# Petstore Lite application and batch settings.
# Read by the batch scripts through conf/env.sh. The web tier takes its
# settings from WEB-INF/web.xml and META-INF/context.xml.

# Database
petstore.db.name=PetStoreDB
petstore.db.home=/var/petstore/db
petstore.db.user=estoreuser
petstore.db.password=«REDACTED:secret-finding-1»
petstore.db.url.embedded=jdbc:derby:/var/petstore/db/PetStoreDB
petstore.db.url.network=jdbc:derby://localhost:1527//var/petstore/db/PetStoreDB
petstore.db.dialect=derby

# Sign-on rules (must match UserDAO and CreateUserServlet)
signon.maxFailedAttempts=3
signon.unlockAfterMinutes=30
signon.username.minLength=3
signon.username.maxLength=25
signon.password.minLength=«REDACTED:secret-finding-2»
signon.password.maxLength=«REDACTED:secret-finding-3»
signon.session.timeoutMinutes=15
signon.rememberUsernameCookie=bp_signon
signon.rememberUsernameCookie.maxAgeSeconds=2678400

# Catalog
catalog.locale=en_US
catalog.pageSize=2
catalog.minCategories=5
catalog.minItems=28

# Batch
batch.backup.dir=/var/petstore/backup
batch.backup.keepDays=7
batch.extract.dir=/var/petstore/extract
batch.log.dir=/var/petstore/log
batch.audit.retentionDays=90
batch.store.url=http://localhost:8080/petstore
