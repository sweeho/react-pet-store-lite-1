  - slug: "sign-on-audit"
    title: "Sign-on audit trail"
    order: 7
    dependsOn:
      - "sign-on"
      - "account-lockout"
      - "account-registration"
      - "access-control"
    priority: 0
    change:
      dir: "openspec/changes/sx-sign-on-audit"
      specCapabilities:
        - "sign-on-audit"
    canvas:
      problem: "The store records every sign-in outcome, lock, unlock, sign-out and new account in an audit log, shows each user their recent entries on My Account, exports the previous day's entries to the security team every night, reports daily statistics and purges entries older than 90 days every Sunday. The rules are spread across the schema, the data access code, one page, four scheduled jobs and the operations runbook."
      solution: "Build the audit event record with its closed set of event types, the events written by sign-on, lockout, unlock and registration, the My Account page with the 10 most recent events, the daily extract file with its line format and trailer, the daily statistics report and the Sunday purge of entries older than 90 days after a successful extract, as specified in the sign-on-audit delta spec."
      userStories:
        - "As a signed-in user, I want to see my recent sign-in activity on My Account, so that I can spot sign-ins that were not me."
        - "As a security analyst, I want a daily file of the previous day's sign-on events, so that I can monitor account activity."
        - "As an operator, I want audit entries older than 90 days purged after they have been extracted, so that the log does not grow without bound."
      acceptanceCriteria:
        - "Sign-on audit event record — Event recorded with every field: The log holds a new entry with a unique identifier, user name j2ee, event type SIGNON_OK, the event time and client address 10.0.0.5"
        - "Sign-on audit event record — Event recorded without a client address: The entry is stored with an empty client address"
        - "Sign-on audit event record — Entry missing a mandatory field: The write is refused and no entry is stored"
        - "Sign-on audit event record — Recorded entries are never changed: The existing entry is unchanged; entries are removed only by the retention purge"
        - "Weekly audit purge after extract — Sunday purge after a successful extract: Every audit event older than 90 days is deleted"
        - "Weekly audit purge after extract — Sunday extract failed: No purge runs that week and no audit event is deleted"
        - "Weekly audit purge after extract — Not a Sunday: No audit event is deleted"
        - "Daily sign-on audit extract file — Extract of a day with events: A file signon_audit_20261029.csv is written with 28 event lines in ascending event-number order, each carrying audit_id, username, event_type, event_ts and remote_addr, with no header row, followed by the line TRAILER,20261029,28"
        - "Daily sign-on audit extract file — Events outside the previous day are excluded: Neither event appears in signon_audit_20261029.csv"
        - "Daily sign-on audit extract file — Backup not successful: The extract does not run"
        - "Closed set of audit event types — Unknown event type refused: The write is refused and no entry is stored"
        - "Closed set of audit event types — Listed event type accepted: The entry is stored"
        - "Mandatory audit fields and accepted event types — Event without an event time: The write is rejected and no entry is stored"
        - "Mandatory audit fields and accepted event types — Event without a client address: The entry is stored with an empty client address"
        - "Audit field lengths — User name of 25 characters: The entry is stored with the full user name"
        - "Audit field lengths — User name longer than 25 characters: The write is refused"
        - "Audit field lengths — Client address of 45 characters: The entry is stored with the full client address"
        - "Audit event time and origin — User-caused event: The entry carries event time 2026-10-29 09:23:47 and origin 10.0.0.5"
        - "Audit event time and origin — Job-caused event: The entry carries origin batch:PSL_ACCT_UNLOCK"
        - "System-assigned ascending event number — Two events recorded in sequence: It receives an event number greater than 1685"
        - "Event identifier generated on recording — Two events at the same time: Each has its own identifier and the identifiers differ"
        - "Caller never supplies the event identifier — Event recorded without an identifier: The entry is stored and carries a system-assigned identifier"
        - "Events recorded against the user name as typed — Sign-in with an unknown user name: A SIGNON_FAIL event is recorded under user name ghost"
        - "Audit user name need not match an account — User name differing only by case: A SIGNON_FAIL event is recorded under user name J2EE"
        - "Audit user name need not match an account — Events kept after the account is gone: The events for olduser are still present"
        - "Sign-on outcomes are audited — Successful sign-in: One SIGNON_OK event is recorded for j2ee with address 10.0.0.5"
        - "Sign-on outcomes are audited — Wrong password: One SIGNON_FAIL event is recorded for j2ee"
        - "Sign-on outcomes are audited — Sign-in attempt on a locked account: One SIGNON_LOCKED event is recorded for j2ee"
        - "Every audited activity and its event type — Activity mapped to its event type: It holds exactly one event of each of SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, SIGNOFF and USER_CREATED"
        - "Locking attempt writes two events — Third wrong password in a row: A SIGNON_FAIL event is recorded followed by an ACCOUNT_LOCKED event, the second with the higher event number"
        - "Account creation is audited — New account created: A USER_CREATED event is recorded for newbie with event time 2026-10-29 14:02:11"
        - "Sign-off is audited on explicit sign-out — Explicit sign-out: One SIGNOFF event is recorded for j2ee with the client address"
        - "Sign-off is audited on explicit sign-out — Session times out: No SIGNOFF event is recorded"
        - "No sign-off event without explicit sign-out — Browser closed: No SIGNOFF event is recorded for j2ee"
        - "Automatic unlock is audited — Two accounts released by one run: Both accounts are unlocked and one ACCOUNT_UNLOCKED event per account is recorded with client address batch:PSL_ACCT_UNLOCK"
        - "Automatic unlock is audited — Unlock run fails before commit: No account is unlocked and no ACCOUNT_UNLOCKED event is recorded"
        - "Client-address field content — Address of an IPv6 client: The client-address field holds 2001:db8::1"
        - "Sign-on audit retention of 90 days — Recent event kept: The event is kept"
        - "Sign-on audit retention of 90 days — Old event removed: The event is removed"
        - "Retained history no older than 90 days — Oldest event in the 2026-10-29 export: Its event time is no older than 90 days before 2026-10-29"
        - "Daily extract and 90-day purge — Purged event was extracted first: It was included in the daily extract file for the day it was recorded"
        - "Weekly purge cutoff — Events on either side of the cutoff: The 2026-08-02 event is deleted and the 2026-08-03 event is kept"
        - "Purge waits for the Sunday extract — Extract still running at 02:00: The purge runs after it, not before"
        - "Purge waits for the Sunday extract — Events up to about 97 days old between purges: Events up to about 97 days old MAY still be present"
        - "Extract file content and encoding — Event at midnight of the run day: Signon_audit_20261029.csv contains the 2026-10-29 00:00:00 event and not the 2026-10-30 00:00:00 event"
        - "Extract file content and encoding — User name with a non-ASCII character: The user name is written UTF-8 encoded inside double quotes"
        - "Extract trailer count — Day with 28 events: The last line of signon_audit_20261029.csv is TRAILER,20261029,28"
        - "Extract trailer line — Only one trailer: It holds exactly one line starting with TRAILER, and it is the last line, reading TRAILER,20261029,5"
        - "Extract of an empty day — Day with no audit events: Signon_audit_20261029.csv is produced containing only the line TRAILER,20261029,0"
        - "One extract file per day — Extract matches the stored events: It contains exactly those 31 events in ascending event-number order and the trailer TRAILER,20261028,31"
        - "Extract line format — One event line: The line reads 1660,\"j2ee\",\"SIGNON_OK\",\"2026-10-29 09:23:47.0\",\"10.0.0.5\""
        - "Extract event time and user name representation — Mixed-case user name: The user name field is \"J2EE\" and the event time field is \"2026-10-29 09:23:47.0\""
        - "Extract event type and client address values — Automatic unlock in the extract: Its client address field is \"batch:PSL_ACCT_UNLOCK\""
        - "Extract event type and client address values — Event with no client address: Its client address field is empty"
        - "Dedicated extract location — Extract written to the dedicated location: Signon_audit_YYYYMMDD.csv is found in the fixed extract location and nowhere else"
        - "Extract always covers the previous day — Extract run late: It produces signon_audit_20261030.csv and 2026-10-29 is not extracted"
        - "Extract rerun replaces the file — Extract rerun on the same day: Signon_audit_20261029.csv is replaced with a fresh extract of 2026-10-29 and only one trailer line is present"
        - "Extract failure alert — Extract fails: The security team receives a regular-urgency e-mail that the sign-on audit extract was not produced, and neither the sign-on report nor the purge runs that day"
        - "Daily report per event type — Report for a day with two event types: Signon_report_20261029.txt lists SIGNON_FAIL 3 events 2 users, then SIGNON_OK 12 events 9 users, and no other event type"
        - "Report locked-account and role figures are a run-time snapshot — Account locked and unlocked on the previous day: It states 0 locked accounts and the current number of CUSTOMER and ADMIN accounts"
        - "Report file covers the previous calendar day — Report file name: The report is written as signon_report_20261029.txt"
        - "Daily report content — Report holds the three figures: Signon_report_20261029.txt holds the per-event-type counts for 2026-10-29, the locked-account count and the account count per role"
        - "Report scheduled after the extract — Extract not successful: No report is written"
        - "Report scheduled after the extract — Extract finishes after 01:45: The report runs after 01:52"
        - "Audit retrieval by time range — One day selected from 90 days of history: Only events in that time range are read"
        - "Audit retrieval by user in time order — One user's recent events: Only that user's events are read, in event-time order"
        - "My Account page — Signed-in user opens My Account: The My Account page is displayed with the title \"My Account\" inside the shared banner, sidebar and footer"
        - "My Account sign-in gate and identity display — Customer views identity: It shows User Name j2ee and Role CUSTOMER"
        - "My Account sign-in gate and identity display — Visitor who is not signed in opens My Account: The Sign In page is displayed instead of My Account, and My Account is shown after a successful sign-in"
        - "My Account recent activity selection — User with more than 10 events: Exactly the 10 newest events are listed, newest at the top"
        - "My Account recent activity selection — Two events with the same time: ACCOUNT_LOCKED is listed above SIGNON_FAIL"
        - "My Account recent activity selection — Other users' events not shown: None of ghost's events are listed"
        - "My Account recent activity rows — Row content: The first row shows When 2026-10-29 09:23:47, Event SIGNON_OK and From 10.0.0.5"
        - "My Account recent activity rows — Unlock performed by the automatic run: The first row shows Event ACCOUNT_UNLOCKED and From batch:PSL_ACCT_UNLOCK"
        - "My Account recent activity rows — User with no events: The When, Event and From headings and the note \"Showing your 10 most recent events.\" are shown with no rows"
      outOfScope:
        - "How the nightly jobs are scheduled, chained, retried and alerted (batch-operations)."
        - "The lockout and unlock rules themselves (account-lockout)."
        - "Audit of catalog or administration actions: only sign-on events are recorded."
      risksAssumptions:
        - "Disputed: the Oracle populate statements do not generate the audit identifier."
        - "Some extract-file format details are low confidence; see legacy-analysis/ir/_recommendations/sign-on-audit.yaml."
      techStack: []
      affectedCode: []
      screens:
        - "My Account recent activity: the signed-on user's name, role and their 10 most recent audit events, newest first (events with the same time ordered by most recently recorded first), each with event type, date and time, and client address"
        - "My Account page: a signed-in user sees their user name, their role and their 10 most recent sign-on events, newest first, each with the time (yyyy-MM-dd HH:mm:ss), the event type code and the client address it came from"
        - "My Account page frame: a page titled 'My Account' on the shared layout"
        - "Recent Sign-in Activity table: the My Account page of a signed-in user shows the user name, the user's role and a 'Recent Sign-in Activity' table of the user's 10 most recent sign-on events, newest first, each with its time (yyyy-MM-dd HH:mm:ss), its event code and the client address; a visitor who is not signed in and opens Account is shown the Sign In page first"
