  - slug: "access-control"
    title: "Access control"
    order: 6
    dependsOn:
      - "sign-on"
    priority: 0
    change:
      dir: "openspec/changes/sx-access-control"
      specCapabilities:
        - "access-control"
    canvas:
      problem: "Who may open which page is decided by a role stored with each account (CUSTOMER or ADMIN), a declarative list of protected pages, a filter on every request, a separate check on the forced sample-data reload and a banner that shows the Admin link by role. None of it is written down as one specification."
      solution: "Build the two approved access-control requirements in the access-control delta spec: the account role domain (exactly one role per account, CUSTOMER or ADMIN, CUSTOMER by default, any other value refused) and the page access matrix (catalog, search, sign-in and create-account pages open to everyone, My Account for any signed-in user, Catalog Administration for ADMIN only with Access Denied shown to a signed-in CUSTOMER). The remaining legacy rules are pending SME approval and are not specified yet."
      userStories:
        - "As a visitor, I want to browse the catalog without signing in, so that I can look before creating an account."
        - "As a signed-in customer, I want to open My Account, so that I can see my account and recent activity."
        - "As a store administrator, I want Catalog Administration open only to administrators, so that customers cannot reload the store's data."
        - "As a customer who opens Catalog Administration, I want to see Access Denied instead, so that I know the page is not for me."
      acceptanceCriteria:
        - "Account role domain — Account created without a role: The account's role is CUSTOMER"
        - "Account role domain — Account stored with an ADMIN role: The account is saved with role ADMIN"
        - "Account role domain — Account stored with an unknown role: The save is refused and no account is stored"
        - "Page access by role — Anonymous visitor browses the catalog: The requested page is served without a sign-in"
        - "Page access by role — Signed-in customer opens My Account: The My Account page is served"
        - "Page access by role — Signed-in customer opens Catalog Administration: The Access Denied page is shown instead of Catalog Administration"
        - "Page access by role — Signed-in administrator opens Catalog Administration: The Catalog Administration page is served"
      outOfScope:
        - "The credential check and sign-out (sign-on)."
