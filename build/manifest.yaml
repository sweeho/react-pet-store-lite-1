  - slug: "batch-operations"
    title: "Batch operations"
    order: 9
    dependsOn:
      - "sample-data-population"
      - "sign-on-audit"
      - "account-lockout"
    priority: 0
    change:
      dir: "openspec/changes/sx-batch-operations"
      specCapabilities:
        - "batch-operations"
    canvas:
      problem: "The store depends on scheduled jobs nobody documents as product behaviour: a nightly online database backup with 7-day retention, an audit extract and report chained behind it, a weekly audit purge, a morning catalog check and a 15-minute account unlock. Their ordering, retry limits, exit codes, alert routing and logging are spread across a scheduler export, six shell scripts, an environment file, six SQL scripts, the container image and the runbook."
      solution: "Build the job schedule and its operational contract: the nightly chain (backup, then audit extract, then sign-on report and Sunday purge), the independent catalog check and unlock jobs, backup naming and retention, holding the chain on a failed backup, retry limits, the 0/4/8 exit codes, the shared batch log, failure alerts, rerun rules, output locations and the restore procedure, as specified in the batch-operations delta spec."
      userStories:
        - "As an operator, I want the nightly jobs to run in a fixed order and hold when the backup fails, so that no job runs against unprotected data."
        - "As an operator, I want failed jobs to retry within set limits and alert the right team, so that I hear about real failures only."
        - "As an operator, I want a dated daily backup kept for 7 days and a documented restore, so that I can recover the store."
      acceptanceCriteria:
        - "Nightly job chain order — Normal weekday night: The extract starts no earlier than 01:30 and after the backup succeeded, the sign-on report starts no earlier than 01:45, and the audit purge does not run"
        - "Nightly job chain order — Sunday night: The sign-on report starts no earlier than 01:45 and the audit purge starts no earlier than 02:00"
        - "Nightly job chain order — Extract not yet succeeded: The sign-on report MUST NOT start"
        - "Jobs independent of the nightly chain — Backup failed but catalog check runs: The catalog integrity check starts"
        - "Jobs independent of the nightly chain — Unlock cadence: The unlock runs at 15-minute intervals between 00:00 and 23:59 regardless of the nightly chain's state"
        - "Daily online database backup — First backup of the day: The store stays available and a backup named PetStoreDB_20261102 exists"
        - "Daily online database backup — Backup rerun on the same date: Exactly one PetStoreDB_20261102 backup exists and it holds the newer copy"
        - "Backup retention — Old backup removed: That backup is deleted"
        - "Backup retention — Recent backup kept: That backup is kept"
        - "Backup retention — Failed run deletes nothing: No dated backup is deleted"
        - "Failed backup holds the dependent chain — Backup fails after all reruns: The audit extract, the sign-on report and the audit purge do not run, and operations receive an urgent mail saying the backup failed and the audit extract is held"
        - "Failed backup holds the dependent chain — Backup succeeds on a rerun: The audit extract becomes eligible to start"
        - "Automatic retry limits — Backup keeps failing: The backup is run at most 3 times in total, with 10 minutes between a failure and the next run"
        - "Automatic retry limits — Extract rerun cap: No further automatic run of the extract is made for that day"
        - "Automatic retry limits — Report not retried: The report is not rerun automatically"
        - "Batch job exit codes — Successful job: Its exit code is 0"
        - "Batch job exit codes — Catalog rule broken: Its exit code is 4"
        - "Batch job exit codes — Database step fails: Its exit code is 8"
        - "Database step failure detection — Error line reported: The job treats the step as failed and ends with exit code 8"
        - "Database step failure detection — No error line: The job treats the step as succeeded"
        - "Shared batch log — Successful run logged: The shared batch log holds a start line and an end OK line, both time-stamped and naming the backup job"
        - "Shared batch log — Failed run logged: The shared batch log holds a time-stamped FAILED line naming the extract job and the failed step"
        - "Batch failure alerts — Extract failure alert: The security team receives a regular-urgency mail saying the sign-on audit extract was not produced"
        - "Batch failure alerts — Catalog rule alert: The catalog team receives an urgent mail pointing at the catalog check log"
        - "Batch failure alerts — Catalog check ends with code 8: No mail is sent"
        - "Batch failure alerts — Purge failure: No mail is sent"
        - "Rerun after a failed job — Rerun after database outage: The report runs and ends with code 0"
        - "Audit extract day window — Normal extract: It covers sign-on events of 2026-11-01 and its file is named for 20261101"
        - "Audit extract day window — Same-day rerun: The 20261101 file is replaced"
        - "Audit extract day window — Held past midnight: It covers 2026-11-02, and 2026-11-01 is extracted only if an operator runs it by hand with changed dates"
        - "Batch output locations — Defaults: The backup is written under /var/petstore/backup, the extract under /var/petstore/extract and the log lines under /var/petstore/log"
        - "Batch output locations — Override: Its log lines are written to that location"
        - "Batch access to the live store database — Store running: It updates the same accounts the store reads, while the store stays available"
        - "Batch access to the live store database — Store not running: The job cannot reach the database and ends with exit code 8"
        - "Batch access to the store over HTTP — Sample-data load request: The request is sent to http://localhost:8080/petstore"
        - "Batch packaging with the store — On-demand run inside the deployed unit: The job runs without any further installation"
        - "Batch packaging with the store — Tool version mismatch: The job fails"
        - "Persistent working areas — Fresh start: Each writes into its own existing working area and none writes into the live database area"
        - "Restore from a dated backup — Restore of the previous night's backup: The store serves the data as it was at the time of that backup"
        - "Single store database and connection pool — Pool exhausted: That request fails to obtain a connection"
        - "Single store database and connection pool — Missing database: The database is created"
      outOfScope:
        - "The content of the audit extract file, the sign-on report and the 90-day purge rule (sign-on-audit)."
        - "The 30-minute unlock rule (account-lockout)."
        - "The C1 to C4 catalog rules (catalog-data-integrity)."
        - "No user interface: no screen records were extracted for this capability."
      risksAssumptions:
        - "Open SME decisions: backup retention (7 days or about 8 copies), whether the extract's single rerun is automatic, the undefined PSL_CAL calendar, the silent-failure paths and the Sunday report/purge race."
