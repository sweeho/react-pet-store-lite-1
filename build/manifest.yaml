  - slug: "account-registration"
    title: "Account registration"
    order: 5
    dependsOn:
      - "sign-on"
    priority: 0
    change:
      dir: "openspec/changes/sx-account-registration"
      specCapabilities:
        - "account-registration"
    canvas:
      problem: "An anonymous visitor can create their own customer account from the Sign In page. The field rules and their exact messages, the order they are checked in, the duplicate-name refusal, the fixed CUSTOMER role, the immediate sign-in and the account-created audit event are recorded only in code and page templates."
      solution: "Build self-service sign-up: user name rules (trimmed 3 to 25 letters, digits, '-' or '_', unique and case-sensitive), password rules (4 to 25 characters, repeated entry must match), first-failure-only reporting, a CUSTOMER account created unlocked with 0 failures, immediate sign-in and redirect, the USER_CREATED audit event, and the sign-up form and refusal pages, as specified in the account-registration delta spec."
      userStories:
        - "As a new customer, I want to create an account with a user name and password from the Sign In page, so that I can sign in to the store."
        - "As a new customer, I want to be told exactly which rule my user name or password broke, so that I can fix it and try again."
        - "As a new customer, I want to be signed in as soon as my account is created, so that I can continue where I was."
      acceptanceCriteria:
        - "User name length — User name too short: No account is created and the refusal reason shown is \"The user name must be 3 to 25 characters.\""
        - "User name length — User name too long: No account is created and the refusal reason shown is \"The user name must be 3 to 25 characters.\""
        - "User name length — User name missing: No account is created and the refusal reason shown is \"The user name must be 3 to 25 characters.\""
        - "User name length — Boundary lengths accepted: The account \"abc\" is created"
        - "User name characters — User name with a space: No account is created and the refusal reason shown is \"The user name can only contain letters, digits, '-' and '\\_'.\""
        - "User name characters — User name with surrounding spaces: The length check passes, no account is created, and the refusal reason shown is \"The user name can only contain letters, digits, '-' and '\\_'.\""
        - "User name characters — Hyphen and underscore accepted: The account \"pet_lover-1\" is created"
        - "Password length — Password too short: No account is created and the refusal reason shown is \"The password must be 4 to 25 characters.\""
        - "Password length — Password too long: No account is created and the refusal reason shown is \"The password must be 4 to 25 characters.\""
        - "Accepted password lengths — Boundary lengths accepted: The password length check passes"
        - "Accepted password lengths — Spaces count towards length: The password is accepted as 4 characters long"
        - "Password confirmation — Confirmation differs: No account is created and the refusal reason shown is \"The password and the confirmation do not match.\""
        - "Password confirmation — Confirmation differs only in case: No account is created and the refusal reason shown is \"The password and the confirmation do not match.\""
        - "User name already taken — Name already taken: No account is created and the refusal reason shown is \"The user name j2ee is already taken. Choose another user name.\""
        - "Case-sensitive user names — Same name in different case: A separate account \"J2EE\" is created and the account \"j2ee\" is unchanged"
        - "Check order and single refusal reason — Several rules broken: No account is created and the only refusal reason shown is \"The user name can only contain letters, digits, '-' and '\\_'.\""
        - "Check order and single refusal reason — Duplicate checked only after field rules pass: The only refusal reason shown is \"The password must be 4 to 25 characters.\""
        - "Initial state of a self-registered account — New account defaults: The account \"newpet\" has the CUSTOMER role, zero failed sign-ons, is unlocked, has no lock time and carries its creation time"
        - "Initial state of a self-registered account — Role cannot be requested: The account has the CUSTOMER role"
        - "No self-service administrator accounts — Only customer sign-up is offered: The only account-creation surface offered is the customer sign-up form, and no surface lets them choose the ADMIN role"
        - "Immediate sign-in after account creation — New user is signed in: They are signed in as \"newpet\" with the CUSTOMER role and can open customer-only pages without entering their password again"
        - "Destination after account creation — Visitor was sent to sign in from a protected page: They are taken to the protected page they originally requested"
        - "Destination after account creation — Visitor opened the Sign In page directly: They are taken to the home page"
        - "Successful sign-up sequence — Valid sign-up completes every step: The account exists with the CUSTOMER role, one USER_CREATED event for \"newpet\" is recorded, the visitor is signed in as \"newpet\" and the home page is displayed"
        - "Account-created audit event — Sign-up is audited: The audit log holds one USER_CREATED event for \"newpet\" with client address 10.0.0.5"
        - "Account-created audit event — Refused sign-up is not audited: No new USER_CREATED event is recorded"
        - "Account-created event timing — Event time equals creation time: The account-created event for \"newpet\" has a timestamp equal to the account's creation time, it is the earliest event for \"newpet\", and no successful sign-on event for \"newpet\" is recorded"
        - "Password stored as entered — Stored password matches entry: Its password value is \"Secret 1\""
        - "One account per user name — Second account with the same user name is refused by the store: The store refuses it and the existing account is unchanged"
        - "One account per user name — Account without a password is refused by the store: The store refuses it"
        - "Account creation time defaults — Creation time defaults: Its creation time is the moment it was stored"
        - "Last sign-on time kept on the account — New account has no last sign-on time: The account \"newpet\" has a creation time and an empty last sign-on time"
        - "Account record fields and defaults — Defaults applied when only name and password are given: Its role is CUSTOMER, its failed attempt count is 0, its locked flag is N, its lock time and last sign-on time are empty and its creation time is set"
        - "Account record fields and defaults — Role outside the allowed set: The store refuses it"
        - "Default role is CUSTOMER — Role omitted: Its role is CUSTOMER"
        - "Sign-up form on the Sign In page — Form displayed to an anonymous visitor: The new-customer form shows the User Name, Password and Password (Repeat) inputs (both passwords masked, all empty), the \"Create New Account\" button and the two rule lines"
        - "Sign-up form on the Sign In page — Form submitted: The three values are submitted as one sign-up request and the visitor sees either the page reached after successful sign-up or the account creation refusal page"
        - "Account creation refusal reason and go-back link — Refusal displayed: It shows the heading \"Could Not Create Your Account\", the reason \"The password and the confirmation do not match.\" and a \"go back\" link"
        - "Account creation refusal reason and go-back link — Go back: The Sign In page with the empty sign-up form is displayed"
        - "Could Not Create Your Account page — Taken user name refused: The page titled \"Create Account Error\" is displayed with the store's standard banner, sidebar and footer, headed \"Could Not Create Your Account\", showing \"The user name j2ee is already taken. Choose another user name.\""
      outOfScope:
        - "Creating administrator accounts through sign-up: self-registered accounts are always CUSTOMER."
        - "Profile, address or payment details: the legacy account holds only a user name and password."
        - "Password reset and account deletion: the legacy store has neither."
      risksAssumptions:
        - "The password length bounds are named constants whose values are redacted in the extraction copy; 4 to 25 is taken from the page text."
        - "Business Owner decision: plaintext password storage."
        - "Open: non-ASCII letters are accepted in user names by the legacy check."
      techStack: []
      affectedCode: []
      screens:
        - "Sign-up form on the Sign In page: a new-customer form with User Name, Password and Password (Repeat) fields and a 'Create New Account' button, showing the rules 'User name: 3 to 25 letters, digits, '-' or '_'.' and 'Password: 4 to 25 characters.'"
        - "Could Not Create Your Account page: shown when an account-creation request breaks a field rule or uses a taken user name, giving the specific reason and a 'go back' link to the Sign In page"
        - "Account creation refusal message: when account creation is refused the 'Could Not Create Your Account' page shows the message of the rule that was broken"
