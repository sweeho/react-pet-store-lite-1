# Spec extraction SX-0001 release schedule for the build orchestrator.
# Acceptance criteria are generated one per scenario from each change's specs/<capability>/spec.md.
# reviewedBy/reviewedAt are null: no named reviewer is recorded for any capability.
schemaVersion: 1
program:
  key: "pet-store-lite-rebuild"
  title: "Java Pet Store Lite rebuild"
  source: "extraction"
  generator: "vortex-spec-extraction"
  sourceRef: "vortex/legacy-spec/sx-0001"
capabilities:
  - slug: "catalog-browsing"
    title: "Catalog browsing"
    order: 1
    dependsOn: []
    priority: 0
    change:
      dir: "openspec/changes/sx-catalog-browsing"
      specCapabilities:
        - "catalog-browsing"
    canvas:
      problem: "Every visitor, signed in or not, moves through the store from the home page to a category, a product and an item. The rules behind that path (two-row paging and its Previous/Next links, en_US-only text, US-dollar prices, which price is shown as Your Price, the shared page layout and the error pages) live in SQL statements, page templates and a page-composition framework, and the User Guide disagrees with the code in places. None of it is written down as one specification."
      solution: "Build the public catalog: the three-level category, product and item model with per-locale text and prices, the category, product and item pages with paging, the home page, the shared layout with banner and Pets side bar, and the General Error page, matching the requirements in the catalog-browsing delta spec."
      userStories:
        - "As a visitor, I want to pick a pet category from the home page or the side bar, so that I can see the products in it."
        - "As a visitor, I want to page through a category's products and a product's items, so that I can find the pet I want."
        - "As a visitor, I want to see an item's picture, List Price, Your Price and description, so that I can decide whether to buy it."
        - "As a visitor, I want a clear error page with a way back to the catalog when something goes wrong, so that I am not stranded."
      acceptanceCriteria:
        - "Category product list paging (SWHR5-R-0018) — First page of a category with more than two products: The first 2 products are listed with their name and description, a Next link is shown and no Previous link is shown"
        - "Category product list paging (SWHR5-R-0018) — Last page of a category: Only the fifth product is listed, a Previous link is shown and no Next link is shown"
        - "Category product list paging (SWHR5-R-0018) — Category with exactly two products: Both products are listed and neither a Next nor a Previous link is shown"
        - "Store language and currency (SWHR5-R-0008) — Visitor with a non-English browser: The catalog text is shown in en_US and both prices are formatted as US-dollar amounts such as \"$16.50\""
        - "Shared page layout — Any catalog page is displayed: The browser title is that page's title, the banner appears above the body, the side bar appears beside the body, and the footer appears below it"
        - "Shared page layout — A page with no layout of its own: It is displayed in the default layout with the shared banner, side bar and footer"
        - "Store banner — Anonymous visitor sees the banner: The banner shows the logo, the search box with a Search button, an Account link and a Sign in link, and does not show \"Signed in as\""
        - "Store banner — Signed-in user sees the banner: The banner shows \"Signed in as j2ee\", an Account link and a Sign out link in place of Sign in"
        - "Store banner — Banner controls: The logo opens the home page, and Search opens the search results for the keyword \"fish\""
        - "Banner Admin link for administrators — Administrator signed in: The banner shows an Admin link that opens the Catalog Administration page"
        - "Banner Admin link for administrators — Customer signed in: The banner shows no Admin link"
        - "Pets side bar — Side bar with the standard catalog: The side bar shows \"Pets\" followed by the links Birds, Cats, Dogs, Fish, Reptiles in that order"
        - "Pets side bar — More than five categories exist: Only the first five categories by name are listed and no Next link is offered in the side bar"
        - "Pets side bar — Following a side bar link: The product list of the Dogs category is displayed"
        - "Named catalog pages and their titles — Page titles: The titles are \"Welcome to the BluePrints Petstore\", \"Products\", \"Items\" and \"Item\" respectively"
        - "Named catalog pages and their titles — Welcome page after sign-in: Its title is \"Welcome\" and its body is the same pet picture as the home page"
        - "Home page — Choosing a pet on the home page: The product list of the Fish category is displayed"
        - "Home page — Every category is reachable from the picture: There is a region for each of Birds, Fish, Dogs, Reptiles and Cats, each with that category name as its alternative text"
        - "Category page — Displaying a category: The page shows \"Products for this Category\", lists Angelfish and Goldfish with their descriptions, and shows a Next link but no Previous link"
        - "Category page — Following a product link: The item list of the Angelfish product is displayed"
        - "Category page — Unknown or empty category: The heading is shown with an empty list and neither Previous nor Next"
        - "Product page — Displaying a product: The page shows \"Items for this Product\" and the rows \"Large Angelfish\" and \"Small Angelfish\", each with its description and \"$16.50\""
        - "Product page — Following an item link: The item page of that item is displayed"
        - "Item page — Anonymous visitor views an item: The page shows the heading \"Large Angelfish\", the item picture, \"List Price: $16.50\", \"Your Price: $10.00\", the description and \"Item ID: EST-1\""
        - "Item page — Item without text in the store locale: No item is found and no item details are displayed"
        - "General Error page — Catalog database unavailable: The General Error page is displayed with the text \"An unexpected error occurred. Please return to the catalog and try again.\" and the word \"catalog\" links to the home page"
        - "Three-level catalog with five categories — Walking the hierarchy: Each level lists only the children of the level above it"
        - "Category record — Duplicate category code: The store is rejected"
        - "Category record — Second text entry for the same locale: The store is rejected"
        - "Product record — Product with an unknown category: The store is rejected"
        - "Item record — Item missing its description: The store is rejected"
        - "Item record — Asking for an attribute out of range: \"Large\" is returned"
        - "Category listing — Category without text in the locale: That category is not listed"
        - "Product listing — Products in name order: The products are returned as Angelfish, Goldfish, Koi"
        - "Item listing — Items of a product: Both items are returned with their prices, attributes and descriptions, in no guaranteed order"
        - "Single item lookup — Unknown item identifier: No item is returned and no error is raised"
        - "Single category and product lookup — Category lookup in a locale with no text: Nothing is returned"
        - "Locale completeness of items — Item whose product has no text in the locale: The item is not shown"
        - "Page arithmetic — Middle page: Rows 3 and 4 are returned, next and previous are both available, the next page starts at 4 and the previous page starts at 0"
        - "Page arithmetic — Start beyond the end: An empty page is returned with neither next nor previous available"
        - "Page arithmetic — Negative start: An empty page is returned and no error is raised"
        - "Default page position and size — No paging parameters: The first 2 products are shown"
        - "Default page position and size — Paging parameters in the address: The second, third and fourth products are shown"
        - "Non-positive page size — Count of zero: Exactly one product is returned"
        - "Next and Previous link targets — Previous from a short last page: The page shown starts at entry 4 and shows entries 4 and 5"
        - "Next and Previous link targets — Next keeps the page size: Entries 4, 5 and 6 are shown"
        - "Display language selection — Unsupported language requested: The en_US page is shown"
        - "Locale text interpretation — Locale text forms: They yield the server default locale, English (United States) and no locale respectively"
        - "Locale-specific catalog tables — Locale other than Japan or China: The base catalog tables are read"
        - "Undefined page name — Mistyped page name: The response body is \"Error: Definition for screen catgory not found\" with no banner, side bar or footer"
        - "Return to previous page — Requesting PREVIOUS after viewing an item: The item page is shown again and remains the remembered page"
        - "Page definitions loading — Duplicate page definition: The first definition is used, a warning is logged and the store starts normally"
        - "Catalog data failure — Query fails: The request fails with a catalog error that carries the database's message"
        - "Catalog query dialect configuration — Oracle deployment: The oracle statement set is used for every catalog query"
        - "Anonymous catalog navigation — Browsing without an account: Each page is displayed without a sign-in prompt"
        - "Character encoding — Non-ASCII search keyword: The keyword is received as \"café\" and the results page is served as UTF-8"
        - "Store address — Opening the store: The store home page is returned"
        - "Listing by parent without full scan — Products of one category: They are found through the category code rather than a scan of every product"
        - "Combined catalog item listing — Category without text in the item's locale: That item does not appear"
      outOfScope:
        - "Keyword search and the Search page (catalog-search)."
        - "Sign-in, My Account and Catalog Administration, which appear here only as banner links."
        - "The C1 to C4 catalog integrity check and the price guard (catalog-data-integrity)."
        - "Loading the sample catalog (sample-data-population)."
        - "Shopping cart, ordering and payment: the legacy store has none."
      risksAssumptions:
        - "Disputed: whether Your Price (the unit cost) is a customer price or a member price."
        - "Unresolved reachability: the PREVIOUS page, locale-suffixed tables, single category and product lookup and the combined catalog view have no caller in the legacy source."
      techStack: []
      affectedCode: []
      screens:
        - "Products for this Category page: lists the chosen category's products two at a time, each with its name (linking to the product's items) and description, with a Previous link only when an earlier page exists and a Next link only when a later page exists"
        - "Items for this Product page: lists the chosen product's items two at a time, each with its attribute and product name (linking to the item page), its description and its list price formatted as en_US currency, with the same conditional Previous and Next links as the category page"
        - "Item page: titled with the item attribute and product name, showing the item image, List Price (the item's list price), Your Price (the item's unit cost), the item description and the Item ID, with both prices formatted as en_US currency"
        - "Home page: a pet picture whose regions link to the Birds, Fish, Dogs, Reptiles and Cats category pages"
        - "Store page frame: every store page is composed of a banner (logo linking to the home page, a keyword search box, an Account link and a Sign in or Sign out link), a Pets side bar, the page body and a footer"
        - "General Error page: shown for any unhandled error while serving a page, saying an unexpected error occurred, with a link back to the catalog"
        - "Banner with sign-in status and Admin link: logo returning to the home page, Search box, Account link and Sign in or Sign out link, plus 'Signed in as <user name>' when signed in, a category side bar, the requested body and a footer; a user signed in with the ADMIN role also sees an Admin link in the banner"
        - "Shared page layout: every named page is rendered from one layout of title, banner, sidebar, body and footer, where the title text and the content of each region come from that page's definition, and the default layout is used when a page names none"
        - "Named catalog pages: Home, Products (category), Items (product), Item and General Error, each addressable by name and titled 'Welcome to the BluePrints Petstore', 'Products', 'Items', 'Item' and 'General Error'; the Welcome page shown after sign-in reuses the Home page body"
        - "Banner and Pets side bar: a banner holding the store logo (linking to the home page), a search box and the Account and Sign in links (Sign out plus 'Signed in as <user name>' when signed in), a Pets side bar with one link per category in alphabetical order, the requested page body and a footer"
