  - slug: "account-lockout"
    title: "Account lockout"
    order: 4
    dependsOn:
      - "sign-on"
    priority: 0
    change:
      dir: "openspec/changes/sx-account-lockout"
      specCapabilities:
        - "account-lockout"
    canvas:
      problem: "The store locks an account after 3 consecutive wrong-password attempts and releases it from a 15-minute batch job once the lock is more than 30 minutes old. The rule guards customer and administrator accounts, is spread over the sign-on code, a SQL batch script, a scheduler definition, the schema and three guides, and has sharp edges: the strict 30-minute boundary, the 30 to 45 minute effective lock window, no unlock screen, and audit events at each step."
      solution: "Build the failed-attempt counter, the lock on the third consecutive failure, refusal of every sign-in while locked (for every role), the scheduled automatic unlock with its audit event, the operations-only early unlock, the lock state and its defaults, and the Account Locked page, as specified in the account-lockout delta spec."
      userStories:
        - "As an account holder, I want my account locked after three wrong passwords in a row, so that someone guessing my password is stopped."
        - "As a locked-out user, I want a page that tells me why I cannot sign in and when the lock clears, so that I know to wait or contact the store."
        - "As an operator, I want locks to clear automatically once they are more than 30 minutes old, so that customers are not locked out indefinitely."
      acceptanceCriteria:
        - "Consecutive failed sign-in count — Wrong password increments the count: The account's consecutive failed sign-in count becomes 2 and a sign-in failure event is recorded"
        - "Consecutive failed sign-in count — Successful sign-in resets the count: The sign-in succeeds and the account's consecutive failed sign-in count becomes 0"
        - "Lock on the third consecutive failure — Third consecutive failure locks the account: The account is locked, its failed count is 3, its lock time is the time of the attempt, and the Account Locked page is shown instead of the sign-in error page"
        - "Lock threshold of three consecutive failures — Two consecutive failures do not lock: The account is not locked and the sign-in error page is shown"
        - "Lockout and automatic unlock policy — Count restarts after an unlock: The count is 0 and the account is not locked"
        - "Only consecutive failures count towards a lock — Failures interrupted by a success: The account's failed count is 2 and the account is not locked"
        - "Successful sign-in clears earlier failures — One failure then success: The account's failure count returns to 0"
        - "Unknown user names do not count towards a lock — Sign-in with a non-existent user name: Each attempt shows the sign-in error page and records a sign-in failure event for \"ghost\", and no account is locked"
        - "Locked account refuses every sign-in — Correct password on a locked account: The sign-in is refused, the Account Locked page is shown, a sign-in-while-locked event is recorded, and the failed count stays 3 and the lock time is unchanged"
        - "Locked account refuses every sign-in — Wrong password on a locked account: Only a sign-in-while-locked event is recorded, no sign-in failure event is recorded, and the lock is not extended"
        - "Locked refusal leaves catalog browsing available — Browsing after a locked refusal: The category is displayed without the user being signed in"
        - "Locked attempts are audited separately from failures — Audit entry for an attempt on a locked account: The audit trail gains one sign-in-while-locked event and no sign-in failure event, and no session is established"
        - "Attempts on a locked account do not extend the lock — Repeated attempts while locked: Both are refused, its lock time stays 10:00:00, and it is released by the first unlock run more than 30 minutes after 10:00:00"
        - "Lockout applies to every role — Administrator fails three times: The administrator account is locked exactly as a customer account would be"
        - "Account lock state — New account starts unlocked: Its failed count is 0, it is not locked and it has no lock time"
        - "Lock tracking for every sign-on account — Sample accounts loaded unlocked: Every populated account has a failed count of 0, is unlocked and has no lock time"
        - "Lock state defaults — Account stored without lock values: It is not locked and its failed count is 0"
        - "Scheduled automatic unlock — Lock older than 30 minutes is released: The account is not locked, its failed count is 0, its lock time is empty, and an account-unlocked event attributed to the unlock job is recorded"
        - "Scheduled automatic unlock — Lock younger than 30 minutes is kept: The account stays locked and no unlock event is recorded for it"
        - "Unlock check schedule — Weekend overnight run: The account is unlocked"
        - "Automatic unlock clears lock state — Lock exactly 30 minutes old: It stays locked, and the 10:45 run unlocks it, clears its lock time, sets its failure count to 0 and records an account-unlocked event"
        - "Quarter-hour unlock job records its run time — Unlock event carries the run time: The account is unlocked, its account-unlocked event is timestamped 09:45:00 and its failed count is 0"
        - "Unlock attributed to the job — Source of an automatic unlock event: The account-unlocked event names the unlock job as its source and carries no client address"
        - "No in-application unlock — Locked user looks for an unlock option: No page or control is offered that unlocks the account"
        - "Early unlock by operations — On-demand unlock run on a recent lock: The account stays locked"
        - "Early unlock by operations — Manual administrator unlock: The account is not locked, its failed count is 0, its lock time is empty and an account-unlocked event attributed to \"admin\" is recorded"
        - "Operations unlock routes — Direct data change by operations: The account is not locked, its failed count is 0 and an account-unlocked event with source \"admin\" is recorded"
        - "Manual unlock is audited with the admin source — Manual unlock leaves an audit record: It holds an account-unlocked event whose address is \"admin\""
        - "Lock event timing in the sign-in audit trail — Audit events for the locking attempt: The audit trail holds a sign-in failure event and then an account-locked event for that user, both from 10.0.0.5"
        - "Account Locked page display — Page content is displayed: It shows the title \"Account Locked\" within the shared layout, the statement that the account is locked after 3 failed sign-in attempts in a row, the statement that locks clear automatically 30 minutes after they are set, the advice to try later or contact the store administrator, and a \"browsing the catalog\" link"
        - "Account Locked page display — Browse-catalog link is followed: The catalog home page is shown and the user remains signed out"
        - "Account Locked page shown on a locked refusal — Refused sign-in on a locked account: The Account Locked page is displayed and not the sign-in error page"
        - "Account Locked page shown on a locked refusal — Ordinary failed sign-in: The sign-in error page is displayed and not the Account Locked page"
      outOfScope:
        - "An in-application unlock screen: the legacy store has none and early unlock is an operations procedure."
        - "The credential check itself (sign-on)."
        - "The audit log's extract, report and purge (sign-on-audit)."
      risksAssumptions:
        - "Disputed: whether the account-locked audit event carries the same time as the failed sign-in event or follows later (code and sample extract disagree)."
        - "Open: the behaviour of a locked account with no lock time."
      techStack: []
      affectedCode: []
      screens:
        - "Account Locked page: titled 'Account Locked' on the shared layout and shown when a sign-in is attempted on a locked account (even with the right password), stating the account is locked after 3 failed attempts in a row and is unlocked automatically 30 minutes after the lock, suggesting to try later or contact the store administrator, and offering a link to keep browsing the catalog"
        - "Account Locked page on a locked refusal: shown whenever a sign-in is refused because the account is locked, letting the user keep browsing the catalog"
