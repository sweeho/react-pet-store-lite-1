  - slug: "sample-data-population"
    title: "Sample data population"
    order: 8
    dependsOn:
      - "catalog-browsing"
      - "sign-on"
      - "access-control"
    priority: 0
    change:
      dir: "openspec/changes/sx-sample-data-population"
      specCapabilities:
        - "sample-data-population"
    canvas:
      problem: "The store fills its own database from a bundled sample data set. A visitor's first entry triggers the load, the daily catalog check also triggers it when the tables are missing, and an administrator can force a full reload that deletes every account and all sign-on history. Who may trigger it and what it destroys are operational and access-control rules spread across the populate servlet, a statement file, two pages, the batch chain and the admin guide."
      solution: "Build the store entry page and first load, the already-populated check, the ADMIN-only forced reload from Catalog Administration with its warning, the step order and replace-everything semantics, the sample catalog and accounts, the sign-on history seed and the result redirection, as specified in the sample-data-population delta spec."
      userStories:
        - "As the first visitor to an empty store, I want the sample catalog loaded when I enter, so that there is something to browse."
        - "As a store administrator, I want to reload the sample data after a clear warning of what it deletes, so that I can reset a demo store on purpose."
        - "As an operator, I want the daily catalog check to load the catalog when it is missing, so that the store recovers without a manual step."
      acceptanceCriteria:
        - "Store entry page — Entry page is displayed: It shows the store description, an \"enter the store\" link, a note that the database is populated automatically on first use, and a note that administrators can reload the sample data after signing in"
        - "Catalog Administration page — Administrator opens the page: It shows the warning that every catalog and sign-on table is dropped and recreated, that all accounts created in the store and all sign-in history are deleted and that the administrator will be signed out, and a \"Reload Sample Data\" button"
        - "Catalog Administration page — Administrator presses Reload Sample Data: A forced reload of the sample data is requested and, on success, the home page is shown with the administrator signed out"
        - "Entering the store requests a first load — Anonymous visitor follows the link: The \"Please wait while the Java Pet Store Application is being populated...\" message is shown, a first-load population is requested, and the home page is shown without any sign-in prompt"
        - "Daily catalog check triggers first load — Catalog empty at 06:00: A first load of the sample data is requested and the catalog is checked again afterwards"
        - "Non-forced population check — Store already populated: No catalog, account or sign-on history data is changed"
        - "Non-forced population check — One catalog table empty: Every catalog and sign-on table is dropped, recreated and reloaded from the sample data file"
        - "Failed check counts as not populated — Missing table: The full drop-and-reload runs and deletes every existing sign-on account and all sign-on history"
        - "Failed check counts as not populated — Empty sign-on history only: No data is changed"
        - "Sample catalog invariants — Catalog invariants after load: The catalog holds the categories FISH, DOGS, REPTILES, CATS and BIRDS, 16 products and 28 items, every category has a product, every product has an item, and no item's list price is below its unit cost"
        - "Forced-mode flag interpretation — Parameter absent: The request is handled as a first-load request"
        - "Forced value matched case-insensitively — Mixed-case true: The request is handled as a forced reload"
        - "Forced value matched case-insensitively — Unrecognised value: The request is handled as a first-load request"
        - "First-load requests open to any caller — Customer requests a first load: The request is accepted and is not answered with Access Denied"
        - "Forced reload restricted to administrators — Anonymous visitor requests a forced reload: Access Denied is shown and no table is dropped, recreated or loaded"
        - "Forced reload restricted to administrators — Customer requests a forced reload: Access Denied is shown and no table is dropped, recreated or loaded"
        - "Forced reload restricted to administrators — Administrator requests a forced reload: The reload is performed"
        - "Forced reload rule — Successful forced reload: The self-registered account and all sign-on history are gone, the sample catalog and sample accounts are present, and the administrator is signed out"
        - "Reload Sample Data replaces all store tables — Administrator reloads: All eight tables are dropped, recreated and loaded from the sample data, the administrator is signed out and the home page is shown"
        - "Session ended on every accepted population request — Signed-in customer enters a populated store: No data changes and the user is signed out"
        - "Population step order — Table absent at drop time: The missing table is ignored at the drop step, and all tables are created and loaded"
        - "Population step order — Table cannot be created: The reload stops with an error and the sample data file is not loaded"
        - "Eight-table populated check and recreation — Sign-on audit table unreadable: All eight tables are dropped and recreated and the sample data is loaded"
        - "No rollback on partial failure — Insert fails mid-load: The reload reports failure and the rows inserted before it remain in the database"
        - "Language code normalisation — en-US in the data file: The stored language code is \"en_US\""
        - "Sample data file validation on read — Malformed file: The load stops and a population failure is reported"
        - "Sample data file validation on read — Non-fatal validity error: The error is written to the server log and loading continues"
        - "Sample data referential validation — Product names an undefined category: The validation reports the product as invalid"
        - "Population result redirection — Success with a named page: The requester is sent to the home page"
        - "Population result redirection — Failure without an error page: The request fails with a server error"
        - "Loaded account attributes — Loaded account defaults: The account \"shopper\" has the role CUSTOMER, zero failed sign-ins, is not locked, has no lock time and no last sign-on time, and has the load time as its creation time"
        - "Catalog record structure on load — Item without optional attributes: The item row is created before its detail row, and the detail row holds that attribute with its other four attributes empty"
        - "Sample account passwords — Sign in with a sample account: The sign-in succeeds with the ADMIN role"
        - "Sample accounts created on load — Accounts after first load: Exactly the accounts j2ee, shopper and admin exist with the roles CUSTOMER, CUSTOMER and ADMIN"
        - "Sample data content — Counts after first load: The store holds 5 categories, 16 products, 28 items and the three sample accounts"
        - "Sample item identifiers and prices — Item identifiers after load: The items are EST-1 to EST-28, all text has language en_US, and each item's list price and unit cost equal the values in the sample data"
        - "Configured data file, statements and dialect — Missing dialect statement: The population fails with an error naming the missing statement"
        - "Two database dialects — No dialect configured: The Derby table definitions are used"
        - "First load callable by the catalog check job — Nothing to load: The call reports success"
        - "First load callable by the catalog check job — Load fails during a job call: The call reports failure that the job can detect"
        - "Repeatable sign-on history seed — Seed loaded after first population: 40 additional CUSTOMER accounts and 90 days of sign-on audit events ending 2026-10-30 exist"
        - "Repeatable sign-on history seed — Regenerated for the same end date: They are identical"
        - "Seed account roles — Roles after seeding: Admin is the only ADMIN account and every account added by the seed has the CUSTOMER role"
        - "Seed account roles — Seed loaded before first population: No j2ee, shopper or admin account is created by the seed"
      outOfScope:
        - "Editing individual catalog records: there is no catalog maintenance screen."
        - "Backup and restore scheduling (batch-operations), although some backup records were tagged here and are kept as drafts."
        - "The catalog integrity rules C1 to C4 (catalog-data-integrity)."
      risksAssumptions:
        - "Disputed: the session ends on every store entry, against the guide's statement that nothing happens."
        - "Disputed: whether a structurally invalid data file is rejected or loaded with a log entry."
        - "A forced reload has no rollback on partial failure."
      techStack: []
      affectedCode: []
      screens:
        - "Catalog Administration page: shown to administrators, warning that reloading drops and recreates every catalog and sign-on table, deletes all accounts created in the store and all sign-in history, and signs the administrator out, with a 'Reload Sample Data' button that requests a forced reload followed by the home page"
        - "Store entry page: describes the store with an 'enter the store' link, stating that the database is populated automatically on first use and that administrators can reload the sample data after signing in"
