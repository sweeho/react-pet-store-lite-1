  - slug: "catalog-data-integrity"
    title: "Catalog data integrity"
    order: 10
    dependsOn:
      - "catalog-browsing"
      - "sample-data-population"
      - "batch-operations"
    priority: 0
    change:
      dir: "openspec/changes/sx-catalog-data-integrity"
      specCapabilities:
        - "catalog-data-integrity"
    canvas:
      problem: "The catalog is kept consistent in two places nobody documented together: database constraints that refuse bad data at write time, and a daily 06:00 check (C1 to C4) that reports what the database cannot enforce and alerts the catalog team. A rebuild that keeps only the tables loses the check; one that keeps only the check loses the price guard."
      solution: "Build the catalog structure rules (hierarchy, identifiers, per-locale text and item details, price precision, referential integrity, locale codes), the price guard that a list price is never below the unit cost, the four checked rules C1 to C4, and the daily integrity check with its log, first-load behaviour and catalog team alert, as specified in the catalog-data-integrity delta spec."
      userStories:
        - "As the catalog team, I want a list price below the unit cost refused when it is written, so that no item is sold at a loss by mistake."
        - "As the catalog team, I want a daily report of categories without products, products without items, prices below cost and items without English text, so that I can fix the catalog."
        - "As the catalog team, I want an alert when the daily check finds a breach, so that I do not have to read the log every day."
      acceptanceCriteria:
        - "Catalog hierarchy and identity — Product under an existing category is accepted: The product is accepted"
        - "Catalog hierarchy and identity — Product under an unknown category is refused: The product is refused and nothing is stored"
        - "Catalog hierarchy and identity — Item under an unknown product is refused: The item is refused and nothing is stored"
        - "Catalog hierarchy and identity — Duplicate code is refused: The second category is refused"
        - "Catalog hierarchy and identity — Code longer than 10 characters is refused: The item is refused"
        - "Category and product display text per locale — Text entry with only a name is accepted: The entry is accepted"
        - "Category and product display text per locale — Second text entry for the same locale is refused: The second entry is refused"
        - "Category and product display text per locale — Text entry without a name is refused: The entry is refused"
        - "Item details per locale — Complete details entry is accepted: The entry is accepted"
        - "Item details per locale — Details entry without a description is refused: The entry is refused"
        - "Item details per locale — Second details entry for the same locale is refused: The second entry is refused"
        - "Item price precision — Amount within range is stored with two decimals: It is held as 16.50"
        - "Item price precision — Amount above the maximum is refused: The entry is refused"
        - "List price never below unit cost — List price below cost is refused: The entry is refused and nothing is stored"
        - "List price never below unit cost — List price equal to cost is accepted: The entry is accepted"
        - "List price never below unit cost — List price above cost is accepted: The entry is accepted"
        - "Localised text refers to an existing record — Text for an unknown category is refused: The entry is refused"
        - "Localised text refers to an existing record — Removing a category that still has text is refused: The removal is refused and the category and its text remain"
        - "Locale codes — Hyphenated tag is normalised on load: The category text is stored under locale \"en_US\""
        - "Category has at least one product (rule C1) — Empty category is reported: BIRDS is reported as a breach of rule C1"
        - "Category has at least one product (rule C1) — Category with a product is not reported: DOGS is not reported under rule C1"
        - "Product has at least one item (rule C2) — Product without items is reported: K9-BD-01 is reported as a breach of rule C2"
        - "Price at or above cost is re-checked (rule C3) — Below-cost entry already present is reported: EST-13 is reported as a breach of rule C3"
        - "Every item has an en_US description (rule C4) — Item without en_US details is reported: EST-1 is reported as a breach of rule C4"
        - "Every item has an en_US description (rule C4) — Product without en_US text is not reported: No breach of rule C4 is reported for the product or its items"
        - "Daily catalog integrity check (SWHR5-R-0019) — A check finds offending rows: The run ends with exit code 4, the offending product is written to the catalog check log, and the catalog team is alerted by mail"
        - "Daily catalog integrity check (SWHR5-R-0019) — No check finds offending rows: The run ends successfully with exit code 0 and no alert is sent"
        - "Catalog check log content — Totals are logged on a clean run: The log records 5 categories and 28 items and the run succeeds"
        - "Catalog check log content — Low totals do not fail the check: The totals are logged and the run succeeds"
        - "First load when the catalog does not exist — Missing catalog is loaded and re-checked: A first load of the sample data is requested without forcing a reload, and checks C1 to C4 run again against the loaded catalog"
        - "First load when the catalog does not exist — Load request fails: The run ends with exit code 8 and the checks are not repeated"
        - "Catalog team alert — Breach raises an urgent mail: An urgent e-mail is sent to the catalog team naming the catalog check log"
        - "Catalog team alert — Other failure does not raise the catalog mail: The catalog-integrity e-mail is not sent"
      outOfScope:
        - "A minimum catalog size of 5 categories and 28 items (held for an SME decision)."
        - "The combined catalog-item view, which has no reader."
        - "Fixed-width versus variable-width identifier storage (held for an SME decision)."
        - "No user interface: no screen records were extracted for this capability."
      risksAssumptions:
        - "Several IR record keys are reused across pass files with different content; see the change's design.md."
