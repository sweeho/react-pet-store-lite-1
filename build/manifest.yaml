  - slug: "catalog-data-integrity"
    title: "Catalog data integrity"
    order: 10
    dependsOn:
      - "catalog-browsing"
      - "sample-data-population"
      - "batch-operations"
    priority: 0
    change:
      dir: "openspec/changes/sx-catalog-data-integrity"
      specCapabilities:
        - "catalog-data-integrity"
    canvas:
      problem: "The catalog is kept consistent in two places nobody documented together: database constraints that refuse bad data at write time, and a daily 06:00 check (C1 to C4) that reports what the database cannot enforce and alerts the catalog team. A rebuild that keeps only the tables loses the check; one that keeps only the check loses the price guard."
      solution: "Build the catalog structure rules (hierarchy, identifiers, per-locale text and item details, price precision, referential integrity, locale codes), the price guard that a list price is never below the unit cost, the four checked rules C1 to C4, and the daily integrity check with its log, first-load behaviour and catalog team alert, as specified in the catalog-data-integrity delta spec."
      userStories:
        - "As the catalog team, I want a list price below the unit cost refused when it is written, so that no item is sold at a loss by mistake."
        - "As the catalog team, I want a daily report of categories without products, products without items, prices below cost and items without English text, so that I can fix the catalog."
        - "As the catalog team, I want an alert when the daily check finds a breach, so that I do not have to read the log every day."
      acceptanceCriteria:
        - "Catalog hierarchy with populated levels — Migrated catalog forms a complete hierarchy: Every product names one existing category, every item names one existing product, and no category or product is empty"
        - "Three-level catalog with unique identifiers — Product under an unknown category is refused: The product is refused and nothing is stored"
        - "Three-level catalog with unique identifiers — Duplicate category identifier is refused: The second category is refused"
        - "Item identity and parent product — Item under an unknown product is rejected: The item is rejected and nothing is stored"
        - "Item identity and parent product — Duplicate item identifier is rejected: The second item is rejected"
        - "Identifier and locale code length — Identifier longer than 10 characters is refused: The item is refused"
        - "Identifier and locale code length — Locale code of 10 characters is accepted: The entry is accepted"
        - "Referential integrity across the catalog — Item details for an unknown item are rejected: The details are rejected"
        - "Referential integrity across the catalog — Product text for an unknown product is rejected: The entry is rejected"
        - "Category text refers to an existing category — Text for an unknown category is refused: The entry is refused"
        - "Category text refers to an existing category — Removing a category that still has text is refused: The removal is refused and the category and its text remain"
        - "Descriptive text per locale — Text entry with only a name is accepted: The entry is accepted"
        - "Descriptive text per locale — Second description for the same locale is refused: The second entry is refused"
        - "Descriptive text per locale — Name longer than 80 characters is refused: The entry is refused"
        - "Product text per locale — Product text without a name is refused: The entry is refused"
        - "Product text per locale — Product text with only a name is accepted: The entry is accepted"
        - "English text for every catalog record — Migrated catalog carries en_US text only: Every category, product and item has an en_US entry and no entry carries another locale"
        - "Item details per locale — Complete details entry is accepted: The entry is accepted"
        - "Item details per locale — Details entry without a description is refused: The entry is refused"
        - "One detail record per item and locale — Second details entry for the same locale is refused: The second entry is refused"
        - "One detail record per item and locale — Details entry without an image is refused: The entry is refused"
        - "Item details amounts and attributes — Amount with nine integer digits is refused: The entry is refused"
        - "Item details amounts and attributes — Attribute longer than 80 characters is refused: The entry is refused"
        - "Two-decimal prices never below cost — Price is held with two decimals: It is held as 16.50"
        - "Two-decimal prices never below cost — Price below cost is not held: The entry is refused"
        - "List price never below unit cost — List price below cost is rejected: The record is rejected"
        - "List price never below unit cost — List price equal to cost is accepted: The record is accepted"
        - "Localised details price guard — Price above cost is accepted: It is accepted"
        - "Localised details price guard — Price below cost is rejected: It is rejected"
        - "Item price below cost is refused (rule C3) — Below-cost item is refused in another locale: The details are refused"
        - "Price guard refused and re-checked — Write is refused: The entry is refused and nothing is stored"
        - "Price guard refused and re-checked — Row already present is reported: EST-13 is reported as a breach of check C3"
        - "Locale normalisation and seed details — Hyphenated tag is normalised on load: The category text is stored under locale \"en_US\""
        - "Locale normalisation and seed details — Seed record without localized details is refused: The seed data is refused"
        - "Every category has a product (check C1) — Empty category is reported: BIRDS is reported as a breach of check C1"
        - "Every category has a product (check C1) — Category with a product is not reported: DOGS is not reported under check C1"
        - "Four catalog rules hold at all times — A catalog breaking one rule is not valid: Rule C2 is reported as broken for K9-BD-01 and rules C1, C3 and C4 hold"
        - "Migrated catalog satisfies C1 to C3 — Migrated sample catalog satisfies the rules: No category without a product, no product without an item and no item priced below cost is found"
        - "Every product has an item (check C2) — Product without items is reported: K9-BD-01 is reported as a breach of check C2"
        - "Every product has an item (rule C2) — Product with an item satisfies C2: K9-BD-01 is not reported"
        - "Every item has an en_US description (check C4) — Item without en_US details is reported: EST-1 is reported as a breach of check C4"
        - "Every item has an en_US description (check C4) — Product without en_US text is not reported: No breach of check C4 is reported"
        - "C4 violation per item — Each offending item is listed: EST-1 and EST-2 are each reported as a C4 violation"
        - "Every item has an en_US description (rule C4) — Item with en_US details satisfies C4: EST-1 is not reported"
        - "en_US catalog locale — Item lacking en_US text is reported: EST-20 is reported"
        - "Catalog totals are logged — Totals are logged on a clean run: The log records 5 categories and 28 items and the run succeeds"
        - "Totals are not judged — Low totals do not fail the check: The totals are logged and the run succeeds"
        - "Declared catalog minimums are not enforced — Catalog below the declared minimums: The run succeeds and no breach is reported"
        - "Daily catalog integrity check — A check finds offending rows: The run ends with exit code 4, the offending product is written to the catalog check log, and the catalog team is alerted by mail"
        - "Daily catalog integrity check — No check finds offending rows: The run ends successfully with exit code 0 and no alert is sent"
        - "Daily check log and exit codes — Results are appended, not overwritten: The new results and counts are appended after the previous ones"
        - "Daily check log and exit codes — Violation ends with code 4: The run ends with code 4 and an urgent mail is sent to the catalog team"
        - "Check before the store opens — Breach ends as failed: The run ends as failed with code 4 and the C4 row for EST-1 is in the catalog check log"
        - "Breaching rows and totals are logged — Breaching row is logged with its rule and code: The log carries a C2 row naming K9-BD-01 and the totals 5 and 27, and the run ends with exit code 4"
        - "First load when the catalog does not exist — Missing catalog is loaded and re-checked: A first load of the sample data is requested, and checks C1 to C4 run again against the loaded catalog"
        - "Independent schedule and catalog team alert — Breach raises an urgent mail without waiting for the backup: An urgent e-mail is sent to the catalog team naming the catalog check log"
        - "Independent schedule and catalog team alert — Other result raises no catalog mail: The catalog-integrity e-mail is not sent"
      outOfScope:
        - "A minimum catalog size of 5 categories and 28 items (held for an SME decision)."
        - "The combined catalog-item view, which has no reader."
        - "Fixed-width versus variable-width identifier storage (held for an SME decision)."
        - "No user interface: no screen records were extracted for this capability."
      risksAssumptions:
        - "Several IR record keys are reused across pass files with different content; see the change's design.md."
