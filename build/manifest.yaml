  - slug: "sign-on"
    title: "Sign-on and sign-off"
    order: 3
    dependsOn:
      - "catalog-browsing"
    priority: 0
    change:
      dir: "openspec/changes/sx-sign-on"
      specCapabilities:
        - "sign-on"
    canvas:
      problem: "Customers and administrators sign in and out through a request filter, an account store, a sign-out handler and four pages plus the shared banner. The credential check, where the user lands afterwards, the Remember My User Name cookie, the 15-minute inactivity timeout and the audit events written on each outcome are spread over Java code, deployment descriptors, configuration, the guides and the account data."
      solution: "Build sign-in and sign-out: the case-sensitive credential check, the signed-in session carrying user name and role, return to the requested page, Remember My User Name, the 15-minute timeout, sign-out with its audit event, and the Sign In, Sign-in Error, signed-out and Welcome pages and banner status, as specified in the sign-on delta spec."
      userStories:
        - "As a returning customer, I want to sign in with my user name and password, so that I can reach my account."
        - "As a returning customer, I want the store to remember my user name, so that I do not have to type it each time."
        - "As a visitor who mistyped my credentials, I want an error page that does not reveal which one was wrong, with a way to try again, so that my account stays private."
        - "As a signed-in user, I want to sign out and see that I am signed out, so that nobody else can use my session."
      acceptanceCriteria:
        - "Credential check — Correct credentials on an unlocked account: The sign-in is accepted"
        - "Credential check — Password differs only in letter case: The sign-in is refused"
        - "Credential check — User name differs only in letter case: The sign-in is refused as an unknown user name and the failure count of \"j2ee\" is unchanged"
        - "Credential check — Correct password on a locked account: The sign-in is refused"
        - "Refused sign-in shows the sign-in error page (SWHR5-R-0023) — Unknown user name: The sign-in error page is shown and the visitor is not signed in"
        - "Refused sign-in shows the sign-in error page (SWHR5-R-0023) — Wrong password that does not lock the account: The sign-in error page is shown and the visitor is not signed in"
        - "Sign-in error does not disclose which credential was wrong (SWHR5-R-0024) — Same page for an unknown user and a wrong password: Both attempts show the same Sign-in Error page with identical wording"
        - "Successful sign-in updates the account — Sign-in after earlier failures: The account's failed sign-in count is 0 and its last sign-in time is 2024-03-05 10:15"
        - "Sign-in outcome audit events — Successful sign-in is audited: One successful sign-in event is recorded for \"alice\""
        - "Sign-in outcome audit events — Unknown user name is audited as typed: One failed sign-in event is recorded for \"Alice\" and the failure count of \"alice\" stays 0"
        - "Signed-in session — Session after a customer signs in: The session is marked signed in with user name \"alice\" and role CUSTOMER"
        - "Return to the requested page after sign-in — Sign-in requested by a protected page: The visitor is taken to My Account"
        - "Return to the requested page after sign-in — No page was requested: The visitor is taken to the home page"
        - "Remember my user name — Ticked on a successful sign-in: The browser keeps the user name \"alice\" for 31 days"
        - "Remember my user name — Ticked on a refused sign-in: The sign-in error page is shown and the browser keeps the user name \"nobody\" for 31 days"
        - "Remember my user name — Unticked: The remembered user name is deleted from the browser"
        - "Session inactivity timeout — Idle beyond 15 minutes: The visitor is shown the Sign In page"
        - "Session inactivity timeout — Activity within 15 minutes: My Account is shown without a new sign-in"
        - "Sign out (SWHR5-R-0009) — Signed-in user signs out: A sign-off event is recorded for \"alice\", the session ends and the \"You are signed out\" page is shown"
        - "Sign out (SWHR5-R-0009) — Sign out with no signed-in user: The \"You are signed out\" page is shown and no sign-off event is recorded"
        - "Sign out (SWHR5-R-0009) — Sign out by form submission: The outcome is the same as choosing the Sign out link"
        - "Account store failure during sign-in — Database unavailable: The visitor is not signed in and a general server error is returned instead of the Sign-in Error page"
        - "UTF-8 request decoding before sign-in — Non-ASCII password: The sign-in is accepted"
        - "Passwords stored and compared as entered — Stored password matches the entered text: Its stored password is \"Pa55word\""
        - "Account sign-on timestamps — New account never signed in: Its creation time is 2024-02-01 08:00 and its last sign-in time is empty"
        - "Account sign-on timestamps — Last sign-in agrees with the audit trail: Its last sign-in time is 2024-03-05 10:15"
        - "Existing user names containing a full stop — Migrated account with a dotted user name: The sign-in is accepted"
        - "Sign In page returning-customer form — No remembered user name: The User Name field shows \"j2ee\", the Password field is empty, the checkbox is unticked and a Sign In button is offered"
        - "Sign In page returning-customer form — Remembered user name present: The User Name field shows \"alice\", the Password field is empty and the checkbox is ticked"
        - "Sign In page returning-customer form — Submitting the form: The credentials are checked and the visitor is signed in"
        - "Sign-in Error page — Error page after a refused sign-in: It shows the heading \"Sign-in Error\", the not-found message, the 3-attempt lock warning and a \"try again\" link"
        - "Sign-in Error page — Try again: The Sign In page is displayed"
        - "Signed-out page — Page after sign-out: The page shows \"You are signed out.\", a thank-you line and a \"sign in\" link"
        - "Signed-out page — Sign in again: The Sign In page is displayed"
        - "Banner sign-in status — Signed-in visitor: The banner shows \"Signed in as alice\" and a \"Sign out\" link, and no \"Sign in\" link"
        - "Banner sign-in status — Anonymous visitor: The banner shows a \"Sign in\" link and no \"Signed in as\" text"
        - "Banner sign-in status — Sign out from the banner: The visitor is signed out and the signed-out page is shown"
        - "Sign-in Welcome page — Signing in from the banner link: The Welcome page is displayed with the home page content and the banner shows \"Signed in as <user name>\""
        - "Sign-in Welcome page — Already signed in: The Welcome page is displayed without a sign-in prompt"
      outOfScope:
