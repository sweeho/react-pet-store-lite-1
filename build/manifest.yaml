  - slug: "sample-data-population"
    title: "Sample data population"
    order: 8
    dependsOn:
      - "catalog-browsing"
      - "sign-on"
      - "access-control"
    priority: 0
    change:
      dir: "openspec/changes/sx-sample-data-population"
      specCapabilities:
        - "sample-data-population"
    canvas:
      problem: "The store fills its own database from a bundled sample data set. A visitor's first entry triggers the load, the daily catalog check also triggers it when the tables are missing, and an administrator can force a full reload that deletes every account and all sign-on history. Who may trigger it and what it destroys are operational and access-control rules spread across the populate servlet, a statement file, two pages, the batch chain and the admin guide."
      solution: "Build the store entry page and first load, the already-populated check, the ADMIN-only forced reload from Catalog Administration with its warning, the step order and replace-everything semantics, the sample catalog and accounts, the sign-on history seed and the result redirection, as specified in the sample-data-population delta spec."
      userStories:
        - "As the first visitor to an empty store, I want the sample catalog loaded when I enter, so that there is something to browse."
        - "As a store administrator, I want to reload the sample data after a clear warning of what it deletes, so that I can reset a demo store on purpose."
        - "As an operator, I want the daily catalog check to load the catalog when it is missing, so that the store recovers without a manual step."
      acceptanceCriteria:
        - "Store entry page — Entry page is displayed: It shows the store description, an \"enter the store\" link, a note that the database is populated automatically on first use, and a note that administrators can reload the sample data from the Admin page after signing in"
        - "Store entry page — Visitor follows the enter-the-store link: The message \"Please wait while the Java Pet Store Application is being populated...\" is shown, a first-load (non-forced) population is requested, and the home page is shown once it completes"
        - "Catalog Administration page — Administrator opens the page: It shows the title \"Catalog Administration\", the warning that every catalog and sign-on table is dropped and recreated, that all accounts created in the store and all sign-in history are deleted and that the administrator will be signed out, and a \"Reload Sample Data\" button"
        - "Catalog Administration page — Administrator presses Reload Sample Data: A forced reload of the sample data is requested and, on success, the home page is shown with the administrator signed out"
        - "First load on entering the store — Anonymous visitor enters an empty store: The sample data is loaded and the home page is shown, without any sign-in prompt"
        - "First load on entering the store — Visitor enters an already populated store: No catalog, account or sign-on history data is changed"
        - "First-load requests open to any caller — Customer requests a first load: The request is accepted and is not answered with Access Denied"
        - "Forced reload restricted to administrators (SWHR5-R-0022) — Anonymous visitor requests a forced reload: Access Denied is shown and no table is dropped, recreated or loaded"
        - "Forced reload restricted to administrators (SWHR5-R-0022) — Customer requests a forced reload: Access Denied is shown and no table is dropped, recreated or loaded"
        - "Forced reload restricted to administrators (SWHR5-R-0022) — Administrator requests a forced reload: The reload is performed"
        - "Refused forced reload leaves the session intact — Customer stays signed in after a refused reload: The user is still signed in"
        - "Forced reload replaces all store data — Forced reload on a store with customer data: The self-registered account and all sign-on history are gone, the sample catalog and sample accounts are present, the administrator is signed out and the home page is shown"
        - "Forced-mode flag interpretation — Mixed-case true: The request is handled as a forced reload"
        - "Forced-mode flag interpretation — Unrecognised value: The request is handled as a first-load request"
        - "Already-populated check — One catalog table empty: Every catalog and sign-on table is dropped, recreated and reloaded"
        - "Already-populated check — Empty sign-on audit table: No data is changed"
        - "Failed check counts as not populated — Missing table: The full drop, recreate and reload runs and deletes every existing sign-on account and all sign-on history"
        - "Population removes all accounts and history — Self-registered account after population: Only the accounts listed in the sample data exist and \"alice\" does not"
        - "Session ended on every accepted population request — Signed-in customer enters a populated store: No data changes, the user is signed out, and no sign-off event is recorded"
        - "Population step order — Table absent at drop time: The missing table is ignored at the drop step, and all eight tables are created and loaded"
        - "No rollback on partial failure — Insert fails mid-load: The population reports failure and the rows inserted before it remain in the database"
        - "Sample accounts — Accounts after first load: Exactly the accounts j2ee, shopper and admin exist with the roles CUSTOMER, CUSTOMER and ADMIN, and the sign-on audit history holds no account-created event for them"
        - "Loaded account attributes — Loaded account defaults: The account \"shopper\" has zero failed sign-ins, is not locked, has no last sign-on time, and has the population time as its creation time"
        - "Sample catalog content — Catalog after first load: The catalog holds 5 categories, 16 products and 28 items, all text has language en_US, and no item's list price is below its unit cost"
        - "Catalog record structure on load — Item without optional attributes: The item detail row holds that attribute and its other four attributes are empty"
        - "Language code normalisation — en-US in the data file: The stored language code is \"en_US\""
        - "Sample data validation — Malformed file: The population fails and reports a failure"
        - "Sample data validation — Structural violation in a well-formed file: The violation is written to the server log and loading continues"
        - "Configured data source and dialect — Missing dialect statement: The population fails with an error naming the missing statement"
        - "Sign-on audit identifier — Audit event after population: It is stored with a new, unique identifier that the caller did not supply"
        - "Population result redirection — Success with a named page: The requester is sent to the home page"
        - "Population result redirection — Failure without an error page: The cause is logged and the request fails with a server error"
        - "First load callable by the catalog check job — Load fails during a job call: The response carries a failure status that the job can detect"
        - "Daily catalog check triggers first load — Missing tables at 06:00: A first load is requested and the catalog checks run again on the loaded data"
        - "Daily catalog check triggers first load — Load request fails: The job ends with exit code 8"
        - "Sign-on history seed — Seed loaded after first population: 40 additional CUSTOMER accounts and the audit events from 2026-08-01 to 2026-10-30 exist, and the accounts j2ee, shopper and admin have creation time 2026-08-01 00:00:00"
        - "Sign-on history seed — Seed loaded before first population: The updates to the three sample accounts affect no rows"
        - "Sign-on history seed — Regenerated for the same end date: They are identical"
        - "Sign-on history seed — Locked accounts at period end: Exactly two customer accounts are locked, each with a lock less than 30 minutes old"
        - "Seed account roles — Roles after seeding: Admin is the only ADMIN account"
        - "Store database location and connection limits — First start on a new host: The database is created at that location"
        - "Daily online backup — Backup retention: Today's backup exists and every backup older than 7 whole days is deleted"
        - "Batch retries — Catalog check failure: The job is not rerun automatically"
        - "Batch job log lines — Job run is logged: The batch job log gains exactly two lines for that run, one for the start and one for the end"
        - "Restore from a dated backup — Restore after an unwanted reload: The store restarts with the accounts and history as they were at backup time"
      outOfScope:
        - "Editing individual catalog records: there is no catalog maintenance screen."
        - "Backup and restore scheduling (batch-operations), although some backup records were tagged here and are kept as drafts."
        - "The catalog integrity rules C1 to C4 (catalog-data-integrity)."
      risksAssumptions:
        - "Disputed: the session ends on every store entry, against the guide's statement that nothing happens."
        - "Disputed: whether a structurally invalid data file is rejected or loaded with a log entry."
        - "A forced reload has no rollback on partial failure."
      techStack: []
      affectedCode: []
      screens:
        - "Catalog Administration page: shown to administrators, warning that reloading drops and recreates every catalog and sign-on table, deletes all accounts created in the store and all sign-in history, and signs the administrator out, with a 'Reload Sample Data' button that requests a forced reload followed by the home page"
        - "Store entry page: describes the store with an 'enter the store' link, stating that the database is populated automatically on first use and that administrators can reload the sample data after signing in"
