# Spec extraction SX-0001 release schedule for the build orchestrator.
# Acceptance criteria are generated one per scenario from each change's specs/<capability>/spec.md.
# reviewedBy/reviewedAt are null: no named reviewer is recorded for any capability.
schemaVersion: 1
program:
  key: "pet-store-lite-rebuild"
  title: "Java Pet Store Lite rebuild"
  source: "extraction"
  generator: "vortex-spec-extraction"
  sourceRef: "vortex/legacy-spec/sx-0001"
capabilities:
  - slug: "catalog-browsing"
    title: "Catalog browsing"
    order: 1
    dependsOn: []
    priority: 0
    change:
      dir: "openspec/changes/sx-catalog-browsing"
      specCapabilities:
        - "catalog-browsing"
    canvas:
      problem: "Every visitor, signed in or not, moves through the store from the home page to a category, a product and an item. The rules behind that path (two-row paging and its Previous/Next links, en_US-only text, US-dollar prices, which price is shown as Your Price, the shared page layout and the error pages) live in SQL statements, page templates and a page-composition framework, and the User Guide disagrees with the code in places. None of it is written down as one specification."
      solution: "Build the public catalog: the three-level category, product and item model with per-locale text and prices, the category, product and item pages with paging, the home page, the shared layout with banner and Pets side bar, and the General Error page, matching the requirements in the catalog-browsing delta spec."
      userStories:
        - "As a visitor, I want to pick a pet category from the home page or the side bar, so that I can see the products in it."
        - "As a visitor, I want to page through a category's products and a product's items, so that I can find the pet I want."
        - "As a visitor, I want to see an item's picture, List Price, Your Price and description, so that I can decide whether to buy it."
        - "As a visitor, I want a clear error page with a way back to the catalog when something goes wrong, so that I am not stranded."
      acceptanceCriteria:
        - "Category products page — First page of a category with five products: The page is headed \"Products for this Category\" and shows the first two products by name and description, each name linking to that product's items, and a Next link is shown and no Previous link is shown"
        - "Category products page — Last page of a category: One product is shown, a Previous link is shown and no Next link is shown"
        - "Product items page — Product with three items: The page is headed \"Items for this Product\" and shows two items, the first labelled \"Male Adult Bulldog\" linking to its item page, with its description and the price \"$18.50\", and a Next link is shown and no Previous link is shown"
        - "Item page — Item page for a seeded item: The page shows the item image, the heading \"Large Angelfish\", \"List Price $16.50\", \"Your Price $10.00\", the item description and \"Item ID: EST-1\""
        - "Home page pet picture — Visitor clicks a pet on the home page: The Dogs category page is shown"
        - "Store page frame — Anonymous visitor views any store page: The page shows the banner with the logo, a search box, an Account link and a Sign in link, the Pets side bar, the page body and the footer, and clicking the logo shows the home page"
        - "Store page frame — Signed-in visitor sees Sign out: The banner shows a Sign out link in place of the Sign in link"
        - "General Error page — Unhandled error while serving a page: The General Error page is shown, stating that an unexpected error occurred, and it offers a link that returns the visitor to the catalog home page"
        - "Banner Admin link — Administrator is signed in: The banner shows \"Signed in as admin\", a Sign out link and an Admin link"
        - "Banner Admin link — Customer is signed in: The banner shows \"Signed in as j2ee\" and a Sign out link, and no Admin link"
        - "Shared page layout from page definitions — Page with no layout of its own: The page is rendered on the default layout with the title \"Products\", the shared banner, sidebar and footer, and the category body"
        - "Named catalog pages and titles — Page titles: The page titles are \"Welcome to the BluePrints Petstore\", \"Products\", \"Items\", \"Item\" and \"General Error\""
        - "Named catalog pages and titles — Welcome page after sign-in: Its title is \"Welcome\" and its body is the same pet picture as the home page"
        - "Home page category links — Visitor opens the store root: A picture of pets is shown in which each of the Birds, Fish, Dogs, Reptiles and Cats regions links to that category's product list"
        - "Three-level catalog drill-down — Drilling from category to item: The Dogs page lists Bulldog with its name and description, and the Bulldog page lists \"Male Adult Bulldog\" with its description and list price"
        - "Category and product ordering — Categories in name order: They appear in the order Birds, Cats, Dogs, Fish, Reptiles"
        - "Item order is undefined — Items of a product are not sorted: The items are returned without any sort being applied, and a consumer MUST NOT rely on their order"
        - "Pets side bar shows at most five categories — Side bar with the five seeded categories: The Pets side bar lists Birds, Cats, Dogs, Fish and Reptiles in that order, each linking to its category page"
        - "en_US text and US-dollar prices on pages — Browser asks for French: The catalog text is the en_US text and prices are formatted like \"$16.50\""
        - "Next and Previous link targets — Next keeps the page size: The next page starts at position 3 with a page size of 3"
        - "Next and Previous link targets — Previous resets the page size to 2: The page shown starts at position 0 with a page size of 2"
        - "Items shown only with locale text — Item without en_US product text: The item does not appear"
        - "UTF-8 request interpretation — Search words with accented characters: The word is read as \"café\" with its accented character intact"
        - "Category list with descriptions — Category list in en_US: Five entries are returned, each with identifier, name and description, ordered by name"
        - "Category product paging — Middle page of a category: Two products are shown with name and description, and both a Previous and a Next link are shown"
        - "Category product paging — Category with two products: Both products are shown and neither a Next nor a Previous link is shown"
        - "Category navigation limited to five — Six categories exist: Only the first five by name are listed and no Next link is offered"
        - "Product list for a category — Default product page: The first two products by name are returned, each with identifier, name and description"
        - "Item list for a product — Default item page: Both items are returned, each with identifier, image, description, attributes, product name, list price and unit cost"
        - "Shared side bar on every page — Side bar on the item page: A side bar lists one link per category in alphabetical order"
        - "Single item lookup — Known item: Its category, product identifier, product name, image, description, five attributes, list price 16.50 and unit cost 10.00 are returned"
        - "Single item lookup — Unknown item: No item is returned and no error is raised"
        - "Category structure, item fields and per-locale text — Item belongs to a product and category: Its en_US description, image, list price and unit cost are returned, together with its product and category"
        - "Default page size with request override — No page size requested: Two products are shown"
        - "Default page size with request override — Page size requested: Four products are shown"
        - "Default catalog page size — Product page with default size: Two items are shown"
        - "Undefined page name — Unknown page requested: The response is the plain text \"Error: Definition for screen nosuch not found\", without the banner, side bar or footer"
        - "Return to previous page — PREVIOUS after viewing a category: The category page is displayed again, without re-supplying the previous request's parameters"
        - "Display language selection — Request names an unconfigured language: The page is shown with the en_US definitions"
        - "Display language selection — Nothing named: The page is shown in en_US"
        - "Category record — Category read in en_US: Its identifier \"DOGS\", name \"Dogs\" and description are returned"
        - "Product record — Product belongs to one category: Its identifier, name \"Bulldog\" and description are returned and it belongs to DOGS only"
        - "Item record — Attribute position out of range: \"Large\" is returned"
        - "Item fields and optional category description — Item without attributes: It is accepted"
        - "Item fields and optional category description — Item without description: It is rejected"
        - "Category listing in the shopper's locale — Paged category listing: The first two categories by name are returned and a next page is available"
        - "Product listing in the shopper's locale — Paged product listing: The third and fourth products by name are returned"
        - "Item listing in the shopper's locale — Paged item listing: Two items are returned with their identifier, product name, image, description, attributes, list price and unit cost, and a next page is available"
        - "Item view requires locale text — Item detail missing in the locale: No item is returned"
        - "Catalog page arithmetic — Start negative: An empty page is returned"
        - "Catalog page arithmetic — Last page exactly filled: Two rows are returned, no next page is offered, a previous page is offered and it starts at 0"
        - "Catalog page arithmetic — Start beyond the last row: An empty page is returned"
        - "Default start and page size — No start or count supplied: The first two rows are returned"
        - "Non-positive page size returns one row — Count of zero: Exactly one row is returned"
        - "Locale completeness of catalog text — Item detail exists but product detail does not: EST-1 is not listed"
        - "Locale text interpretation — Locale strings: They yield the server's default locale, English (United States), and no locale respectively"
        - "Catalog data failure — Data store unavailable: The request fails with a catalog error carrying the underlying message, and no empty list is returned"
        - "Catalog query dialect configuration — Deployment names the Derby set: The Derby statements are used for every catalog query"
        - "Listing by parent without full scan — Products of a category looked up by parent code: They are found through a lookup on the category code, not by reading every product"
        - "Store language and currency — Prices on the product page: The page text is in English and the price reads \"$18.50\""
        - "Price labels — Item prices labelled: 16.50 is labelled \"List Price\" and 10.00 is labelled \"Your Price\""
        - "Five pet categories — Seeded categories: Exactly the categories FISH, DOGS, REPTILES, CATS and BIRDS are present"
        - "Anonymous catalog navigation — Anonymous drill-down: Each page is shown without a sign-in prompt, and the links carry category id FISH, product id FI-SW-01 and item id EST-1"
      outOfScope:
        - "Keyword search and the Search page (catalog-search)."
        - "Sign-in, My Account and Catalog Administration, which appear here only as banner links."
        - "The C1 to C4 catalog integrity check and the price guard (catalog-data-integrity)."
        - "Loading the sample catalog (sample-data-population)."
        - "Shopping cart, ordering and payment: the legacy store has none."
      risksAssumptions:
        - "Disputed: whether Your Price (the unit cost) is a customer price or a member price."
        - "Unresolved reachability: the PREVIOUS page, locale-suffixed tables, single category and product lookup and the combined catalog view have no caller in the legacy source."
      techStack: []
      affectedCode: []
      screens:
        - "Products for this Category page: lists the chosen category's products two at a time, each with its name (linking to the product's items) and description, with a Previous link only when an earlier page exists and a Next link only when a later page exists"
        - "Items for this Product page: lists the chosen product's items two at a time, each with its attribute and product name (linking to the item page), its description and its list price formatted as en_US currency, with the same conditional Previous and Next links as the category page"
        - "Item page: titled with the item attribute and product name, showing the item image, List Price (the item's list price), Your Price (the item's unit cost), the item description and the Item ID, with both prices formatted as en_US currency"
        - "Home page: a pet picture whose regions link to the Birds, Fish, Dogs, Reptiles and Cats category pages"
        - "Store page frame: every store page is composed of a banner (logo linking to the home page, a keyword search box, an Account link and a Sign in or Sign out link), a Pets side bar, the page body and a footer"
        - "General Error page: shown for any unhandled error while serving a page, saying an unexpected error occurred, with a link back to the catalog"
        - "Banner with sign-in status and Admin link: logo returning to the home page, Search box, Account link and Sign in or Sign out link, plus 'Signed in as <user name>' when signed in, a category side bar, the requested body and a footer; a user signed in with the ADMIN role also sees an Admin link in the banner"
        - "Shared page layout: every named page is rendered from one layout of title, banner, sidebar, body and footer, where the title text and the content of each region come from that page's definition, and the default layout is used when a page names none"
        - "Named catalog pages: Home, Products (category), Items (product), Item and General Error, each addressable by name and titled 'Welcome to the BluePrints Petstore', 'Products', 'Items', 'Item' and 'General Error'; the Welcome page shown after sign-in reuses the Home page body"
        - "Banner and Pets side bar: a banner holding the store logo (linking to the home page), a search box and the Account and Sign in links (Sign out plus 'Signed in as <user name>' when signed in), a Pets side bar with one link per category in alphabetical order, the requested page body and a footer"
