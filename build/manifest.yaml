  - slug: "sign-on"
    title: "Sign-on and sign-off"
    order: 3
    dependsOn:
      - "catalog-browsing"
    priority: 0
    change:
      dir: "openspec/changes/sx-sign-on"
      specCapabilities:
        - "sign-on"
    canvas:
      problem: "Customers and administrators sign in and out through a request filter, an account store, a sign-out handler and four pages plus the shared banner. The credential check, where the user lands afterwards, the Remember My User Name cookie, the 15-minute inactivity timeout and the audit events written on each outcome are spread over Java code, deployment descriptors, configuration, the guides and the account data."
      solution: "Build sign-in and sign-out: the case-sensitive credential check, the signed-in session carrying user name and role, return to the requested page, Remember My User Name, the 15-minute timeout, sign-out with its audit event, and the Sign In, Sign-in Error, signed-out and Welcome pages and banner status, as specified in the sign-on delta spec."
      userStories:
        - "As a returning customer, I want to sign in with my user name and password, so that I can reach my account."
        - "As a returning customer, I want the store to remember my user name, so that I do not have to type it each time."
        - "As a visitor who mistyped my credentials, I want an error page that does not reveal which one was wrong, with a way to try again, so that my account stays private."
        - "As a signed-in user, I want to sign out and see that I am signed out, so that nobody else can use my session."
      acceptanceCriteria:
        - "Credential check — Correct credentials on an unlocked account: The sign-in is accepted"
        - "Credential check — Correct password on a locked account: The sign-in is refused"
        - "Case-sensitive match of user name and password — Password differs only in letter case: The sign-in is refused"
        - "Case-sensitive match of user name and password — User name differs only in letter case: The sign-in is refused"
        - "Sign-in outcome routing — Successful sign-in with no page requested: The home page is shown"
        - "Sign-in outcome routing — Failed sign-in: The \"Sign-in Error\" page is shown with a try-again link"
        - "Sign-in acceptance rule — Unknown user: The sign-in is refused"
        - "Sign-in acceptance rule — All three conditions hold: The sign-in is accepted"
        - "Sign-in acceptance with try-again on wrong credentials — Wrong user name: The Sign-in Error page is shown with a \"try again\" link"
        - "Passwords compared as entered — Entered password matches the stored text: The sign-in is accepted"
        - "Passwords stored in readable form — Stored password is the entered text: Its stored password is \"Pa55word\""
        - "One account per case-sensitive user name — User names differing only in case are different accounts: No account is found"
        - "Account record — Defaults on a new account: Its role is CUSTOMER, its failed sign-in count is 0, its locked flag is N and its creation time is set"
        - "Account record — Duplicate user name: The store refuses it"
        - "Successful sign-in resets the failure count — Sign-in after earlier failures: The account's failed sign-in count is 0 and its last sign-in time is 2024-03-05 10:15"
        - "Existing user names containing a full stop — Migrated account with a dotted user name: The sign-in is accepted"
        - "Last successful sign-in time recorded — First successful sign-in: The account's last sign-in time is 2024-02-01 08:30"
        - "Last successful sign-in time recorded — Refused sign-in leaves the time unchanged: The account's last sign-in time is still 2024-02-01 08:30"
        - "Last sign-in time equals the most recent successful sign-in — Several sign-ins: Its last sign-in time is 2024-03-05 10:15"
        - "Sign out ends the session and records the sign-off — Signed-in user chooses Sign out: The session ends, a sign-off event is recorded for \"alice\" and the \"You are signed out\" page is shown"
        - "Sign out — Signed-in user signs out: A sign-off event is recorded for \"alice\", the session ends and the \"You are signed out\" page is shown"
        - "Sign out — Sign out with no signed-in user: The \"You are signed out\" page is shown and no sign-off event is recorded"
        - "Sign-off by link or form submission — Sign out by form submission: A sign-off event is recorded for \"alice\", the session ends and the signed-out page is shown"
        - "Sign-off by link or form submission — No session: The signed-out page is shown and no event is recorded"
