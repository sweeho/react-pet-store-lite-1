  - slug: "catalog-search"
    title: "Catalog search"
    order: 2
    dependsOn:
      - "catalog-browsing"
    priority: 0
    change:
      dir: "openspec/changes/sx-catalog-search"
      specCapabilities:
        - "catalog-search"
    canvas:
      problem: "Shoppers find items by keyword from a search box on every page. The matching rules (which fields are searched, any-word semantics, case handling, wildcard characters, unordered results, en_US only, two results per page) are spread over code and SQL, and the User Guide states some of them wrongly."
      solution: "Build keyword search over the catalog: the banner search box, keyword tokenisation and matching on product name, category code and item description, the locale restriction, empty and no-match handling, paging at two results per page and the Search results page, as specified in the catalog-search delta spec."
      userStories:
        - "As a shopper, I want to type keywords into the search box on any page, so that I can find items without browsing the categories."
        - "As a shopper, I want items that match any of my keywords listed with their price and a link to the item, so that I can open the one I want."
        - "As a shopper, I want a clear message when nothing matches, so that I know to try different words."
      acceptanceCriteria:
        - "Keyword match on product name, category code and item description — Part of a word matches a product name: Every Bulldog item is returned, together with every item in the DOGS category and every item whose description contains \"dog\""
        - "Keyword match on product name, category code and item description — Keyword matches the category code: Those three items are returned"
        - "Keyword match on product name, category code and item description — Duplicate keywords collapse: The result is identical to a search for \"koi\", with no item listed twice"
        - "Several keywords match any word — Two words, each matching different items: Both the snake items and the koi items are returned"
        - "Several keywords match any word — One word matches nothing: The Poodle items are returned"
        - "Search results paged two per page — Odd result count: There are 4 pages, the first three holding 2 items and the last holding 1"
        - "Search results paged two per page — No results: There are 0 pages"
        - "Keyword case handling — Lower-case keyword matches regardless of stored case: The item is returned"
        - "Keyword case handling — Keyword with a capital letter matches nothing: No item is returned and the no-results message is shown"
        - "Item attributes are not searched — Keyword present only in an attribute: No item is returned"
        - "Search limited to the shopper's locale — Text in another locale is not matched: The item is not returned"
        - "Empty query returns no results without a catalog query — Whitespace-only query: Zero results and zero pages are returned and no catalog query is executed"
        - "No-results message — Query matches nothing: The page shows \"No results were found for your search.\" and lists no items"
        - "No-results message — Empty query: The page shows \"No results were found for your search.\" and lists no items"
        - "No-results message and missing search-text field — Search text of spaces only: The page shows \"No results were found for your search.\""
        - "No-results message and missing search-text field — Missing search-text parameter: The generic error page is shown instead of search results or the no-results message"
        - "Wildcard characters in keywords — Percent sign matches everything: Every en_US item is returned"
        - "Wildcard characters in keywords — Underscore matches one character: The Koi item is returned"
        - "Search results have no defined order — Results are paged without a sort key: Together they return each of the 13 items exactly once, in an order no requirement fixes"
        - "Search result item data — A result carries the full item data: The EST-6 result carries its category, product identifier, product name, item identifier, image, description, attributes, list price and unit cost"
        - "Request text decoded as UTF-8 — Non-ASCII search keyword: The keyword used for the search is \"café\", unaltered"
        - "Banner search box screen — Search box shown on every page: The banner shows an empty text box for search words and a button labelled \"Search\""
        - "Banner search box screen — Submitting the search box: The Search page opens showing the first page of results for \"dog\""
        - "Search results screen — First page of results: It shows \"Search Results:\", \"Items matching any of: dog\", the first 2 matching items each with attribute and product name linked to its item page, its description and its unit cost as US-dollar currency, a Next link, and no Previous link"
        - "Search results screen — Middle page navigation: Page 3 of the results for \"dog\" is shown, with both Previous and Next links"
        - "Search results screen — Opening a result: The item page for EST-6 opens"
        - "Search results screen — No matches: It shows \"No results were found for your search.\" with no heading, no echo line, no rows and no paging links"
        - "Search results screen — Search text is shown escaped: The echo line shows \"dog <i>\" as literal characters and does not render them as markup"
        - "Substring match per search word — Word found inside an item description: The item is returned"
        - "Distinct-keyword substring search in en_US — Repeated and mixed keywords: The Koi items are returned once each and the keyword \"Bulldog\" contributes no item"
        - "Keyword compared as typed against lower-cased text — Upper-case category code typed: No item is returned"
        - "Capitalised product name search — Capitalised product name: No result is found"
        - "Capitalised product name search — Lower-case product name: The item is found"
        - "Capitalised keyword matches nothing — Captured Bulldog sample: \"Bulldog\" returns no results and \"dog\" returns the Bulldog items"
        - "Result order and wildcard characters — Underscore is not literal: The item whose description contains \"dog\" is returned"
        - "Search result listing and empty search — Three matches: The first 2 items are listed, each linking to its item page, and a Next link leads to the third"
        - "Search result listing and empty search — Empty search box: \"No results were found for your search.\" is shown"
        - "Search results paging links and item navigation — Previous from the second page: Page 1 of results for \"dog\" is shown"
        - "Search results paging links and item navigation — Clicking a result: The item page for EST-6 opens"
      outOfScope:
        - "The item page that a result links to and the general paging rule (catalog-browsing)."
        - "Searching item attributes: the legacy search does not look at them."
        - "Relevance ranking: legacy results have no defined order."
      risksAssumptions:
        - "Disputed: a keyword with a capital letter matches nothing, although the User Guide says search is not case-sensitive; goes to the Business Owner."
        - "Suspected legacy defects carried as drafts: '%' and '_' act as wildcards, and a request with no search-text field reaches the general error page."
      techStack: []
      affectedCode: []
      screens:
        - "Banner search box: a keyword search box with a Search button in the banner of every page"
        - "Search page: titled 'Search' on the shared layout; when the search text is empty or nothing matches it says 'No results were found for your search.', otherwise it shows 'Search Results:', the line 'Items matching any of: <search text>' and the matches two at a time, each with attribute and product name (linking to the item page), description and the item's unit cost formatted as en_US currency, with conditional Previous and Next links"
