suspected_defects:
  - capability_key: catalog-search
    record_keys: [SRCH-BR-0002]
    severity: medium
    category: contradicts-document
    title: Search is case-sensitive although the user guide says it is not
    description: >
      The user guide states search is not case-sensitive. The live system compares
      the keyword as typed against lower-cased catalog text, so any keyword with a
      capital letter matches nothing: the captured search for "Bulldog" returns no
      results while "dog" returns the Bulldog items. Customers who capitalise a
      pet name find nothing.
