  - record_key: LOCKOUT-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an existing, unlocked account with two consecutive failed sign-ons
      WHEN a third consecutive sign-on fails
      THEN the system SHALL lock the account, record a failed sign-on followed by an
      account-locked event, and show the Account Locked page rather than the sign-in
      error page.
    plain_text: >
      Three wrong passwords in a row lock the account. On the third failure the shopper
      sees "Account Locked", not the usual sign-in error.
    technical_note: >
      UserDAO.authenticate: failedAttempts++ and lock when >= MAX_FAILED_ATTEMPTS (3).
      locked_ts is set, then SIGNON_FAIL and ACCOUNT_LOCKED are audited, and the call
      returns SIGNON_LOCKED (screen signon_locked). Decision cases S02-S04. In the 1686-event
      audit sample, all 23 ACCOUNT_LOCKED events follow exactly three consecutive
      SIGNON_FAIL events for the same user.
    interface: false
    confidence: high
    confidence_basis: >
      The decision table, the audit sample (23 of 23 locks), the code constant and the
      user guide all agree.
    risk_class: regulated
    basis: >
      Decision cases S02-S04; audit sample lock sequences; MAX_FAILED_ATTEMPTS = 3.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_decision_cases.csv
        line_start: 1
        line_end: 5
        excerpt: |
          case_id,prior_failed_attempts,prior_locked,attempt,result_screen,failed_attempts_after,locked_after,audit_events_written
          S01,0,N,correct,main.screen,0,N,SIGNON_OK
          S02,0,N,wrong,signon_error.screen,1,N,SIGNON_FAIL
          S03,1,N,wrong,signon_error.screen,2,N,SIGNON_FAIL
          S04,2,N,wrong,signon_locked.screen,3,Y,SIGNON_FAIL+ACCOUNT_LOCKED
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_audit_events_anonymised.csv
        line_start: 81
        line_end: 84
        excerpt: |
          80,U-afa7ef,SIGNON_FAIL,2026-08-14,14,web
          81,U-afa7ef,SIGNON_FAIL,2026-08-14,14,web
          82,U-afa7ef,SIGNON_FAIL,2026-08-14,14,web
          83,U-afa7ef,ACCOUNT_LOCKED,2026-08-14,14,web
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 141
        line_end: 142
        excerpt: |
          failedAttempts++;
          boolean lockNow = failedAttempts >= MAX_FAILED_ATTEMPTS;
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        kind: document
        anchor: "5.3 Locked account"
        line_start: 128
        line_end: 128
        excerpt: |
          <div class="warn">After <b>3 failed sign-in attempts in a row</b> your account is locked. While it is locked you cannot sign in, even with the right password.</div>
    stack_metadata:
      db.object: signon.failed_attempts, signon.locked, signon.locked_ts

  - record_key: LOCKOUT-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN a locked account
      WHEN a sign-on is attempted with either the correct or a wrong password
      THEN the system SHALL refuse it, show the Account Locked page, record only a
      sign-on-while-locked event, and leave the failure count and lock unchanged.
    plain_text: >
      A locked account cannot sign in, even with the right password. Further tries do
      not add to the failure count.
    technical_note: >
      The locked check runs before the password comparison in UserDAO.authenticate. It
      audits SIGNON_LOCKED and returns. Decision cases S05 (correct) and S10 (wrong): no
      counter change. The audit sample has no SIGNON_FAIL or SIGNON_OK for a user between
      ACCOUNT_LOCKED and ACCOUNT_UNLOCKED. All 11 SIGNON_LOCKED events fall in that window.
    interface: false
    confidence: high
    confidence_basis: >
      The decision table, the audit sample check over all events, the code and the user
      guide agree.
    risk_class: regulated
    basis: >
      Decision cases S05, S10; code order; audit sample.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_decision_cases.csv
        line_start: 6
        line_end: 6
        excerpt: |
          S05,0,Y,correct,signon_locked.screen,0,Y,SIGNON_LOCKED
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_decision_cases.csv
