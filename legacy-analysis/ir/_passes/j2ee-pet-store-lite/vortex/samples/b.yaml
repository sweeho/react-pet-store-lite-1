# SX-0001 extract-b, shard j2ee-pet-store-lite/vortex/samples
# Source module: three captured behaviour samples (catalog search cases, sign-on
# decision table, anonymised sign-on audit event log). Code, DDL and user-guide
# lines are cited only to corroborate what the samples show.
# No legacy-analysis/sources/**/extracted.md exists in this tree; the user guide is
# cited directly from legacy-source/ with line ranges plus a heading anchor.
records:
  - record_key: CATSEARCH-BR-0001
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      The system SHALL return an item for a keyword when the keyword appears as a
      substring of the item's product name, its category code or its item description
      in the search locale, and SHALL NOT match on item attributes.
    plain_text: >
      A search word finds a pet when the word appears anywhere in the product name,
      the category code or the item description. Part of a word is enough. Details such
      as size or "Adult Male" are not searched.
    technical_note: >
      SEARCH_ITEMS in CatalogDAOSQL.xml applies `like '%kw%'` to lower(name),
      lower(catid) and lower(b.descn); attr1..attr5 are selected but not filtered.
      Sample: "dog" returns EST-12 only because its description is "Doubles as a watch
      dog"; "large" and "adult male" (both attr1 values in item_details) return no results.
    interface: false
    confidence: high
    confidence_basis: >
      The captured cases match the SQL statement and the user guide. Three sources agree:
      the substring behaviour ("dog" matches a description), the fields searched, and that
      attribute values are not searched.
    risk_class: operational
    basis: >
      Captured search cases for dog (13 items incl. description-only match EST-12),
      large and adult male (0 results); SQL filters only name/catid/descn.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/catalog_search_cases.json
        line_start: 26
        line_end: 52
        excerpt: |
          {
            "input": {
              "keywords": "dog",
              "locale": "en_US",
              "pageSize": 2
            },
            "output": {
              "resultCount": 13,
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/catalog_search_cases.json
        line_start: 148
        line_end: 174
        excerpt: |
              "keywords": "large",
              ...
              "resultCount": 0,
              ...
              "keywords": "adult male",
              ...
              "resultCount": 0,
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml
        line_start: 119
        line_end: 122
        excerpt: |
          where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
          </SQLFragment>
          <SQLFragment parameterNb="3" occurrence="VARIABLE">
              or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        kind: document
        anchor: "4. Searching / How search matches"
        line_start: 90
        line_end: 91
        excerpt: |
          <li>A word matches when it appears anywhere in the product name, the category code (for example DOGS) or the item description.
          Part of a word is enough: <i>dog</i> finds Bulldog and every item in the DOGS category.</li>
    stack_metadata:
      jsp.page: search.screen
      db.object: item, item_details, product, product_details

  - record_key: CATSEARCH-BR-0002
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      GIVEN a search keyword that contains one or more upper-case letters
      WHEN the search runs
      THEN the system SHALL match it against lower-cased product name, category code and
      description text without lower-casing the keyword, so that such a keyword matches
      no item (today "Bulldog" returns no results while "dog" returns Bulldog items).
    plain_text: >
      Today a search word typed with a capital letter finds nothing. "Bulldog" gives
      "No results", and "bulldog" or "dog" finds the bulldogs. The user guide says
      search ignores case.
    technical_note: >
      GenericCatalogDAO.searchItems binds "%" + keyword + "%" without lowering it, and the
      SQL compares it to lower(column). The upper-case pattern can never match lower-case
      text. Captured case "Bulldog" -> resultCount 0.
    interface: false
    confidence: high
    confidence_basis: >
      The captured sample shows the observed result and the code shows the cause: the
      keyword is bound unchanged while the columns are lower-cased. The user guide states
      the opposite. The live behaviour is clear. Whether it is intended is not.
    dispute:
      reason: contradicts-docs
      detail: >
        User guide says "Search is not case-sensitive" and that "dog" finds Bulldog;
        captured sample and code show any keyword containing a capital letter returns zero
        results. An SME must decide whether the rebuild preserves the observed behaviour
        or the documented one.
    risk_class: operational
    basis: >
      Captured "Bulldog" case returns 0 results and the "No results" message; code binds
      the raw keyword against lower() columns.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/catalog_search_cases.json
        line_start: 53
        line_end: 65
        excerpt: |
          {
            "input": {
              "keywords": "Bulldog",
              "locale": "en_US",
              "pageSize": 2
            },
            "output": {
              "resultCount": 0,
              "itemIds": [],
              "message": "No results were found for your search.",
              "pages": 0
            }
          },
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 363
        line_end: 365
        excerpt: |
          parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
          parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
          parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        kind: document
        anchor: "4. Searching / How search matches"
        line_start: 93
        line_end: 93
        excerpt: |
          <li>Search is not case-sensitive.</li>
    stack_metadata:
      jsp.page: search.screen

  - record_key: CATSEARCH-BR-0003
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      The system SHALL split the search text on whitespace into keywords, ignore duplicate
      keywords, and return every item that matches at least one keyword.
    plain_text: >
      When several words are typed, a pet is listed if it matches any one of them.
    technical_note: >
      StringTokenizer on the query into a HashSet. Each keyword adds an OR'd fragment
      (occurrence="VARIABLE") to SEARCH_ITEMS. The only multi-word sample ("adult male")
      returns 0 because neither word occurs in any searched field, so the sample neither
      confirms nor contradicts the OR rule.
    interface: false
    confidence: medium
    confidence_basis: >
      The code and the user guide agree. The single multi-word sample cannot tell OR
      from AND because both words miss, so the samples add no independent evidence.
    risk_class: operational
    basis: >
      Tokenizer and VARIABLE OR fragment in the DAO/SQL; user guide states "any".
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/catalog_search_cases.json
        line_start: 161
        line_end: 174
        excerpt: |
          {
            "input": {
              "keywords": "adult male",
              "locale": "en_US",
              "pageSize": 2
            },
            "output": {
              "resultCount": 0,
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 346
        line_end: 350
        excerpt: |
          Collection keywordSet = new HashSet();
          StringTokenizer tokenizer = new StringTokenizer(searchQuery);
          while (tokenizer.hasMoreTokens()) {
            keywordSet.add(tokenizer.nextToken());
          }
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        kind: document
        anchor: "4. Searching / How search matches"
        line_start: 92
        line_end: 92
        excerpt: |
          <li>When you type several words separated by spaces, items that match <b>any</b> of the words are listed.</li>

  - record_key: CATSEARCH-BR-0004
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      GIVEN an empty search text, or a search that matches no item
