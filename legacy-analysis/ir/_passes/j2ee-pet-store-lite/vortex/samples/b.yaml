    record_keys: [CATSEARCH-BR-0002]
    severity: medium
    category: contradicts-document
    title: Search words containing a capital letter never match
    description: >
      The user guide says search is not case-sensitive. The captured search for "Bulldog"
      returns "No results were found for your search", although "dog" returns the bulldog
      items. The keyword is compared, unchanged, with text that has been lower-cased.
