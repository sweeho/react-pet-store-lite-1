  - record_key: SIGNON-BR-0003
    kind: business-rule
    capability_key: sign-on
    requirement: >
      GIVEN an existing user name typed in upper case
      WHEN a sign-on is submitted
      THEN the system SHALL treat the name as unknown: it SHALL show the sign-in error
      page, record a failed sign-on, and leave the real account's failure count unchanged.
    plain_text: >
      User names are case-sensitive. Typing an existing name in capitals counts as an
      unknown user, so it does not count toward locking the real account.
    technical_note: >
      Decision case S08 ("upper") produces SIGNON_FAIL with failed_attempts_after 0. That
      fits the exact-match `where username = ?` lookup finding no row. The sample does not
      define "upper". This reading assumes the user name, not the password, was upper-cased.
      An upper-cased password would have raised the count to 1.
    interface: false
    confidence: low
    confidence_basis: >
      The outcome is captured, but the meaning of the "upper" attempt value is inferred,
      not stated. Only the count staying at 0 separates it from a wrong-password case.
    risk_class: regulated
    basis: >
      Decision case S08 outcome compared with S02 (wrong password increments).
    traces:
