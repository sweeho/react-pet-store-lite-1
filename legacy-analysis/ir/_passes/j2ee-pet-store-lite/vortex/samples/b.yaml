  - record_key: LOCKOUT-BR-0003
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an existing, unlocked account
      WHEN a sign-on is submitted with a blank password
      THEN the system SHALL treat it as a wrong password: it SHALL show the sign-in error
      page, record a failed sign-on, and add one to the consecutive-failure count.
    plain_text: >
      Leaving the password empty counts as a wrong password and moves the account one
      step closer to being locked.
    technical_note: >
      Decision case S09 ("blank") -> failed_attempts_after 1. In authenticate, an empty
      password fails storedPassword.equals and takes the failure branch. No separate
      required-field check stops it first.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear captured case, consistent with the code path. No validator or document
      states this explicitly.
    risk_class: regulated
    basis: >
      Decision case S09.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_decision_cases.csv
        line_start: 10
        line_end: 10
        excerpt: |
          S09,0,N,blank,signon_error.screen,1,N,SIGNON_FAIL

  - record_key: LOCKOUT-BR-0004
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock an account once its lock is more than 30
      minutes old, checking at least every 15 minutes. It SHALL reset the account's
      failure count to zero and record an account-unlocked event attributed to the
      scheduled process, not to the web.
    plain_text: >
      A locked account unlocks by itself about 30 minutes after it was locked. The check
      runs every 15 minutes, so it can take up to 45 minutes. The unlock is logged as done
      by the store.
    technical_note: >
      PSL_ACCT_UNLOCK (cyclic every 15 min) runs acct_unlock.sql: insert ACCOUNT_UNLOCKED
      audit rows, then set locked='N', failed_attempts=0, locked_ts=NULL where
      locked_ts < now-30min. Audit sample: 21 ACCOUNT_UNLOCKED rows, all source_kind
      batch, each 0-1 clock-hours after the matching ACCOUNT_LOCKED (the sample has hour
      granularity). The two locks with no unlock are the last events in the sample.
    interface: false
    confidence: high
    confidence_basis: >
      The audit sample timing, the batch SQL, the scheduler definition and the user guide
      agree. The sample's hour granularity cannot confirm the exact 30 minutes, only
      that it is under two hours.
    risk_class: regulated
    basis: >
      Audit sample lock->unlock pairs; batch SQL with 30-minute threshold.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_audit_events_anonymised.csv
        line_start: 84
        line_end: 87
        excerpt: |
          83,U-afa7ef,ACCOUNT_LOCKED,2026-08-14,14,web
          84,U-d5d780,SIGNON_OK,2026-08-14,15,web
          85,U-d5d780,SIGNOFF,2026-08-14,15,web
          86,U-afa7ef,ACCOUNT_UNLOCKED,2026-08-14,15,batch
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 1
        line_end: 3
        excerpt: |
          -- PSL_ACCT_UNLOCK: unlock sign-on accounts locked for more than 30 minutes.
          -- Business rule: 3 failed sign-ons in a row lock an account (UserDAO).
          -- A lock is cleared automatically 30 minutes after it was set.
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        kind: document
        anchor: "5.3 Locked account"
        line_start: 129
        line_end: 130
        excerpt: |
          <p>The page <i>Account Locked</i> appears. The lock is cleared automatically 30 minutes after it was set
          (the store checks every 15 minutes, so allow up to 45 minutes). You can keep browsing the catalog while you wait.
    stack_metadata:
      batch.trigger: PSL_ACCT_UNLOCK every 15 minutes

  - record_key: SIGNONAUDIT-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on audit event with the user name, an event type
      from exactly USER_CREATED, SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED,
      ACCOUNT_UNLOCKED and SIGNOFF, and a timestamp. Events SHALL be orderable in the
      sequence they were written, and SHALL be distinguishable as raised by a web action
      or by a scheduled process.
    plain_text: >
      Every sign-in related event is logged with who, what and when. There are seven kinds
      of event: account created, signed in, failed sign-in, tried while locked, account
      locked, account unlocked, signed out.
    technical_note: >
      The anonymised sample has columns event_seq (contiguous 1..1686), user_token,
      event_type, event_day, event_hour and source_kind (web | batch). All seven types
      occur. The DDL check constraint on signon_audit.event_type lists the same seven.
      In the real table, source shows as remote_addr ('batch:PSL_ACCT_UNLOCK' for batch
      rows). The anonymiser derives source_kind from it.
    interface: false
    confidence: high
    confidence_basis: >
      The sample's event-type set exactly matches the DDL check constraint and the user
      guide event table.
    risk_class: regulated
    basis: >
      Sample header and event values; DDL check constraint.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_audit_events_anonymised.csv
        line_start: 1
        line_end: 4
        excerpt: |
          event_seq,user_token,event_type,event_day,event_hour,source_kind
          1,U-ec8654,USER_CREATED,2026-08-01,12,web
          2,U-d5d780,SIGNON_OK,2026-08-02,15,web
          3,U-d5d780,SIGNOFF,2026-08-02,15,web
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 93
        line_end: 93
        excerpt: |
          ('SIGNON_OK', 'SIGNON_FAIL', 'SIGNON_LOCKED', 'ACCOUNT_LOCKED', 'SIGNOFF', 'USER_CREATED', 'ACCOUNT_UNLOCKED'))
    stack_metadata:
      db.object: signon_audit

  - record_key: SIGNONAUDIT-BR-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL keep sign-on audit events for 90 days and remove older events.
    plain_text: >
      The sign-in history is kept for 90 days and older entries are removed.
    technical_note: >
      The sample covers exactly 90 calendar days (2026-08-01 to 2026-10-29), which fits a
      90-day window. PSL_AUDIT_PURGE deletes rows older than CURRENT_DATE - 90 days
      (PSL_AUDIT_RETENTION_DAYS=90 in conf/env.sh).
    interface: false
    confidence: medium
    confidence_basis: >
      The batch SQL states the rule. The sample's span only fits it and does not show a
      purge happening, so the samples add weak support.
    risk_class: regulated
    basis: >
      Purge SQL 90-day threshold; sample date span.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_audit_events_anonymised.csv
        line_start: 2
        line_end: 2
        excerpt: |
          1,U-ec8654,USER_CREATED,2026-08-01,12,web
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_audit_events_anonymised.csv
        line_start: 1687
        line_end: 1687
        excerpt: |
          1686,U-6cd21b,ACCOUNT_LOCKED,2026-10-29,23,web
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 1
        line_end: 1
        excerpt: |
          -- PSL_AUDIT_PURGE: delete sign-on audit events older than 90 days.
    stack_metadata:
      batch.trigger: PSL_AUDIT_PURGE weekly Sunday 02:00

  - record_key: SIGNON-BR-0004
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL record a sign-off event only for a user whose most recent sign-on
      event was a successful sign-on.
    plain_text: >
      A "signed out" entry appears only after a successful sign-in.
    technical_note: >
      Across all 553 SIGNOFF rows in the audit sample, the user's previous event is
      SIGNON_OK. This is an observed invariant of the sample. The sign-off code path is not
      in this shard.
    interface: false
    confidence: low
    confidence_basis: >
      Inferred from the sample alone (553 of 553). The enforcing code was not read in this
      pass.
    risk_class: operational
    basis: >
      Audit sample ordering.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_audit_events_anonymised.csv
        line_start: 3
        line_end: 4
        excerpt: |
          2,U-d5d780,SIGNON_OK,2026-08-02,15,web
          3,U-d5d780,SIGNOFF,2026-08-02,15,web

findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/vortex/samples/catalog_search_cases.json
    description: >
      Every captured result lists item ids in ascending numeric order (e.g. EST-1..EST-5,
      EST-20, EST-21), but SEARCH_ITEMS in CatalogDAOSQL.xml has no ORDER BY, so the order
      is whatever the database returns. A human must decide whether result order is a
      requirement (and which order), since paging two at a time depends on it.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_decision_cases.csv
    description: >
      The "attempt" column values (correct, wrong, unknown, upper, blank) are not defined
      anywhere in the shard. "upper" is read as an upper-cased user name (SIGNON-BR-0003);
      the capture owner should confirm.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/vortex/samples/signon_audit_events_anonymised.csv
    description: >
      Several users (e.g. U-d5d780, U-6105b1, U-c26e58) have events with no prior
      USER_CREATED. Presumably these are seeded accounts or accounts created before the
      90-day window. This is not treated as a defect. No document in legacy-analysis/sources
      exists for this module, so document traces cite the user guide in legacy-source directly.

