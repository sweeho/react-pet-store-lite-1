# SX-0001 extract-a, shard j2ee-pet-store-lite/db/batch (pass A)
# Scope: the six batch SQL scripts under legacy-source/j2ee-pet-store-lite/db/batch.
# Wrapper scripts (batch/*.sh), the Control-M export and the guides are cited as
# corroborating sources where they decide what the SQL's result means; they are
# owned by other shards and no record here is extracted from them alone.
records:

  # ---------------------------------------------------------------- account-lockout
  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an account is locked and its lock time is more than 30 minutes before the
      moment the unlock run executes, WHEN the unlock run executes, THEN the system SHALL
      mark the account as not locked, reset its consecutive failed sign-in count to 0 and
      clear its lock time.
    plain_text: >
      A locked account is unlocked automatically once the lock is more than 30 minutes
      old, and its count of failed sign-ins starts again from zero.
    technical_note: >
      db/batch/acct_unlock.sql UPDATE on SIGNON (locked='Y' AND locked_ts <
      CURRENT_TIMESTAMP - 30 minutes) sets locked='N', failed_attempts=0, locked_ts=NULL.
      Run by batch/psl_acct_unlock.sh. The 30 is a literal in the SQL; the setting
      signon.unlockAfterMinutes=30 in conf/petstore.properties is not read by anything.
    interface: false
    confidence: high
    confidence_basis: >
      The UPDATE states the rule directly, the script header comment restates it, the
      SIGNON DDL comment, the Control-M job description, Operations Runbook 3.6 and Admin
      Guide R5 all give the same 30 minutes and the same reset of the failed count.
    risk_class: operational
    basis: >
      The UPDATE statement and its WHERE clause in acct_unlock.sql; corroborated by the
      runbook and admin guide text.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 1
        line_end: 3
        excerpt: |2
          -- PSL_ACCT_UNLOCK: unlock sign-on accounts locked for more than 30 minutes.
          -- Business rule: 3 failed sign-ons in a row lock an account (UserDAO).
          -- A lock is cleared automatically 30 minutes after it was set.
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 15
        excerpt: |2
          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 54
        line_end: 54
        excerpt: |2
           <tr><td>R5</td><td>Batch job PSL_ACCT_UNLOCK runs every 15 minutes and unlocks accounts locked more than 30 minutes ago. It sets failed attempts to 0 and records ACCOUNT_UNLOCKED.</td></tr>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 72
        line_end: 72
        excerpt: |2
          <p>Every 15 minutes. Unlocks accounts locked more than 30 minutes ago, resets their failed attempts and writes ACCOUNT_UNLOCKED to the audit.</p>
    stack_metadata:
      db.object: SIGNON
      batch.trigger: Control-M PSL_ACCT_UNLOCK (PSL_PETSTORE_CYCLIC)
      framework: Derby ij script

  - record_key: LOCK-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL run the automatic unlock every 15 minutes throughout the day, so
      that a lock is released at the first run after it becomes more than 30 minutes old
      (between about 30 and 45 minutes after it was set). GIVEN a lock is exactly 30
      minutes old at a run, WHEN that run executes, THEN the account SHALL stay locked
      until the next run.
    plain_text: >
      The automatic unlock is checked every 15 minutes, so in practice a locked customer
      waits between 30 and 45 minutes before they can try again.
    technical_note: >
      Strict "<" comparison in acct_unlock.sql; cadence is Control-M cyclic job
      PSL_ACCT_UNLOCK, INTERVAL=00015M, TIMEFROM 0000 TO 2359. The 30-45 minute window
      is derived from the two values, not stated anywhere.
    interface: false
    confidence: medium
    confidence_basis: >
      The 15-minute cadence is declared in the scheduler and restated by the runbook, the
      admin guide and the script header; the strict boundary is read from the SQL. The
      30-45 minute effective window is my derivation from those two facts and is not
      written down anywhere, so not high. Run-to-run jitter in the scheduler was not
      visible.
    risk_class: operational
    basis: >
      The `<` comparison in the SQL plus the declared 15-minute schedule.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 14
        line_end: 15
        excerpt: |2
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 82
        line_end: 83
        excerpt: |2
                   TIMEFROM="0000" TIMETO="2359" WEEKDAYS="ALL"
                   CYCLIC="1" CYCLIC_TYPE="Interval" INTERVAL="00015M" IND_CYCLIC="START"
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_acct_unlock.sh
        line_start: 2
        line_end: 2
        excerpt: |2
          # PSL_ACCT_UNLOCK - every 15 minutes. Unlocks accounts locked > 30 minutes.
    stack_metadata:
      batch.trigger: Control-M cyclic, INTERVAL=00015M, IND_CYCLIC=START

  - record_key: LOCK-BR-0003
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an account is marked locked but has no lock time recorded, WHEN the unlock
      run executes, THEN the system SHALL leave the account locked (it is never released
      automatically).
    plain_text: >
      An account that is locked without a recorded lock time is never unlocked
      automatically; someone has to unlock it by hand.
    technical_note: >
      Consequence of SQL NULL comparison: `locked_ts < <timestamp>` is unknown when
      locked_ts is NULL, so neither the audit INSERT nor the UPDATE selects the row. The
      DDL allows locked='Y' with locked_ts NULL (locked_ts is nullable, no CHECK ties the
      two). UserDAO sets locked_ts whenever it locks, so the case arises only from data
      written outside the sign-in path (seed, migration, manual SQL).
    interface: false
    confidence: low
    confidence_basis: >
      Inferred from SQL NULL semantics and the absence of a constraint, not stated
      anywhere. The two locked rows in data/migration/signon.csv both carry a lock time,
      so I saw no live example.
    risk_class: operational
    basis: >
      The WHERE clause in acct_unlock.sql and the nullable locked_ts column with no
      check tying it to locked.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 15
        excerpt: |2
          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 75
        line_end: 76
        excerpt: |2
            locked char(1) default 'N' not null,
            locked_ts timestamp,
    stack_metadata:
      db.object: SIGNON

  # ---------------------------------------------------------------- sign-on-audit
  - record_key: AUD-BR-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      WHEN the unlock run releases an account, the system SHALL record one
      ACCOUNT_UNLOCKED audit event for that account, timestamped at the run, with the
      origin recorded as "batch:PSL_ACCT_UNLOCK" in place of a client address, in the
      same transaction as the unlock.
    plain_text: >
      Every automatic unlock is written to the sign-in history, marked as done by the
      automatic unlock job rather than by a person.
    technical_note: >
      acct_unlock.sql INSERT INTO signon_audit ... SELECT from signon with the same
      predicate as the UPDATE, under AUTOCOMMIT OFF, COMMIT at the end. remote_addr
      literal 'batch:PSL_ACCT_UNLOCK'. Manual unlocks (Admin Guide 2.1) use 'admin'.
    interface: false
    confidence: high
    confidence_basis: >
      The INSERT is explicit in the SQL; the event type is allowed by the
      ck_signon_audit_event CHECK; the runbook column description names the same
      'batch:PSL_ACCT_UNLOCK' value and Admin Guide R5 states the event is recorded.
    risk_class: operational
    basis: >
      The INSERT ... SELECT in acct_unlock.sql and the transaction bracket around it.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 4
        line_end: 10
        excerpt: |2
          AUTOCOMMIT OFF;

          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr)
            SELECT username, 'ACCOUNT_UNLOCKED', CURRENT_TIMESTAMP, 'batch:PSL_ACCT_UNLOCK'
              FROM signon
             WHERE locked = 'Y'
               AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 17
        line_end: 17
        excerpt: |2
          COMMIT;
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 55
        line_end: 55
        excerpt: |2
           <tr><td>5 remote_addr</td><td>Client address, or <code>batch:PSL_ACCT_UNLOCK</code></td></tr>
    stack_metadata:
      db.object: SIGNON_AUDIT
      batch.trigger: Control-M PSL_ACCT_UNLOCK

  - record_key: AUD-INT-0002
    kind: integration
    capability_key: sign-on-audit
    requirement: >
      The system SHALL produce, once a day, an extract of every sign-on audit event whose
      time falls in the previous calendar day (from 00:00 inclusive to 24:00 exclusive of
      the day before the run date), ordered by event number, with the columns event
      number, user name, event type, event time and client address, for the security
      team.
    plain_text: >
      Every night the security team receives a file listing all of yesterday's sign-in
      events: who, what happened, when, and from which address.
    technical_note: >
      audit_extract.sql calls SYSCS_UTIL.SYSCS_EXPORT_QUERY on SIGNON_AUDIT with
      event_ts >= CURRENT_DATE-1 day and < CURRENT_DATE (database clock), ORDER BY
      audit_id. batch/psl_audit_extract.sh renames the output. Scheduled 01:30 daily.
    interface: true
    confidence: high
    confidence_basis: >
      Window and columns are explicit in the SQL, restated by the script comment, the
      Control-M description and Runbook 3.2 (column table and "00:00 to 24:00"); a
      produced file under data/interface/ has exactly these five columns.
    risk_class: operational
    basis: >
      The export query in audit_extract.sql.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_extract.sql
        line_start: 1
        line_end: 10
        excerpt: |2
          -- PSL_AUDIT_EXTRACT: export yesterday's sign-on audit events for the
          -- security team. Output: /var/petstore/extract/signon_audit_extract.csv
          -- (the script renames it to signon_audit_YYYYMMDD.csv).
          CALL SYSCS_UTIL.SYSCS_EXPORT_QUERY(
            'SELECT audit_id, username, event_type, event_ts, remote_addr
               FROM signon_audit
              WHERE event_ts >= {fn TIMESTAMPADD(SQL_TSI_DAY, -1, CAST(CURRENT_DATE AS TIMESTAMP))}
                AND event_ts <  CAST(CURRENT_DATE AS TIMESTAMP)
              ORDER BY audit_id',
            '/var/petstore/extract/signon_audit_extract.csv', ',', '"', 'UTF-8');
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 46
        line_end: 48
        excerpt: |2
          <h2>3.2 PSL_AUDIT_EXTRACT</h2>
          <p>Exports yesterday's rows of SIGNON_AUDIT (00:00 to 24:00) to <code>/var/petstore/extract/signon_audit_YYYYMMDD.csv</code>
          for the security team (<code>db/batch/audit_extract.sql</code>).</p>
    stack_metadata:
      db.object: SIGNON_AUDIT
      batch.trigger: Control-M PSL_AUDIT_EXTRACT 01:30 daily
      derby.procedure: SYSCS_UTIL.SYSCS_EXPORT_QUERY

  - record_key: AUD-INT-0003
    kind: integration
    capability_key: sign-on-audit
    requirement: >
      The system SHALL write the daily audit extract as a UTF-8, comma-separated file
      named signon_audit_YYYYMMDD.csv (YYYYMMDD being the extracted day), with no header
      row, text values enclosed in double quotes, and a final trailer line
      "TRAILER,YYYYMMDD,<n>" where n is the number of event lines, excluding the
      trailer.
    plain_text: >
      The daily sign-in history file has a fixed layout: one event per line, no
      heading, and a closing line that states the date and how many events the file
      holds, so the receiver can check nothing was lost.
    technical_note: >
      Delimiter ',', quote '"' and 'UTF-8' are the SYSCS_EXPORT_QUERY arguments in
      audit_extract.sql. File name and trailer are added by batch/psl_audit_extract.sh
      (mv to signon_audit_$DAY.csv; ROWS=wc -l; echo TRAILER,$DAY,$ROWS). The day in the
      file name comes from the shell clock (`date -d yesterday`), the rows from the
      database clock (CURRENT_DATE).
    interface: true
    confidence: high
    confidence_basis: >
      Format arguments in the SQL, naming and trailer in the wrapper script, and the
      same layout described in Runbook 3.2 and visible in the sample file
      data/interface/signon_audit_20261029.csv (quoted text, unquoted id, trailer line).
    risk_class: operational
    basis: >
      Export arguments in audit_extract.sql, completed by the wrapper script's rename and
      trailer.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_extract.sql
        line_start: 10
        line_end: 10
        excerpt: |2
            '/var/petstore/extract/signon_audit_extract.csv', ',', '"', 'UTF-8');
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 6
        line_end: 13
        excerpt: |2
          DAY=$(date -d yesterday '+%Y%m%d' 2>/dev/null || date -v-1d '+%Y%m%d')
          OUT="$PSL_EXTRACT_DIR/signon_audit_$DAY.csv"
          psl_log "start day=$DAY"
          rm -f "$PSL_EXTRACT_DIR/signon_audit_extract.csv"
          psl_ij "$PSL_SQL/audit_extract.sql" > /dev/null || { psl_log "FAILED: export"; exit 8; }
          mv "$PSL_EXTRACT_DIR/signon_audit_extract.csv" "$OUT"
          ROWS=$(wc -l < "$OUT" | tr -d ' ')
          echo "TRAILER,$DAY,$ROWS" >> "$OUT"
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 57
        line_end: 57
        excerpt: |2
          <p>No header row. The last line is a trailer <code>TRAILER,YYYYMMDD,&lt;row count&gt;</code>; the count excludes the trailer.</p>
      - path: legacy-source/j2ee-pet-store-lite/data/interface/signon_audit_20261029.csv
        line_start: 1
        line_end: 1
        excerpt: |2
          1659,"idanair","SIGNON_OK","2026-10-29 09:23:47.0","10.17.227.177"
    stack_metadata:
      derby.procedure: SYSCS_UTIL.SYSCS_EXPORT_QUERY
      batch.trigger: Control-M PSL_AUDIT_EXTRACT

  - record_key: AUD-BR-0004
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The automatic audit extract SHALL always cover the day before the run date; the
      system SHALL provide no parameter to extract any other day. GIVEN an older day must
      be re-extracted, THEN this SHALL be done by running the extract query by hand with
      changed dates.
    plain_text: >
      The daily sign-in file can only be produced for "yesterday"; getting an older day
      again is a manual operations task.
    technical_note: >
      The date window is computed from CURRENT_DATE inside audit_extract.sql and the
      script takes no arguments. Runbook 4.2 documents the manual procedure.
    interface: true
    confidence: high
    confidence_basis: >
      The SQL has no parameter and the runbook states the same limitation explicitly.
    risk_class: operational
    basis: >
      CURRENT_DATE-relative window in the SQL; Runbook 4.2.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_extract.sql
        line_start: 7
        line_end: 8
        excerpt: |2
              WHERE event_ts >= {fn TIMESTAMPADD(SQL_TSI_DAY, -1, CAST(CURRENT_DATE AS TIMESTAMP))}
                AND event_ts <  CAST(CURRENT_DATE AS TIMESTAMP)
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 88
        line_end: 90
        excerpt: |2
          <h2>4.2 Rerunning the extract</h2>
          <p>The extract always covers the day before the run date. To re-extract an older day, run the export query in
          <code>db/batch/audit_extract.sql</code> by hand with the dates changed.</p>
    stack_metadata:
      db.object: SIGNON_AUDIT

  - record_key: AUD-BR-0005
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL delete sign-on audit events whose time is before 00:00 on the day
      90 days before the run date, once a week on Sunday, and only after that day's
      audit extract has completed successfully.
    plain_text: >
      Sign-in history is kept for 90 days. Once a week, on Sunday, older entries are
      deleted, but only after that night's history file has been produced.
    technical_note: >
      audit_purge.sql DELETE FROM signon_audit WHERE event_ts < CURRENT_DATE - 90 days,
      in one transaction. 90 is a literal in the SQL. Control-M PSL_AUDIT_PURGE,
      WEEKDAYS="0" 02:00, INCOND PSL_AUDIT_EXTRACT-OK. Because it runs weekly, an event
      can be up to about 97 days old before it is deleted.
    interface: false
    confidence: high
    confidence_basis: >
      The DELETE and its 90-day predicate are explicit; the 90 days are restated in the
      script comment, the Control-M description, Runbook 3.4 and 5, conf/env.sh and
      petstore.properties; the Sunday schedule and the extract dependency are declared
      in the scheduler and the runbook.
    risk_class: operational
    basis: >
      The DELETE in audit_purge.sql and the scheduler dependency.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 1
        line_end: 8
        excerpt: |2
          -- PSL_AUDIT_PURGE: delete sign-on audit events older than 90 days.
          -- Runs only after PSL_AUDIT_EXTRACT so every row has been extracted first.
          AUTOCOMMIT OFF;

          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};

          COMMIT;
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 51
        line_end: 59
        excerpt: |2
              <JOB JOBISN="4" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_PURGE"
                   DESCRIPTION="Delete SIGNON_AUDIT rows older than 90 days (Sundays)"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_purge.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AD"
                   TIMEFROM="0200" WEEKDAYS="0"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PSL_AUDIT_PURGE-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 63
        line_end: 64
        excerpt: |2
          <h2>3.4 PSL_AUDIT_PURGE</h2>
          <p>Sundays only. Deletes SIGNON_AUDIT rows older than 90 days. It waits for that day's extract so no row is deleted before it is extracted.</p>
    stack_metadata:
      db.object: SIGNON_AUDIT
      batch.trigger: Control-M PSL_AUDIT_PURGE Sunday 02:00

  - record_key: AUD-BR-0006
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL produce a daily sign-on report named signon_report_YYYYMMDD.txt
      that lists, for each event type that occurred on the previous calendar day, the
      number of events and the number of distinct user names, sorted by event type.
      Event types with no events that day SHALL be absent from the list rather than shown
      as zero.
    plain_text: >
      Every night a short report shows how many sign-ins, failures, lockouts and so on
      happened yesterday, and how many different user names were involved in each.
    technical_note: >
      First query of signon_report.sql: GROUP BY event_type over the same yesterday
      window as the extract, COUNT(*) and COUNT(DISTINCT username), ORDER BY event_type.
      "User names" are as typed, so failed attempts with unknown names are counted too.
      batch/psl_signon_report.sh writes the ij output to the dated file; scheduled 01:45
      after PSL_AUDIT_EXTRACT-OK.
    confidence: high
    confidence_basis: >
      The query is explicit; Runbook 3.3 and the script header describe the same content
      and file name. The omission of zero-count types is read from GROUP BY semantics,
      not stated.
    risk_class: operational
    basis: >
      The first SELECT in signon_report.sql.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/signon_report.sql
        line_start: 1
        line_end: 7
        excerpt: |2
          -- PSL_SIGNON_REPORT: daily sign-on statistics for yesterday.
          SELECT event_type, COUNT(*) AS events, COUNT(DISTINCT username) AS users
            FROM signon_audit
           WHERE event_ts >= {fn TIMESTAMPADD(SQL_TSI_DAY, -1, CAST(CURRENT_DATE AS TIMESTAMP))}
             AND event_ts <  CAST(CURRENT_DATE AS TIMESTAMP)
           GROUP BY event_type
           ORDER BY event_type;
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 59
        line_end: 61
        excerpt: |2
          <h2>3.3 PSL_SIGNON_REPORT</h2>
          <p>Writes yesterday's counts per event type, the number of locked accounts and accounts per role to
          <code>/var/petstore/extract/signon_report_YYYYMMDD.txt</code>.</p>
    stack_metadata:
      db.object: SIGNON_AUDIT
      batch.trigger: Control-M PSL_SIGNON_REPORT 01:45 daily

  - record_key: AUD-BR-0007
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The daily sign-on report SHALL also state the number of accounts locked at the
      moment the report runs and the number of accounts per role (CUSTOMER, ADMIN) at
      that moment. These two figures SHALL be a snapshot at run time, not values for
      the previous day.
    plain_text: >
      The nightly report also shows how many accounts are locked right now and how many
      customers and administrators exist.
    technical_note: >
      Second and third queries of signon_report.sql read SIGNON directly (locked='Y';
      GROUP BY role). No date filter, so they reflect the state at about 01:45, after
      any unlocks done by the 15-minute job.
    confidence: high
    confidence_basis: >
      Both queries are explicit and Runbook 3.3 lists the same two figures. The
      "snapshot at run time" reading follows directly from the absence of a date filter.
    risk_class: operational
    basis: >
      The two SIGNON queries in signon_report.sql.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/signon_report.sql
        line_start: 9
        line_end: 11
        excerpt: |2
          SELECT COUNT(*) AS locked_accounts FROM signon WHERE locked = 'Y';

          SELECT role, COUNT(*) AS accounts FROM signon GROUP BY role;
    stack_metadata:
      db.object: SIGNON

  # ---------------------------------------------------------------- catalog-data-integrity
  - record_key: CAT-BR-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      Every category SHALL have at least one product. The daily catalog check SHALL
      report each category that has none (check C1) as a breach.
    plain_text: >
      A category with no products in it is a data error that the morning check reports.
    technical_note: >
      catalog_check.sql C1: category rows with NOT EXISTS product.catid. Not enforced by
      the schema (a foreign key goes the other way only); detected nightly, not
      prevented.
    interface: false
    confidence: high
    confidence_basis: >
      The query in the check script and Admin Guide 3.3 rule C1 state the same rule.
      Only detected in one place; nothing prevents the breach at write time.
    risk_class: operational
    basis: >
      Query C1 in catalog_check.sql; Admin Guide 3.3.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 3
        line_end: 5
        excerpt: |2
          -- C1: categories with no product
