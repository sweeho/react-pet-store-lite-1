suspected_defects:
  - capability_key: catalog-data-integrity
    record_keys: [CAT-WF-0005, POP-WF-0001]
    severity: high
    category: error-swallowed
    title: Catalog check reports success when its SQL fails for any reason other than a missing table
    description: >
      The wrapper captures the output of the catalog check SQL but never looks at the
      helper's failure status. If the database is unreachable, or any check query fails
      with an error other than "does not exist", no C1-C4 lines are printed and the job
      ends with code 0 ("end OK"). The catalog team is then not alerted even though no
      check ran. The same applies to the second run after a first load.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 9
        line_end: 21
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 24
        line_end: 25
  - capability_key: sample-data-population
    record_keys: [POP-WF-0001]
    severity: high
    category: data-corruption
    title: Catalog check's "first load" can wipe all accounts and sign-in history
    description: >
      When any catalog table the check reads is missing, the job calls the store's
      first-load endpoint. That endpoint drops and recreates every table, including the
      account and sign-in audit tables, whenever its own "already populated" test fails
      or throws. A partially missing catalog therefore can delete all customer accounts
      and the audit history, which the extract and the 90-day retention exist to keep.
      Discovery finding F3; the Admin Guide warns that a reload deletes all accounts and
      sign-in history.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 10
        line_end: 13
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 162
        line_end: 172
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 87
        line_end: 87
  - capability_key: sign-on-audit
    record_keys: [AUD-BR-0005, BAT-WF-0003]
    severity: medium
    category: contradicts-document
    title: Purge can delete audit events that were never extracted
    description: >
      The purge SQL comment and Runbook 3.4 say the purge waits for the extract "so
      every row has been extracted first". The purge only waits for that night's
      extract, which covers yesterday alone. If the extract for some earlier day failed
      and was never rerun by hand (reruns are manual for any day but yesterday), the
      purge still deletes that day's events once they pass 90 days, without them ever
      having reached the security team.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 1
        line_end: 6
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 64
        line_end: 64
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 89
        line_end: 90
  - capability_key: account-lockout
    record_keys: [LOCK-BR-0001, AUD-BR-0001]
    severity: low
    category: data-corruption
    title: Unlock audit row and unlock itself are decided by two separate clock readings
    description: >
      The unlock run selects accounts to audit and accounts to unlock in two separate
      statements, each reading the current time again. A lock that crosses the
      30-minute boundary between the two statements is unlocked without an
      ACCOUNT_UNLOCKED audit row (or, if the clock went backwards, audited without
      being unlocked). Discovery finding F12.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 6
        line_end: 15
  - capability_key: sign-on-audit
    record_keys: [AUD-BR-0005]
    severity: low
    category: other
    title: Audit retention setting is logged but not used
    description: >
      The purge job logs "retention=<PSL_AUDIT_RETENTION_DAYS>d" from configuration,
      but the SQL deletes on a hard-coded 90 days. Changing the setting would change
      the log line and not the behaviour. batch.audit.retentionDays and
      signon.unlockAfterMinutes in petstore.properties are likewise not read.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_purge.sh
        line_start: 6
        line_end: 7
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 5
        line_end: 6
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 11
        line_end: 11
  - capability_key: batch-operations
    record_keys: [BAT-BR-0002]
    severity: low
    category: contradicts-document
    title: Backup retention keeps about 8 copies where the runbook says 7 days
    description: >
      The runbook says backups older than 7 days are deleted; the cleanup keeps any
      folder less than 8 whole days old. Discovery finding F14.
    traces:
