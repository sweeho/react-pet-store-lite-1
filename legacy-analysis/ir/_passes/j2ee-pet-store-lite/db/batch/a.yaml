  - record_key: POP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      GIVEN the catalog tables do not exist when the daily catalog check runs, WHEN the
      check detects this, THEN the system SHALL request a first load of the store's
      sample data (not a forced reload), and SHALL then run the catalog checks again on
      the loaded data. IF the first-load request fails, THEN the run SHALL end with the
      "SQL or file error" outcome (code 8).
    plain_text: >
      If the morning check finds no catalog at all, it asks the store to load its sample
      catalog and then checks again.
    technical_note: >
      Detection is a text match on "does not exist" in the ij output of
      catalog_check.sql (Derby error for a missing table). batch/psl_catalog_check.sh then
      calls HTTP GET $PSL_STORE_URL/Populate?forcefully=false with curl -sf and reruns
      the SQL. Any one missing table among those the SQL reads triggers it.
      PopulateServlet with forcefully=false drops and recreates all tables when its own
      "already populated" check fails (see suspected defect).
    interface: false
    confidence: high
    confidence_basis: >
      The wrapper code, the Control-M description ("first load when empty") and Runbook
      3.5 agree; the trigger condition depends on the SQL in this shard reading the
      catalog tables.
    risk_class: operational
    basis: >
      The wrapper's handling of the catalog_check.sql output.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 9
        line_end: 14
        excerpt: |2
          OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          if echo "$OUT" | grep -q "does not exist"; then
            psl_log "catalog tables missing, requesting first load"
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
            OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          fi
