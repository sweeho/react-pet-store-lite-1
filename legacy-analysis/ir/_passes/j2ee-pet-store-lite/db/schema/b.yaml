          );
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 115
        line_end: 119
        excerpt: |
                      if (!rs.next()) {
                          rs.close();
                          select.close();
                          audit(connection, userName, EVENT_SIGNON_FAIL, remoteAddr);
                          return SIGNON_INVALID;
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 55
        line_end: 55
        excerpt: |
           <tr><td>R6</td><td>A sign-in with an unknown user name is recorded as SIGNON_FAIL against the name typed.</td></tr>
    stack_metadata:
