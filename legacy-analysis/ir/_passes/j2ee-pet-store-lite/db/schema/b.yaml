  # ------------------------------------------------------------------ account-lockout
  - record_key: AL-ENT-0001
    kind: entity
    capability_key: account-lockout
    requirement: >
      The system SHALL keep, for every account, a count of consecutive failed sign-ins
      (starting at 0), a locked flag that is either locked or not locked (starting not
      locked), and the time the lock was set when the account is locked.
    plain_text: >
      For each account the store remembers how many sign-ins in a row have failed, whether
      the account is locked, and when it was locked. New accounts start unlocked with no
      failures.
    technical_note: >
      SIGNON.failed_attempts (integer / number(3), NOT NULL default 0), SIGNON.locked
      char(1) NOT NULL default 'N' with ck_signon_locked (locked in ('Y','N')), and
      SIGNON.locked_ts nullable. Oracle failed_attempts is number(3) (max 999); Derby is
      integer.
    interface: false
    confidence: high
    confidence_basis: >
      Columns, defaults and the Y/N check are declared in both DDLs and PopulateSQL.xml, and
      UserDAO reads and writes exactly these columns.
    risk_class: regulated
    basis: >
      Column definitions and ck_signon_locked; Oracle column comments.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 74
        line_end: 81
        excerpt: |
            failed_attempts number(3) default 0 not null,
            locked char(1) default 'N' not null,
            locked_ts timestamp,
            last_signon timestamp,
            created_ts timestamp default current_timestamp not null,
            constraint pk_signon primary key (username),
            constraint ck_signon_role check (role in ('CUSTOMER', 'ADMIN')),
            constraint ck_signon_locked check (locked in ('Y', 'N'))
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 130
        line_end: 131
        excerpt: |
          COMMENT ON COLUMN signon.locked IS 'Y when the account is locked after 3 failed sign-ons in a row, else N';
          COMMENT ON COLUMN signon.failed_attempts IS 'Consecutive failed sign-ons; reset to 0 on success or unlock';
    stack_metadata:
      db.object: [SIGNON.failed_attempts, SIGNON.locked, SIGNON.locked_ts, ck_signon_locked]

  - record_key: AL-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock an account when its third consecutive sign-in fails, and SHALL
      reset the consecutive-failure count to 0 when a sign-in succeeds or the account is
      unlocked.
    plain_text: >
      Three wrong sign-ins in a row lock the account. A successful sign-in, or an unlock,
      starts the count again from zero.
    technical_note: >
      Stated in the SIGNON table comment and column comments. Enforced in UserDAO
      (MAX_FAILED_ATTEMPTS = 3, lockNow = failedAttempts >= 3; UPDATE_SUCCESS sets
      failed_attempts = 0) and by acct_unlock.sql (failed_attempts = 0 on unlock). Also
