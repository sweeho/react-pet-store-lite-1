    plain_text: >
      A newly created account is a customer account unless an administrator role is
      deliberately given to it.
    technical_note: >
      SIGNON.role default 'CUSTOMER'. The sample-data insert in PopulateSQL.xml passes the
      role explicitly; the admin guide states administrators come only from sample data.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear declaration (column default, repeated in both DDLs); the self-sign-up insert
      path was not traced in this module, so whether it relies on the default or sets
      CUSTOMER itself was not confirmed here.
    risk_class: regulated
    basis: >
      role varchar(10) default 'CUSTOMER' not null; admin guide role table.
    traces:
