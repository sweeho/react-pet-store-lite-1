  - record_key: SA-BR-0003
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record sign-on events against the user name as typed, without
      requiring that an account with that name exists.
    plain_text: >
      The sign-in log records the name the person typed, even if no such account exists, so
