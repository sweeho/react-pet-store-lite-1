  - record_key: SA-BR-0004
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL export each day's sign-on events once daily and SHALL delete sign-on
      events older than 90 days.
    plain_text: >
      The sign-in log is sent out once a day, and entries older than 90 days are removed.
    technical_note: >
      Stated in the SIGNON_AUDIT table comment (PSL_AUDIT_EXTRACT daily, PSL_AUDIT_PURGE
      after 90 days). Implemented in db/batch/audit_extract.sql and audit_purge.sql;
      batch.audit.retentionDays=90 in petstore.properties but the SQL hard-codes -90. The
      purge runs weekly (Sundays), so rows may live up to about 96 days. Detailed file
      layout and schedule belong to the batch shard.
    interface: true
    confidence: high
    confidence_basis: >
      Schema comment, purge SQL and configuration agree on 90 days; the extract is the feed
      the security team consumes.
    risk_class: regulated
    basis: >
      SIGNON_AUDIT table comment; audit_purge.sql; petstore.properties.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 84
        line_end: 84
        excerpt: |
          -- SIGNON_AUDIT: Transaction log of sign-on events. Extracted daily by PSL_AUDIT_EXTRACT, purged after 90 days by PSL_AUDIT_PURGE.
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 5
        line_end: 6
        excerpt: |
          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 36
        line_end: 36
        excerpt: |
          batch.audit.retentionDays=90
    stack_metadata:
      db.object: SIGNON_AUDIT
      batch.trigger: [PSL_AUDIT_EXTRACT, PSL_AUDIT_PURGE]

findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
    description: >
      Catalog rules C1 (every category has a product), C2 (every product has an item) and
      C4 (every item has an en_US description) from the admin guide are NOT enforced by the
      schema; only the daily PSL_CATALOG_CHECK detects breaches after the fact. No record was
      emitted for them from this module. A human should decide whether the rebuild must
      enforce them at write time or keep detect-and-alert (see the batch/catalog shards).
  - kind: conflict
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
    record_key: CB-ENT-0001
    description: >
      Key and locale columns are char(10) (blank-padded) in the Derby runtime DDL and
      PopulateSQL.xml, but varchar(10) in the Oracle "reference production" DDL. Comparison
      and length semantics for codes shorter than 10 characters differ between the two
      (padded vs unpadded values returned to the application). Also SIGNON.failed_attempts
      is integer on Derby but number(3) on Oracle, and SIGNON_AUDIT.audit_id is
      GENERATED ALWAYS on Derby (explicit ids refused) but only defaulted by a trigger on
      Oracle (explicit ids accepted). A human should confirm which database is live
      production; the header calls Derby "runtime" and Oracle "reference production".
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
    description: >
      Thresholds 3 failures, 30 minutes and 90 days are each held in petstore.properties
      AND hard-coded in Java/SQL; nothing shows the properties file being read by the code
      that enforces them. Changing the property would likely have no effect. Recorded as
      context on AL-BR-0002, AL-BR-0003 and SA-BR-0004 rather than as separate records.

suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CB-BR-0004]
    severity: medium
    category: contradicts-document
    title: '"Your Price" shows the unit cost, documented as a member discount price'
    description: >
      The user guide describes "Your Price" as the discounted price for members, but the
      store displays the item's unit cost under that label, and there is no member price
      in the data. Because list price must be at least unit cost, "Your Price" is always the
      lower figure, and it is the store's cost figure that is exposed to every visitor,
      signed-in or not. Search results show only this figure.
