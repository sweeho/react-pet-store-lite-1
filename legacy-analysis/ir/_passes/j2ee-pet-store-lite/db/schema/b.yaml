    plain_text: >
      A locked account is unlocked automatically after 30 minutes, its failure count is
      cleared and the unlock is logged.
    technical_note: >
      Stated in the SIGNON table comment; implemented by db/batch/acct_unlock.sql (run every
      15 minutes by PSL_ACCT_UNLOCK), so the effective unlock happens 30-45 minutes after
      the lock. signon.unlockAfterMinutes=30 in petstore.properties; the SQL hard-codes -30.
    interface: false
    confidence: high
