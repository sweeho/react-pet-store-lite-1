  # ------------------------------------------------------------------ access-control
  - record_key: AC-BR-0001
    kind: business-rule
    capability_key: access-control
    requirement: >
      The system SHALL give every account exactly one role, and SHALL accept only the roles
      CUSTOMER and ADMIN.
    plain_text: >
      Every account is either a customer or an administrator; no other kind of account can
      exist.
    technical_note: >
      SIGNON.role NOT NULL with check constraint ck_signon_role (role in ('CUSTOMER',
      'ADMIN')), identical in both DDLs and PopulateSQL.xml. Admin guide section 1 states
      the role is stored with the account and read at sign-in.
    interface: false
    confidence: high
    confidence_basis: >
      Database check constraint in three declarations plus the admin guide statement.
    risk_class: regulated
    basis: >
      ck_signon_role check constraint; schema comment "Role is CUSTOMER or ADMIN".
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 80
        line_end: 80
        excerpt: |
            constraint ck_signon_role check (role in ('CUSTOMER', 'ADMIN')),
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 80
        line_end: 80
        excerpt: |
            constraint ck_signon_role check (role in ('CUSTOMER', 'ADMIN')),
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 16
        line_end: 16
        excerpt: |
          <p>Every account has one role. The role is stored with the account and read at sign-in.</p>
    stack_metadata:
