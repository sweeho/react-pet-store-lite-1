    record_keys: [SA-BR-0003, SA-ENT-0001]
    severity: low
    category: contradicts-document
    title: A sign-in typed with a user name longer than 25 characters cannot be logged
    description: >
      The sign-in form puts no length limit on the user name, and an unknown name is logged
      as typed (admin guide R6). The log's user-name field holds at most 25 characters, so a
      longer typed name makes the log write fail with a database error instead of being
      recorded as a failed sign-in. Inferred from the column size, the absent form limit
      and the unguarded insert; not executed in this pass.
