# SX-0001 extract-b — module j2ee-pet-store-lite/db/schema (independent pass B)
# Sources read: db/schema/petstore_derby.sql (runtime), db/schema/petstore_oracle.sql
# (reference production), cross-checked against populate/PopulateSQL.xml, UserDAO,
# CreateUserServlet, item.jsp, search.jsp, db/batch/*.sql, conf/petstore.properties and
# docs/guides/*.html. No legacy-analysis/sources/**/extracted.md exists in this tree, so
# the HTML guides are cited directly by path and line.
records:
  # ------------------------------------------------------------------ catalog-browsing
  - record_key: CB-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL store each pet category under a unique category code of at most
      10 characters, and SHALL hold the category's display name (required, at most 80
      characters), optional image reference and optional description (each at most 255
      characters) once per locale, with at most one text record per category and locale.
    plain_text: >
      Every category (Fish, Dogs, Reptiles, Cats, Birds) has a short unique code. Its name,
      picture and description are kept separately for each language, one set per language,
      and the name is mandatory.
    technical_note: >
      Tables CATEGORY (PK catid) and CATEGORY_DETAILS (PK catid+locale, FK to CATEGORY,
      name NOT NULL). Identical in the Derby and Oracle DDL and in PopulateSQL.xml, except
      the key column type (char(10) on Derby, varchar(10) on Oracle).
    interface: false
    confidence: high
    confidence_basis: >
      Declared identically in two DDL files plus the runtime create statement in
      PopulateSQL.xml; the constraints are database-enforced, not inferred.
    risk_class: operational
    basis: >
      Primary keys, NOT NULL and column lengths on CATEGORY and CATEGORY_DETAILS.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 10
        line_end: 20
        excerpt: |
          -- CATEGORY: Pet categories (FISH, DOGS, REPTILES, CATS, BIRDS). Key only; text is in CATEGORY_DETAILS.
          CREATE TABLE category (catid char(10) not null,
            constraint pk_category primary key (catid));

          -- CATEGORY_DETAILS: Localised name, image and description of a category. One row per category and locale.
          CREATE TABLE category_details (catid char(10) not null,
            name varchar(80) not null, image varchar(255),
            descn varchar(255), locale char(10) not null,
            constraint pk_category_details primary key (catid, locale),
              constraint fk_category_details_1 foreign key (catid)
              references category (catid));
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 11
        line_end: 20
        excerpt: |
          CREATE TABLE category (catid varchar(10) not null,
            constraint pk_category primary key (catid));

          -- CATEGORY_DETAILS: Localised name, image and description of a category. One row per category and locale.
          CREATE TABLE category_details (catid varchar(10) not null,
            name varchar2(80) not null, image varchar2(255),
            descn varchar2(255), locale varchar(10) not null,
            constraint pk_category_details primary key (catid, locale),
              constraint fk_category_details_1 foreign key (catid)
              references category (catid));
    stack_metadata:
      db.object: [CATEGORY, CATEGORY_DETAILS]

  - record_key: CB-ENT-0002
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL store each product under a unique product code of at most 10
      characters, SHALL assign every product to exactly one category, and SHALL hold the
      product's display name (required, at most 80 characters), optional image and optional
      description (each at most 255 characters) once per locale.
    plain_text: >
      A product is a kind of pet (for example Bulldog). It has a unique code, always belongs
      to exactly one category, and has a mandatory name plus optional picture and
      description in each language.
    technical_note: >
      Tables PRODUCT (PK productid, catid NOT NULL, FK fk_product_1 to CATEGORY, index
      idx_product_catid) and PRODUCT_DETAILS (PK productid+locale, FK to PRODUCT).
    interface: false
    confidence: high
    confidence_basis: >
      Same constraints declared in both DDL files and in the runtime PopulateSQL.xml create
      statement.
    risk_class: operational
    basis: >
      NOT NULL foreign key product.catid -> category.catid; composite PK on product_details.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 22
        line_end: 39
        excerpt: |
          -- PRODUCT: A kind of pet within a category, for example K9-BD-01 Bulldog in DOGS.
          CREATE TABLE product (
            productid char(10) not null,
            catid char(10) not null,
            constraint pk_product primary key (productid),
              constraint fk_product_1 foreign key (catid)
              references category (catid));

          -- PRODUCT_DETAILS: Localised name, image and description of a product.
          CREATE TABLE product_details (
            productid char(10) not null,
            locale char(10) not null,
            name varchar(80) not null,
            image varchar(255),
            descn varchar(255),
            constraint pk_product_details primary key (productid, locale),
              constraint fk_product_details_1 foreign key (productid)
              references product (productid));
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 23
        line_end: 28
        excerpt: |
          CREATE TABLE product (
            productid varchar(10) not null,
            catid varchar(10) not null,
            constraint pk_product primary key (productid),
              constraint fk_product_1 foreign key (catid)
              references category (catid));
    stack_metadata:
      db.object: [PRODUCT, PRODUCT_DETAILS, idx_product_catid]

  - record_key: CB-ENT-0003
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL store each sellable item under a unique item code of at most 10
      characters, SHALL assign every item to exactly one product, and SHALL hold per locale
      the item's list price and unit cost (both required, up to 8 integer digits and exactly
      2 decimal places), a required image reference and a required description (each at
      most 255 characters), and up to five optional attributes of at most 80 characters.
    plain_text: >
      An item is the thing a customer actually buys (for example Male Adult Bulldog). It has
      a unique code and belongs to one product. For each language it carries a list price,
      a unit cost, a picture, a description and up to five short attributes; prices,
      picture and description are mandatory and prices are in whole cents.
    technical_note: >
      Tables ITEM (PK itemid, productid NOT NULL FK to PRODUCT, index idx_item_productid)
      and ITEM_DETAILS (PK itemid+locale, FK to ITEM, listprice/unitcost decimal(10,2) on
      Derby and number(10,2) on Oracle, image and descn NOT NULL, attr1..attr5 nullable).
      Unlike category/product details, item image and description are mandatory.
    interface: false
    confidence: high
    confidence_basis: >
      Declared identically in both DDL files and in PopulateSQL.xml (runtime create).
    risk_class: financial
    basis: >
      Column definitions and constraints of ITEM and ITEM_DETAILS; prices are money values,
      hence financial.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 41
        line_end: 67
        excerpt: |
          -- ITEM: A sellable variant of a product, for example EST-6 Male Adult Bulldog.
          CREATE TABLE item (
            itemid char(10) not null,
            productid char(10) not null,
            constraint pk_item primary key (itemid),
              constraint fk_item_1 foreign key (productid)
              references product (productid)
          );

          -- ITEM_DETAILS: Localised price, cost, image, description and up to 5 attributes of an item. List price must not be below unit cost.
          CREATE TABLE item_details (
            itemid char(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale char(10) not null,
            image varchar(255) not null,
            descn varchar(255) not null,
            attr1 varchar(80),
            attr2 varchar(80),
            attr3 varchar(80),
            attr4 varchar(80),
            attr5 varchar(80),
            constraint pk_item_details primary key (itemid, locale),
                constraint fk_item_details_1 foreign key (itemid)
                references item (itemid),
                constraint ck_item_details_price check (listprice >= unitcost)
          );
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 51
        line_end: 57
        excerpt: |
          CREATE TABLE item_details (
            itemid varchar(10) not null,
            listprice number(10,2) not null,
            unitcost number(10,2) not null,
            locale varchar(10) not null,
            image varchar2(255) not null,
            descn varchar2(255) not null,
    stack_metadata:
      db.object: [ITEM, ITEM_DETAILS, idx_item_productid]

  - record_key: CB-BR-0004
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show an item's stored list price labelled "List Price" and the
      item's stored unit cost labelled "Your Price"; no separate member or discounted price
      is stored.
    plain_text: >
      On an item page the shopper sees two prices: "List Price" is the catalog price and
      "Your Price" is the item's unit cost figure. There is no other price kept for members.
    technical_note: >
      Oracle column comments state the mapping (listprice -> List Price, unitcost -> Your
      Price). item.jsp renders listCost as List Price and unitCost as Your Price; search.jsp
      shows only unitCost in result rows. The schema has no member-price column. See the
      suspected defect on this record: the user guide calls Your Price a member discount.
    interface: false
    confidence: high
    confidence_basis: >
      Stated in the schema column comments and independently implemented in item.jsp; the
      display mapping is read, not inferred.
    risk_class: financial
    basis: >
      COMMENT ON COLUMN item_details.listprice / unitcost, and the item page markup.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 133
        line_end: 134
        excerpt: |
          COMMENT ON COLUMN item_details.listprice IS 'Price shown as List Price';
          COMMENT ON COLUMN item_details.unitcost IS 'Price shown as Your Price';
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/item.jsp
        line_start: 26
        line_end: 30
        excerpt: |
            <td class="petstore" width="100%"><b>List Price:</b>
             <fmt:formatNumber value="${item.listCost}" type="currency" />
             <br><br>
             <b>Your Price:</b>
             <fmt:formatNumber value="${item.unitCost}" type="currency" />
    stack_metadata:
      db.object: [ITEM_DETAILS.listprice, ITEM_DETAILS.unitcost]
      jsp.page: [item.jsp, search.jsp]

  - record_key: CB-BR-0005
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      GIVEN an item whose details exist in a locale WHEN the combined catalog listing for
      that locale is produced THEN the item SHALL appear only if its product and its
      category also have text in that same locale.
    plain_text: >
      In the combined catalog listing, an item shows up in a language only when its product
      and its category have also been written in that language.
    technical_note: >
      View V_CATALOG_ITEM inner-joins ITEM_DETAILS to PRODUCT_DETAILS and CATEGORY_DETAILS
      on equal locale. No caller of the view was found in the application Java, JSPs, DAO
      SQL or batch SQL, so whether any live path uses it is unknown.
    interface: false
    confidence: low
    confidence_basis: >
      The join semantics are read directly from the view, but no consumer of the view was
      found, so the behaviour may never be exercised.
    dispute:
      reason: unresolved-reachability
      detail: >
        The view is declared in both DDL files but grep finds no reference to
        v_catalog_item outside the schema files and their copies under vortex/inputs. An SME
        or DBA should confirm whether reports, ad-hoc queries or an external tool read it;
        if nothing does, this record can be dropped.
    risk_class: presentational
    basis: >
      INNER JOINs with locale equality in V_CATALOG_ITEM.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 101
        line_end: 109
        excerpt: |
          CREATE VIEW v_catalog_item AS
          SELECT d.catid, cd.name AS category_name, p.productid, pd.name AS product_name,
                 i.itemid, idt.listprice, idt.unitcost, idt.attr1, idt.descn, idt.image, idt.locale
            FROM item i
            JOIN item_details idt ON idt.itemid = i.itemid
            JOIN product p ON p.productid = i.productid
            JOIN product_details pd ON pd.productid = p.productid AND pd.locale = idt.locale
            JOIN category d ON d.catid = p.catid
            JOIN category_details cd ON cd.catid = d.catid AND cd.locale = idt.locale;
    stack_metadata:
      db.object: V_CATALOG_ITEM

  # ------------------------------------------------------------ catalog-data-integrity
  - record_key: CDI-BR-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL reject any item price record whose list price is below its unit
      cost.
    plain_text: >
      An item can never be priced below what it costs: the list price must be at least the
      unit cost, and any attempt to store otherwise is refused.
    technical_note: >
      Check constraint ck_item_details_price (listprice >= unitcost) on ITEM_DETAILS in both
      DDL files and in the PopulateSQL.xml runtime create; the daily PSL_CATALOG_CHECK query
      C3 re-checks it. Admin guide rule C3 documents it.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced by a database check constraint declared in three places, re-verified by a
      batch query, and documented in the admin guide.
    risk_class: financial
    basis: >
      CHECK (listprice >= unitcost); admin guide rule C3.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 66
        line_end: 66
        excerpt: |
                constraint ck_item_details_price check (listprice >= unitcost)
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 66
        line_end: 66
        excerpt: |
                constraint ck_item_details_price check (listprice >= unitcost)
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 9
        line_end: 10
        excerpt: |
          -- C3: items priced below cost
          SELECT 'C3' AS chk, itemid FROM item_details WHERE listprice < unitcost;
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 96
        line_end: 96
        excerpt: |
           <tr><td>C3</td><td>An item's list price is never below its unit cost (database check constraint).</td></tr>
    stack_metadata:
      db.object: ck_item_details_price

  - record_key: CDI-BR-0002
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL reject a product that names a non-existent category, an item that
      names a non-existent product, and any localised text or price record that names a
      non-existent category, product or item.
    plain_text: >
      Catalog entries must hang together: a product must belong to a category that exists,
      an item to a product that exists, and text or prices can only be added for things
      that exist.
    technical_note: >
      Foreign keys fk_product_1, fk_item_1, fk_category_details_1, fk_product_details_1,
      fk_item_details_1 in both DDL files (no ON DELETE action declared, so a parent with
      children cannot be deleted either).
    interface: false
    confidence: high
    confidence_basis: >
      Five foreign keys declared identically in both DDL files and the runtime create
      statements.
    risk_class: operational
    basis: >
      FOREIGN KEY ... REFERENCES clauses on all child catalog tables.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 26
        line_end: 28
        excerpt: |
            constraint pk_product primary key (productid),
              constraint fk_product_1 foreign key (catid)
              references category (catid));
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 45
        line_end: 47
        excerpt: |
            constraint pk_item primary key (itemid),
              constraint fk_item_1 foreign key (productid)
              references product (productid)
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 63
        line_end: 65
        excerpt: |
            constraint pk_item_details primary key (itemid, locale),
                constraint fk_item_details_1 foreign key (itemid)
                references item (itemid),
    stack_metadata:
      db.object: [fk_product_1, fk_item_1, fk_category_details_1, fk_product_details_1, fk_item_details_1]

  # ------------------------------------------------------------ account-registration
  - record_key: AR-ENT-0001
    kind: entity
    capability_key: account-registration
    requirement: >
      The system SHALL store each account under a unique user name of at most 25
      characters, SHALL require a password of at most 25 characters, and SHALL record the
      time the account was created, defaulting to the moment of insertion.
    plain_text: >
      Each customer account has a user name no one else can use (up to 25 characters), a
      password (up to 25 characters) and the date and time it was created.
    technical_note: >
      Table SIGNON: PK pk_signon(username), username/password varchar(25) NOT NULL,
      created_ts NOT NULL default current_timestamp. CreateUserServlet/UserDAO apply the
      same 25-character maximum (3-25 for user name, 4-25 for password) and pre-check for an
      existing name before insert (DuplicateUserException); the PK is the backstop.
      Password is stored as entered (see suspected defect).
    interface: false
    confidence: high
    confidence_basis: >
      Uniqueness and length are enforced by the schema and independently by Java
      validation (UserDAO length constants and duplicate pre-check).
    risk_class: regulated
    basis: >
      SIGNON primary key and column definitions; UserDAO.MAX_USERNAME_LENGTH = 25; duplicate
      check in UserDAO.createUser.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 70
        line_end: 79
        excerpt: |
          CREATE TABLE signon (
            username varchar(25) not null,
            password varchar(25) not null,
            role varchar(10) default 'CUSTOMER' not null,
            failed_attempts integer default 0 not null,
            locked char(1) default 'N' not null,
            locked_ts timestamp,
            last_signon timestamp,
            created_ts timestamp default current_timestamp not null,
            constraint pk_signon primary key (username),
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 175
        line_end: 180
        excerpt: |
                      boolean exists = rs.next();
                      rs.close();
                      select.close();
                      if (exists) {
                          throw new DuplicateUserException(userName);
                      }
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 56
        line_end: 57
        excerpt: |
           *  - user name is 3 to 25 characters, letters, digits, '-' and '_' only
           *  - password is 4 to 25 characters
    stack_metadata:
