  # ------------------------------------------------------------------- sign-on-audit
  - record_key: SA-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on event with a unique, system-assigned, increasing
      event number, the user name (required, at most 25 characters), the event type
      (required), the event time (required) and the client address (optional, at most 45
      characters).
    plain_text: >
      Every sign-in related event is logged with its own number, who it was about, what
      happened, when, and from which network address if known.
    technical_note: >
      Table SIGNON_AUDIT. Derby: audit_id bigint GENERATED ALWAYS AS IDENTITY. Oracle:
      audit_id number(19) filled by sequence signon_audit_seq (CACHE 20) via trigger
      trg_signon_audit_id only when the insert leaves audit_id null. remote_addr varchar(45)
      fits an IPv6 text address; batch rows put 'batch:PSL_ACCT_UNLOCK' there. Indexes on
      (username, event_ts) and (event_ts).
    interface: false
    confidence: high
    confidence_basis: >
      Declared in both DDLs and PopulateSQL.xml; UserDAO and batch SQL insert exactly these
      columns.
    risk_class: regulated
    basis: >
      SIGNON_AUDIT definition, sequence and trigger.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 85
        line_end: 91
        excerpt: |
          CREATE TABLE signon_audit (
            audit_id bigint generated always as identity,
            username varchar(25) not null,
            event_type varchar(20) not null,
            event_ts timestamp not null,
            remote_addr varchar(45),
            constraint pk_signon_audit primary key (audit_id),
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 96
        line_end: 104
        excerpt: |
          CREATE SEQUENCE signon_audit_seq START WITH 1 INCREMENT BY 1 CACHE 20;

          CREATE OR REPLACE TRIGGER trg_signon_audit_id
          BEFORE INSERT ON signon_audit
          FOR EACH ROW
          WHEN (new.audit_id IS NULL)
          BEGIN
            SELECT signon_audit_seq.NEXTVAL INTO :new.audit_id FROM dual;
          END;
    stack_metadata:
      db.object: [SIGNON_AUDIT, signon_audit_seq, trg_signon_audit_id, idx_signon_audit_user_ts, idx_signon_audit_ts]

  - record_key: SA-BR-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL accept only these sign-on event types: successful sign-in, failed
      sign-in, sign-in attempted while locked, account locked, account unlocked, sign-off
      and account created (codes SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED,
      ACCOUNT_UNLOCKED, SIGNOFF, USER_CREATED).
    plain_text: >
      The sign-in log knows exactly seven kinds of event: signed in, failed to sign in,
      tried while locked, got locked, got unlocked, signed out, and account created.
    technical_note: >
      Check constraint ck_signon_audit_event in both DDLs and PopulateSQL.xml; UserDAO
      constants EVENT_*; the same list is the event_type column of the daily extract file
      the security team receives (operations runbook 3.2), so the codes are an interface
      value set.
    interface: true
    confidence: high
    confidence_basis: >
