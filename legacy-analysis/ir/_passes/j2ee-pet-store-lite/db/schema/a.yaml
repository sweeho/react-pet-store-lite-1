# Pass A, shard j2ee-pet-store-lite/db/schema (SX-0001)
# Sources read: db/schema/petstore_derby.sql (runtime), db/schema/petstore_oracle.sql
# (reference production), and the matching blocks of src/main/webapp/populate/PopulateSQL.xml
# for cross-checking. No legacy-analysis/sources/**/extracted.md exists in this tree, so no
# document trace is cited. legacy-analysis/inventory/units/ddl-export-default-00{1,2,3}.md were
# read; they are adapter indexes of these same two SQL files, so the SQL is cited directly.
records:
  - record_key: CDI-ENT-0001
    kind: entity
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL hold a catalog of three levels: categories, products and items. Each
      product SHALL belong to exactly one existing category, and each item SHALL belong to
      exactly one existing product. Each category, product and item SHALL be identified by a
      unique identifier of at most 10 characters.
    plain_text: >
      The catalog is organised as categories, which contain products, which contain sellable
      items. A product cannot exist without its category, and an item cannot exist without its
      product. Every one has a short unique code of up to 10 characters.
    technical_note: >
      Tables CATEGORY, PRODUCT and ITEM, with primary keys pk_category, pk_product and pk_item
      and foreign keys fk_product_1 (product.catid to category) and fk_item_1 (item.productid to
      product). The DDL is the same in both dialects and in PopulateSQL.xml, apart from the
      char/varchar key type (see CDI-RULE-0006).
    interface: false
    confidence: high
    confidence_basis: >
      The PK and FK constraints are declared in the Derby DDL, the Oracle DDL and the runtime
      create statements in PopulateSQL.xml. They are database-enforced invariants.
    risk_class: operational
    basis: >
      Primary and foreign key constraints on category, product and item.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 11
        line_end: 12
        excerpt: |
          CREATE TABLE category (catid char(10) not null,
            constraint pk_category primary key (catid));
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 23
        line_end: 28
        excerpt: |
          CREATE TABLE product (
            productid char(10) not null,
            catid char(10) not null,
            constraint pk_product primary key (productid),
              constraint fk_product_1 foreign key (catid)
              references category (catid));
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 42
        line_end: 48
        excerpt: |
          CREATE TABLE item (
            itemid char(10) not null,
            productid char(10) not null,
            constraint pk_item primary key (itemid),
              constraint fk_item_1 foreign key (productid)
              references product (productid)
          );
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 23
        line_end: 28
        excerpt: |
          CREATE TABLE product (
            productid varchar(10) not null,
            catid varchar(10) not null,
            constraint pk_product primary key (productid),
              constraint fk_product_1 foreign key (catid)
              references category (catid));
    stack_metadata:
      db.object: [CATEGORY, PRODUCT, ITEM]

  - record_key: CDI-ENT-0002
    kind: entity
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL store the descriptive text of each category, product and item per
      locale, with at most one description per (identifier, locale) pair, and each description
      SHALL refer to an existing category, product or item. A category or product description
      SHALL have a name of at most 80 characters, and MAY have an image reference and a
      description of at most 255 characters each.
    plain_text: >
      Names and descriptions are kept separately for each language, one per language for each
      category, product or item. A category or product must have a name in that language; the
      picture and description are optional.
    technical_note: >
      CATEGORY_DETAILS and PRODUCT_DETAILS, primary key (id, locale), foreign key to the parent
      table, name varchar(80) not null, image and descn varchar(255) nullable, locale char(10)
      (Derby) or varchar(10) (Oracle) not null.
    interface: false
    confidence: high
    confidence_basis: >
      Declared identically in both DDL files and in PopulateSQL.xml; database-enforced.
    risk_class: presentational
    basis: >
      Composite primary keys and foreign keys on the *_details tables; NOT NULL on name.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 14
        line_end: 20
        excerpt: |
          -- CATEGORY_DETAILS: Localised name, image and description of a category. One row per category and locale.
          CREATE TABLE category_details (catid char(10) not null,
            name varchar(80) not null, image varchar(255),
            descn varchar(255), locale char(10) not null,
            constraint pk_category_details primary key (catid, locale),
              constraint fk_category_details_1 foreign key (catid)
              references category (catid));
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 31
        line_end: 39
        excerpt: |
          CREATE TABLE product_details (
            productid char(10) not null,
            locale char(10) not null,
            name varchar(80) not null,
            image varchar(255),
            descn varchar(255),
            constraint pk_product_details primary key (productid, locale),
              constraint fk_product_details_1 foreign key (productid)
              references product (productid));
    stack_metadata:
      db.object: [CATEGORY_DETAILS, PRODUCT_DETAILS]

  - record_key: CDI-ENT-0003
    kind: entity
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL store, for each item and locale, exactly one set of item details holding
      a list price and a unit cost (each a decimal amount with 2 decimal places and at most 10
      digits in total), an image reference and a description (each required, at most 255
      characters), and up to five optional attributes of at most 80 characters each.
    plain_text: >
      Every item has, for each language, a list price, a cost, a picture, a description and up
      to five optional features such as "Male Adult". Prices are kept to the cent, up to
      99 999 999.99.
    technical_note: >
      ITEM_DETAILS: primary key (itemid, locale), fk_item_details_1 to ITEM, listprice and
      unitcost decimal(10,2) (Oracle number(10,2)) not null, image and descn not null,
      attr1..attr5 varchar(80) nullable. Unlike category and product details, image and descn
      are mandatory here.
    interface: false
    confidence: high
    confidence_basis: >
      Declared identically in both DDL files and the runtime create statement; database-enforced.
    risk_class: financial
    basis: >
      Column definitions and constraints of item_details.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 50
        line_end: 67
        excerpt: |
          -- ITEM_DETAILS: Localised price, cost, image, description and up to 5 attributes of an item. List price must not be below unit cost.
          CREATE TABLE item_details (
            itemid char(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale char(10) not null,
            image varchar(255) not null,
            descn varchar(255) not null,
            attr1 varchar(80),
            attr2 varchar(80),
            attr3 varchar(80),
            attr4 varchar(80),
            attr5 varchar(80),
            constraint pk_item_details primary key (itemid, locale),
                constraint fk_item_details_1 foreign key (itemid)
                references item (itemid),
                constraint ck_item_details_price check (listprice >= unitcost)
          );
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 53
        line_end: 54
        excerpt: |
            listprice number(10,2) not null,
            unitcost number(10,2) not null,
    stack_metadata:
      db.object: ITEM_DETAILS

  - record_key: CDI-RULE-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL NOT store an item whose list price is lower than its unit cost.
      GIVEN item details with unit cost 20.00 WHEN the list price is 19.99 THEN the record SHALL
      be rejected; WHEN the list price equals 20.00 THEN it SHALL be accepted.
    plain_text: >
      An item's list price may never be below what it costs. A price equal to the cost is
      allowed.
    technical_note: >
      CHECK constraint ck_item_details_price (listprice >= unitcost) on ITEM_DETAILS, in the
      Derby DDL, the Oracle DDL and the runtime create in PopulateSQL.xml. The table comments
      in both DDL files repeat the rule.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced by a CHECK constraint in three places (both DDLs and PopulateSQL.xml) and stated
      in a table comment. No Java-side check was looked for in this shard.
    risk_class: financial
    basis: >
      ck_item_details_price and the ITEM_DETAILS comment "List price must not be below unit cost."
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 66
        line_end: 66
        excerpt: |
                constraint ck_item_details_price check (listprice >= unitcost)
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 66
        line_end: 66
        excerpt: |
                constraint ck_item_details_price check (listprice >= unitcost)
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 132
        line_end: 132
        excerpt: |
                        constraint ck_item_details_price check (listprice >= unitcost)
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 127
        line_end: 127
        excerpt: |
          COMMENT ON TABLE item_details IS 'Localised price, cost, image, description and up to 5 attributes of an item. List price must not be below unit cost.';
    stack_metadata:
      db.object: ITEM_DETAILS.ck_item_details_price

  - record_key: CB-RULE-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL present an item's list price as "List Price" and its unit cost as
      "Your Price".
    plain_text: >
      On screen, the list price is labelled "List Price" and the stored cost is labelled
      "Your Price".
    technical_note: >
      Stated only by Oracle column comments on ITEM_DETAILS.listprice and ITEM_DETAILS.unitcost.
      The screens that do the labelling are in other shards (item.jsp, product.jsp, search.jsp;
      discovery finding F7).
    interface: false
    confidence: low
    confidence_basis: >
      Two column comments in one file, the Oracle reference DDL. The Derby runtime DDL has no
      such comment, and this shard does not read the JSPs that render the prices.
    dispute:
      reason: other
      detail: >
        The same table calls unitcost the item's cost (table comment, and the CHECK that list
        price is not below it), yet labels it "Your Price", the amount a customer appears to
        pay. So either customers are shown, and maybe charged, the cost price, or the column
        is misnamed. A business owner must decide which amount is the customer's price. The
        JSPs that render the labels (F7) would show what customers see today.
    risk_class: financial
    basis: >
      COMMENT ON COLUMN item_details.listprice / unitcost.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 133
        line_end: 134
        excerpt: |
          COMMENT ON COLUMN item_details.listprice IS 'Price shown as List Price';
          COMMENT ON COLUMN item_details.unitcost IS 'Price shown as Your Price';
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 50
        line_end: 50
        excerpt: |
          -- ITEM_DETAILS: Localised price, cost, image, description and up to 5 attributes of an item. List price must not be below unit cost.
    stack_metadata:
      db.object: ITEM_DETAILS.listprice, ITEM_DETAILS.unitcost

  - record_key: CB-RULE-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL offer the pet categories FISH, DOGS, REPTILES, CATS and BIRDS.
    plain_text: >
      The store has five pet categories: fish, dogs, reptiles, cats and birds.
    technical_note: >
      Named only in the CATEGORY table comment in both DDL files. Nothing in the schema
