  - record_key: AL-RULE-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock an account after 3 consecutive failed sign-ins, SHALL reset the
      consecutive-failure count to 0 on a successful sign-in or on unlock, and SHALL unlock a
      locked account automatically after 30 minutes.
    plain_text: >
      Three wrong passwords in a row lock the account. A successful sign-in or an unlock sets
      the count back to zero, and a locked account unlocks itself after 30 minutes.
    technical_note: >
      Stated in the SIGNON table comment (both DDLs) and Oracle column comments only. The schema
      does not enforce the threshold or the timer; enforcement lives in the sign-on code and the
      PSL_ACCT_UNLOCK batch job (db/batch/acct_unlock.sql), which are other shards.
    interface: false
    confidence: low
    confidence_basis: >
      Comments only, nothing enforced in this module. The 3 and 30 values must be confirmed
      against the sign-on code and the unlock job.
    risk_class: regulated
    basis: >
      SIGNON table comment and comments on SIGNON.locked and SIGNON.failed_attempts.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 69
        line_end: 69
        excerpt: |
          -- SIGNON: Sign-on accounts. Role is CUSTOMER or ADMIN. Locked after 3 failed sign-ons in a row; unlocked by PSL_ACCT_UNLOCK after 30 minutes.
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 130
        line_end: 131
        excerpt: |
          COMMENT ON COLUMN signon.locked IS 'Y when the account is locked after 3 failed sign-ons in a row, else N';
          COMMENT ON COLUMN signon.failed_attempts IS 'Consecutive failed sign-ons; reset to 0 on success or unlock';
    stack_metadata:
      db.object: SIGNON
      batch.trigger: PSL_ACCT_UNLOCK

  - record_key: SOA-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on event with a unique event identifier, the user name
      (at most 25 characters, required), the event type (required), the event time (required)
      and the client network address (optional, at most 45 characters). The event type SHALL be
      one of SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED, SIGNOFF, USER_CREATED or
      ACCOUNT_UNLOCKED, and any other value SHALL be rejected.
    plain_text: >
      Every sign-on event is logged with who, what happened, when, and from which network
      address. Only seven kinds of event exist: successful sign-in, failed sign-in, sign-in to
      a locked account, account locked, sign-off, account created and account unlocked.
    technical_note: >
      SIGNON_AUDIT: audit_id primary key, username varchar(25) not null, event_type varchar(20)
      not null with CHECK ck_signon_audit_event, event_ts timestamp not null, remote_addr
      varchar(45) (long enough for an IPv6 text address). No foreign key to SIGNON, so events
      for unknown user names can be stored. Indexes on (username, event_ts) and (event_ts).
      The runtime insert sets event_ts to current_timestamp.
    interface: false
    confidence: high
    confidence_basis: >
      CHECK constraint and NOT NULLs declared in both DDLs and PopulateSQL.xml, and the enum is
      repeated in an Oracle column comment.
    risk_class: regulated
    basis: >
      SIGNON_AUDIT definition and ck_signon_audit_event.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 85
        line_end: 94
        excerpt: |
          CREATE TABLE signon_audit (
            audit_id bigint generated always as identity,
            username varchar(25) not null,
            event_type varchar(20) not null,
            event_ts timestamp not null,
            remote_addr varchar(45),
            constraint pk_signon_audit primary key (audit_id),
            constraint ck_signon_audit_event check (event_type in
              ('SIGNON_OK', 'SIGNON_FAIL', 'SIGNON_LOCKED', 'ACCOUNT_LOCKED', 'SIGNOFF', 'USER_CREATED', 'ACCOUNT_UNLOCKED'))
          );
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 132
