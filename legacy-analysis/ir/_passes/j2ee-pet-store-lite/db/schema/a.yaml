    record_keys: [SOA-RULE-0001]
    severity: high
    category: data-corruption
    title: Oracle runtime schema gives audit events no identifier
    description: >
      On an Oracle database created by the populate step, the audit table requires an event
      identifier but nothing generates one and the insert does not supply it. Every sign-on
      event write would then probably fail, losing the audit trail and possibly breaking the
      sign-in that triggered it. The Oracle reference DDL has a generator that the runtime
      create lacks.
