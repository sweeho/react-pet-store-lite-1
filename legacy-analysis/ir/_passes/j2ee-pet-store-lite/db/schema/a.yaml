  - record_key: SOA-RULE-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL assign each sign-on audit event a unique identifier automatically, so that
      recording an event never requires the caller to supply one.
    plain_text: >
      Each logged sign-on event gets its own number automatically.
    technical_note: >
      Derby: audit_id bigint generated always as identity. Oracle reference DDL: audit_id
      number(19) not null, filled by sequence signon_audit_seq and BEFORE INSERT trigger
      trg_signon_audit_id. The Oracle block of PopulateSQL.xml, which actually creates the
      runtime tables, declares audit_id number(19) not null with no sequence or trigger, while
      its insert statement omits audit_id (F5).
    interface: false
    confidence: medium
    confidence_basis: >
      Auto-assignment is clear for Derby and for the Oracle reference DDL. The Oracle runtime
      create does not provide it, so on a database built by the populate step the behaviour
      differs. Not executed.
    dispute:
      reason: conflicting-sources
      detail: >
        petstore_oracle.sql generates audit_id with a sequence and trigger; the Oracle block of
        PopulateSQL.xml creates audit_id as NOT NULL with no generator, and the shared insert
        does not supply it, so every audit insert on an Oracle database built by populate would
        probably fail. Which DDL production Oracle was built from, or a test insert there, would
        settle this.
    risk_class: regulated
    basis: >
      audit_id definitions in the three DDL sources.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 86
        line_end: 86
        excerpt: |
            audit_id bigint generated always as identity,
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 96
        line_end: 104
        excerpt: |
          CREATE SEQUENCE signon_audit_seq START WITH 1 INCREMENT BY 1 CACHE 20;

          CREATE OR REPLACE TRIGGER trg_signon_audit_id
          BEFORE INSERT ON signon_audit
          FOR EACH ROW
          WHEN (new.audit_id IS NULL)
          BEGIN
            SELECT signon_audit_seq.NEXTVAL INTO :new.audit_id FROM dual;
          END;
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 354
        line_end: 354
        excerpt: |
                    audit_id number(19) not null,
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 365
        line_end: 365
        excerpt: |
                  insert into signon_audit (username, event_type, event_ts, remote_addr) values (?, ?, current_timestamp, ?)
    stack_metadata:
      db.object: SIGNON_AUDIT.audit_id, SIGNON_AUDIT_SEQ, TRG_SIGNON_AUDIT_ID

  - record_key: SOA-RULE-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL extract the sign-on audit log daily and SHALL purge audit events older
      than 90 days.
    plain_text: >
      The sign-on log is exported once a day, and entries older than 90 days are deleted.
    technical_note: >
      Stated in the SIGNON_AUDIT table comment (both DDLs), naming jobs PSL_AUDIT_EXTRACT and
      PSL_AUDIT_PURGE. The jobs themselves (db/batch/audit_extract.sql, audit_purge.sql) are
      other shards.
    interface: true
    confidence: low
    confidence_basis: >
      A comment in this module; the enforcing batch SQL and schedule are not read in this shard.
    risk_class: regulated
    basis: >
      SIGNON_AUDIT table comment.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 84
        line_end: 84
        excerpt: |
          -- SIGNON_AUDIT: Transaction log of sign-on events. Extracted daily by PSL_AUDIT_EXTRACT, purged after 90 days by PSL_AUDIT_PURGE.
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 129
        line_end: 129
        excerpt: |
          COMMENT ON TABLE signon_audit IS 'Transaction log of sign-on events. Extracted daily by PSL_AUDIT_EXTRACT, purged after 90 days by PSL_AUDIT_PURGE.';
    stack_metadata:
      db.object: SIGNON_AUDIT
      batch.trigger: [PSL_AUDIT_EXTRACT, PSL_AUDIT_PURGE]

  - record_key: CDI-RULE-0006
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL treat catalog identifiers and locale codes as text of at most 10
      characters.
    plain_text: >
      Category, product and item codes, and language codes, are up to 10 characters long.
    technical_note: >
      Derby declares catid, productid, itemid and locale as char(10), which pads values with
      trailing blanks to 10 characters; Oracle declares them varchar(10), which stores them as
      entered. Comparison, display and exported values can differ by trailing spaces between the
      two databases (F5).
    interface: false
    confidence: medium
    confidence_basis: >
      The 10-character limit is clear in every source; whether padding is part of the observable
      behaviour depends on which database production runs, which this shard cannot see.
    dispute:
      reason: conflicting-sources
      detail: >
        Derby (runtime) uses fixed-width padded char(10); Oracle (reference production) uses
        varchar(10). Data migrated from Derby may carry trailing blanks. Knowing which database
        is live, and whether any consumer compares ids with the padding, would settle it.
    risk_class: operational
    basis: >
      Key column types in both DDL files.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 11
        line_end: 11
        excerpt: |
          CREATE TABLE category (catid char(10) not null,
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 11
        line_end: 11
        excerpt: |
          CREATE TABLE category (catid varchar(10) not null,
    stack_metadata:
      db.object: [CATEGORY.catid, PRODUCT.productid, ITEM.itemid, "*_DETAILS.locale"]

findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
    description: >
      Both DDL files say "Source of truth for table shape: src/main/webapp/populate/PopulateSQL.xml"
      (line 4), so these files are reference copies, not what builds the database. Where they
      differ from PopulateSQL.xml (the Oracle audit_id generator, the v_catalog_item view), a
      human must confirm what production actually contains. Recorded as disputes on
      SOA-RULE-0001 and CDI-RULE-0002.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
    description: >
      The SIGNON_AUDIT username is required and at most 25 characters, with no link to SIGNON.
      Failed sign-ins with an unknown, missing or over-long typed name are logged (F11); a name
      over 25 characters or a missing one would violate this column. The sign-on code (other
      shard) decides whether that happens; this shard can only state the column limits.

