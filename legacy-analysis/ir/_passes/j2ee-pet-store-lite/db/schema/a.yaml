  - record_key: AC-RULE-0001
    kind: business-rule
    capability_key: access-control
    requirement: >
      The system SHALL give every account exactly one role, either CUSTOMER or ADMIN, and SHALL
      assign CUSTOMER when no role is given. GIVEN an account is stored with any other role
      value THEN the system SHALL reject it.
    plain_text: >
      Every account is either a customer or an administrator. New accounts are customers unless
      stated otherwise, and no other role exists.
    technical_note: >
      SIGNON.role varchar(10) default 'CUSTOMER' not null, CHECK ck_signon_role
      (role in ('CUSTOMER','ADMIN')), in both DDLs and PopulateSQL.xml; the table comment repeats
      it.
    interface: false
    confidence: high
    confidence_basis: >
      CHECK constraint and default in three DDL sources plus the table comment.
    risk_class: regulated
    basis: >
      ck_signon_role and the default on role.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 73
        line_end: 73
        excerpt: |
            role varchar(10) default 'CUSTOMER' not null,
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 80
        line_end: 80
        excerpt: |
            constraint ck_signon_role check (role in ('CUSTOMER', 'ADMIN')),
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 159
        line_end: 159
        excerpt: |
                    constraint ck_signon_role check (role in ('CUSTOMER', 'ADMIN')),
    stack_metadata:
      db.object: SIGNON.ck_signon_role

  - record_key: AL-RULE-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL record for each account whether it is locked (yes or no, default no), the
      count of consecutive failed sign-ins (default 0), and the time it was locked.
    plain_text: >
      Each account carries a locked or unlocked flag (unlocked when created), a count of failed
      sign-ins in a row (zero when created), and when it was locked.
    technical_note: >
      SIGNON.locked char(1) default 'N' not null with CHECK ck_signon_locked (locked in
      ('Y','N')); failed_attempts integer (Oracle number(3)) default 0 not null; locked_ts
      timestamp nullable; last_signon timestamp nullable.
    interface: false
    confidence: high
    confidence_basis: >
      CHECK constraint and defaults declared in both DDLs and PopulateSQL.xml.
    risk_class: regulated
    basis: >
      ck_signon_locked and column defaults on SIGNON.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 74
        line_end: 77
        excerpt: |
            failed_attempts integer default 0 not null,
            locked char(1) default 'N' not null,
            locked_ts timestamp,
            last_signon timestamp,
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 81
        line_end: 81
        excerpt: |
            constraint ck_signon_locked check (locked in ('Y', 'N'))
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 160
        line_end: 160
        excerpt: |
                    constraint ck_signon_locked check (locked in ('Y', 'N'))
    stack_metadata:
