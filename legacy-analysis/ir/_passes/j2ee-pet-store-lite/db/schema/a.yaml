    stack_metadata:
      db.object: CATEGORY

  - record_key: CDI-RULE-0002
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL define a combined catalog-item view that lists an item only when it has
      item details and its product and category both have details in the same locale as the
      item details.
    plain_text: >
      There is a combined catalog listing in which an item appears for a language only if its
      product and its category also have text in that language.
    technical_note: >
      View V_CATALOG_ITEM, inner joins of item, item_details, product, product_details (same
      locale), category and category_details (same locale). Defined in both DDL files; it is
      not in PopulateSQL.xml, so the runtime database built by the populate step does not
      contain it, and nothing in the tree reads it (F6).
    interface: false
    confidence: low
    confidence_basis: >
      The view is declared, but it is not created at runtime and has no reader, so it is unclear
      whether it states a rule or is leftover reference DDL.
    dispute:
      reason: unresolved-reachability
      detail: >
        The view is defined in both DDL files but is not created by PopulateSQL.xml, and a grep
        of the tree finds no reader except byte-identical copies under vortex/inputs. Production
        Oracle may hold it if the reference DDL was applied by hand, and an external report
        might query it. A DBA or operations confirmation of whether the view exists in
        production and who reads it would settle this.
    risk_class: operational
    basis: >
      CREATE VIEW v_catalog_item.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 101
        line_end: 109
        excerpt: |
          CREATE VIEW v_catalog_item AS
          SELECT d.catid, cd.name AS category_name, p.productid, pd.name AS product_name,
                 i.itemid, idt.listprice, idt.unitcost, idt.attr1, idt.descn, idt.image, idt.locale
            FROM item i
            JOIN item_details idt ON idt.itemid = i.itemid
            JOIN product p ON p.productid = i.productid
            JOIN product_details pd ON pd.productid = p.productid AND pd.locale = idt.locale
            JOIN category d ON d.catid = p.catid
            JOIN category_details cd ON cd.catid = d.catid AND cd.locale = idt.locale;
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 112
        line_end: 112
        excerpt: |
          CREATE VIEW v_catalog_item AS
    stack_metadata:
      db.object: V_CATALOG_ITEM

  - record_key: AR-ENT-0001
    kind: entity
    capability_key: account-registration
    requirement: >
      The system SHALL store each account with a user name that is unique and at most 25
