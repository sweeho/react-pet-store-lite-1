      the time the account was created.
    plain_text: >
      Each customer account has a user name that nobody else can have, up to 25 characters, a
      password of up to 25 characters, and the date and time it was created.
    technical_note: >
      SIGNON table: username varchar(25) primary key pk_signon, password varchar(25) not null,
      created_ts timestamp default current_timestamp not null. Same in both DDLs and
      PopulateSQL.xml. The password column is plain varchar, so passwords are stored as entered
      (no hash column exists; see discovery F13).
    interface: false
    confidence: high
    confidence_basis: >
      Declared identically in both DDLs and the runtime create; the uniqueness is a primary key.
    risk_class: regulated
    basis: >
      SIGNON column definitions and pk_signon.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 70
        line_end: 79
        excerpt: |
          CREATE TABLE signon (
            username varchar(25) not null,
            password varchar(25) not null,
            role varchar(10) default 'CUSTOMER' not null,
            failed_attempts integer default 0 not null,
            locked char(1) default 'N' not null,
            locked_ts timestamp,
            last_signon timestamp,
            created_ts timestamp default current_timestamp not null,
            constraint pk_signon primary key (username),
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
