  - capability_key: account-lockout
    record_keys: [LOCK-BR-0002, LOCK-BR-0001]
    severity: low
    category: data-corruption
    title: An account can be unlocked without an audit event
    description: >
      The unlock writes the audit events and then updates the accounts in two
      statements, each evaluating "now" separately. A lock that passes the 30-minute
      mark between the two statements is unlocked but gets no ACCOUNT_UNLOCKED event.
      Also, if the audit insert fails, the database tool carries on to the update and
      the commit, so accounts are unlocked with no audit record before the job reports
      the failure.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 4
        line_end: 17
