# SX-0001 extract-b, shard j2ee-pet-store-lite/batch (independent second reading)
# Scope read: batch/*.sh, the SQL each script runs (db/batch/*.sql), conf/env.sh
# (sourced by every script), conf/petstore.properties, the Control-M export that
# schedules the scripts, and docs/guides/operations-runbook.html + admin-guide.html
# (no legacy-analysis/sources/**/extracted.md exists in this tree, so the guides
# are cited as source files with line ranges).
records:
  - record_key: BATCH-WF-0001
    kind: workflow
    capability_key: batch-operations
    requirement: >
      The system SHALL run the nightly job chain in this order: a database backup
      daily at 01:00; the sign-on audit extract daily from 01:30, only after that
      day's backup succeeded; the sign-on statistics report daily from 01:45, only
      after that day's extract succeeded; and the audit purge on Sundays from 02:00,
      only after that day's extract succeeded. The catalog integrity check SHALL
      run daily at 06:00 independently of the chain.
    plain_text: >
      Every night the database is backed up at 1:00. Only once the backup has worked
      is yesterday's sign-in history exported (from 1:30). Only once that export has
      worked are the daily sign-in report (from 1:45) and, on Sundays, the clean-up of
      old sign-in history (from 2:00) run. A separate catalog health check runs every
      morning at 6:00.
    technical_note: >
      Ordering is enforced by Control-M conditions in folder PSL_PETSTORE_DAILY:
      PSL_DB_BACKUP adds PSL_DB_BACKUP-OK; PSL_AUDIT_EXTRACT waits on it (and deletes
      it) and adds PSL_AUDIT_EXTRACT-OK; PSL_SIGNON_REPORT and PSL_AUDIT_PURGE
      (WEEKDAYS="0") wait on PSL_AUDIT_EXTRACT-OK, and the purge deletes it.
      PSL_CATALOG_CHECK has no in-condition. Script header comments restate the times.
    interface: false
    confidence: high
    confidence_basis: >
      The same ordering is stated in three independent places: the Control-M
      in/out-conditions, the header comment of each script, and the runbook's
      schedule table and diagram. The scheduler export is the enforcing source.
    risk_class: operational
    basis: >
      TIMEFROM / WEEKDAYS and INCOND/OUTCOND elements of each job in the Control-M
      export; runbook section 2.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 27
        line_end: 35
        excerpt: |2
              <JOB JOBISN="2" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_EXTRACT"
                   DESCRIPTION="Export yesterday SIGNON_AUDIT rows to signon_audit_YYYYMMDD.csv"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_extract.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AB"
                   TIMEFROM="0130" WEEKDAYS="ALL" MAXRERUN="1"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 45
        line_end: 47
        excerpt: |2
                   TIMEFROM="0145" WEEKDAYS="ALL"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 55
        line_end: 58
        excerpt: |2
                   TIMEFROM="0200" WEEKDAYS="0"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="-" />
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 36
        line_end: 38
        excerpt: |2
          <pre>01:00 PSL_DB_BACKUP --> 01:30 PSL_AUDIT_EXTRACT --+--> 01:45 PSL_SIGNON_REPORT
                                                            +--> 02:00 PSL_AUDIT_PURGE (Sundays)
          06:00 PSL_CATALOG_CHECK            every 15 min  PSL_ACCT_UNLOCK</pre>
    stack_metadata:
      batch.trigger: Control-M folder PSL_PETSTORE_DAILY
      framework: Control-M + POSIX sh + Derby ij

  - record_key: BATCH-BR-0002
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      GIVEN the nightly database backup has not succeeded for the run date
      WHEN the audit extract's start time arrives
      THEN the audit extract SHALL NOT run, and neither SHALL the sign-on report or
      the Sunday audit purge that depend on it, and the operations team SHALL be
      sent an urgent mail stating the backup failed and the audit extract is held.
    plain_text: >
      If the nightly backup fails, the sign-in history export is held back (and the
      report and clean-up that follow it), and operations get an urgent email saying
      so.
    technical_note: >
      PSL_AUDIT_EXTRACT INCOND PSL_DB_BACKUP-OK is only added on a successful backup.
      PSL_DB_BACKUP ON CODE=NOTOK sends DOMAIL URGENCY="U" to psl-ops. psl_db_backup.sh
      exits 8 when the ij backup call reports an ERROR line.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced by the scheduler condition, stated in the failure mail text, and
      restated in runbook section 3.1. Lowered by nothing except that the script only
      detects some failures (see suspected defects).
    risk_class: operational
    basis: >
      Control-M backup job ON/DOMAIL and the extract's INCOND; runbook 3.1.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 21
        line_end: 24
        excerpt: |2
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="+" />
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="U" DEST="psl-ops@example.invalid" SUBJECT="PSL_DB_BACKUP failed" MESSAGE="Petstore DB backup failed, audit extract is held" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 44
        line_end: 44
        excerpt: |2
          Critical job: up to 2 reruns 10 minutes apart; on failure Control-M mails psl-ops and PSL_AUDIT_EXTRACT stays waiting.</p>
    stack_metadata:
      batch.trigger: Control-M condition PSL_DB_BACKUP-OK

  - record_key: BATCH-REQ-0003
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL take an online (store stays open) backup of the whole store
      database every day at 01:00 and keep it as a folder named with the run date
      (PetStoreDB_YYYYMMDD); a second backup on the same date SHALL replace the
      earlier one of that date.
    plain_text: >
      The whole store database is copied every night at 1:00 without closing the
      store. Each copy is labelled with its date; running it twice in one day keeps
      only the latest copy for that day.
    technical_note: >
      psl_db_backup.sh removes any leftover undated PetStoreDB folder, calls
      SYSCS_UTIL.SYSCS_BACKUP_DATABASE('/var/petstore/backup') via psl_ij, removes
      any existing PetStoreDB_<today> folder and renames the new backup to it.
    interface: false
    confidence: high
    confidence_basis: >
      Script, SQL, Control-M description and runbook 3.1 all agree on the online
      backup and dated folder; the same-day replacement is read from one script line
      only, but it is unambiguous.
    risk_class: operational
    basis: >
      psl_db_backup.sh lines 5-10 and db_backup.sql.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 5
        line_end: 10
        excerpt: |2
          STAMP=$(date '+%Y%m%d')
          psl_log "start"
          rm -rf "$PSL_BACKUP_DIR/PetStoreDB"
          psl_ij "$PSL_SQL/db_backup.sql" > /dev/null || { psl_log "FAILED: backup"; exit 8; }
          rm -rf "$PSL_BACKUP_DIR/PetStoreDB_$STAMP"
          mv "$PSL_BACKUP_DIR/PetStoreDB" "$PSL_BACKUP_DIR/PetStoreDB_$STAMP"
      - path: legacy-source/j2ee-pet-store-lite/db/batch/db_backup.sql
        line_start: 1
        line_end: 3
        excerpt: |2
          -- PSL_DB_BACKUP: online backup of PetStoreDB.
          -- Derby writes /var/petstore/backup/PetStoreDB; the script moves it to a dated folder.
          CALL SYSCS_UTIL.SYSCS_BACKUP_DATABASE('/var/petstore/backup');
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 42
        line_end: 43
        excerpt: |2
          <p>Online backup of PetStoreDB with <code>SYSCS_UTIL.SYSCS_BACKUP_DATABASE</code> (<code>db/batch/db_backup.sql</code>).
          The backup is moved to <code>/var/petstore/backup/PetStoreDB_YYYYMMDD</code>. Backups older than 7 days are deleted.
    stack_metadata:
      batch.trigger: Control-M PSL_DB_BACKUP 01:00 daily
      db.object: SYSCS_UTIL.SYSCS_BACKUP_DATABASE

  - record_key: BATCH-BR-0004
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL delete dated database backups older than 7 days at the end of
      each successful backup run.
    plain_text: >
      Database backups are kept for 7 days; older ones are deleted after each nightly
      backup.
    technical_note: >
      psl_db_backup.sh line 11: find ... -name 'PetStoreDB_*' -mtime +$PSL_BACKUP_KEEP_DAYS
      -exec rm -rf. PSL_BACKUP_KEEP_DAYS=7 in conf/env.sh; also batch.backup.keepDays=7
      in petstore.properties (not read by the scripts). find's -mtime +7 rounds age
      down to whole days, so in practice about 9 dated folders survive (see suspected
      defects).
    interface: false
    confidence: high
    confidence_basis: >
      The value 7 appears in env.sh (enforcing), the Control-M description, the
      runbook and petstore.properties. The exact boundary is find's whole-day
      rounding, which is read rather than documented.
    risk_class: operational
    basis: >
      psl_db_backup.sh line 11 with env.sh line 12.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
        excerpt: |2
          find "$PSL_BACKUP_DIR" -maxdepth 1 -name 'PetStoreDB_*' -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf {} \;
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 12
        line_end: 12
        excerpt: |2
          PSL_BACKUP_KEEP_DAYS=7
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 16
        line_end: 16
        excerpt: |2
                   DESCRIPTION="Online backup of PetStoreDB, keep 7 days"
    stack_metadata:
      batch.trigger: Control-M PSL_DB_BACKUP

  - record_key: BATCH-BR-0005
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL treat the nightly backup and the morning catalog check as
      critical jobs; a failed backup SHALL be retried automatically up to 2 times,
      10 minutes apart, and a failed audit extract SHALL be retried automatically at
      most once. The sign-on report, audit purge and catalog check SHALL NOT be
      retried automatically.
    plain_text: >
      The backup and the catalog check are marked critical. A failed backup is tried
      again up to twice, ten minutes apart; a failed sign-in history export is tried
      again once. The other jobs are not retried on their own.
    technical_note: >
      Control-M: PSL_DB_BACKUP CRITICAL="1" MAXRERUN="2" INTERVAL="00010M";
      PSL_AUDIT_EXTRACT MAXRERUN="1" (no interval stated); PSL_CATALOG_CHECK
      CRITICAL="1" with no MAXRERUN; report and purge carry no MAXRERUN.
    interface: false
    confidence: medium
    confidence_basis: >
      Backup rerun policy is in the scheduler export and the runbook (two places);
      the extract's single rerun and the absence of reruns elsewhere are read from
      the scheduler export alone, so the whole record is graded medium.
    risk_class: operational
    basis: >
      Control-M job attributes; runbook 3.1.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 18
        line_end: 19
        excerpt: |2
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0100" WEEKDAYS="ALL" DAYSCAL="PSL_CAL" MAXRERUN="2" INTERVAL="00010M"
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 31
        line_end: 31
        excerpt: |2
                   TIMEFROM="0130" WEEKDAYS="ALL" MAXRERUN="1"
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 65
        line_end: 66
        excerpt: |2
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0600" WEEKDAYS="ALL"
    stack_metadata:
      batch.trigger: Control-M MAXRERUN / CRITICAL

  - record_key: BATCH-BR-0006
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL alert by mail on these job outcomes only: a failed database
      backup (urgent, to operations); a failed audit extract (regular, to the security
      team, "Sign-on audit extract not produced"); and a catalog check that ends with
      code 4 (urgent, to the catalog team, pointing at the catalog check log).
    plain_text: >
      Operations get an urgent email when the backup fails; the security team gets an
      email when the sign-in history export is not produced; the catalog team gets an
      urgent email when the morning catalog check finds bad data. No other job
      failure sends an email.
    technical_note: >
      ON/DOMAIL blocks exist only on PSL_DB_BACKUP (CODE=NOTOK, URGENCY U, psl-ops),
      PSL_AUDIT_EXTRACT (CODE=NOTOK, URGENCY R, psl-security) and PSL_CATALOG_CHECK
      (CODE=COMPSTAT=4, URGENCY U, psl-catalog). PSL_SIGNON_REPORT, PSL_AUDIT_PURGE,
      PSL_ACCT_UNLOCK and catalog-check exit 8 have no alert (see suspected defects).
    interface: false
    confidence: high
    confidence_basis: >
      Mail actions are declared in the scheduler export and each is restated in the
      runbook (3.1, 3.5) or admin guide (catalog check alert). "No other alert" is the
      absence of a declaration, which is what the export shows.
    risk_class: operational
    basis: >
      The three DOMAIL elements in the Control-M export.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 36
        line_end: 38
        excerpt: |2
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="R" DEST="psl-security@example.invalid" SUBJECT="PSL_AUDIT_EXTRACT failed" MESSAGE="Sign-on audit extract not produced" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 69
        line_end: 71
        excerpt: |2
                <ON STMT="*" CODE="COMPSTAT=4">
                  <DOMAIL URGENCY="U" DEST="psl-catalog@example.invalid" SUBJECT="Petstore catalog integrity check failed" MESSAGE="See /var/petstore/log/catalog_check.log" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 22
        line_end: 24
        excerpt: |2
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="U" DEST="psl-ops@example.invalid" SUBJECT="PSL_DB_BACKUP failed" MESSAGE="Petstore DB backup failed, audit extract is held" />
                </ON>
    stack_metadata:
      batch.trigger: Control-M ON/DOMAIL

  - record_key: BATCH-BR-0007
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      Every batch job SHALL end with exit code 0 when it succeeded, 4 when the
      catalog check found catalog data breaking a rule, and 8 when a database step,
      the sample-data load request, or a file step failed.
    plain_text: >
      Each night job reports one of three results: OK; "the catalog data is wrong"
      (catalog check only); or "a technical step failed".
    technical_note: >
      Every script ends `exit 0` on success and `exit 8` when psl_ij returns non-zero
      (psl_ij returns 1 only when the ij output contains a line starting with ERROR);
      psl_catalog_check.sh exits 4 on any C1-C4 row and 8 when the Populate curl
      fails. The runbook's exit-code table says 8 also covers file errors, but no
      script checks its file operations (see suspected defects).
    interface: false
    confidence: high
    confidence_basis: >
      The codes are set in all six scripts and listed in the runbook exit-code table;
      the scheduler keys the catalog alert on code 4.
    risk_class: operational
    basis: >
      exit statements in batch/*.sh; runbook section 4; psl_ij in env.sh.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 12
        line_end: 21
        excerpt: |2
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
            OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          fi
          echo "$OUT" >> "$PSL_LOG_DIR/catalog_check.log"
          if echo "$OUT" | grep -qE "^C[1-4] "; then
            psl_log "FAILED: integrity check found rows"
            exit 4
          fi
          psl_log "end OK"
          exit 0
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 17
        line_end: 26
        excerpt: |2
          # Run a SQL script with Derby ij against the store database.
          # Usage: psl_ij <script.sql>   Fails when ij reports an ERROR line.
          psl_ij() {
            out=$("$JAVA_CMD" -cp "$DERBY_LIB/derbytools-10.14.2.0.jar:$DERBY_LIB/derbyclient-10.14.2.0.jar" \
                  -Dij.connection.psl="$PSL_DB_URL" -Dij.outfile=/dev/stdout \
                  org.apache.derby.tools.ij "$1" 2>&1)
            echo "$out"
            echo "$out" | grep -q "^ERROR" && return 1
            return 0
          }
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 77
        line_end: 79
        excerpt: |2
           <tr><td>0</td><td>OK</td><td>None</td></tr>
           <tr><td>4</td><td>PSL_CATALOG_CHECK found bad catalog data</td><td>Catalog team fixes the data or an administrator reloads the sample data. Rerun the job.</td></tr>
           <tr><td>8</td><td>SQL or file error</td><td>Read <code>batch.log</code> and the job log. Check that Tomcat is up (the Derby network server runs inside it) and that port 1527 answers. Rerun.</td></tr>
    stack_metadata:
      framework: POSIX sh + Derby ij

  - record_key: BATCH-REQ-0008
    kind: requirement
    capability_key: batch-operations
    requirement: >
      Every batch job SHALL write a time-stamped line naming the job to a shared
      batch log when it starts and when it ends (OK or FAILED with a reason), and the
      jobs SHALL keep their own detail logs (unlock, purge, catalog check output).
    plain_text: >
      Each night job notes in a shared log when it started and how it finished, with
      the time; some jobs also keep a detailed log of their own.
    technical_note: >
      psl_log in env.sh appends "YYYY-MM-DD HH:MM:SS [PSL_JOB] message" to
      $PSL_LOG_DIR/batch.log; acct_unlock.log, audit_purge.log and catalog_check.log
      receive ij output.
    interface: false
    confidence: medium
    confidence_basis: >
      One helper defines the format and the runbook mentions batch.log once; every
      script calls it, but it is a single implementation point.
    risk_class: operational
    basis: >
      psl_log in env.sh; runbook system overview "Job log".
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 28
        line_end: 31
        excerpt: |2
          # Write a time-stamped line to the job log and stdout.
          psl_log() {
            echo "$(date '+%Y-%m-%d %H:%M:%S') [$PSL_JOB] $*" | tee -a "$PSL_LOG_DIR/batch.log"
          }
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_acct_unlock.sh
        line_start: 5
        line_end: 7
        excerpt: |2
          psl_log "start"
          psl_ij "$PSL_SQL/acct_unlock.sql" >> "$PSL_LOG_DIR/acct_unlock.log" || { psl_log "FAILED"; exit 8; }
          psl_log "end OK"
    stack_metadata:
      framework: POSIX sh

  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL, every 15 minutes around the clock, unlock every locked
      account whose lock was set more than 30 minutes earlier, setting its failed
      sign-in count back to 0 and clearing its lock time.
      GIVEN an account locked 20 minutes ago WHEN the unlock runs THEN it stays
      locked until a later run; an account therefore stays locked between 30 and
      about 45 minutes.
    plain_text: >
      A locked account is unlocked automatically once it has been locked for more
      than 30 minutes. The check runs every 15 minutes, so the actual wait is between
      30 and 45 minutes. Unlocking also resets the count of failed sign-in attempts.
    technical_note: >
      Control-M folder PSL_PETSTORE_CYCLIC, job PSL_ACCT_UNLOCK, CYCLIC interval 15M
      00:00-23:59, runs psl_acct_unlock.sh -> db/batch/acct_unlock.sql:
      UPDATE signon SET locked='N', failed_attempts=0, locked_ts=NULL WHERE
      locked='Y' AND locked_ts < CURRENT_TIMESTAMP - 30 minutes (strictly older).
      30 also in petstore.properties signon.unlockAfterMinutes (not read by the job).
    interface: false
    confidence: high
    confidence_basis: >
      The UPDATE enforces it; the 15-minute cycle is in the scheduler export; the
      30-minute value and reset are restated in the script comment, the Control-M
      description, the runbook (3.6) and the admin guide rule R5.
    risk_class: operational
    basis: >
      acct_unlock.sql UPDATE; Control-M cyclic job definition.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 17
        excerpt: |2
          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};

          COMMIT;
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 78
        line_end: 83
        excerpt: |2
              <JOB JOBISN="1" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_ACCT_UNLOCK"
                   DESCRIPTION="Unlock sign-on accounts locked for more than 30 minutes"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_acct_unlock.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA"
                   TIMEFROM="0000" TIMETO="2359" WEEKDAYS="ALL"
                   CYCLIC="1" CYCLIC_TYPE="Interval" INTERVAL="00015M" IND_CYCLIC="START"
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 54
        line_end: 54
        excerpt: |2
           <tr><td>R5</td><td>Batch job PSL_ACCT_UNLOCK runs every 15 minutes and unlocks accounts locked more than 30 minutes ago. It sets failed attempts to 0 and records ACCOUNT_UNLOCKED.</td></tr>
    stack_metadata:
      batch.trigger: Control-M PSL_PETSTORE_CYCLIC / PSL_ACCT_UNLOCK every 15 min
      db.object: SIGNON (locked, failed_attempts, locked_ts)

  - record_key: LOCK-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL record one ACCOUNT_UNLOCKED sign-on audit event per account it
      unlocks automatically, with the unlock time and the source
      "batch:PSL_ACCT_UNLOCK" in place of a client address, in the same transaction
      as the unlock.
    plain_text: >
      Every automatic unlock is written to the sign-in history, marked as done by the
      unlock job rather than by a person.
    technical_note: >
      acct_unlock.sql runs with AUTOCOMMIT OFF: INSERT INTO signon_audit ... SELECT
