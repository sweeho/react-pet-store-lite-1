  - record_key: AUDIT-BR-0004
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL, every Sunday from 02:00 and only after that day's audit
      extract succeeded, permanently delete every sign-on audit event timestamped
      before 00:00 of the date 90 days before the run date.
      GIVEN the purge runs only weekly WHEN it has just run THEN events up to 90
      days old remain, and up to about 97 days old just before the next run.
    plain_text: >
      Sign-in history older than 90 days is deleted once a week, on Sunday night,
      and only after that night's export has worked. Because it runs weekly, entries
      can be up to about 97 days old before they go.
    technical_note: >
      Control-M PSL_AUDIT_PURGE WEEKDAYS="0" TIMEFROM 0200, INCOND
      PSL_AUDIT_EXTRACT-OK. audit_purge.sql: DELETE FROM signon_audit WHERE event_ts <
      CAST(CURRENT_DATE AS TIMESTAMP) - 90 days, AUTOCOMMIT OFF + COMMIT. The 90 is a
      literal in the SQL; PSL_AUDIT_RETENTION_DAYS=90 in env.sh is only logged.
    interface: false
    confidence: high
    confidence_basis: >
      The DELETE enforces it, the scheduler enforces day and order, and the value 90
      is restated in env.sh, petstore.properties, the Control-M description and the
      runbook (3.4 and settings table).
    risk_class: operational
    basis: >
      audit_purge.sql; Control-M PSL_AUDIT_PURGE; runbook 3.4.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 1
        line_end: 8
        excerpt: |2
          -- PSL_AUDIT_PURGE: delete sign-on audit events older than 90 days.
          -- Runs only after PSL_AUDIT_EXTRACT so every row has been extracted first.
          AUTOCOMMIT OFF;

          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};

          COMMIT;
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 51
        line_end: 57
        excerpt: |2
              <JOB JOBISN="4" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_PURGE"
                   DESCRIPTION="Delete SIGNON_AUDIT rows older than 90 days (Sundays)"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_purge.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AD"
                   TIMEFROM="0200" WEEKDAYS="0"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 64
        line_end: 64
        excerpt: |2
          <p>Sundays only. Deletes SIGNON_AUDIT rows older than 90 days. It waits for that day's extract so no row is deleted before it is extracted.</p>
    stack_metadata:
      batch.trigger: Control-M PSL_AUDIT_PURGE Sunday 02:00
      db.object: SIGNON_AUDIT

  - record_key: CATINT-WF-0001
    kind: workflow
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL check the catalog every day at 06:00, before the store opens,
      against these rules: C1 every category has at least one product; C2 every
      product has at least one item; C3 no item's list price is below its unit cost;
      C4 every item has an en_US description. WHEN any rule is broken THEN the check
      SHALL record the offending category, product or item identifiers in the
      catalog check log, end with the "bad catalog data" result, and the catalog team
      SHALL be sent an urgent mail.
    plain_text: >
      Every morning at 6:00 the catalog is checked: every category has products,
      every product has items, no item sells below cost, and every item has an
      English (US) description. If any of these fails, the catalog team gets an
      urgent email and the offending entries are listed in the check's log.
    technical_note: >
      psl_catalog_check.sh runs db/batch/catalog_check.sql (four SELECTs tagged
      C1..C4) and appends the ij output to catalog_check.log; any output line
      matching ^C[1-4] -> exit 4 -> Control-M COMPSTAT=4 DOMAIL to psl-catalog. C3 is
      also a table check constraint (ck_item_details_price, owned by the db shard).
    interface: false
    confidence: high
    confidence_basis: >
      The SQL and script enforce it; the scheduler alert keys on its exit code; the
      four rules are restated in the admin guide table 3.3 and the runbook 3.5.
    risk_class: operational
    basis: >
      catalog_check.sql; psl_catalog_check.sh; admin guide 3.3.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 3
        line_end: 13
        excerpt: |2
          -- C1: categories with no product
          SELECT 'C1' AS chk, c.catid FROM category c
           WHERE NOT EXISTS (SELECT 1 FROM product p WHERE p.catid = c.catid);
          -- C2: products with no item
          SELECT 'C2' AS chk, p.productid FROM product p
           WHERE NOT EXISTS (SELECT 1 FROM item i WHERE i.productid = p.productid);
          -- C3: items priced below cost
          SELECT 'C3' AS chk, itemid FROM item_details WHERE listprice < unitcost;
          -- C4: items without an en_US description
          SELECT 'C4' AS chk, i.itemid FROM item i
           WHERE NOT EXISTS (SELECT 1 FROM item_details d WHERE d.itemid = i.itemid AND d.locale = 'en_US');
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 15
        line_end: 19
        excerpt: |2
          echo "$OUT" >> "$PSL_LOG_DIR/catalog_check.log"
          if echo "$OUT" | grep -qE "^C[1-4] "; then
            psl_log "FAILED: integrity check found rows"
            exit 4
          fi
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 94
        line_end: 99
        excerpt: |2
           <tr><td>C1</td><td>Every category has at least one product.</td></tr>
           <tr><td>C2</td><td>Every product has at least one item.</td></tr>
           <tr><td>C3</td><td>An item's list price is never below its unit cost (database check constraint).</td></tr>
           <tr><td>C4</td><td>Every item has an en_US description.</td></tr>
          </table>
          <p>Job PSL_CATALOG_CHECK checks C1 to C4 every morning at 06:00 and alerts the catalog team when one fails.</p>
    stack_metadata:
      batch.trigger: Control-M PSL_CATALOG_CHECK 06:00 daily
      db.object: CATEGORY, PRODUCT, ITEM, ITEM_DETAILS

  - record_key: CATINT-REQ-0002
    kind: requirement
    capability_key: catalog-data-integrity
    requirement: >
      The daily catalog check SHALL record the total number of categories and the
      total number of items in its log, without judging them against any minimum.
    plain_text: >
      The morning catalog check also notes how many categories and items the
      catalog holds, for information only.
    technical_note: >
      Last two SELECTs of catalog_check.sql, appended to catalog_check.log. Their
      output never matches ^C[1-4] so cannot fail the job. catalog.minCategories=5 and
      catalog.minItems=28 in petstore.properties are not used (see findings).
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place (the SQL comment "Totals for the log" and the queries); nothing
      else restates it.
    risk_class: operational
    basis: >
      catalog_check.sql lines 14-16.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 14
        line_end: 16
        excerpt: |2
          -- Totals for the log
          SELECT COUNT(*) AS categories FROM category;
          SELECT COUNT(*) AS items FROM item;
    stack_metadata:
      batch.trigger: Control-M PSL_CATALOG_CHECK

  - record_key: POP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      GIVEN the catalog tables do not exist when the daily catalog check runs
      WHEN the check detects this
      THEN the system SHALL request a first (non-forced) load of the sample data from
      the running store, and SHALL then run the catalog checks again; if the load
      request fails the job SHALL end with the technical-failure result.
      A catalog whose tables exist but hold no rows SHALL NOT trigger a load.
    plain_text: >
      If the morning check finds the catalog has never been set up, it asks the
      store to load its sample data the normal (non-forced) way and then checks
      again. A catalog that is set up but empty does not trigger a load.
    technical_note: >
      psl_catalog_check.sh greps the ij output for "does not exist" (Derby
      "Table/View ... does not exist") and then curls
      $PSL_STORE_URL/Populate?forcefully=false (curl -sf, failure -> exit 8), then
      reruns catalog_check.sql. The script header and Control-M description say "when
      empty"; the code tests only for missing tables (see suspected defects). What
      the Populate endpoint itself does belongs to the web shard.
    interface: false
    confidence: medium
    confidence_basis: >
      The live condition (missing tables only) is read from one script; the runbook
      3.5 agrees with the code, while the script comment and scheduler description
      say "empty". Graded medium because the two document sources disagree on the
      trigger, even though the code is unambiguous.
    risk_class: operational
    basis: >
      psl_catalog_check.sh lines 9-14; runbook 3.5.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 2
        line_end: 14
        excerpt: |2
          # PSL_CATALOG_CHECK - daily 06:00 before the store opens.
          # Runs the catalog integrity checks. When the catalog is empty it asks the
          # store to populate itself (first load, not a forced reload). Any failed
          # check ends the job with code 4 so operations is alerted.
          PSL_JOB=PSL_CATALOG_CHECK
          . "${PSL_HOME:-/opt/petstore}/conf/env.sh"
          psl_log "start"
          OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          if echo "$OUT" | grep -q "does not exist"; then
            psl_log "catalog tables missing, requesting first load"
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
            OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          fi
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 67
        line_end: 68
        excerpt: |2
          <p>Runs catalog checks C1 to C4 (see the Administrator Guide). If the catalog tables do not exist it calls
          <code>http://localhost:8080/petstore/Populate?forcefully=false</code> to load the sample data, then checks again.
    stack_metadata:
      batch.trigger: Control-M PSL_CATALOG_CHECK
      framework: HTTP GET to the store's Populate servlet

findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
    description: >
      petstore.properties lines 27-29 declare catalog.pageSize=2,
      catalog.minCategories=5 and catalog.minItems=28. The batch catalog check logs
      category and item totals (CATINT-REQ-0002) but compares them with no minimum,
      and no batch script reads these keys. A human must decide whether a minimum
      catalog size was ever a rule the morning check should enforce (5 categories /
      28 items matches the sample data in the admin guide) or is only descriptive.
  - kind: conflict
    record_key: AUDIT-BR-0004
    path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
    description: >
      petstore.properties lines 1-3 say its settings are "Read by the batch scripts
      through conf/env.sh", but env.sh never reads the file: it hard-codes the same
      values (retention 90, backup 7 days, directories, store URL) and the SQL
      hard-codes 90 days and the backup/extract paths again. Today the values agree,
      so behaviour is unaffected; a human should decide which source is
      authoritative for retention and folder settings, because changing the
      properties file today changes nothing (also affects BATCH-BR-0004).
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
    description: >
      Nothing in the batch tree removes old signon_audit_YYYYMMDD.csv or
      signon_report_YYYYMMDD.txt files from the extract folder, nor rotates
      batch.log or the per-job logs. The source does not say whether another system
      (the security team's collector) moves or deletes the extract files. A human
      must state the intended retention of the extract and report files.

suspected_defects:
  - capability_key: catalog-data-integrity
    record_keys: [CATINT-WF-0001]
    severity: high
    category: error-swallowed
    title: Catalog check reports OK when the database cannot be read
    description: >
      The catalog check ignores the failure result of its database step and only
      looks for "does not exist" or a C1-C4 row in the output. When the database
      server is down or refuses the connection, the output holds a connection error,
      neither pattern matches, and the job logs "end OK" and exits 0, so no alert is
      sent and the morning check reads as passed. The same applies to the re-check
      after a sample-data load.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 9
        line_end: 21
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 79
        line_end: 79
  - capability_key: batch-operations
    record_keys: [BATCH-BR-0007, BATCH-BR-0002]
    severity: medium
    category: error-swallowed
    title: Database-step failure is detected only from an upper-case "ERROR" line
    description: >
      The shared helper that runs every SQL step ignores the program's own exit
      status and decides failure only by searching the output for a line starting
      with "ERROR". A failure that prints anything else (for example Java not found,
      or the Derby library missing, which prints "Error: Could not find or load main
      class") is reported as success, so backup, extract, purge, unlock and report
      can all end "OK" having done nothing.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 19
        line_end: 26
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0003, AUDIT-REQ-0001, BATCH-BR-0007]
    severity: medium
    category: error-swallowed
    title: Backup and extract end OK even when the file move fails
    description: >
      After the database step, the backup and the extract rename their output with an
      unchecked move, and the extract then counts lines of a file that may not
      exist. If the move fails (for example the backup or extract folder was
      overridden by the environment while the SQL still writes to the fixed
      /var/petstore path) the job still logs "end OK" and exits 0, so no dated backup
      or no dated extract exists while the chain continues and, on Sunday, the purge
      runs. The runbook says exit 8 covers file errors.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 9
        line_end: 13
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 11
        line_end: 15
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_extract.sql
        line_start: 10
        line_end: 10
