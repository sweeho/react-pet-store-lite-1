    severity: low
    category: contradicts-document
    title: Purge can delete events that were never extracted
    description: >
      The runbook and the purge SQL comment say no row is deleted before it is
      extracted. The purge only checks that the latest extract worked; the extract
      only covers the previous day and is never caught up automatically. A day whose
      extract failed and was not re-run by hand is purged after 90 days without ever
      having been exported.
