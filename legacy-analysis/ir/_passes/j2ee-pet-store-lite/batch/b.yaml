  - record_key: AUDIT-REQ-0001
    kind: requirement
    capability_key: sign-on-audit
    requirement: >
      The system SHALL, daily, export every sign-on audit event timestamped on the
      previous calendar day (from 00:00 inclusive to 00:00 of the run date
      exclusive) to a file named signon_audit_YYYYMMDD.csv (YYYYMMDD = the previous
      day), comma-separated, double-quote delimited, UTF-8, with no header row, in
      ascending event number order, with the columns event number, user name,
      event type, event time and client address.
    plain_text: >
      Every night, all of yesterday's sign-in history is written to a dated file for
      the security team, one line per event, oldest event number first: event
      number, user name, what happened, when, and from where.
    technical_note: >
      psl_audit_extract.sh deletes any stale signon_audit_extract.csv, runs
      audit_extract.sql (SYSCS_UTIL.SYSCS_EXPORT_QUERY to the fixed path
      /var/petstore/extract/signon_audit_extract.csv), then renames it with the
      shell's "yesterday" date. Day window uses the database CURRENT_DATE.
      Re-extracting an older day is a manual edit of the SQL (runbook 4.2).
    interface: true
    confidence: high
    confidence_basis: >
      SQL and script enforce it; the Control-M description, the script header and the
