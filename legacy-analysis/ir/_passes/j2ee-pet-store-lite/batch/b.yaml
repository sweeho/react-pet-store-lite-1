    severity: low
    category: other
    title: On Sundays the purge can consume the condition the report still waits for
    description: >
      The sign-on report and the Sunday purge both wait on the same "extract OK"
      condition, and the purge deletes it when it runs. If the extract finishes after
      02:00 (for example after backup reruns and an extract rerun), both become
      eligible at once; if the purge is submitted first and removes the condition,
      the report for that day is left waiting and is not produced.
    traces:
