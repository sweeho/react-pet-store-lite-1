  - record_key: BATCH-REQ-0002
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL take an online backup of the store database once a day, store it in a
      folder named after the run date (PetStoreDB_YYYYMMDD), replace any backup already taken
      under the same date, and delete dated backups whose modification time is more than
      7 days old.
    plain_text: >
      The store database is copied every night while the store keeps running. Each copy is
      labelled with its date; running it twice on the same day keeps only the newer copy.
      Copies older than a week are deleted.
    technical_note: >
      batch/psl_db_backup.sh calls db/batch/db_backup.sql (SYSCS_UTIL.SYSCS_BACKUP_DATABASE
      into /var/petstore/backup), then renames the resulting PetStoreDB folder to
      PetStoreDB_$STAMP, after deleting any same-date folder. Retention uses
      find -mtime +$PSL_BACKUP_KEEP_DAYS with PSL_BACKUP_KEEP_DAYS=7 from conf/env.sh
      (also batch.backup.keepDays=7 in conf/petstore.properties, which env.sh does not read).
      `find -mtime +7` matches only folders 8 or more whole days old (see suspected defects).
    interface: false
    confidence: high
    confidence_basis: >
      The backup, dated rename and retention are in the script and its SQL. The 7-day value
      also appears in env.sh, petstore.properties, the scheduler job description and the
      runbook. Not lower because the code and documents agree on the behaviour; the exact
      retention boundary is a separate suspected defect, not doubt about the rule.
    risk_class: operational
    basis: >
      Script lines 5-11 and the backup SQL; retention constant in env.sh.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 2
        line_end: 13
        excerpt: |2
          # PSL_DB_BACKUP - daily 01:00. Online Derby backup, keeps 7 days.
          PSL_JOB=PSL_DB_BACKUP
          . "${PSL_HOME:-/opt/petstore}/conf/env.sh"
          STAMP=$(date '+%Y%m%d')
          psl_log "start"
          rm -rf "$PSL_BACKUP_DIR/PetStoreDB"
          psl_ij "$PSL_SQL/db_backup.sql" > /dev/null || { psl_log "FAILED: backup"; exit 8; }
          rm -rf "$PSL_BACKUP_DIR/PetStoreDB_$STAMP"
          mv "$PSL_BACKUP_DIR/PetStoreDB" "$PSL_BACKUP_DIR/PetStoreDB_$STAMP"
          find "$PSL_BACKUP_DIR" -maxdepth 1 -name 'PetStoreDB_*' -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf {} \;
          psl_log "end OK backup=$PSL_BACKUP_DIR/PetStoreDB_$STAMP"
          exit 0
      - path: legacy-source/j2ee-pet-store-lite/db/batch/db_backup.sql
        line_start: 1
        line_end: 3
        excerpt: |2
          -- PSL_DB_BACKUP: online backup of PetStoreDB.
          -- Derby writes /var/petstore/backup/PetStoreDB; the script moves it to a dated folder.
          CALL SYSCS_UTIL.SYSCS_BACKUP_DATABASE('/var/petstore/backup');
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 12
        line_end: 12
        excerpt: |2
          PSL_BACKUP_KEEP_DAYS=7
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.1 PSL_DB_BACKUP"
        line_start: 42
        line_end: 43
        excerpt: |2
          <p>Online backup of PetStoreDB with <code>SYSCS_UTIL.SYSCS_BACKUP_DATABASE</code> (<code>db/batch/db_backup.sql</code>).
          The backup is moved to <code>/var/petstore/backup/PetStoreDB_YYYYMMDD</code>. Backups older than 7 days are deleted.
    stack_metadata:
      batch.trigger: Control-M PSL_DB_BACKUP
      db.object: SYSCS_UTIL.SYSCS_BACKUP_DATABASE
      backup.path: /var/petstore/backup/PetStoreDB_YYYYMMDD

  - record_key: BATCH-REQ-0003
    kind: requirement
    capability_key: batch-operations
    requirement: >
      GIVEN the nightly database backup fails
      WHEN the failure is detected
      THEN the system SHALL rerun the backup up to 2 more times, 10 minutes apart, SHALL send
      an urgent mail to the operations team, and SHALL hold the sign-on audit extract (and so
      the report and purge after it) until a backup succeeds for that day.
    plain_text: >
      If the nightly backup fails it is retried twice, ten minutes apart. Operations get an
      urgent e-mail, and the export of sign-in history waits until a backup works.
    technical_note: >
      PSL_DB_BACKUP in PSL_PETSTORE.xml: CRITICAL="1", MAXRERUN="2", INTERVAL="00010M",
      ON CODE NOTOK -> DOMAIL URGENCY U to psl-ops. PSL_AUDIT_EXTRACT has INCOND
      PSL_DB_BACKUP-OK, which is only set on success. The script ends with exit 8 when ij
      reports an ERROR line.
    interface: false
    confidence: high
    confidence_basis: >
      Declared in the scheduler definition and restated in the runbook section for the job,
      including the mail text "audit extract is held". High because declaration and document agree.
    risk_class: operational
    basis: >
      Scheduler rerun and notification attributes plus the extract's in-condition.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 18
        line_end: 24
        excerpt: |2
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0100" WEEKDAYS="ALL" DAYSCAL="PSL_CAL" MAXRERUN="2" INTERVAL="00010M"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="+" />
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="U" DEST="psl-ops@example.invalid" SUBJECT="PSL_DB_BACKUP failed" MESSAGE="Petstore DB backup failed, audit extract is held" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 8
        line_end: 8
        excerpt: |2
          psl_ij "$PSL_SQL/db_backup.sql" > /dev/null || { psl_log "FAILED: backup"; exit 8; }
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.1 PSL_DB_BACKUP"
        line_start: 44
        line_end: 44
        excerpt: |2
          Critical job: up to 2 reruns 10 minutes apart; on failure Control-M mails psl-ops and PSL_AUDIT_EXTRACT stays waiting.</p>
    stack_metadata:
      batch.trigger: Control-M PSL_DB_BACKUP
      scheduler.maxrerun: 2
      scheduler.rerun_interval: 10M
      alert.dest: psl-ops@example.invalid

  - record_key: BATCH-REQ-0004
    kind: requirement
    capability_key: batch-operations
    requirement: >
      Every batch job SHALL end with exit code 0 on success, 4 when the catalog integrity check
      finds bad catalog data, and 8 on a database or file error, and SHALL write one
      time-stamped line naming the job to the shared batch log when it starts and when it
      ends. A job SHALL treat any database error line reported by the SQL tool as a failure.
    plain_text: >
      Each nightly job reports a result: 0 for "worked", 4 for "the catalog has bad data", 8
      for "a database or file problem". Each job also writes a dated start line and end line
      to one common job log.
    technical_note: >
      conf/env.sh psl_log appends "<timestamp> [<PSL_JOB>] <msg>" to
      $PSL_LOG_DIR/batch.log; psl_ij runs Derby ij and returns 1 when any output line starts
      with ERROR. Every script uses `|| { psl_log "FAILED..."; exit 8; }` after psl_ij;
      psl_catalog_check.sh exits 4 on integrity rows. Runbook section 4 lists the codes.
      Note: psl_catalog_check.sh does not check psl_ij's return code (see suspected defects).
    interface: false
    confidence: high
    confidence_basis: >
      The codes are coded in all six scripts and listed in the runbook exit-code table; the
      log helper is in env.sh and the runbook names batch.log. High because code and
      document agree.
    risk_class: operational
    basis: >
      exit statements in each script; psl_ij/psl_log helpers in env.sh.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 17
        line_end: 31
        excerpt: |2
          # Run a SQL script with Derby ij against the store database.
          # Usage: psl_ij <script.sql>   Fails when ij reports an ERROR line.
          psl_ij() {
            out=$("$JAVA_CMD" -cp "$DERBY_LIB/derbytools-10.14.2.0.jar:$DERBY_LIB/derbyclient-10.14.2.0.jar" \
                  -Dij.connection.psl="$PSL_DB_URL" -Dij.outfile=/dev/stdout \
                  org.apache.derby.tools.ij "$1" 2>&1)
            echo "$out"
            echo "$out" | grep -q "^ERROR" && return 1
            return 0
          }

          # Write a time-stamped line to the job log and stdout.
          psl_log() {
            echo "$(date '+%Y-%m-%d %H:%M:%S') [$PSL_JOB] $*" | tee -a "$PSL_LOG_DIR/batch.log"
          }
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_acct_unlock.sh
        line_start: 5
        line_end: 8
        excerpt: |2
          psl_log "start"
          psl_ij "$PSL_SQL/acct_unlock.sql" >> "$PSL_LOG_DIR/acct_unlock.log" || { psl_log "FAILED"; exit 8; }
          psl_log "end OK"
          exit 0
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 16
        line_end: 21
        excerpt: |2
          if echo "$OUT" | grep -qE "^C[1-4] "; then
            psl_log "FAILED: integrity check found rows"
            exit 4
          fi
          psl_log "end OK"
          exit 0
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "4. Exit codes and recovery"
        line_start: 76
        line_end: 79
        excerpt: |2
           <tr><th>Code</th><th>Meaning</th><th>Action</th></tr>
           <tr><td>0</td><td>OK</td><td>None</td></tr>
           <tr><td>4</td><td>PSL_CATALOG_CHECK found bad catalog data</td><td>Catalog team fixes the data or an administrator reloads the sample data. Rerun the job.</td></tr>
           <tr><td>8</td><td>SQL or file error</td><td>Read <code>batch.log</code> and the job log. Check that Tomcat is up (the Derby network server runs inside it) and that port 1527 answers. Rerun.</td></tr>
    stack_metadata:
      framework: POSIX sh + Derby ij 10.14.2
      log.path: /var/petstore/log/batch.log
      db.url: jdbc:derby://localhost:1527//var/petstore/db/PetStoreDB

  - record_key: BATCH-REQ-0005
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL alert by mail on these batch failures only: a failed database backup
      (urgent, to operations), a failed sign-on audit extract (regular, to security), and a
      catalog integrity check ending with code 4 (urgent, to the catalog team). A failure of
      the sign-on report, the audit purge, the account unlock, or a catalog check ending with
      any code other than 4 SHALL raise no mail.
    plain_text: >
      Operations are e-mailed when the backup fails, security when the sign-in export fails,
      and the catalog team when the morning check finds bad catalog data. Nobody is
      e-mailed when the report, the history clean-up or the account release fails, or when
      the morning check fails for a technical reason.
    technical_note: >
      Only three ON/DOMAIL blocks exist in PSL_PETSTORE.xml: PSL_DB_BACKUP CODE=NOTOK
      URGENCY U psl-ops; PSL_AUDIT_EXTRACT CODE=NOTOK URGENCY R psl-security;
      PSL_CATALOG_CHECK CODE=COMPSTAT=4 URGENCY U psl-catalog. PSL_SIGNON_REPORT,
      PSL_AUDIT_PURGE and PSL_ACCT_UNLOCK have no ON block. The "no mail" half is read from
      the absence of configuration, which is why this is medium.
    interface: false
    confidence: medium
    confidence_basis: >
      The three alerts are declared in one place (the scheduler) and the backup and catalog
      ones are restated in the runbook. The absence of alerts for the other jobs is inferred
      from missing configuration; site-wide Control-M alerting outside this export could
      exist and cannot be seen here.
    risk_class: operational
    basis: >
      ON/DOMAIL blocks in the scheduler export and their absence on the other jobs.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 36
        line_end: 38
        excerpt: |2
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="R" DEST="psl-security@example.invalid" SUBJECT="PSL_AUDIT_EXTRACT failed" MESSAGE="Sign-on audit extract not produced" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 69
        line_end: 71
        excerpt: |2
                <ON STMT="*" CODE="COMPSTAT=4">
                  <DOMAIL URGENCY="U" DEST="psl-catalog@example.invalid" SUBJECT="Petstore catalog integrity check failed" MESSAGE="See /var/petstore/log/catalog_check.log" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 22
        line_end: 24
        excerpt: |2
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="U" DEST="psl-ops@example.invalid" SUBJECT="PSL_DB_BACKUP failed" MESSAGE="Petstore DB backup failed, audit extract is held" />
                </ON>
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.5 PSL_CATALOG_CHECK"
        line_start: 69
        line_end: 69
        excerpt: |2
          Exit code 4 means a check found rows; Control-M mails psl-catalog. Details are in <code>/var/petstore/log/catalog_check.log</code>.</p>
    stack_metadata:
      batch.trigger: Control-M ON/DOMAIL
      alert.psl_db_backup: psl-ops@example.invalid (U)
      alert.psl_audit_extract: psl-security@example.invalid (R)
      alert.psl_catalog_check: psl-catalog@example.invalid (U, COMPSTAT=4 only)

  - record_key: BATCH-REQ-0006
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The sign-on audit extract and the sign-on report SHALL always cover the calendar day
      before the run date; a rerun on the same day SHALL overwrite that day's file. The
      extract SHALL be rerun automatically at most once on failure. Re-extracting an older
      day SHALL require running the export by hand with changed dates.
    plain_text: >
      The sign-in export and the daily report always cover yesterday. Running either again
      the same day replaces the file. A failed export is retried once automatically; to
      export an older day someone has to do it by hand.
    technical_note: >
      Both scripts compute DAY with `date -d yesterday` and their SQL uses CURRENT_DATE - 1
      day .. CURRENT_DATE; neither takes a date argument. PSL_AUDIT_EXTRACT has MAXRERUN="1";
      PSL_SIGNON_REPORT has no MAXRERUN. Runbook 4.2 states the manual procedure.
    interface: false
    confidence: high
    confidence_basis: >
      The fixed "yesterday" window is coded in both scripts and both SQL files, and the
      runbook states the rerun limitation explicitly. High because code and document agree.
    risk_class: operational
    basis: >
      Date computation in the scripts, date window in the SQL, MAXRERUN on the extract.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 6
        line_end: 7
        excerpt: |2
          DAY=$(date -d yesterday '+%Y%m%d' 2>/dev/null || date -v-1d '+%Y%m%d')
          OUT="$PSL_EXTRACT_DIR/signon_audit_$DAY.csv"
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_signon_report.sh
        line_start: 6
        line_end: 9
        excerpt: |2
          DAY=$(date -d yesterday '+%Y%m%d' 2>/dev/null || date -v-1d '+%Y%m%d')
