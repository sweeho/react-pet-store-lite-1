  # ------------------------------------------------------------------ catalog-data-integrity
  - record_key: CAT-WF-0001
    kind: workflow
    capability_key: catalog-data-integrity
    requirement: >
      Every day at 06:00 the system SHALL run the catalog checks C1 to C4, append their
      results and the counts of categories and items to the catalog check log, and end with
      code 4 when any check finds a violating row, which SHALL raise an urgent mail to the
      catalog team; otherwise it SHALL end with code 0.
    plain_text: >
      Every morning before the store opens the catalog is checked against four rules. The
      results, with the number of categories and items, go to a log, and the catalog team
      is e-mailed if any rule is broken.
    technical_note: >
      batch/psl_catalog_check.sh runs db/batch/catalog_check.sql, appends the whole ij output
      to $PSL_LOG_DIR/catalog_check.log, and exits 4 when any output line matches
      ^C[1-4] (a violating row tagged with its check id). Control-M mails psl-catalog on
      COMPSTAT=4. The category and item counts are logged only; nothing compares them with
      a minimum (see findings).
    interface: false
    confidence: high
    confidence_basis: >
      Coded in the script and SQL, declared in the scheduler, and described in the runbook
      3.5 and admin guide 3.3. High because code, schedule and documents agree.
    risk_class: operational
    basis: >
      Script lines 9-21; catalog_check.sql; scheduler ON COMPSTAT=4.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 9
        line_end: 21
        excerpt: |2
          OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          if echo "$OUT" | grep -q "does not exist"; then
            psl_log "catalog tables missing, requesting first load"
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
            OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          fi
          echo "$OUT" >> "$PSL_LOG_DIR/catalog_check.log"
          if echo "$OUT" | grep -qE "^C[1-4] "; then
            psl_log "FAILED: integrity check found rows"
            exit 4
          fi
          psl_log "end OK"
          exit 0
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 14
        line_end: 16
        excerpt: |2
          -- Totals for the log
          SELECT COUNT(*) AS categories FROM category;
          SELECT COUNT(*) AS items FROM item;
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "3.3 Catalog data rules"
        line_start: 99
        line_end: 99
        excerpt: |2
