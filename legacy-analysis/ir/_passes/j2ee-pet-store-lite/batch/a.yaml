  # ------------------------------------------------------------------ sample-data-population
  - record_key: POP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      GIVEN the catalog tables do not exist when the 06:00 catalog check runs
      WHEN the check reports a missing table
      THEN the system SHALL request a first (not forced) load of the sample data from the
      store, SHALL end with code 8 if that request fails, and otherwise SHALL run the
      catalog checks again on the loaded data.
    plain_text: >
      If the morning catalog check finds that the store has no catalog at all, it asks the
      store to load its sample catalog and accounts, then checks again. If the load fails,
      the job fails.
    technical_note: >
      psl_catalog_check.sh greps the ij output for "does not exist" and calls
      $PSL_STORE_URL/Populate?forcefully=false with curl -sf (no sign-in). PopulateServlet
      with force=false drops, recreates and reloads every table, including SIGNON and
      SIGNON_AUDIT, unless both the catalog and user checks pass. Tables that exist but are
      empty do not trigger this path (see suspected defects). Section 3.1 of the admin
      guide describes the same first-load behaviour from the store's home page.
    interface: false
    confidence: high
    confidence_basis: >
      Coded in the script and described in runbook 3.5 and the scheduler description;
      the servlet behaviour it triggers was read directly. High because code and document
      agree on the trigger and the call.
    risk_class: operational
    basis: >
      Script lines 10-14; PopulateServlet.doPost/populate.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 10
        line_end: 14
        excerpt: |2
          if echo "$OUT" | grep -q "does not exist"; then
            psl_log "catalog tables missing, requesting first load"
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
            OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          fi
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 162
        line_end: 172
        excerpt: |2
                if (!forcefully) {
                  try {
                    alreadyPopulated = catalogPopulator.check(connection) && userPopulator.check(connection);
                  } catch (PopulateException exception) {}
                  //System.err.println("Already populated: " + alreadyPopulated);
                }
                if (forcefully || !alreadyPopulated) {
                  catalogPopulator.dropTables(connection);
                  userPopulator.dropTables(connection);
                  catalogPopulator.createTables(connection);
                  userPopulator.createTables(connection);
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.5 PSL_CATALOG_CHECK"
        line_start: 67
        line_end: 68
        excerpt: |2
          <p>Runs catalog checks C1 to C4 (see the Administrator Guide). If the catalog tables do not exist it calls
          <code>http://localhost:8080/petstore/Populate?forcefully=false</code> to load the sample data, then checks again.
    stack_metadata:
      batch.trigger: Control-M PSL_CATALOG_CHECK
      http.endpoint: GET /petstore/Populate?forcefully=false

findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
    description: >
      catalog.minCategories=5 and catalog.minItems=28 (lines 28-29) suggest a minimum
      catalog size, and the catalog check logs the category and item counts
      (catalog_check.sql lines 15-16), but nothing compares the counts with these minimums
      and no document states such a rule. A human should decide whether a minimum catalog
      size is a requirement; no record was emitted for it.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
    description: >
      The header (lines 1-3) says the file is "Read by the batch scripts through
      conf/env.sh", but env.sh never reads it: it hard-codes the same folders, retention
      days and URL, and the SQL files hard-code 90 days, 30 minutes and the backup/extract
      folders again. It cannot be told from the source which copy is authoritative when
      they differ. Today all copies hold the same values.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/batch/psl_signon_report.sh
    description: >
      The daily sign-on report file is written to the extract folder, but no source or
      document says who reads it or whether another system consumes it. That decides
      whether it is an interface whose layout must be preserved; AUD-REQ-0002 leaves
      interface unstated.

suspected_defects:
  - capability_key: catalog-data-integrity
    record_keys: [CAT-WF-0001, BATCH-REQ-0004]
    severity: high
    category: error-swallowed
    title: Catalog check reports success when the database cannot be queried
    description: >
      The catalog check ignores whether its database queries succeeded. If the database is
      unreachable or any query fails for a reason other than a missing table, no violating
      rows are printed, so the job logs "end OK" and ends with code 0. No alert is raised and
      the morning check is recorded as passed although nothing was checked. The other
      batch jobs end with code 8 in the same situation.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 9
        line_end: 21
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 19
        line_end: 26

  - capability_key: catalog-data-integrity
    record_keys: [CAT-WF-0001, POP-WF-0001]
    severity: medium
    category: contradicts-document
    title: An empty catalog passes the morning check and is not loaded
    description: >
      The script header and the scheduler description say the first load happens "when the
      catalog is empty", but the load is triggered only when the catalog tables are missing.
      If the tables exist with no rows, checks C1 to C4 find nothing to report and the job
      ends OK with zero categories and items. The runbook describes the code's behaviour
      ("if the catalog tables do not exist"), so the two documents disagree with each other.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 3
        line_end: 14
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 63
        line_end: 63
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.5 PSL_CATALOG_CHECK"
        line_start: 67
        line_end: 68

  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0005, POP-WF-0001]
    severity: medium
    category: other
    title: Several batch failures alert nobody
    description: >
      The critical 06:00 catalog job alerts only on code 4. When its first-load request
      fails, the job ends with code 8 and no mail is sent. The sign-on report, the weekly
      audit purge and the 15-minute account unlock have no failure notification at all.
      The runbook tells operators to read the logs and rerun on code 8, but nothing tells
      them a code 8 happened.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 41
        line_end: 85
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 12
        line_end: 12
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "4. Exit codes and recovery"
        line_start: 79
        line_end: 79

  - capability_key: sign-on-audit
    record_keys: [AUD-INT-0001]
    severity: medium
    category: error-swallowed
    title: Extract can deliver a trailer-only file and report success
    description: >
      The export always writes to a fixed folder (/var/petstore/extract), but the script
      looks for the file in its configurable extract folder. The script also does not check
      the rename or the line count. If the export file is not where the script expects
      (for example, the extract folder is changed), the rename fails. The script then
      appends "TRAILER,<day>," to a new file with an empty count and ends OK, so the security
      team gets a file with no events and no alert is sent.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 9
        line_end: 15
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_extract.sql
        line_start: 10
        line_end: 10
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 8
        line_end: 8

  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0002]
    severity: medium
    category: error-swallowed
    title: Backup folder is fixed in the SQL while the script's is configurable
    description: >
      The database writes the backup to a fixed folder (/var/petstore/backup), but the
      script renames and prunes in its configurable backup folder and does not check the
      rename. If the folder setting differs from the fixed path, the job reports
      "end OK backup=..." for a dated backup that does not exist.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 7
        line_end: 12
      - path: legacy-source/j2ee-pet-store-lite/db/batch/db_backup.sql
        line_start: 3
        line_end: 3
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 7
        line_end: 7

  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0002]
    severity: low
    category: contradicts-document
    title: Backups are kept about 8 days, not 7
    description: >
      The runbook and job description say backups older than 7 days are deleted. The prune
      deletes only folders whose age is more than 7 whole days (8 or more), so after each
      run about 8 to 9 dated backups remain rather than 7.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.1 PSL_DB_BACKUP"
        line_start: 43
        line_end: 43

  - capability_key: sign-on-audit
    record_keys: [AUD-BR-0004, LOCK-BR-0001]
    severity: low
    category: data-corruption
    title: An account can be unlocked without an ACCOUNT_UNLOCKED audit event
    description: >
      The audit insert and the unlock update are separate statements, and each takes the
      current time on its own. An account whose lock passes the 30-minute mark between the
      two statements is not in the audit insert but is unlocked by the update. The account
      is then released with no ACCOUNT_UNLOCKED event in the sign-on history.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 6
        line_end: 15

  - capability_key: sign-on-audit
    record_keys: [AUD-REQ-0002, BATCH-WF-0001]
    severity: low
    category: other
    title: Sunday purge can stop the sign-on report from running
    description: >
      On Sundays the purge removes the "extract succeeded" condition that the sign-on report
      also waits for. If the extract finishes late, after 02:00 (for example after backup
      reruns), the report and the purge become eligible together. If the purge runs first,
      the report's condition is gone and that day's report is never produced. That job has
      no alert.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 47
        line_end: 58

  - capability_key: sample-data-population
    record_keys: [POP-WF-0001]
    severity: medium
    category: data-corruption
    title: Automatic first load from the morning check wipes accounts and sign-on history
    description: >
      When the catalog tables are missing, the 06:00 job asks for a first load. A first load
      drops and recreates every table, including customer accounts and the sign-on
      audit, whenever the catalog or account check fails. If only the catalog tables are
      lost, the unattended job deletes all accounts and sign-in history. This includes events
      not yet past their 90-day retention or not yet exported. The admin guide warns to take
      a backup before a manual reload, but no backup is taken before this automatic one.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 10
        line_end: 12
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 162
        line_end: 172
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "3.1 First load"
        line_start: 76
        line_end: 77

  - capability_key: sign-on-audit
    record_keys: [AUD-BR-0003]
    severity: low
    category: other
    title: Audit retention setting does not control the purge
    description: >
      The 90-day retention is set in conf/env.sh and petstore.properties and printed in the
      purge job's log, but the purge deletes using a fixed 90 written in its own query.
      Changing the setting changes the log line, not what is deleted.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_purge.sh
        line_start: 6
        line_end: 7
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 5
        line_end: 6
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 11
        line_end: 11
