# SX-0001 extract-a, shard j2ee-pet-store-lite/batch
# Scope: legacy-source/j2ee-pet-store-lite/batch/*.sh, read together with the
# files they execute or are scheduled by (conf/env.sh, db/batch/*.sql,
# scheduler/control-m/PSL_PETSTORE.xml) and the operations/admin/user guides.
# No legacy-analysis/sources/**/extracted.md exists in this tree; the HTML guides
# under legacy-source/j2ee-pet-store-lite/docs/guides are cited directly as
# document traces, with an anchor naming the section heading.
records:

  # ------------------------------------------------------------------ batch-operations
  - record_key: BATCH-WF-0001
    kind: workflow
    capability_key: batch-operations
    requirement: >
      The system SHALL run the nightly job chain in this order: database backup daily at
      01:00; sign-on audit extract daily from 01:30, only after that day's backup has
      succeeded; sign-on statistics report daily from 01:45, only after that day's extract
      has succeeded; sign-on audit purge on Sundays from 02:00, only after that day's
      extract has succeeded. The catalog integrity check SHALL run daily at 06:00 and the
      account unlock SHALL run every 15 minutes from 00:00 to 23:59, both independent of the chain.
    plain_text: >
      Every night the store first backs up its database at 1:00. Only when the backup
      worked does it export yesterday's sign-in history (from 1:30). Only when that export
      worked does it produce the daily sign-in report (from 1:45) and, on Sundays, delete
      old sign-in history (from 2:00). Separately, the catalog is checked every morning at
      6:00, and locked accounts are released every 15 minutes, all day.
    technical_note: >
      Control-M export scheduler/control-m/PSL_PETSTORE.xml, folder PSL_PETSTORE_DAILY:
      PSL_DB_BACKUP (TIMEFROM 0100) sets PSL_DB_BACKUP-OK; PSL_AUDIT_EXTRACT (0130) waits on
      and consumes it, sets PSL_AUDIT_EXTRACT-OK; PSL_SIGNON_REPORT (0145) and PSL_AUDIT_PURGE
      (0200, WEEKDAYS=0) wait on PSL_AUDIT_EXTRACT-OK; PSL_CATALOG_CHECK (0600) has no
      in-condition. Folder PSL_PETSTORE_CYCLIC: PSL_ACCT_UNLOCK cyclic, interval 15 min.
      The same order is restated in each script header and in the runbook schedule table.
    interface: false
    confidence: high
    confidence_basis: >
      Stated in three independent places that agree: the scheduler definition
      (times, weekdays and in/out conditions), the header comment of each batch script,
      and the operations runbook schedule table and diagram. Graded high and not lower
      because all three match exactly.
    risk_class: operational
    basis: >
      The scheduler in/out conditions make each step wait for the previous step's success
      condition; times and weekdays come from TIMEFROM / WEEKDAYS.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 15
        line_end: 35
        excerpt: |2
              <JOB JOBISN="1" APPLICATION="PETSTORE" SUB_APPLICATION="DATABASE" JOBNAME="PSL_DB_BACKUP"
                   DESCRIPTION="Online backup of PetStoreDB, keep 7 days"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_db_backup.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0100" WEEKDAYS="ALL" DAYSCAL="PSL_CAL" MAXRERUN="2" INTERVAL="00010M"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="+" />
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="U" DEST="psl-ops@example.invalid" SUBJECT="PSL_DB_BACKUP failed" MESSAGE="Petstore DB backup failed, audit extract is held" />
                </ON>
              </JOB>

              <JOB JOBISN="2" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_EXTRACT"
                   DESCRIPTION="Export yesterday SIGNON_AUDIT rows to signon_audit_YYYYMMDD.csv"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_extract.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AB"
                   TIMEFROM="0130" WEEKDAYS="ALL" MAXRERUN="1"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 41
        line_end: 68
        excerpt: |2
              <JOB JOBISN="3" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_SIGNON_REPORT"
                   DESCRIPTION="Daily sign-on statistics report"
                   TASKTYPE="Command" CMDLINE="/opt/petstore/batch/psl_signon_report.sh"
