  - record_key: AUD-BR-0003
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL, once a week on Sunday and only after that day's audit extract has
      succeeded, permanently delete every sign-on audit event whose timestamp is before
      midnight at the start of the day 90 days before the run date.
    plain_text: >
      Sign-in history is kept for 90 days. Every Sunday, after that day's export has been
      made, older events are deleted for good.
    technical_note: >
      db/batch/audit_purge.sql: DELETE FROM signon_audit WHERE event_ts <
      CURRENT_DATE - 90 days (as a timestamp), in one transaction. The 90 is a literal in the
      SQL; PSL_AUDIT_RETENTION_DAYS=90 in conf/env.sh is only printed in the start log line,
      and batch.audit.retentionDays=90 in petstore.properties is not read. Because it runs
      weekly, events can be kept up to 96 days before deletion.
    interface: false
    confidence: high
    confidence_basis: >
      The 90-day cut-off is in the purge SQL and is restated in env.sh, petstore.properties,
      the DDL comment on SIGNON_AUDIT, the scheduler description and the runbook; the
      Sunday schedule and extract dependency are declared in the scheduler. High because
      every source agrees on the value.
    risk_class: regulated
    basis: >
      Purge SQL date predicate; scheduler WEEKDAYS="0" and INCOND PSL_AUDIT_EXTRACT-OK.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 1
        line_end: 8
        excerpt: |2
          -- PSL_AUDIT_PURGE: delete sign-on audit events older than 90 days.
          -- Runs only after PSL_AUDIT_EXTRACT so every row has been extracted first.
          AUTOCOMMIT OFF;

          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};

          COMMIT;
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_purge.sh
        line_start: 2
        line_end: 7
        excerpt: |2
          # PSL_AUDIT_PURGE - weekly Sunday 02:00 after PSL_AUDIT_EXTRACT.
          # Deletes SIGNON_AUDIT rows older than 90 days.
          PSL_JOB=PSL_AUDIT_PURGE
          . "${PSL_HOME:-/opt/petstore}/conf/env.sh"
          psl_log "start retention=${PSL_AUDIT_RETENTION_DAYS}d"
          psl_ij "$PSL_SQL/audit_purge.sql" >> "$PSL_LOG_DIR/audit_purge.log" || { psl_log "FAILED"; exit 8; }
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 11
        line_end: 11
        excerpt: |2
          PSL_AUDIT_RETENTION_DAYS=90
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.4 PSL_AUDIT_PURGE"
        line_start: 64
        line_end: 64
        excerpt: |2
          <p>Sundays only. Deletes SIGNON_AUDIT rows older than 90 days. It waits for that day's extract so no row is deleted before it is extracted.</p>
    stack_metadata:
      batch.trigger: Control-M PSL_AUDIT_PURGE (WEEKDAYS=0, 02:00)
      db.object: SIGNON_AUDIT

  - record_key: AUD-BR-0004
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      WHEN the automatic unlock releases an account
      THEN the system SHALL record an ACCOUNT_UNLOCKED audit event for that user name with
      the time of the unlock and the client address "batch:PSL_ACCT_UNLOCK", committed in
      the same transaction as the unlock.
    plain_text: >
      Every time the store automatically releases a locked account it records that in the
      sign-in history, marked as done by the automatic job rather than by a person.
    technical_note: >
      db/batch/acct_unlock.sql inserts into signon_audit from signon with the same WHERE
      clause as the following UPDATE, under AUTOCOMMIT OFF and a final COMMIT; if ij reports
      an ERROR the script exits 8 before COMMIT. The marker value is the string literal
      'batch:PSL_ACCT_UNLOCK' in remote_addr. The INSERT and UPDATE each evaluate
      CURRENT_TIMESTAMP separately (see suspected defects).
    interface: false
    confidence: high
    confidence_basis: >
      Coded in the unlock SQL and documented in the runbook (3.6 and the extract column
      table), the admin guide rule R5 and the user guide event table. High because code and
      three documents agree.
    risk_class: regulated
    basis: >
      INSERT ... SELECT in acct_unlock.sql.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 4
        line_end: 17
        excerpt: |2
          AUTOCOMMIT OFF;

          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr)
            SELECT username, 'ACCOUNT_UNLOCKED', CURRENT_TIMESTAMP, 'batch:PSL_ACCT_UNLOCK'
              FROM signon
             WHERE locked = 'Y'
               AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};

          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};

          COMMIT;
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.6 PSL_ACCT_UNLOCK"
        line_start: 72
        line_end: 72
        excerpt: |2
          <p>Every 15 minutes. Unlocks accounts locked more than 30 minutes ago, resets their failed attempts and writes ACCOUNT_UNLOCKED to the audit.</p>
    stack_metadata:
      batch.trigger: Control-M PSL_ACCT_UNLOCK
      db.object: SIGNON, SIGNON_AUDIT

  # ------------------------------------------------------------------ account-lockout
  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      Every 15 minutes, all day, the system SHALL unlock every locked account whose lock was
      set strictly more than 30 minutes before the run, setting its failed sign-in count to 0
      and clearing its lock time. An account SHALL therefore stay locked for more than 30 and
      up to about 45 minutes.
    plain_text: >
      A locked account is released automatically once it has been locked for more than 30
      minutes. The store checks every 15 minutes, so a customer may wait up to about 45
      minutes. On release the count of failed attempts starts again from zero.
    technical_note: >
      UPDATE signon SET locked='N', failed_attempts=0, locked_ts=NULL WHERE locked='Y' AND
      locked_ts < CURRENT_TIMESTAMP - 30 minutes (db/batch/acct_unlock.sql), run by
      batch/psl_acct_unlock.sh from the Control-M cyclic job (interval 15 min). The 30 is a
      SQL literal; signon.unlockAfterMinutes=30 in petstore.properties is not read by the
      batch. An account with locked='Y' and a NULL locked_ts is never unlocked by this job.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in the unlock SQL and the cyclic schedule; the same 30-minute / 15-minute
      values appear in petstore.properties, the SIGNON DDL comment, the admin guide rule R5
      and the user guide (which states up to 45 minutes). High because code, configuration
      and documents agree.
    risk_class: operational
    basis: >
      UPDATE predicate in acct_unlock.sql; INTERVAL="00015M" on PSL_ACCT_UNLOCK.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 1
        line_end: 3
        excerpt: |2
          -- PSL_ACCT_UNLOCK: unlock sign-on accounts locked for more than 30 minutes.
          -- Business rule: 3 failed sign-ons in a row lock an account (UserDAO).
          -- A lock is cleared automatically 30 minutes after it was set.
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 15
        excerpt: |2
          UPDATE signon
