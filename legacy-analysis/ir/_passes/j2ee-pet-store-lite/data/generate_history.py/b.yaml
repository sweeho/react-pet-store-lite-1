records:
  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock an account when its third consecutive sign-on with a wrong password
      fails, recording the failed attempt and then an account-locked event, and SHALL reset the
      consecutive-failure count to zero on a successful sign-on.
      GIVEN an account with two consecutive failed sign-ons WHEN a third sign-on fails THEN the
      account is locked, the lock time is recorded, and a sign-on failure event followed by an
      account-locked event is written to the sign-on audit trail.
    plain_text: >
      Three wrong passwords in a row lock the account. A successful sign-in clears the count of
      wrong attempts.
    technical_note: >
      Enforced in UserDAO.authenticate (MAX_FAILED_ATTEMPTS = 3; UPDATE_FAILURE sets locked='Y' and
      locked_ts; UPDATE_SUCCESS resets failed_attempts = 0). The synthetic history generator
      data/generate_history.py models the same rule: after 3 SIGNON_FAIL events it emits
      ACCOUNT_LOCKED, and the two accounts left locked at period end are written with
      failed_attempts=3, locked='Y', locked_ts set. The schema comment on SIGNON says the same thing.
    interface: false
    confidence: high
    confidence_basis: >
      Production code (UserDAO), the schema comment and the generator's docstring and logic all
      state 3 consecutive failures. The generator is test tooling, so it corroborates the rule but
      does not enforce it.
    risk_class: regulated
    basis: >
      The generator docstring states "3 failures in a row lock an account"; lines 65-69 and 86-89
      emit three SIGNON_FAIL then ACCOUNT_LOCKED; UserDAO lines 141-153 enforce it.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 1
        line_end: 6
        excerpt: |
          """Generate 90 days of synthetic sign-on history for Petstore Lite.

          Writes data/seed/signon_history.sql: extra customer accounts and SIGNON_AUDIT
          events that follow the application rules (3 failures in a row lock an account,
          PSL_ACCT_UNLOCK clears the lock 30+ minutes later, a sign-on usually ends in a
          sign-off). Deterministic: the same seed gives the same file.
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 65
        line_end: 69
        excerpt: |
