findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
    description: >
      This file is a developer/demo data generator that no runtime path, batch job or schedule calls.
      Its rules duplicate production rules (UserDAO, acct_unlock.sql). The records above cite it as
      corroboration. A human should decide whether SEED-REQ-0001 (demo history) belongs in the
      target specification at all. No document sources (legacy-analysis/sources/**/extracted.md) exist
      in this tree, so no document traces were possible.

suspected_defects:
  - capability_key: account-lockout
    record_keys: [LOCK-BR-0002]
    severity: low
    category: other
    title: Synthetic unlock time can be 15 minutes later than the real job would unlock
    description: >
      The generator rounds the unlock time up to the next quarter hour after lock+30 minutes. When
      lock+30 minutes already falls exactly on a quarter-hour minute, it still adds a full 15
      minutes. The real job runs every 15 minutes from its start time, not on wall-clock quarter
      hours, and clears locks older than 30 minutes. The demo history can therefore show unlock
      delays that do not match the live behaviour. Only the test data is affected.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 72
        line_end: 74
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 78
        line_end: 83
  - capability_key: sample-data-population
    record_keys: [SEED-REQ-0001]
    severity: low
    category: other
    title: Generated accounts carry plain-text passwords in a committed file
    description: >
      The generator writes customer passwords in clear text into a seed SQL file that is committed
      to the repository. This matches how the live table stores passwords (plain varchar), so it
      reproduces the legacy practice. The vortex README warns about plain-text passwords in the
      migration extracts.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 38
        line_end: 38
