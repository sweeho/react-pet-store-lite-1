findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
    description: >
      The generated history only models sessions that end in a successful sign-in (a sign-off follows
      70% of the time). Whether that 70% / 12-19% failure mix reflects production behaviour is not
      a requirement; it is synthetic. No document sources (legacy-analysis/sources) exist to check it.

suspected_defects:
  - capability_key: account-registration
    record_keys: [SAMPLE-WF-0001, ACCT-BR-0001]
    severity: low
    category: data-corruption
    title: Sample accounts use user names that registration would reject
    description: >
      The generator builds user names that can contain a '.', but self-registration only allows
      letters, digits, '-' and '_'. In the committed data set 17 of the 40 generated accounts contain
      a '.', so the sample store holds accounts no customer could have created.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 32
        line_end: 35
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 107
        line_end: 112
  - capability_key: sign-on
    record_keys: [SAMPLE-WF-0001]
    severity: low
    category: other
    title: Never-signed-in sample accounts get a last sign-in time
    description: >
      A generated account that never signs in is written with its last sign-in time equal to its
      creation time. The application leaves the last sign-in time empty until the first successful
      sign-in, so such accounts look as if they had signed in at creation.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 48
        line_end: 48
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 97
        line_end: 98
