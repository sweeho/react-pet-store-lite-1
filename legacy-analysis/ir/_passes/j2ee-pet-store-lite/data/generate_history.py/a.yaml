# Pass A — legacy-source/j2ee-pet-store-lite/data/generate_history.py
# The module is an offline developer tool that writes data/seed/signon_history.sql.
# It is not part of the running application; its records state the rules the
# generated data is built to follow, each corroborated against the production code.
# No legacy-analysis/sources/**/extracted.md exists in this tree, so there are no
# document trace pointers; the guides cited are HTML under legacy-source/.
records:
  - record_key: SAMPLE-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      The system SHALL provide an optional, repeatable sign-on history data set, loaded only
      after the first catalog/account load, that adds 40 extra CUSTOMER accounts and 90 days of
      sign-on audit events ending on a chosen end date (default 2026-10-30), and SHALL produce
      the identical data set every time for the same end date.
    plain_text: >
      For demos and testing, the store can be given three months of realistic sign-in history:
      40 extra customer accounts and their sign-ins, failures, lockouts and sign-outs. It is
      loaded after the store's first data load, and regenerating it gives exactly the same data.
    technical_note: >
      data/generate_history.py uses random.Random(SEED=1302), DAYS=90 and a default end of
      datetime(2026,10,30) (overridable by argv[1]) to write data/seed/signon_history.sql: INSERTs into
      signon and signon_audit inside AUTOCOMMIT OFF ... COMMIT, plus UPDATEs of created_ts/last_signon
      for the built-in accounts j2ee, shopper, admin. README says to load it with psl_ij after the
      first populate. The committed SQL header confirms 40 accounts, 1686 events, 2026-08-01 to 2026-10-30.
    interface: false
    confidence: high
    confidence_basis: >
      The generator code states the counts, seed and window, and the committed output file and
      README both corroborate them. Not graded higher-risk because this is tooling, not runtime.
    risk_class: operational
    basis: >
      Module docstring, constants SEED/DAYS, the 40-user loop and the file writer; README "Load 90 days
      of sign-on history after the first load".
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 1
        line_end: 16
        excerpt: |
          """Generate 90 days of synthetic sign-on history for Petstore Lite.

          Writes data/seed/signon_history.sql: extra customer accounts and SIGNON_AUDIT
          events that follow the application rules (3 failures in a row lock an account,
          PSL_ACCT_UNLOCK clears the lock 30+ minutes later, a sign-on usually ends in a
          sign-off). Deterministic: the same seed gives the same file.

          Usage: python3 data/generate_history.py [end-date YYYY-MM-DD]
          """
          import random
          import sys
          from datetime import datetime, timedelta
          from pathlib import Path

          SEED = 1302
          DAYS = 90
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 24
        line_end: 31
        excerpt: |
              rnd = random.Random(SEED)
              end = datetime.strptime(sys.argv[1], "%Y-%m-%d") if len(sys.argv) > 1 else datetime(2026, 10, 30)
              start = end - timedelta(days=DAYS)
              out = Path(__file__).parent / "seed" / "signon_history.sql"
              out.parent.mkdir(exist_ok=True)

              users = {}
              while len(users) < 40:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 95
        line_end: 97
        excerpt: |
                  f.write("-- Generated by data/generate_history.py (seed %d). %d accounts, %d audit events, %s to %s.\n"
                          % (SEED, len(accounts), len(events), start.date(), end.date()))
                  f.write("-- Load after the first populate: ij data/seed/signon_history.sql\nAUTOCOMMIT OFF;\n\n")
      - path: legacy-source/j2ee-pet-store-lite/README.md
        line_start: 35
        line_end: 40
        excerpt: |
          Load 90 days of sign-on history after the first load:

          ```sh
          docker cp data/seed/signon_history.sql psl:/tmp/h.sql
          docker exec psl sh -c '. /opt/petstore/conf/env.sh; psl_ij /tmp/h.sql'
          ```
    stack_metadata:
      framework: python-script
      job.entrypoint: python3 data/generate_history.py [end-date]
      db.model: signon, signon_audit
      random.seed: 1302

  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock an account on the third consecutive failed sign-in and SHALL record
      one failed-sign-in event per failure followed by an account-locked event at the time of the
      third failure.
    plain_text: >
      Three wrong passwords in a row lock the account. Each wrong attempt is logged, and the lock
      itself is logged as a separate event.
    technical_note: >
      The generator emits 1-3 SIGNON_FAIL events per session and, only when there are 3, an
      ACCOUNT_LOCKED event (generate_history.py 65-69, and the end-of-period locks at 83-89 which set
      failed_attempts=3, locked='Y', locked_ts). Production: UserDAO.MAX_FAILED_ATTEMPTS = 3 and
      authenticate() sets locked='Y' and locked_ts=now and audits SIGNON_FAIL then ACCOUNT_LOCKED.
      Admin guide rule R3 states the same.
    interface: false
    confidence: high
    confidence_basis: >
      Encoded in the generator and independently enforced in UserDAO.authenticate and stated in the
      admin guide (R3) and schema comment.
    risk_class: regulated
    basis: >
      The generator's lock condition (fails == 3) and the final-state update mirror UserDAO's
      failedAttempts >= MAX_FAILED_ATTEMPTS lock and its audit order.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 65
        line_end: 69
        excerpt: |
                      for _ in range(fails):
                          events.append((ts, name, "SIGNON_FAIL", ip))
                          ts += timedelta(seconds=rnd.randint(8, 60))
                      if fails == 3:
                          events.append((ts, name, "ACCOUNT_LOCKED", ip))
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 86
        line_end: 89
        excerpt: |
                  for i in range(3):
                      events.append((ts + timedelta(seconds=20 * i), name, "SIGNON_FAIL", ip))
                  events.append((ts + timedelta(seconds=60), name, "ACCOUNT_LOCKED", ip))
                  accounts[name].update(failed=3, locked="Y", locked_ts=ts + timedelta(seconds=60))
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 69
        line_end: 69
        excerpt: |
              public static final int MAX_FAILED_ATTEMPTS = 3;
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 52
        line_end: 52
        excerpt: |
           <tr><td>R3</td><td>The 3rd failure in a row locks the account (LOCKED = Y) and records the time of the lock.</td></tr>
    stack_metadata:
      framework: python-script
      db.model: signon.failed_attempts, signon.locked, signon.locked_ts

  - record_key: LOCK-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock a locked account at the first scheduled unlock run
      (runs every 15 minutes on the quarter hour) that is strictly more than 30 minutes after the
      lock, and SHALL record an account-unlocked event whose source address identifies the unlock
      job rather than a client.
    plain_text: >
      A locked account unlocks itself: a job every quarter of an hour releases any lock older than
      30 minutes, so a lock lasts between 30 and 45 minutes. The release is logged as done by the job.
    technical_note: >
      The generator places ACCOUNT_UNLOCKED at lock+30 min rounded up to the next quarter hour
      (always strictly later, since a minute%15==0 still adds 15) with remote_addr
      'batch:PSL_ACCT_UNLOCK'. Production: db/batch/acct_unlock.sql unlocks WHERE locked_ts <
      now-30min (strict), resets failed_attempts=0 and locked_ts=NULL, inserts ACCOUNT_UNLOCKED with
      'batch:PSL_ACCT_UNLOCK'; batch/psl_acct_unlock.sh and the operations runbook schedule it every 15 min.
      Assumes the cyclic job fires at :00/:15/:30/:45 — the generator assumes it, the runbook only says
      "every 15 minutes".
    interface: false
    confidence: high
    confidence_basis: >
      Generator, unlock SQL, job script, admin guide R5 and runbook agree on 30 minutes / every 15
      minutes. The quarter-hour alignment of the run times is only assumed by the generator.
    risk_class: regulated
    basis: >
      Generator unlock arithmetic and the remote_addr literal; acct_unlock.sql predicate and insert.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 72
        line_end: 75
        excerpt: |
                          unlock = ts + timedelta(minutes=30)
                          unlock = unlock + timedelta(minutes=15 - unlock.minute % 15, seconds=-unlock.second)
                          events.append((unlock, name, "ACCOUNT_UNLOCKED", "batch:PSL_ACCT_UNLOCK"))
                          ts = unlock + timedelta(minutes=rnd.randint(5, 240))
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 6
        line_end: 15
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr)
            SELECT username, 'ACCOUNT_UNLOCKED', CURRENT_TIMESTAMP, 'batch:PSL_ACCT_UNLOCK'
              FROM signon
             WHERE locked = 'Y'
               AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};

          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_acct_unlock.sh
        line_start: 2
        line_end: 2
        excerpt: |
          # PSL_ACCT_UNLOCK - every 15 minutes. Unlocks accounts locked > 30 minutes.
    stack_metadata:
      framework: python-script
      schedule.trigger: PSL_ACCT_UNLOCK every 15 minutes
      job.entrypoint: batch/psl_acct_unlock.sh

  - record_key: LOCK-BR-0003
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an account is locked WHEN its user attempts to sign in THEN the system SHALL refuse the
      sign-in and record a locked-sign-in event for that attempt, distinct from a failed-sign-in event.
    plain_text: >
      While an account is locked, any sign-in attempt is refused and logged as "attempt on a locked
      account", not as a wrong password.
    technical_note: >
      The generator emits SIGNON_LOCKED (50% of the time) between ACCOUNT_LOCKED and ACCOUNT_UNLOCKED.
      Production: UserDAO.authenticate checks locked first, audits EVENT_SIGNON_LOCKED and returns
      SIGNON_LOCKED without changing failed_attempts (admin guide R4).
    interface: false
    confidence: high
    confidence_basis: >
      Generator models it and UserDAO enforces it, with the admin guide R4 stating it.
    risk_class: regulated
    basis: >
      SIGNON_LOCKED event placed only while the account is locked; UserDAO locked branch.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 70
        line_end: 71
        excerpt: |
                          if rnd.random() < 0.5:
                              events.append((ts + timedelta(minutes=rnd.randint(2, 20)), name, "SIGNON_LOCKED", ip))
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 127
        line_end: 130
        excerpt: |
                      if (locked) {
                          audit(connection, userName, EVENT_SIGNON_LOCKED, remoteAddr);
                          return SIGNON_LOCKED;
                      }
    stack_metadata:
      framework: python-script

  - record_key: AUDIT-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on audit event with the user name, an event type from the
      closed set {SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, SIGNOFF,
      USER_CREATED}, the event time to the second, and the originating address (a client address, or
      the name of the job that produced it).
    plain_text: >
      Every sign-in event is logged with who, what kind of event (one of seven), when, and from where
      (the user's network address, or the automated job that caused it).
    technical_note: >
      The generator writes INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) using
      exactly these seven types and 'YYYY-MM-DD HH:MM:SS' timestamps. Schema
      (db/schema/petstore_derby.sql) enforces the type set with ck_signon_audit_event and audit_id identity.
    interface: false
    confidence: high
    confidence_basis: >
      The generator's insert shape matches the schema CHECK constraint and UserDAO INSERT_AUDIT.
    risk_class: regulated
    basis: >
      Generator audit INSERT; schema constraint on event_type.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/generate_history.py
        line_start: 111
        line_end: 113
        excerpt: |
                  for ts, name, typ, ip in events:
                      f.write("INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES (%s, '%s', %s, %s);\n"
                              % (q(name), typ, t(ts), q(ip)))
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 92
        line_end: 93
        excerpt: |
            constraint ck_signon_audit_event check (event_type in
              ('SIGNON_OK', 'SIGNON_FAIL', 'SIGNON_LOCKED', 'ACCOUNT_LOCKED', 'SIGNOFF', 'USER_CREATED', 'ACCOUNT_UNLOCKED'))
    stack_metadata:
      framework: python-script
      db.model: signon_audit

  - record_key: ACCT-BR-0001
    kind: business-rule
    capability_key: account-registration
    requirement: >
      WHEN a customer account is created THEN the system SHALL give it the CUSTOMER role, zero failed
      attempts, an unlocked state and its creation time, and SHALL record an account-created event.
    plain_text: >
      A new account is always a customer account, starts unlocked with no failed attempts, and its
      creation is logged.
    technical_note: >
      The generator emits USER_CREATED at the creation time and inserts signon rows with role 'CUSTOMER'
      and created_ts; the initial state is failed=0, locked='N'. Production: UserDAO.INSERT_USER
      hard-codes failed_attempts 0, locked 'N', ROLE_CUSTOMER, and createUser audits USER_CREATED.
    interface: false
    confidence: high
    confidence_basis: >
      Generator and UserDAO.createUser agree.
