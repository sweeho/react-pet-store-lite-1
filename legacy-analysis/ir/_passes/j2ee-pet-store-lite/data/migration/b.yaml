  - record_key: AUD-BR-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL retain sign-on audit events for 90 days; the migrated audit
      history SHALL cover no more than the retention window (2026-08-01 to 2026-10-29 in
      the extract).
    plain_text: >
      Sign-on history is kept for 90 days. The history being migrated covers the last
      90 days only.
    technical_note: >
      audit_purge.sql deletes rows with event_ts before CURRENT_DATE - 90 days; runbook
      settings table says 90 days. Extract earliest event 2026-08-01 12:12:00, latest
      2026-10-29 23:40:00 (89 days).
    interface: false
    confidence: high
    confidence_basis: >
      Purge SQL and runbook agree; extract span is consistent with them.
    risk_class: regulated
    basis: >
      Retention purge and documented setting.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 5
        line_end: 6
        excerpt: |
          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 97
        line_end: 97
        excerpt: |
           <tr><td>Audit retention</td><td>90 days</td></tr>
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 2
        line_end: 2
        excerpt: |
          1,jo.khan,USER_CREATED,2026-08-01 12:12:00.0,10.15.152.66
    stack_metadata:
      job.entrypoint: PSL_AUDIT_PURGE

  - record_key: REG-BR-0001
    kind: business-rule
    capability_key: account-registration
    requirement: >
      The system SHALL record an account-created event for every self-registered
      account at the account's creation time; the three sample accounts loaded with the
      sample data SHALL have no such event.
    plain_text: >
      Every customer who registers gets a "user created" entry in the sign-on history,
      timed when the account was made. The built-in sample accounts have none.
    technical_note: >
      40 USER_CREATED rows, one per non-sample account, each with event_ts equal to
      signon.created_ts (0 mismatches). j2ee, shopper and admin have no USER_CREATED.
    interface: false
    confidence: medium
    confidence_basis: >
      Derived from cross-table consistency of the extract; the writing code is in another
      shard and was not read here.
    risk_class: regulated
    basis: >
      Cross-table check between signon.csv and signon_audit.csv; admin guide R7 says new
      accounts are written to the audit.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 46
        line_end: 46
        excerpt: |
          45,jo.das,USER_CREATED,2026-08-10 19:44:00.0,10.15.45.49
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 56
        line_end: 56
    stack_metadata:
      db.model: SIGNON_AUDIT.event_type=USER_CREATED

