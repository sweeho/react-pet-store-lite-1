    path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
    description: >
      The audit and account extracts match the synthetic history generator's output in
      shape and volume (40 accounts, 1686 events, the same window; seed header line 1 of
      data/seed/signon_history.sql). A human needs to confirm whether these files are a
      real production extract or a rehearsal set, because records SIGN-BR-0001 and
      REG-BR-0001 are inferred from consistency of this data.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/migration/item.csv
    description: >
      Key columns are char(10) in the DDL (blank-padded), but the extract values are
      unpadded and locale is 'en_US' without padding. The migration must decide whether
      keys are trimmed in the target. Timestamps use 'YYYY-MM-DD HH:MM:SS.f' with no time
      zone; the zone of the legacy server is not stated in this module.
