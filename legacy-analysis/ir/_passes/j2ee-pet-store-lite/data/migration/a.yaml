      another shard.
    risk_class: regulated
    basis: >
      signon_audit.csv admin lock and unlock sequences.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 245
        line_end: 249
