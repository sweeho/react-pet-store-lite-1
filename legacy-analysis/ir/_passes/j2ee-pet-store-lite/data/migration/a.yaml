  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock an account after three consecutive failed sign-ins,
      recording the lock time, and SHALL record an account-locked event.
      GIVEN an account with two consecutive failed sign-ins WHEN a third sign-in fails
      THEN the account is locked, its failed count is 3 and the lock time is stored.
    plain_text: >
      Three wrong passwords in a row lock the account, and the time of the lock is
      kept.
    technical_note: >
      UserDAO applies the rule (not in this shard). In the data, all 23 ACCOUNT_LOCKED
      events follow exactly three consecutive SIGNON_FAIL events for that user, and
      the two accounts still locked at extract time (cal.ng41, deekoh) have
      failed_attempts=3, locked=Y and locked_ts equal to their ACCOUNT_LOCKED event
      time.
    interface: false
    confidence: high
    confidence_basis: >
      High: every lock in 90 days of history follows the 3-failure pattern, the
      stored lock state matches the audit, and the DDL comment, batch SQL comment and
      both guides state the same rule.
    risk_class: regulated
    basis: >
      signon_audit.csv lock sequences; signon.csv locked rows.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 81
        line_end: 84
        excerpt: |
          80,jo.das,SIGNON_FAIL,2026-08-14 14:28:07.0,10.15.45.49
          81,jo.das,SIGNON_FAIL,2026-08-14 14:29:00.0,10.15.45.49
          82,jo.das,SIGNON_FAIL,2026-08-14 14:29:09.0,10.15.45.49
          83,jo.das,ACCOUNT_LOCKED,2026-08-14 14:30:06.0,10.15.45.49
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon.csv
        line_start: 10
        line_end: 10
        excerpt: |
          cal.ng41,pw6463,CUSTOMER,3,Y,2026-10-29 23:39:00.0,2026-10-27 19:42:33.0,2026-08-31 11:09:00.0
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 51
        line_end: 52
        excerpt: |
           <tr><td>R2</td><td>Each failed sign-in adds 1 to the account's failed attempts. A successful sign-in sets it back to 0.</td></tr>
           <tr><td>R3</td><td>The 3rd failure in a row locks the account (LOCKED = Y) and records the time of the lock.</td></tr>
    stack_metadata:
      db.table: SIGNON
      audit.event: ACCOUNT_LOCKED

  - record_key: LOCK-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL refuse a sign-in to a locked account even with the correct
      password, SHALL record the attempt as a sign-in-while-locked event and SHALL NOT
      change the failed count.
    plain_text: >
      While an account is locked nobody can sign in to it, even with the right
      password; each attempt is logged.
    technical_note: >
      11 SIGNON_LOCKED events appear in the audit, each between an ACCOUNT_LOCKED and
      the next ACCOUNT_UNLOCKED for that user; no SIGNON_OK or SIGNON_FAIL is recorded
      for a user while locked.
    interface: false
    confidence: high
    confidence_basis: >
      High: the audit history is consistent with the rule in every case and the
      Administrator Guide (R4) and User Guide state it.
    risk_class: regulated
    basis: >
      State replay over signon_audit.csv found no success or failure event during a
      lock; SIGNON_LOCKED only occurs while locked.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 280
        line_end: 282
        excerpt: |
          279,jo.khan,ACCOUNT_LOCKED,2026-08-29 11:20:06.0,10.17.120.244
          280,jo.khan,SIGNON_LOCKED,2026-08-29 11:36:06.0,10.17.120.244
          281,jo.khan,ACCOUNT_UNLOCKED,2026-08-29 12:00:00.0,batch:PSL_ACCT_UNLOCK
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 53
        line_end: 53
        excerpt: |
           <tr><td>R4</td><td>A locked account cannot sign in, even with the right password. The attempt is recorded as SIGNON_LOCKED and the failed count does not change.</td></tr>
    stack_metadata:
      audit.event: SIGNON_LOCKED

  - record_key: LOCK-BR-0003
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock an account whose lock is more than 30
      minutes old at the next 15-minute check, resetting its failed count to zero and
      recording an account-unlocked event attributed to the unlock job.
      GIVEN an account locked at 14:30:06 WHEN the check runs at 15:00 (lock 29m54s
      old) THEN the account stays locked AND WHEN the check runs at 15:15 THEN the
      account is unlocked.
    plain_text: >
      A locked account unlocks itself once the lock is more than half an hour old;
      the store checks every quarter of an hour, so in practice a user waits between
      30 and 45 minutes.
    technical_note: >
      PSL_ACCT_UNLOCK (Control-M cyclic, INTERVAL 00015M) runs db/batch/acct_unlock.sql:
      locked_ts < now - 30 min (strict) sets locked=N, failed_attempts=0, locked_ts=NULL
      and inserts ACCOUNT_UNLOCKED with remote_addr 'batch:PSL_ACCT_UNLOCK'. In the
      data all 21 ACCOUNT_UNLOCKED events fall on :00/:15/:30/:45 and come 30 to 44
      minutes after the matching lock.
    interface: false
    confidence: high
    confidence_basis: >
      High: batch SQL, scheduler definition, runbook and guides agree, and every
      unlock in the history fits the 30-minute threshold on a 15-minute cycle.
    risk_class: regulated
    basis: >
      signon_audit.csv unlock events; acct_unlock.sql.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 84
        line_end: 87
        excerpt: |
          83,jo.das,ACCOUNT_LOCKED,2026-08-14 14:30:06.0,10.15.45.49
          84,admin,SIGNON_OK,2026-08-14 15:03:27.0,10.0.0.134
          85,admin,SIGNOFF,2026-08-14 15:07:27.0,10.0.0.134
          86,jo.das,ACCOUNT_UNLOCKED,2026-08-14 15:15:00.0,batch:PSL_ACCT_UNLOCK
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 6
        line_end: 15
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr)
            SELECT username, 'ACCOUNT_UNLOCKED', CURRENT_TIMESTAMP, 'batch:PSL_ACCT_UNLOCK'
              FROM signon
             WHERE locked = 'Y'
               AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};

          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        line_start: 160
        line_end: 160
        excerpt: |
           <tr><td>Account Locked</td><td>3 failed sign-ins in a row</td><td>Wait 30 to 45 minutes, then sign in</td></tr>
    stack_metadata:
      job.entrypoint: PSL_ACCT_UNLOCK
      schedule.trigger: every 15 minutes, 00:00-23:59
      threshold.minutes: 30

  - record_key: LOCK-BR-0004
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL apply the three-failure lockout to administrator accounts in
      the same way as to customer accounts.
