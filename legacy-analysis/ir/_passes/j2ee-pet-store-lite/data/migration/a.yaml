# SX-0001 extract-a — j2ee-pet-store-lite/data/migration
# Shard content: 8 full table extracts (CSV with header, CRLF line endings) used
# for migration testing: category, category_details, product, product_details,
# item, item_details, signon, signon_audit. No code lives in this shard; every
# record below is a rule the stored data demonstrably obeys (checked across all
# rows), corroborated where possible by the DDL, batch SQL and the guides.
# No legacy-analysis/sources/**/extracted.md exists in this run, so the guides
# are cited by their committed HTML with line ranges.
records:
  - record_key: CATDI-ENT-0001
    kind: entity
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL hold the catalog as a three-level hierarchy of categories,
      products and items, where every product belongs to exactly one existing
      category, every item belongs to exactly one existing product, every category
      has at least one product and every product has at least one item.
    plain_text: >
      The pet catalog is organised as categories (for example Dogs), products within
      a category (for example Bulldog) and sellable items within a product (for
      example an adult male Bulldog). No category is left without a product and no
      product without an item.
    technical_note: >
      Tables CATEGORY, PRODUCT, ITEM with foreign keys fk_product_1 and fk_item_1
      (db/schema/petstore_derby.sql). "At least one child" is not a constraint; it is
      checked nightly by PSL_CATALOG_CHECK C1/C2 (db/batch/catalog_check.sql). The
      migration extract holds 5 categories, 16 products and 28 items; a full scan of
      the CSVs found no orphan product, no orphan item, no empty category and no
      product without an item.
    interface: false
    confidence: high
    confidence_basis: >
      High: the parent links are enforced by foreign keys in the DDL, the
      non-empty rules are enforced by the nightly check, and all rows of the extract
      satisfy both. The counts match the Administrator Guide (5 categories, 16
      products, 28 items).
    risk_class: operational
    basis: >
      product.csv maps every productid to one of the 5 catids in category.csv;
      item.csv maps every itemid to a productid present in product.csv; each
      category and each product appears as a parent at least once.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/product.csv
        line_start: 1
        line_end: 4
        excerpt: |
          productid,catid
          FI-SW-01,FISH
          FI-SW-02,FISH
          FI-FW-01,FISH
      - path: legacy-source/j2ee-pet-store-lite/data/migration/item.csv
        line_start: 1
        line_end: 2
        excerpt: |
          itemid,productid
          EST-1,FI-SW-01
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 42
        line_end: 48
        excerpt: |
          CREATE TABLE item (
            itemid char(10) not null,
            productid char(10) not null,
            constraint pk_item primary key (itemid),
              constraint fk_item_1 foreign key (productid)
              references product (productid)
          );
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 38
        line_end: 43
        excerpt: |
          -- C1: categories with no product
          SELECT 'C1' AS chk, c.catid FROM category c
           WHERE NOT EXISTS (SELECT 1 FROM product p WHERE p.catid = c.catid);
          -- C2: products with no item
          SELECT 'C2' AS chk, p.productid FROM product p
           WHERE NOT EXISTS (SELECT 1 FROM item i WHERE i.productid = p.productid);
    stack_metadata:
      db.table: [CATEGORY, PRODUCT, ITEM]
      migration.row_counts: {category: 5, product: 16, item: 28}

  - record_key: CATDI-BR-0002
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL store each item's list price and unit cost as amounts with two
      decimal places and SHALL NOT hold an item whose list price is below its unit
      cost.
    plain_text: >
      Every item has a selling price and a cost price in currency with cents, and an
      item is never priced below what it costs.
    technical_note: >
      ITEM_DETAILS.listprice and unitcost are decimal(10,2) not null with check
      constraint ck_item_details_price (listprice >= unitcost); PSL_CATALOG_CHECK C3
      re-checks it nightly. All 28 item_details rows satisfy it; the tightest margin
      is EST-13 (12.50 list, 11.10 cost).
    interface: false
    confidence: high
    confidence_basis: >
      High: enforced by a DDL check constraint and by the nightly batch check, and
      every migrated row complies.
    risk_class: financial
    basis: >
      item_details.csv carries listprice and unitcost with two decimals on every row
      and no row has listprice < unitcost.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/item_details.csv
        line_start: 1
        line_end: 2
        excerpt: |
          itemid,listprice,unitcost,locale,image,descn,attr1,attr2,attr3,attr4,attr5
          EST-1,16.50,10.00,en_US,fish3.gif,Fresh Water fish from Japan,Large,Cuddly,,,
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 51
        line_end: 66
        excerpt: |
          CREATE TABLE item_details (
            itemid char(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
          ...
                constraint ck_item_details_price check (listprice >= unitcost)
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 44
        line_end: 45
        excerpt: |
          -- C3: items priced below cost
          SELECT 'C3' AS chk, itemid FROM item_details WHERE listprice < unitcost;
    stack_metadata:
      db.table: ITEM_DETAILS
      db.constraint: ck_item_details_price

  - record_key: CATDI-BR-0003
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL hold English (en_US) descriptive text for every category,
      product and item, keyed by the record and its locale, and the catalog SHALL
      contain no other locale.
    plain_text: >
      Every category, product and item has its name or description in US English;
      the store holds no other language.
    technical_note: >
      CATEGORY_DETAILS, PRODUCT_DETAILS and ITEM_DETAILS have primary key
      (id, locale). Every row in the three detail extracts has locale en_US and each
      parent id has exactly one detail row. PSL_CATALOG_CHECK C4 checks the item
      level only. View v_catalog_item joins all levels on locale.
    interface: false
    confidence: high
    confidence_basis: >
      High: the data shows a single en_US row for every parent and the nightly check
      C4 enforces it for items; the README states the application is English only.
      Category and product level are corroborated by data only, not by a check.
    risk_class: presentational
    basis: >
      category_details.csv, product_details.csv and item_details.csv: one en_US row
      per category, product and item; no other locale value appears.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/category_details.csv
        line_start: 1
        line_end: 3
        excerpt: |
          catid,name,image,descn,locale
          FISH,Fish,fish_icon.gif,,en_US
          DOGS,Dogs,dogs_icon.gif,,en_US
      - path: legacy-source/j2ee-pet-store-lite/data/migration/product_details.csv
        line_start: 1
        line_end: 2
        excerpt: |
          productid,locale,name,image,descn
          FI-SW-01,en_US,Angelfish,fish1.jpg,Salt Water fish from Australia
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 46
        line_end: 48
        excerpt: |
          -- C4: items without an en_US description
          SELECT 'C4' AS chk, i.itemid FROM item i
           WHERE NOT EXISTS (SELECT 1 FROM item_details d WHERE d.itemid = i.itemid AND d.locale = 'en_US');
    stack_metadata:
      db.table: [CATEGORY_DETAILS, PRODUCT_DETAILS, ITEM_DETAILS]
      locale: en_US

  - record_key: CATB-ENT-0004
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL hold for each item a list price, unit cost, image, description
