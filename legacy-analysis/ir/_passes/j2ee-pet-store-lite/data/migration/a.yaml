  - record_key: SIGNON-BR-0003
    kind: business-rule
    capability_key: sign-on
    dispute:
      reason: conflicting-sources
      detail: >
        17 of 44 stored accounts (for example al.khan, cal.ng41, sue.lee) have a user
        name containing '.', and each has a USER_CREATED audit event, i.e. they were
        self-registered. The registration validator and the User Guide allow only
        letters, digits, '-' and '_'. Either the rule was introduced after these
        accounts were created or the data was loaded around the validator. An SME
        must decide whether the new system accepts '.' in existing user names (so
        these users can still sign in) and whether new sign-ups may use it.
    requirement: >
      The system SHALL hold and allow sign-in for existing accounts whose user names
      contain '.', which the self-registration rule does not permit.
    plain_text: >
      Some existing customers have a full stop in their user name (for example
      "al.khan"), even though sign-up today only allows letters, digits, hyphens and
      underscores. Those customers must still be able to sign in.
    technical_note: >
      CreateUserServlet.validate rejects any character that is not
      Character.isLetterOrDigit, '-' or '_'. SIGNON.username has no such constraint.
      17 rows in signon.csv violate the validator.
    interface: false
    confidence: medium
    confidence_basis: >
      Medium: the stored data is unambiguous, but how these accounts came to exist
      cannot be established from this shard, which is why the record is disputed.
    risk_class: regulated
    basis: >
      signon.csv rows with '.' in username and their USER_CREATED events.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon.csv
        line_start: 5
        line_end: 5
        excerpt: |
          al.khan,pw5164,CUSTOMER,0,N,,2026-10-27 21:06:10.0,2026-09-20 16:36:00.0
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 659
        line_end: 659
        excerpt: |
          658,al.khan,USER_CREATED,2026-09-20 16:36:00.0,10.22.142.252
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 107
        line_end: 111
        excerpt: |
                  for (int i = 0; i < userName.length(); i++) {
                      char c = userName.charAt(i);
                      if (!Character.isLetterOrDigit(c) && c != '-' && c != '_') {
                          return "The user name can only contain letters, digits, '-' and '_'.";
