  - record_key: SIGNON-ENT-0001
    kind: entity
    capability_key: sign-on
    requirement: >
      The system SHALL keep one sign-on account per unique, case-sensitive user name
      holding the password, a role, a count of consecutive failed sign-ins, a locked
      flag, the time the lock was set, the time of the last successful sign-in and
      the time the account was created.
    plain_text: >
      Each user account records its user name, password, role, how many sign-ins in
      a row have failed, whether it is locked and since when, when the user last
      signed in successfully and when the account was created.
    technical_note: >
      Table SIGNON (username varchar(25) PK, password varchar(25), role default
      CUSTOMER, failed_attempts default 0, locked char(1) default N, locked_ts,
      last_signon, created_ts default current_timestamp). The extract has 44 accounts.
      For every account, last_signon equals the latest SIGNON_OK event in
      signon_audit.csv and created_ts equals its USER_CREATED event (where one exists).
    interface: false
    confidence: high
    confidence_basis: >
      High: the shape is in the DDL and the data, and the derived columns
      (last_signon, created_ts) agree row-for-row with the audit history in a full
      cross-check of both extracts.
    risk_class: regulated
    basis: >
      signon.csv header and rows; cross-check against signon_audit.csv found no
      mismatch of last_signon or created_ts.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon.csv
        line_start: 1
        line_end: 2
        excerpt: |
          username,password,role,failed_attempts,locked,locked_ts,last_signon,created_ts
          j2ee,j2ee,CUSTOMER,0,N,,2026-10-26 17:29:32.0,2026-08-01 00:00:00.0
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 70
        line_end: 82
        excerpt: |
          CREATE TABLE signon (
            username varchar(25) not null,
            password varchar(25) not null,
            role varchar(10) default 'CUSTOMER' not null,
            failed_attempts integer default 0 not null,
            locked char(1) default 'N' not null,
            locked_ts timestamp,
            last_signon timestamp,
            created_ts timestamp default current_timestamp not null,
            constraint pk_signon primary key (username),
            constraint ck_signon_role check (role in ('CUSTOMER', 'ADMIN')),
            constraint ck_signon_locked check (locked in ('Y', 'N'))
          );
    stack_metadata:
      db.table: SIGNON
      migration.row_count: 44

  - record_key: ACCESS-BR-0001
    kind: business-rule
    capability_key: access-control
    requirement: >
      The system SHALL give every account exactly one role, CUSTOMER or ADMIN, and
      SHALL make self-registered accounts CUSTOMER.
    plain_text: >
      Every user is either a customer or an administrator. People who sign themselves
      up become customers.
    technical_note: >
      ck_signon_role restricts the value; default is CUSTOMER. In the extract, 43
      accounts are CUSTOMER and only the seeded "admin" account is ADMIN; all 40
      accounts with a USER_CREATED (self-registration) audit event are CUSTOMER.
    interface: false
    confidence: high
    confidence_basis: >
      High: DDL check constraint plus default, matched by every row; the User Guide
      states new accounts are customer accounts.
    risk_class: regulated
    basis: >
      signon.csv role column; signon_audit.csv USER_CREATED events; user guide
      sign-up section.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon.csv
        line_start: 2
        line_end: 4
        excerpt: |
          j2ee,j2ee,CUSTOMER,0,N,,2026-10-26 17:29:32.0,2026-08-01 00:00:00.0
          shopper,j2ee,CUSTOMER,0,N,,2026-10-27 13:37:40.0,2026-08-01 00:00:00.0
          admin,admin,ADMIN,0,N,,2026-10-25 07:49:08.0,2026-08-01 00:00:00.0
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
