  - record_key: AUDIT-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on event with a sequential event number, the
      user name as typed, an event type from SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED,
      ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, SIGNOFF and USER_CREATED, the event time, and
      the client address or, for automatic unlocks, the identifier of the unlock job.
    plain_text: >
      Every sign-in, failed sign-in, lock, unlock, sign-out and new account is logged
      with a running number, the user name, what happened, when, and from which
      address.
    technical_note: >
      SIGNON_AUDIT (audit_id identity, ck_signon_audit_event). The extract holds 1,686
      events with audit_id 1..1686 without gaps, in time order. Counts: SIGNON_OK 791,
      SIGNOFF 553, SIGNON_FAIL 247, USER_CREATED 40, ACCOUNT_LOCKED 23,
      ACCOUNT_UNLOCKED 21, SIGNON_LOCKED 11. remote_addr is an IPv4 address except
      'batch:PSL_ACCT_UNLOCK' on the 21 unlocks. Every audited user name exists in
      SIGNON.
    interface: false
    confidence: high
    confidence_basis: >
      High: DDL check constraint, runbook column table and all migrated rows agree.
    risk_class: regulated
    basis: >
      signon_audit.csv header and values; DDL for SIGNON_AUDIT.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 1
        line_end: 3
        excerpt: |
          audit_id,username,event_type,event_ts,remote_addr
          1,jo.khan,USER_CREATED,2026-08-01 12:12:00.0,10.15.152.66
          2,admin,SIGNON_OK,2026-08-02 15:15:41.0,10.0.0.134
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 85
        line_end: 94
        excerpt: |
          CREATE TABLE signon_audit (
            audit_id bigint generated always as identity,
            username varchar(25) not null,
            event_type varchar(20) not null,
            event_ts timestamp not null,
            remote_addr varchar(45),
            constraint pk_signon_audit primary key (audit_id),
            constraint ck_signon_audit_event check (event_type in
              ('SIGNON_OK', 'SIGNON_FAIL', 'SIGNON_LOCKED', 'ACCOUNT_LOCKED', 'SIGNOFF', 'USER_CREATED', 'ACCOUNT_UNLOCKED'))
          );
    stack_metadata:
      db.table: SIGNON_AUDIT
      migration.row_count: 1686

  - record_key: AUDIT-BR-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL retain sign-on audit events for 90 days and SHALL NOT delete
      an event before it has been included in the daily extract.
    plain_text: >
      The sign-on log keeps about three months (90 days) of history; older entries
      are removed only after they have been sent out in the daily extract.
    technical_note: >
      PSL_AUDIT_PURGE (Sundays, after PSL_AUDIT_EXTRACT) deletes event_ts older than
      CURRENT_DATE - 90 days. The migration extract spans 2026-08-01 12:12 to
      2026-10-29 23:40, inside a 90-day window, consistent with the purge.
    interface: false
    confidence: high
    confidence_basis: >
      High: purge SQL, runbook (retention 90 days) and the span of the migrated data
      agree. The data alone could not prove a purge has run (the earliest event is
      the first account creation).
    risk_class: regulated
    basis: >
      First and last rows of signon_audit.csv; audit_purge.sql.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 1687
        line_end: 1687
        excerpt: |
          1686,deekoh,ACCOUNT_LOCKED,2026-10-29 23:40:00.0,10.35.138.73
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 1
        line_end: 6
        excerpt: |
          -- PSL_AUDIT_PURGE: delete sign-on audit events older than 90 days.
          -- Runs only after PSL_AUDIT_EXTRACT so every row has been extracted first.
          AUTOCOMMIT OFF;

          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 64
        line_end: 64
        excerpt: |
          <p>Sundays only. Deletes SIGNON_AUDIT rows older than 90 days. It waits for that day's extract so no row is deleted before it is extracted.</p>
    stack_metadata:
      job.entrypoint: PSL_AUDIT_PURGE
      retention.days: 90

  - record_key: AUDIT-INT-0003
    kind: integration
    capability_key: sign-on-audit
    requirement: >
      The system SHALL produce, for each day, a file of that day's sign-on audit
      events containing exactly the stored events for that day in event-number order,
      without a header, with a trailer line carrying the date and the row count.
    plain_text: >
      Each day's sign-on events are sent to the security team as a file; the file
      holds exactly what the log holds for that day and ends with a line giving the
      date and number of rows.
    technical_note: >
      PSL_AUDIT_EXTRACT (db/batch/audit_extract.sql) exports yesterday's rows ordered
      by audit_id. The sample data/interface/signon_audit_20261029.csv holds audit_id
      1659-1686, which are exactly the 28 rows of signon_audit.csv dated 2026-10-29,
      and ends "TRAILER,20261029,28". Recorded here because the migration extract is
      the reconciliation source for that file; the file layout itself belongs to the
      data/interface shard.
    interface: true
    confidence: high
    confidence_basis: >
      High: the extract SQL, the runbook layout and the sample output reconcile
      row-for-row with the migration extract.
    risk_class: regulated
    basis: >
      Comparison of data/interface/signon_audit_20261029.csv with signon_audit.csv
      rows 1659-1686.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
        line_start: 1660
        line_end: 1660
        excerpt: |
          1659,idanair,SIGNON_OK,2026-10-29 09:23:47.0,10.17.227.177
      - path: legacy-source/j2ee-pet-store-lite/data/interface/signon_audit_20261029.csv
        line_start: 1
        line_end: 1
        excerpt: |
          1659,"idanair","SIGNON_OK","2026-10-29 09:23:47.0","10.17.227.177"
      - path: legacy-source/j2ee-pet-store-lite/data/interface/signon_audit_20261029.csv
        line_start: 29
        line_end: 29
        excerpt: |
          TRAILER,20261029,28
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 57
        line_end: 57
        excerpt: |
          <p>No header row. The last line is a trailer <code>TRAILER,YYYYMMDD,&lt;row count&gt;</code>; the count excludes the trailer.</p>
    stack_metadata:
      job.entrypoint: PSL_AUDIT_EXTRACT
      external.endpoint: /var/petstore/extract/signon_audit_YYYYMMDD.csv

