        line_end: 4
        excerpt: |
          itemid,listprice,unitcost,locale,image,descn,attr1,attr2,attr3,attr4,attr5
          EST-1,16.50,10.00,en_US,fish3.gif,Fresh Water fish from Japan,Large,Cuddly,,,
          EST-2,16.50,10.00,en_US,fish3.gif,Fresh Water fish from Japan,Small,,,,
          EST-3,18.50,12.00,en_US,fish4.gif,Salt Water fish from Australia,Toothless,Mean,,,
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 56
        line_end: 62
        excerpt: |
            image varchar(255) not null,
            descn varchar(255) not null,
            attr1 varchar(80),
            attr2 varchar(80),
            attr3 varchar(80),
            attr4 varchar(80),
            attr5 varchar(80),
    stack_metadata:
