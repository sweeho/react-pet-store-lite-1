  - record_key: SIGNON-BR-0002
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL reset the consecutive failed sign-in count to zero on a
      successful sign-in and SHALL store the time of that sign-in as the account's
      last sign-in.
    plain_text: >
      A successful sign-in clears any earlier wrong attempts and is remembered as the
      user's last sign-in.
    technical_note: >
      Every unlocked account in signon.csv has failed_attempts=0 and its last_signon
      equals the timestamp of its most recent SIGNON_OK; a replay of the audit found
      no failure streak left open on an unlocked account.
    interface: false
    confidence: high
    confidence_basis: >
      High: the data cross-check is exact for all 44 accounts and Administrator Guide
      R2 states the reset.
    risk_class: regulated
    basis: >
      signon.csv failed_attempts and last_signon versus signon_audit.csv.
    traces:
