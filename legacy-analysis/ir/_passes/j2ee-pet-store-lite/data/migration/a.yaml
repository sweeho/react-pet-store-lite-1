findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
    record_key: LOCK-BR-0001
    description: >
      The ACCOUNT_LOCKED event is never at the same time as the third SIGNON_FAIL; it
      is logged 20 to 60 seconds later (e.g. jo.das third failure 14:29:09, lock
      14:30:06; deekoh 23:39:40 then 23:40:00), and locked_ts equals the
      ACCOUNT_LOCKED time. The guides say the third failure locks the account. A human
      should confirm whether the lock is set at the third failure (and the history was
      generated with an offset) or later, because the 30-minute unlock clock runs from
      locked_ts.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
    description: >
      The extract contains 23 ACCOUNT_LOCKED and 21 ACCOUNT_UNLOCKED events; the two
      outstanding locks (cal.ng41, deekoh) are still locked in signon.csv at extract
      time. A migration must carry these in-flight locks with their locked_ts so the
      unlock timing continues; whether to carry or clear them on cut-over is a
      decision for the business owner.

