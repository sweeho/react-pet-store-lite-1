  - record_key: CATINT-BR-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The catalog SHALL satisfy these rules: every category has at least one product, every
      product has at least one item, and every item's list price is at or above its unit cost.
    plain_text: >
      No empty categories, no products with nothing to sell, and nothing priced below cost.
    technical_note: >
      Five categories (BIRDS, CATS, DOGS, FISH, REPTILES), 16 products, 28 items (EST-1..EST-28).
      All three rules hold in the export. The smallest margin is EST-13 (12.50 list, 11.10 cost).
      Prices are stored with 2 decimals.
    interface: false
    confidence: medium
