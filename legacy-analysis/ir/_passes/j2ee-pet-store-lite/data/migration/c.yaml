  - record_key: ACCTREG-BR-0001
    kind: business-rule
    capability_key: account-registration
    requirement: >
      The system SHALL accept user names made of lowercase letters, digits, '.' and '_'. Existing
      user names are 4 to 11 characters long, and existing passwords are at least 4 characters long.
    plain_text: >
      Existing user names use only lowercase letters, numbers, dots and underscores.
    technical_note: >
      All 43 usernames match [a-z0-9._]+ with lengths 4-11. Passwords are 4-6 characters long.
      These are observed ranges, not enforced limits read from code.
    interface: false
    confidence: low
    confidence_basis: >
      Bare observation over 43 rows. The real validation rules are not visible here and may be
      looser. Recorded so migration does not reject existing names.
    risk_class: operational
    basis: >
      Distribution of username/password values.
