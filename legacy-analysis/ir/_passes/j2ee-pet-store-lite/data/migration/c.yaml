findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
    record_key: ACCTREG-BR-0002
    description: >
      The seeded accounts j2ee, shopper and admin (created 2026-08-01 00:00) have no USER_CREATED
      event, while every other account does. Two explanations fit: sample-data population does not
      audit account creation, or those events fell just outside the 90-day purge cutoff. A human
      should confirm which, because it decides whether a rebuilt seed load must write audit rows.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/migration/signon_audit.csv
    description: >
      The two final lock sequences (cal.ng41 lines 1680-1683, deekoh lines 1684-1687) are evenly
      spaced: failures exactly 20 s apart and locks on whole minutes. Every earlier lock has
      irregular gaps. These may be injected test or migration-rehearsal data, not real traffic.
      Confirm before migrating these two accounts as locked.

suspected_defects:
  - capability_key: sign-on
    record_keys: [SIGNON-ENT-0001]
    severity: high
    category: other
    title: Passwords are stored in plain text
    description: >
      The account table holds passwords as readable text (e.g. 'j2ee', 'admin', 'pw5164').
      The administrator's password equals its user name, and two seeded customer accounts share
      the password 'j2ee'. Anyone with read access to the database or this export can sign in as
      any user, including the administrator.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/signon.csv
        line_start: 1
        line_end: 4
  - capability_key: catalog-browsing
    record_keys: [CATINT-ENT-0002]
    severity: low
    category: data-corruption
    title: Some item descriptions and images contradict their product
    description: >
      Items EST-1 and EST-2 belong to Angelfish ("Salt Water fish from Australia", fish1.jpg) but
      their own text says "Fresh Water fish from Japan" and shows the Koi image fish3.gif. EST-11
      (Rattlesnake) reads "More Bark than bite". Shoppers see item text that disagrees with the
      product page.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/migration/item_details.csv
        line_start: 2
        line_end: 3
      - path: legacy-source/j2ee-pet-store-lite/data/migration/product_details.csv
        line_start: 2
        line_end: 2
