          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.das', 'SIGNON_FAIL', '2026-08-14 14:29:00', '10.15.45.49');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.das', 'SIGNON_FAIL', '2026-08-14 14:29:09', '10.15.45.49');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.das', 'ACCOUNT_LOCKED', '2026-08-14 14:30:06', '10.15.45.49');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_OK', '2026-08-14 15:03:27', '10.0.0.134');
