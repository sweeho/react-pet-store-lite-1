  - record_key: AUD-RULE-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record a SIGNOFF audit event when a user signs out
      explicitly. A session that ends without an explicit sign-out SHALL leave no
      SIGNOFF event.
    plain_text: >
      Signing out is logged. A session that simply expires is not logged as a
      sign-out.
    technical_note: >
      The seed has 791 SIGNON_OK rows but only 553 SIGNOFF rows. Every SIGNOFF
      follows a SIGNON_OK for the same user within minutes. The other 238
      sessions have no closing event, which is consistent with expiry not being
      audited. This is inferred: the data alone cannot say why a sign-out is
      missing.
    interface: false
    confidence: low
    confidence_basis: >
      Inferred from a count gap in generated data, with no code or document
      read. The 238 missing sign-outs could equally be a choice the generator made.
    risk_class: regulated
    basis: SIGNON_OK vs SIGNOFF counts and pairing.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 288
        line_end: 291
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('beadas9', 'SIGNON_FAIL', '2026-08-27 07:43:07', '10.8.170.34');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('beadas9', 'SIGNON_OK', '2026-08-27 07:43:45', '10.8.170.34');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('beadas9', 'SIGNOFF', '2026-08-27 07:58:45', '10.8.170.34');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('j2ee', 'SIGNON_OK', '2026-08-27 09:36:48', '10.38.208.29');

findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
    description: >
      Line 1 says the history covers "2026-08-01 to 2026-10-30", but the last audit
      event is 2026-10-29 23:40:00 (line 1734). The end date is either exclusive
      or wrong. This only matters if a test or a retention calculation relies on
      the header.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
    description: >
      The seed leaves two accounts (cal.ng41, deekoh) locked at 23:39 and 23:40
      on 2026-10-29, with no ACCOUNT_UNLOCKED event yet. Once loaded, the next
      unlock-job run will unlock them at whatever the current time is. An SME
      should decide whether that is intended demo state.

suspected_defects:
  - capability_key: account-registration
    record_keys: [REG-ENT-0001]
    severity: high
    category: other
    title: Passwords are stored as readable text
    description: >
      Every seeded account's password is written into the account table in plain,
      readable form ('pw' followed by four digits). This shows that the account
      store holds passwords unhashed, so anyone who can read the table or a
      backup of it can read every customer's password.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 5
        line_end: 6
  - capability_key: account-registration
    record_keys: [REG-ENT-0001, SDP-RULE-0001]
    severity: medium
    category: contradicts-document
    title: Seeded user names break the registration naming rule
    description: >
      17 of the 40 seeded user names contain a '.' (for example al.khan, cal.ng41).
      The registration form accepts only letters, digits, '-' and '_'. These
      accounts exist in the store, and they can sign in, but nobody could have
      registered them. A rebuild that applies the naming rule to stored accounts,
      or a migration that validates them, would reject them.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 5
        line_end: 5
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 107
        line_end: 111
  - capability_key: account-lockout
    record_keys: [LOCK-RULE-0005]
    severity: medium
    category: other
    title: The only administrator can be locked out by anyone
    description: >
      The administrator account is locked after three wrong passwords exactly like
      a customer account, and this happens three times in the history. Anyone who
      knows the user name 'admin' can keep the administrator out for 30 to 45
      minutes at a time by entering wrong passwords.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 292
        line_end: 296
