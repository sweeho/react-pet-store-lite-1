  - record_key: AUD-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on audit event with the user name, an
      event type, the event time and the origin address, where the event type is
      one of USER_CREATED, SIGNON_OK, SIGNON_FAIL, SIGNOFF, ACCOUNT_LOCKED,
      SIGNON_LOCKED or ACCOUNT_UNLOCKED, and the origin of an event raised by the
      automatic unlock job SHALL be the job's identifier rather than a network
      address.
    plain_text: >
      Every sign-in related event is logged with who, what, when and where from.
      There are seven kinds of event: account created, signed in, wrong password,
      signed out, account locked, sign-in tried while locked, and account
      unlocked. Unlocks done by the automatic job say so in the "where from" field.
    technical_note: >
      signon_audit(username, event_type, event_ts, remote_addr). Counts in the
      seed: SIGNON_OK 791, SIGNOFF 553, SIGNON_FAIL 247, USER_CREATED 40,
      ACCOUNT_LOCKED 23, ACCOUNT_UNLOCKED 21, SIGNON_LOCKED 11. All 21
      ACCOUNT_UNLOCKED rows carry remote_addr 'batch:PSL_ACCT_UNLOCK'. Every other
      row carries a 10.x address. Rows are in event_ts order.
    interface: false
    confidence: medium
    confidence_basis: >
      The vocabulary is exhaustive for this file (1,686 rows parsed). It is not
      high because this is generated data. The live code may emit types the
      generator never produces, and I did not read that code.
    risk_class: regulated
    basis: >
      Distinct event_type values and remote_addr patterns across every
      signon_audit INSERT.
    traces:
