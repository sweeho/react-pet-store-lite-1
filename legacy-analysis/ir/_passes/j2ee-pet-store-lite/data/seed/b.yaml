  - record_key: LOCK-RULE-0004
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock a locked account with a scheduled job
      that runs every 15 minutes, on the quarter hour, and unlocks accounts that
      have been locked for at least about 30 minutes. Each unlock SHALL be
      recorded as an ACCOUNT_UNLOCKED audit event timestamped with the job's run
      time, and the account's failed-attempt count SHALL restart from zero.
    plain_text: >
      A locked account unlocks itself roughly half an hour after it was locked. A
      job checks every 15 minutes, so the actual wait is between 30 and 45
      minutes.
    technical_note: >
      All 21 ACCOUNT_UNLOCKED rows have remote_addr 'batch:PSL_ACCT_UNLOCK' and
      an event_ts on :00, :15, :30 or :45 with seconds 00. The time from lock to
      unlock ranges from 30.4 to 44.9 minutes. That bounds the age threshold to
      between 29.9 and 30.4 minutes, which is consistent with "at least 30
      minutes, checked every 15". After an unlock, a new lock needs 3 fresh
      failures (cal.ng41 locks again at line 1730 after 3 new SIGNON_FAILs). The
      job itself lives in the batch module, not in this shard.
    interface: false
    confidence: low
    confidence_basis: >
      The 30-minute threshold and the 15-minute cadence are derived from timing
      arithmetic over 21 generated episodes, not read from configuration or code.
      Whether the age boundary is inclusive cannot be seen. The batch job
      definition should be checked to confirm the value.
    risk_class: regulated
    basis: >
      Unlock timestamps on quarter hours, the lock-to-unlock gap distribution, and
      the batch identifier in remote_addr.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 131
        line_end: 134
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.das', 'ACCOUNT_LOCKED', '2026-08-14 14:30:06', '10.15.45.49');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_OK', '2026-08-14 15:03:27', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNOFF', '2026-08-14 15:07:27', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.das', 'ACCOUNT_UNLOCKED', '2026-08-14 15:15:00', 'batch:PSL_ACCT_UNLOCK');
    stack_metadata:
      job.entrypoint: PSL_ACCT_UNLOCK
      schedule.trigger: every 15 min (inferred)
      lockout.age_minutes: 30 (inferred)

