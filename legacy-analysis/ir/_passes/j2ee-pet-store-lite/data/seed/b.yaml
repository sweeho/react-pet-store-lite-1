  - record_key: LOCK-RULE-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an account that is not locked, WHEN three consecutive sign-in attempts
      fail, THEN the system SHALL lock the account, set its failed-attempt count
      to 3, record the lock time, and write an ACCOUNT_LOCKED audit event at that
      time from the same origin address as the failed attempts.
    plain_text: >
      Three wrong passwords in a row lock the account, and the lock is logged.
    technical_note: >
      Every one of the 23 ACCOUNT_LOCKED rows is preceded by exactly 3 SIGNON_FAIL
      rows for that user with no SIGNON_OK between them. No run of 3 failures
      lacks a following lock. The two accounts left locked at the end of the seed
      (cal.ng41 line 10, deekoh line 17) have failed_attempts=3, locked='Y' and
      locked_ts equal to their final ACCOUNT_LOCKED event_ts (lines 1730, 1734).
      ACCOUNT_LOCKED is a separate event, written about 20 seconds to 1 minute
      after the third SIGNON_FAIL.
    interface: false
    confidence: medium
    confidence_basis: >
      The pattern holds in 23 of 23 lock episodes and agrees with the stored
      account state. It is still one generated file and not the enforcing code,
      so I cannot give it high.
    risk_class: regulated
    basis: >
      Event sequences FAIL, FAIL, FAIL, ACCOUNT_LOCKED, plus the locked account
      rows.
    traces:
