  - record_key: LOCK-RULE-0003
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN a locked account, WHEN someone tries to sign in to it, THEN the system
      SHALL refuse the attempt without signing the user in, and SHALL record it as
      a SIGNON_LOCKED audit event rather than a failed sign-in.
    plain_text: >
      Trying to sign in to a locked account does not work, and the attempt is
      logged as "tried while locked", not as another wrong password.
    technical_note: >
      There are 11 SIGNON_LOCKED rows, and every one falls between an
      ACCOUNT_LOCKED and the next ACCOUNT_UNLOCKED for that user. No SIGNON_FAIL or
      SIGNON_OK row occurs inside any lock window. Whether the password was right
      or wrong on those attempts is not visible in the data.
    interface: false
    confidence: medium
    confidence_basis: >
      11 of 11 occurrences sit inside lock windows, and no other event type
      appears in a lock window. Generated data only.
    risk_class: regulated
    basis: Placement of SIGNON_LOCKED events relative to lock/unlock events.
    traces:
