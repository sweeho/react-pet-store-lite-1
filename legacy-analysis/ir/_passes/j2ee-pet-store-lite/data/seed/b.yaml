  - record_key: LOCK-RULE-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an account with one or two consecutive failed sign-ins, WHEN the next
      sign-in succeeds, THEN the system SHALL reset the failed-attempt count to
      zero, so that earlier failures do not count towards a lock.
    plain_text: >
      A successful sign-in wipes out any earlier wrong-password attempts.
    technical_note: >
      There are 146 cases in the seed where a SIGNON_OK follows 1 or 2
      SIGNON_FAILs. None of them leads to a lock that counts failures from before
      the success. Accounts whose latest event is a success after a failure show
      failed_attempts=0 (eli.ng5, line 18 and lines 1720-1721).
    interface: false
    confidence: medium
    confidence_basis: >
      Consistent across 146 instances, and the final account state agrees. Generated
      data only.
    risk_class: regulated
    basis: FAIL→OK sequences and failed_attempts=0 on the resulting account rows.
