# Pass B, independent reading of j2ee-pet-store-lite/data/seed.
# The module is one file: data/seed/signon_history.sql (1,736 lines), a generated
# load script: 40 synthetic CUSTOMER accounts, 3 UPDATEs to built-in accounts and
# 1,686 sign-on audit events dated 2026-08-01 12:12:00 to 2026-10-29 23:40:00.
# The file holds DATA, not code. Every rule below is INFERRED from the shape the
# data consistently takes. That shape is what the generator thought the live
# application produces, and the application's own code is the authority. No
# legacy-analysis/sources/**/extracted.md exists in this repository, so there
# are no document traces.
records:
  - record_key: SDP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      The system SHALL support loading a sign-on history seed only after the first
      sample-data population has run, and SHALL apply the whole seed as a single
      transaction, so that either every seeded account and audit event is stored
      or none is.
    plain_text: >
      The demo sign-on history is loaded only after the store's first sample data
      exists, and it goes in all at once or not at all.
    technical_note: >
      Header comment line 2 says "Load after the first populate: ij
      data/seed/signon_history.sql" (Derby ij). Line 3 turns AUTOCOMMIT OFF and the
      last line is COMMIT. Lines 45-47 UPDATE the j2ee, shopper and admin rows,
      which the seed never inserts. They have to exist already, so this is a real
      ordering dependency on populate.
    interface: false
    confidence: medium
    confidence_basis: >
      The ordering is stated in a comment and confirmed by the UPDATEs that
      depend on rows populate creates. The transaction boundary is explicit.
      This grade is not high because there is only one source, and nothing shows
      whether any automated process runs this script or whether an operator runs it
      by hand.
    risk_class: operational
    basis: >
      The header comment names the prerequisite. AUTOCOMMIT OFF ... COMMIT wraps
      every statement.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1
        line_end: 3
        excerpt: |
          -- Generated by data/generate_history.py (seed 1302). 40 accounts, 1686 audit events, 2026-08-01 to 2026-10-30.
          -- Load after the first populate: ij data/seed/signon_history.sql
          AUTOCOMMIT OFF;
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 45
        line_end: 47
        excerpt: |
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-26 17:29:32' WHERE username = 'j2ee';
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-27 13:37:40' WHERE username = 'shopper';
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-25 07:49:08' WHERE username = 'admin';
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1736
        line_end: 1736
        excerpt: |
          COMMIT;
    stack_metadata:
      db.tool: derby-ij
      generator: data/generate_history.py (seed 1302)

  - record_key: SDP-RULE-0001
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      The system SHALL keep the three built-in accounts (j2ee, shopper, admin) as
      rows the sign-on history seed updates but never creates, and every account
      the seed creates SHALL have the CUSTOMER role.
    plain_text: >
      The demo history adds 40 ordinary customer accounts. It never adds an
      administrator, and it only back-dates the three accounts the store already
      ships with.
    technical_note: >
      Lines 5-44 are 40 INSERTs into signon, all with role 'CUSTOMER'. Lines
      45-47 UPDATE created_ts and last_signon on j2ee, shopper and admin. The
      audit events also cover those three accounts, and admin is the only one
      whose sign-ons come from 10.0.0.x addresses.
    interface: false
    confidence: medium
    confidence_basis: >
      I counted this directly: 40 of 40 inserted rows are CUSTOMER, and the 3
      UPDATE targets are absent from the inserts. The roles of the built-in
      accounts come from populate, which is outside this shard and which I did not
      read.
    risk_class: operational
    basis: Role literal on every INSERT, plus UPDATE-only handling of the built-ins.
    traces:
