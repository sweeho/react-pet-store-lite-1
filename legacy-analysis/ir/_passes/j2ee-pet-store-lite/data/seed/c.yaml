    plain_text: >
      Each account has a user name, a password, a role (customer or
      administrator), a count of wrong passwords in a row, whether it is
      locked and since when, when it last signed in, and when it was created.
    technical_note: >
      signon table in db/schema/petstore_derby.sql: username varchar(25) PK,
      password varchar(25), role varchar(10) CHECK IN ('CUSTOMER','ADMIN'),
      failed_attempts integer default 0, locked char(1) CHECK IN ('Y','N'),
      locked_ts, last_signon, created_ts default current_timestamp. The seed
      populates every column and leaves locked_ts NULL on every unlocked
      account. Filed under account-registration as the closest capability for
      the account record itself; the lock columns serve account-lockout.
