  - record_key: REG-BR-0001
    kind: business-rule
    capability_key: account-registration
    requirement: >
      WHEN a customer account is created THEN the system SHALL give it the
      CUSTOMER role, a failed attempt count of 0, an unlocked state and a
      creation time, and SHALL record an account-created event at that same
      time; no other event for that account SHALL precede it.
    plain_text: >
      A newly registered account is an ordinary customer account, starts
      unlocked with no failed sign-ins, and its creation is the first entry in
      its sign-in history.
    technical_note: >
      UserDAO.createUser inserts role ROLE_CUSTOMER, failed_attempts 0,
      locked 'N', created_ts now, then audits USER_CREATED. In the seed all 40
      inserted accounts are CUSTOMER, each has exactly one USER_CREATED event
      whose time equals its created_ts, and no event for the account is
      earlier than created_ts.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced by the production INSERT plus audit call, and matched by all 40
      seed accounts (checked by replay).
    risk_class: operational
    basis: >
      createUser INSERT and audit call; seed signon rows against their
      USER_CREATED events.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 181
        line_end: 188
        excerpt: |
          PreparedStatement insert = connection.prepareStatement(INSERT_USER);
          insert.setString(1, userName);
          insert.setString(2, password);
          insert.setString(3, ROLE_CUSTOMER);
          insert.setTimestamp(4, new Timestamp(System.currentTimeMillis()));
          insert.executeUpdate();
          insert.close();
          audit(connection, userName, EVENT_USER_CREATED, remoteAddr);
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
