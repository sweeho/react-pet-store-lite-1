  - record_key: AUDIT-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on audit event with the user name, an
      event type, the event time and the originating address, where the event
      type SHALL be one of SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED,
      ACCOUNT_LOCKED, SIGNOFF, USER_CREATED or ACCOUNT_UNLOCKED, and the
      originating address SHALL be the client's network address for events
      caused by a user, or the label "batch:" followed by the job name for
      events caused by a scheduled job.
    plain_text: >
      The sign-in history keeps, for every event, who it was about, what
      happened (signed in, wrong password, tried while locked, got locked,
      signed out, account created, unlocked), when, and where from: the
      user's network address, or the name of the automatic job that did it.
    technical_note: >
      signon_audit (audit_id identity PK, username varchar(25) not null,
      event_type varchar(20) not null with a CHECK listing the seven values,
      event_ts timestamp not null, remote_addr varchar(45) nullable). The seed
      uses all seven types (791 SIGNON_OK, 553 SIGNOFF, 247 SIGNON_FAIL, 40
      USER_CREATED, 23 ACCOUNT_LOCKED, 21 ACCOUNT_UNLOCKED, 11 SIGNON_LOCKED),
      client addresses in 10.x.x.x, and 'batch:PSL_ACCT_UNLOCK' for unlocks.
      The same table is extracted daily (PSL_AUDIT_EXTRACT) for another
      consumer, which is why the shape is marked as an interface.
    interface: true
    confidence: high
    confidence_basis: >
      The event vocabulary is enforced by a CHECK constraint in both the Derby
      schema and PopulateSQL.xml and is the exact set the seed uses; the
      "batch:" address convention appears in both acct_unlock.sql and the
      seed.
    risk_class: regulated
    basis: >
      Schema DDL and CHECK constraint; seed rows of every event type; batch
      remote_addr label.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 84
        line_end: 94
        excerpt: |
          -- SIGNON_AUDIT: Transaction log of sign-on events. Extracted daily by PSL_AUDIT_EXTRACT, purged after 90 days by PSL_AUDIT_PURGE.
          CREATE TABLE signon_audit (
            audit_id bigint generated always as identity,
            username varchar(25) not null,
            event_type varchar(20) not null,
            event_ts timestamp not null,
            remote_addr varchar(45),
            constraint pk_signon_audit primary key (audit_id),
            constraint ck_signon_audit_event check (event_type in
              ('SIGNON_OK', 'SIGNON_FAIL', 'SIGNON_LOCKED', 'ACCOUNT_LOCKED', 'SIGNOFF', 'USER_CREATED', 'ACCOUNT_UNLOCKED'))
          );
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 49
        line_end: 51
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.khan', 'USER_CREATED', '2026-08-01 12:12:00', '10.15.152.66');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_OK', '2026-08-02 15:15:41', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNOFF', '2026-08-02 15:26:41', '10.0.0.134');
    stack_metadata:
      db.table: signon_audit
      db.constraint: ck_signon_audit_event

  - record_key: SIGNON-BR-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      WHEN a user signs on successfully THEN the system SHALL set the
      account's last sign-on time to the time of that sign-on and SHALL reset
      its consecutive failed attempt count to 0.
    plain_text: >
      A successful sign-in records when the user last signed in and forgives
      any earlier wrong passwords.
    technical_note: >
      UserDAO UPDATE_SUCCESS sets failed_attempts = 0, last_signon = now. In
      the seed, every one of the 40 inserted accounts has a last_signon equal
      to its latest SIGNON_OK event, and every account not currently locked
      has failed_attempts = 0 even where its last events include SIGNON_FAIL
      followed by SIGNON_OK (e.g. eli.ng5 on 2026-10-29).
    interface: false
    confidence: high
    confidence_basis: >
      Enforced by the production UPDATE and matched by all 40 seed accounts
      (checked by replay against the audit events).
    risk_class: operational
    basis: >
      UPDATE_SUCCESS statement; seed account last_signon values against their
      audit events.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 93
        line_end: 94
        excerpt: |
          private static final String UPDATE_SUCCESS =
              "update signon set failed_attempts = 0, last_signon = ? where username = ?";
