findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
    record_key: LOCK-BR-0001
    description: >
      In the seed, every ACCOUNT_LOCKED event is timestamped 20 seconds to
      about 1 minute after the third SIGNON_FAIL (e.g. lines 1729-1730:
      23:38:40 then 23:39:00; lines 130-131: 14:29:09 then 14:30:06), and
      locked_ts equals the ACCOUNT_LOCKED time. The production code writes
      both events and locked_ts in the same request, so they would be
      milliseconds apart. Any test or migration check that uses this data to
      check lock timing (e.g. "the lock is set by the third failure") will
      see a gap the live system does not produce. A human should decide
      whether the seed is only illustrative or must match the live timing.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/UserPopulator.java
    record_key: SAMP-WF-0001
    description: >
      The populate step's table drop (UserPopulator.dropTables, lines 93-101)
      drops signon_audit and signon, so a forced reload of sample data wipes
      the loaded sign-on history and any real audit events. Nothing in the
      seed or README says whether the history must be reloaded after a forced
      reload. This belongs to the sample-data-population module's own pass;
      it is noted here only because it decides how long the seeded history
      survives.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
    description: >
      No document sources (legacy-analysis/sources/**/extracted.md) exist in
      this tree, so nothing in this module could be checked against the User
      Guide, Administrator Guide or Operations Runbook that README.md says are
      under docs/. If those documents are extracted later, the 30-minute
      unlock and 3-attempt lock should be checked against them.

suspected_defects:
  - capability_key: account-registration
    record_keys: [REG-ENT-0001, REG-BR-0001]
    severity: high
    category: other
    title: Account passwords are stored and loaded in clear text
    description: >
      The seed loads every account's password as a readable value (for
      example 'pw5164'), and the production account creation writes the
      password exactly as typed into the same column. Sign-on compares the
      stored value to the typed one directly. Anyone who can read the account
      table, a database backup or a table extract can read every user's
      password.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 5
        line_end: 5
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 181
