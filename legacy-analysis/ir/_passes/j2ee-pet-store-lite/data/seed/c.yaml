    requirement: >
      The system SHALL keep, for each account, a unique user name of at most
      25 characters, a password, a role of CUSTOMER or ADMIN (default
      CUSTOMER), a consecutive failed attempt count (default 0), a locked flag
      of Y or N (default N), the time it was locked (empty when unlocked), the
