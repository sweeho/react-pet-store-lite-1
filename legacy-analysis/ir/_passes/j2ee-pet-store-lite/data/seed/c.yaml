# SX-0001 extract-c (tie-breaker) for module j2ee-pet-store-lite/data/seed.
# The module is one file: data/seed/signon_history.sql (generated sign-on
# history, 40 accounts, 1686 audit events). It holds no executable logic, so
# every record below is a rule the seed data EXHIBITS, cross-checked against
# the production code or schema that produces the same shape. No
# legacy-analysis/sources/**/extracted.md exists in this tree, so no document
# traces could be cited.
records:
  - record_key: SAMP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      The system SHALL provide a sign-on history sample data set that is loaded
      as a separate step after the first population of the store, in a single
      transaction, which adds 40 customer accounts, back-dates the creation and
      last sign-on of the three standard accounts (j2ee, shopper, admin), and
      adds 90 days (2026-08-01 to 2026-10-30) of sign-on audit events.
      GIVEN the store has not yet been populated WHEN the history is loaded
      THEN the updates to the three standard accounts affect no rows, because
      those accounts only exist after the first population.
    plain_text: >
      A ready-made set of 90 days of sign-in history (40 extra customers and
      their sign-in activity) can be loaded into a store after it has been
      filled with its standard sample data. It must be loaded after that first
      fill, because it adjusts the three standard sample accounts.
    technical_note: >
      data/seed/signon_history.sql is an ij script generated by
      data/generate_history.py (seed 1302). It runs with AUTOCOMMIT OFF and a
      single COMMIT at the end, INSERTs 40 signon rows, UPDATEs the j2ee,
      shopper and admin rows created by the populate step (Populate-UTF8.xml
      Users), then INSERTs 1686 signon_audit rows. README.md documents loading
      it with psl_ij inside the container.
    interface: false
    confidence: high
    confidence_basis: >
      The load order is stated in the file header and corroborated by
      README.md's load instructions and by Populate-UTF8.xml defining the three
      accounts the UPDATEs target. Not graded higher because nothing enforces
      the order; a load before population silently updates zero rows.
    risk_class: operational
    basis: >
      Header comment states the generator, counts, date window and "Load after
      the first populate"; the UPDATE statements reference accounts that only
      the populate step creates; the script brackets everything in one
      transaction.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1
        line_end: 3
        excerpt: |
          -- Generated by data/generate_history.py (seed 1302). 40 accounts, 1686 audit events, 2026-08-01 to 2026-10-30.
          -- Load after the first populate: ij data/seed/signon_history.sql
          AUTOCOMMIT OFF;
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 45
        line_end: 47
        excerpt: |
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-26 17:29:32' WHERE username = 'j2ee';
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-27 13:37:40' WHERE username = 'shopper';
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-25 07:49:08' WHERE username = 'admin';
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1736
        line_end: 1736
        excerpt: |
          COMMIT;
      - path: legacy-source/j2ee-pet-store-lite/README.md
        line_start: 37
        line_end: 40
        excerpt: |
          ```sh
          docker cp data/seed/signon_history.sql psl:/tmp/h.sql
          docker exec psl sh -c '. /opt/petstore/conf/env.sh; psl_ij /tmp/h.sql'
          ```
    stack_metadata:
      db.tool: derby ij
      db.tables: signon, signon_audit
      generator: data/generate_history.py (seed 1302)

  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock an account when it fails to sign on 3 times in a
      row, recording the failed attempt count (3), the lock flag and the time
      the lock was set, and SHALL record an account-locked event in the sign-on
      audit trail immediately after the third failed-attempt event.
    plain_text: >
      Three wrong passwords in a row lock the account. The time of the lock is
      kept, and the lock is written to the sign-in history.
    technical_note: >
      UserDAO.authenticate increments failed_attempts, sets locked='Y' and
      locked_ts=now when failed_attempts >= MAX_FAILED_ATTEMPTS (3), and writes
      SIGNON_FAIL then ACCOUNT_LOCKED to signon_audit. In the seed, all 23
      ACCOUNT_LOCKED events follow exactly 3 consecutive SIGNON_FAIL events
      for that user, and the two accounts still locked at the end of the data
      (cal.ng41, deekoh) carry failed_attempts=3, locked='Y' and a locked_ts
      equal to their ACCOUNT_LOCKED event time.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in code (UserDAO constant and branch), stated in the
      acct_unlock.sql header comment, and every lock in the 1686-event seed
      matches it (checked by replaying the events). The seed's lock timestamp
      differs from the code's (see findings), which does not affect the rule.
    risk_class: operational
    basis: >
      UserDAO MAX_FAILED_ATTEMPTS = 3 and the lockNow branch; seed account rows
      in the locked state and the fail/fail/fail/locked event sequences.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 141
        line_end: 154
        excerpt: |
          failedAttempts++;
          boolean lockNow = failedAttempts >= MAX_FAILED_ATTEMPTS;
          PreparedStatement update = connection.prepareStatement(UPDATE_FAILURE);
          update.setInt(1, failedAttempts);
          update.setString(2, lockNow ? "Y" : "N");
          update.setTimestamp(3, lockNow ? now : null);
          update.setString(4, userName);
          update.executeUpdate();
          update.close();
          audit(connection, userName, EVENT_SIGNON_FAIL, remoteAddr);
          if (lockNow) {
              audit(connection, userName, EVENT_ACCOUNT_LOCKED, remoteAddr);
              return SIGNON_LOCKED;
          }
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 10
        line_end: 10
        excerpt: |
          INSERT INTO signon (username, password, role, failed_attempts, locked, locked_ts, last_signon, created_ts) VALUES ('cal.ng41', 'pw6463', 'CUSTOMER', 3, 'Y', '2026-10-29 23:39:00', '2026-10-27 19:42:33', '2026-08-31 11:09:00');
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1727
        line_end: 1730
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'SIGNON_FAIL', '2026-10-29 23:38:00', '10.11.113.89');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'SIGNON_FAIL', '2026-10-29 23:38:20', '10.11.113.89');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'SIGNON_FAIL', '2026-10-29 23:38:40', '10.11.113.89');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'ACCOUNT_LOCKED', '2026-10-29 23:39:00', '10.11.113.89');
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 1
        line_end: 3
        excerpt: |
          -- PSL_ACCT_UNLOCK: unlock sign-on accounts locked for more than 30 minutes.
          -- Business rule: 3 failed sign-ons in a row lock an account (UserDAO).
          -- A lock is cleared automatically 30 minutes after it was set.
    stack_metadata:
      db.table: signon
      config.key: UserDAO.MAX_FAILED_ATTEMPTS

  - record_key: LOCK-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an account is locked WHEN anyone tries to sign on to it, with any
      password THEN the system SHALL refuse the sign-on, SHALL record a
      locked-sign-on event in the audit trail, and SHALL NOT change the failed
      attempt count or the lock time.
    plain_text: >
      While an account is locked nobody can sign in to it, even with the right
      password. Each attempt is written to the sign-in history but does not
      extend the lock.
    technical_note: >
      UserDAO.authenticate checks locked before comparing the password; when
      locked it writes SIGNON_LOCKED and returns SIGNON_LOCKED with no UPDATE.
      In the seed, 11 SIGNON_LOCKED events all fall between an ACCOUNT_LOCKED
      and the next ACCOUNT_UNLOCKED for that user, no SIGNON_OK occurs inside
      any lock window, and the following unlock is still timed from the
      original lock (e.g. shopper locked 15:44:36, attempt 15:56:36, unlocked
      16:15:00).
    interface: false
    confidence: high
    confidence_basis: >
      Enforced by the early return in code and fully consistent with the seed
      events (checked by replay). The seed cannot show whether the attempt
      used the right password, so the "even with the right password" part
      rests on the code and its class comment alone.
    risk_class: operational
    basis: >
      UserDAO locked-branch and class comment; seed SIGNON_LOCKED events
      inside lock windows.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 127
        line_end: 130
        excerpt: |
          if (locked) {
              audit(connection, userName, EVENT_SIGNON_LOCKED, remoteAddr);
              return SIGNON_LOCKED;
          }
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 893
        line_end: 897
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'ACCOUNT_LOCKED', '2026-09-29 15:44:36', '10.0.0.219');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('wes_brown', 'SIGNON_OK', '2026-09-29 15:48:22', '10.5.209.180');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'SIGNON_LOCKED', '2026-09-29 15:56:36', '10.0.0.219');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('wes_brown', 'SIGNOFF', '2026-09-29 15:58:22', '10.5.209.180');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'ACCOUNT_UNLOCKED', '2026-09-29 16:15:00', 'batch:PSL_ACCT_UNLOCK');
    stack_metadata:
      db.table: signon_audit

  - record_key: LOCK-BR-0003
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock every account whose lock was set
      more than 30 minutes earlier, checking every 15 minutes around the clock,
      and SHALL reset its failed attempt count to 0, clear its lock time, and
      record an account-unlocked event attributed to the unlock job rather than
      to a client address.
    plain_text: >
      A locked account unlocks itself once the lock is more than 30 minutes
      old. The check runs every 15 minutes, so in practice an account stays
      locked for between 30 and about 45 minutes. The unlock is written to the
      sign-in history.
    technical_note: >
      db/batch/acct_unlock.sql (job PSL_ACCT_UNLOCK) inserts ACCOUNT_UNLOCKED
      with remote_addr 'batch:PSL_ACCT_UNLOCK' and updates locked='N',
      failed_attempts=0, locked_ts=NULL WHERE locked_ts < now - 30 minutes
      (strictly older). Control-M runs it cyclically every 15 minutes,
      0000-2359, all weekdays. In the seed all 21 ACCOUNT_UNLOCKED events fall
      on a quarter hour (:00/:15/:30/:45) and between 30m24s and 44m54s after
      the matching ACCOUNT_LOCKED.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in the batch SQL, scheduled in the Control-M definition, and
      every unlock in the seed matches the 30-minute threshold and the
      15-minute cadence. The seed timings are generated, not observed, so they
      corroborate rather than prove the production cadence.
    risk_class: operational
    basis: >
      acct_unlock.sql INSERT/UPDATE with the 30-minute predicate; Control-M
      INTERVAL 00015M; seed ACCOUNT_UNLOCKED events.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 6
        line_end: 15
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr)
            SELECT username, 'ACCOUNT_UNLOCKED', CURRENT_TIMESTAMP, 'batch:PSL_ACCT_UNLOCK'
              FROM signon
             WHERE locked = 'Y'
               AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};

          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 78
        line_end: 83
        excerpt: |
          <JOB JOBISN="1" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_ACCT_UNLOCK"
               DESCRIPTION="Unlock sign-on accounts locked for more than 30 minutes"
               TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_acct_unlock.sh"
               RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA"
               TIMEFROM="0000" TIMETO="2359" WEEKDAYS="ALL"
               CYCLIC="1" CYCLIC_TYPE="Interval" INTERVAL="00015M" IND_CYCLIC="START"
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 131
        line_end: 134
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.das', 'ACCOUNT_LOCKED', '2026-08-14 14:30:06', '10.15.45.49');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_OK', '2026-08-14 15:03:27', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNOFF', '2026-08-14 15:07:27', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.das', 'ACCOUNT_UNLOCKED', '2026-08-14 15:15:00', 'batch:PSL_ACCT_UNLOCK');
    stack_metadata:
      job.entrypoint: /opt/petstore/batch/psl_acct_unlock.sh
      schedule.trigger: Control-M cyclic, interval 15 minutes, 00:00-23:59, all days
      db.table: signon, signon_audit

