# Pass A, module j2ee-pet-store-lite/data/seed (one file: signon_history.sql, 1736 lines).
# This module is generated synthetic DATA, not enforcing code. Every record below is a rule
# the data is consistent with, cross-checked against the code/config/docs that enforce it.
# No legacy-analysis/sources/**/extracted.md exists in this worktree, so no document-kind
# traces are cited; the HTML guides under legacy-source/ are cited as ordinary line traces.
# Whole-file analysis (event ordering, failure runs, unlock gaps, account-state consistency)
# was done with a throwaway script; the counts quoted below come from that run.
records:
  - record_key: POP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      The system SHALL provide an optional sign-on history seed that is loaded only after the
      first sample-data population, in a single transaction, and that adds 40 CUSTOMER accounts
      with 1686 sign-on audit events dated 2026-08-01 to 2026-10-30 and sets the creation date of
      the three built-in accounts (j2ee, shopper, admin) to 2026-08-01 00:00:00 together with a
      last sign-on time.
    plain_text: >
      For demonstrations, the store can be loaded with three months of made-up sign-in history:
      40 extra customer accounts and about 1,700 sign-in events. It is loaded after the normal
      sample data, all at once or not at all, and it back-dates the three built-in accounts to
      1 August 2026.
    technical_note: >
      data/seed/signon_history.sql, produced by data/generate_history.py (seed 1302). Loaded by
      hand with Derby ij per the header comment; AUTOCOMMIT OFF ... COMMIT wraps all statements.
      Lines 5-44 insert signon rows, 45-47 UPDATE the populate-created accounts, 49-1734 insert
      signon_audit rows. It is not invoked by the populate servlet or by any batch job found.
    interface: false
    confidence: medium
    confidence_basis: >
      The load order and transaction boundary are stated in one place (the header comment and the
      AUTOCOMMIT/COMMIT statements of this file). The inventory report lists the seed as synthetic
      history. No caller in the application or batch chain loads it, so whether it is part of any
      supported procedure (versus a developer convenience) cannot be seen; hence not high.
    risk_class: operational
    basis: >
      Header comment states generator, counts, date range and "Load after the first populate";
      statement counts verified (40 signon INSERTs, 1686 signon_audit INSERTs, 3 UPDATEs).
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1
        line_end: 3
        excerpt: |
          -- Generated by data/generate_history.py (seed 1302). 40 accounts, 1686 audit events, 2026-08-01 to 2026-10-30.
          -- Load after the first populate: ij data/seed/signon_history.sql
          AUTOCOMMIT OFF;
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 45
        line_end: 47
        excerpt: |
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-26 17:29:32' WHERE username = 'j2ee';
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-27 13:37:40' WHERE username = 'shopper';
          UPDATE signon SET created_ts = '2026-08-01 00:00:00', last_signon = '2026-10-25 07:49:08' WHERE username = 'admin';
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1735
        line_end: 1736
        excerpt: |

          COMMIT;
    stack_metadata:
      db.dialect: derby
      job.entrypoint: "ij data/seed/signon_history.sql (manual)"
      generator: data/generate_history.py
      generator.seed: 1302

  - record_key: SIGN-ENT-0001
    kind: entity
    capability_key: sign-on
    requirement: >
      The system SHALL keep, for each account, a user name, password, role, count of consecutive
      failed sign-ins, a locked flag (Y or N), the time the lock was set (empty when not locked),
      the time of the last successful sign-in, and the account creation time; the last sign-in
      time SHALL equal the time of the account's most recent successful sign-in.
    plain_text: >
      Each account records its name, password, role, how many sign-ins in a row have failed,
      whether it is locked and since when, when it last signed in successfully, and when it was
      created.
    technical_note: >
      Column list of the SIGNON table as written by every INSERT in the seed (lines 5-44). For all
      40 seeded accounts last_signon equals the timestamp of that user's last SIGNON_OK audit row,
      created_ts equals the USER_CREATED audit row, and failed_attempts equals the trailing run of
      SIGNON_FAIL rows since the last SIGNON_OK/ACCOUNT_UNLOCKED. The table DDL itself is in
      another shard (webapp/populate, db/).
    interface: false
    confidence: medium
    confidence_basis: >
      Field set read directly from 40 INSERT statements, and the internal consistency between the
      account rows and the audit rows was checked mechanically. But the data is generated, so the
      consistency shows what the generator models, not what the application enforces; the DDL and
      DAO were not read in this pass.
    risk_class: operational
    basis: >
      INSERT column list; example account pamkoh whose created_ts matches its USER_CREATED event.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 36
        line_end: 36
        excerpt: |
          INSERT INTO signon (username, password, role, failed_attempts, locked, locked_ts, last_signon, created_ts) VALUES ('pamkoh', 'pw9813', 'CUSTOMER', 0, 'N', NULL, '2026-10-29 10:20:04', '2026-09-29 16:53:00');
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 898
        line_end: 898
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('pamkoh', 'USER_CREATED', '2026-09-29 16:53:00', '10.15.55.146');
    stack_metadata:
      db.table: SIGNON
      db.columns: [username, password, role, failed_attempts, locked, locked_ts, last_signon, created_ts]

  - record_key: AUDIT-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on audit event with the user name, an event type from the
      closed set SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, SIGNOFF,
      USER_CREATED, the event time, and a source address that is the client network address for
      user-initiated events or the identifier of the batch job for automatic unlocks.
    plain_text: >
      Every sign-in event is kept with who, what kind of event (signed in, failed, tried while
      locked, locked, unlocked, signed out, account created), when, and where from: the user's
      network address, or the name of the overnight job when the store itself unlocked the account.
    technical_note: >
      SIGNON_AUDIT table, columns as in every seed INSERT. In the seed: 791 SIGNON_OK, 553 SIGNOFF,
      247 SIGNON_FAIL, 40 USER_CREATED, 23 ACCOUNT_LOCKED, 21 ACCOUNT_UNLOCKED, 11 SIGNON_LOCKED;
      all 21 ACCOUNT_UNLOCKED rows carry remote_addr 'batch:PSL_ACCT_UNLOCK', every other row an
      IPv4-shaped address. The same seven types and the batch marker are listed in the operations
      runbook's SIGNON_AUDIT layout, and the unlock SQL writes the marker.
    interface: false
    confidence: high
    confidence_basis: >
      The event-type set and the remote_addr convention appear in three independent places: the
      seed data, the operations runbook table, and db/batch/acct_unlock.sql which writes the batch
      marker. The application code that writes the other six types was not read in this pass.
    risk_class: regulated
    basis: >
      Seed data event types and addresses; runbook rows 3 (event_type) and 5 (remote_addr);
      unlock SQL INSERT.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 888
        line_end: 897
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'SIGNON_OK', '2026-09-29 13:09:14', '10.11.113.89');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.khan', 'SIGNON_OK', '2026-09-29 15:13:50', '10.[redacted phone 27]');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'SIGNON_FAIL', '2026-09-29 15:42:52', '10.0.0.219');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'SIGNON_FAIL', '2026-09-29 15:43:22', '10.0.0.219');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'SIGNON_FAIL', '2026-09-29 15:44:00', '10.0.0.219');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'ACCOUNT_LOCKED', '2026-09-29 15:44:36', '10.0.0.219');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('wes_brown', 'SIGNON_OK', '2026-09-29 15:48:22', '10.5.209.180');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'SIGNON_LOCKED', '2026-09-29 15:56:36', '10.0.0.219');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('wes_brown', 'SIGNOFF', '2026-09-29 15:58:22', '10.5.209.180');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'ACCOUNT_UNLOCKED', '2026-09-29 16:15:00', 'batch:PSL_ACCT_UNLOCK');
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 53
        line_end: 55
        excerpt: |2
           <tr><td>3 event_type</td><td>SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, SIGNOFF, USER_CREATED</td></tr>
           <tr><td>4 event_ts</td><td>Time of the event</td></tr>
