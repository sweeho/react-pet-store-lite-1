    risk_class: regulated
    basis: >
      Admin ACCOUNT_LOCKED / SIGNON_LOCKED / ACCOUNT_UNLOCKED sequence in the seed.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1214
        line_end: 1219
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'ACCOUNT_LOCKED', '2026-10-12 10:31:40', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_LOCKED', '2026-10-12 10:43:40', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('fay.khan99', 'SIGNON_OK', '2026-10-12 11:01:26', '10.25.1.149');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('dee.das33', 'SIGNON_FAIL', '2026-10-12 11:07:01', '10.13.29.120');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('dee.das33', 'SIGNON_OK', '2026-10-12 11:07:47', '10.13.29.120');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'ACCOUNT_UNLOCKED', '2026-10-12 11:15:00', 'batch:PSL_ACCT_UNLOCK');
    stack_metadata:
      db.table: SIGNON

findings:
  - kind: conflict
    record_key: SIGN-ENT-0001
    path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
    description: >
      17 of the 40 seeded user names contain '.' (e.g. al.khan, cal.ng41, ray.sato), which the
      self-registration check rejects (letters, digits, '-' and '_' only,
      CreateUserServlet.java:107-111). Stored accounts therefore do not all satisfy the
      registration rule. Same as discovery finding F9. A human must decide whether the account
      model accepts '.' (migration) or the registration rule is the invariant.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
    description: >
      395 audit rows have remote_addr of the form '10.[redacted phone N]' (e.g. lines 85, 90, 1689)
      instead of an IPv4 address. This looks like a redaction pass applied to the copy committed for
      analysis, not legacy content. It does not change any record, but the seed as committed is not
      a faithful copy of the generator output and would load non-address values into remote_addr.
      Someone should confirm against generate_history.py or the original file.

suspected_defects:
  - capability_key: sign-on
    record_keys: [SIGN-ENT-0001]
    severity: high
    category: other
    title: Account passwords are stored in plain text
    description: >
      The account table holds the password as a readable value: every seeded account is inserted
      with its password in clear (pw followed by four digits). Anyone who can read the table or this
      file can read every password. Whether the live application hashes on registration cannot be
      seen in this shard, but the seed's values are used verbatim for sign-in matching (admin guide
      R1: "the password matches exactly").
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 5
