    stack_metadata:
      db.table: SIGNON_AUDIT
      db.columns: [username, event_type, event_ts, remote_addr]

  - record_key: AUDIT-BR-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record a USER_CREATED audit event for every new account, timestamped with the
      account's creation time, before any other audit event for that account.
    plain_text: >
      Creating an account is itself logged, at the moment the account is created, and is the first
      thing in that account's history.
    technical_note: >
      In the seed every one of the 40 generated accounts has exactly one USER_CREATED row, it is
      that user's first audit row, and its event_ts equals signon.created_ts. The three
      populate-created accounts (j2ee, shopper, admin) have no USER_CREATED row; their history
      starts with SIGNON_OK. The audit file is in event_ts order throughout.
    interface: false
    confidence: low
    confidence_basis: >
      Inferred from generated data only, and corroborated by the admin guide's R7 ("new account is
      written to SIGNON_AUDIT"). The registration code path that writes the row was not read here,
      and the built-in accounts show the rule does not cover accounts made by sample-data population.
    risk_class: regulated
    basis: >
      40 USER_CREATED rows, one per seeded account, matching created_ts; admin-guide R7.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 49
        line_end: 50
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('jo.khan', 'USER_CREATED', '2026-08-01 12:12:00', '10.15.152.66');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_OK', '2026-08-02 15:15:41', '10.0.0.134');
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 56
        line_end: 56
        excerpt: |2
           <tr><td>R7</td><td>Every sign-in, failure, lock, sign-out and new account is written to SIGNON_AUDIT with the time and the client address.</td></tr>
    stack_metadata:
      db.table: SIGNON_AUDIT

  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock an account on its third consecutive failed sign-in, recording an
      ACCOUNT_LOCKED audit event and setting the account's locked flag, a failed-attempt count of 3
      and the lock time; a successful sign-in or an unlock SHALL reset the consecutive-failure count.
    plain_text: >
      Three wrong passwords in a row lock the account. A correct sign-in in between starts the count
      again from zero.
    technical_note: >
      Seed: all 23 ACCOUNT_LOCKED rows follow exactly three SIGNON_FAIL rows with no SIGNON_OK or
      ACCOUNT_UNLOCKED between them; no user ever has a run of more than 3 failures. The two
      accounts still locked at the end of the seed (cal.ng41, deekoh) have failed_attempts=3,
      locked='Y', locked_ts = their ACCOUNT_LOCKED time. Admin guide R3 states the rule; the unlock
      SQL comment attributes enforcement to UserDAO (not read in this pass).
    interface: false
    confidence: medium
    confidence_basis: >
      Data, admin guide R3 and the unlock-SQL comment all agree on three, but none of them is the
      enforcing code (UserDAO is in another shard). Note the ACCOUNT_LOCKED row is 11-57 seconds
      after the third failure in the seed, a generator artefact; the timing relation cannot be read
      from data.
    risk_class: regulated
    basis: >
      23 of 23 locks preceded by exactly 3 consecutive failures; final account state of the two
      locked accounts.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 10
        line_end: 10
        excerpt: |
          INSERT INTO signon (username, password, role, failed_attempts, locked, locked_ts, last_signon, created_ts) VALUES ('cal.ng41', 'pw6463', 'CUSTOMER', 3, 'Y', '2026-10-29 23:39:00', '2026-10-27 19:42:33', '2026-08-31 11:09:00');
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1727
        line_end: 1730
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'SIGNON_FAIL', '2026-10-29 23:38:00', '10.11.113.89');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'SIGNON_FAIL', '2026-10-29 23:38:20', '10.11.113.89');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'SIGNON_FAIL', '2026-10-29 23:38:40', '10.11.113.89');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('cal.ng41', 'ACCOUNT_LOCKED', '2026-10-29 23:39:00', '10.11.113.89');
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 52
        line_end: 52
        excerpt: |2
           <tr><td>R3</td><td>The 3rd failure in a row locks the account (LOCKED = Y) and records the time of the lock.</td></tr>
    stack_metadata:
      db.table: SIGNON
      lock.threshold: 3

  - record_key: LOCK-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      GIVEN an account is locked WHEN a sign-in is attempted for it THEN the system SHALL refuse the
      sign-in and record a SIGNON_LOCKED audit event, and no successful sign-in SHALL be recorded for
      that account until it has been unlocked.
    plain_text: >
      While an account is locked nobody can sign in to it, and each attempt is logged as "tried while
      locked".
    technical_note: >
      Seed: 11 SIGNON_LOCKED rows, each between that user's ACCOUNT_LOCKED and the next
      ACCOUNT_UNLOCKED; zero SIGNON_OK rows occur inside a lock window. Admin guide R4 adds that the
      failed count does not change on such an attempt; the seed cannot show that because only the
      end-state count is stored.
    interface: false
    confidence: medium
    confidence_basis: >
      Data and admin guide R4 agree; the enforcing sign-on code was not read in this pass, and the
      "failed count unchanged" part of R4 is not observable in this data, so it is not asserted here.
    risk_class: regulated
    basis: >
      SIGNON_LOCKED only ever appears while locked; no SIGNON_OK while locked (mechanical check over
      all 1686 rows).
    traces:
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 1211
        line_end: 1215
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_FAIL', '2026-10-12 10:30:31', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_FAIL', '2026-10-12 10:30:59', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_FAIL', '2026-10-12 10:31:32', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'ACCOUNT_LOCKED', '2026-10-12 10:31:40', '10.0.0.134');
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('admin', 'SIGNON_LOCKED', '2026-10-12 10:43:40', '10.0.0.134');
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 53
        line_end: 53
        excerpt: |2
           <tr><td>R4</td><td>A locked account cannot sign in, even with the right password. The attempt is recorded as SIGNON_LOCKED and the failed count does not change.</td></tr>
    stack_metadata:
      db.table: SIGNON_AUDIT

  - record_key: LOCK-BR-0003
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock, on a 15-minute schedule, every account whose lock was
      set more than 30 minutes earlier, resetting its failed-attempt count to 0, clearing its lock
      time and recording an ACCOUNT_UNLOCKED audit event attributed to the unlock job; a locked
      account SHALL therefore become usable between 30 and 45 minutes after it was locked.
    plain_text: >
      A locked account unlocks by itself. The store checks every quarter of an hour and frees any
      account that has been locked for over 30 minutes, so the wait is 30 to 45 minutes.
    technical_note: >
      db/batch/acct_unlock.sql (strict locked_ts < now - 30 min), run by batch/psl_acct_unlock.sh,
      scheduled every 15 minutes by Control-M job PSL_ACCT_UNLOCK; signon.unlockAfterMinutes=30 in
      conf/petstore.properties. The seed agrees: all 21 ACCOUNT_UNLOCKED rows fall on :00/:15/:30/:45
      and come 30m24s to 44m54s after the matching ACCOUNT_LOCKED.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in SQL, scheduled in the shell script and Control-M definition, valued in config, and
      corroborated by 21 seed unlocks all within the 30-45 minute window. Note the SQL hard-codes -30
      rather than reading the config key; whether the config key is used anywhere is for the shard
      that owns conf/.
    risk_class: regulated
    basis: >
      Unlock SQL WHERE/UPDATE; script header; config value; seed unlock gaps.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 15
        excerpt: |
          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_acct_unlock.sh
        line_start: 2
        line_end: 2
        excerpt: |
          # PSL_ACCT_UNLOCK - every 15 minutes. Unlocks accounts locked > 30 minutes.
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 16
        line_end: 16
        excerpt: |
          signon.unlockAfterMinutes=30
      - path: legacy-source/j2ee-pet-store-lite/data/seed/signon_history.sql
        line_start: 897
        line_end: 897
        excerpt: |
          INSERT INTO signon_audit (username, event_type, event_ts, remote_addr) VALUES ('shopper', 'ACCOUNT_UNLOCKED', '2026-09-29 16:15:00', 'batch:PSL_ACCT_UNLOCK');
    stack_metadata:
      job.entrypoint: batch/psl_acct_unlock.sh
      schedule.trigger: "Control-M PSL_PETSTORE_CYCLIC, every 15 minutes"
      config.key: signon.unlockAfterMinutes

  - record_key: LOCK-BR-0004
    kind: business-rule
    capability_key: account-lockout
    requirement: >
