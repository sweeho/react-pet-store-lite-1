  - record_key: BATCH-OPERATIONS-WF-0001
    kind: workflow
    capability_key: batch-operations
    requirement: >
      The system SHALL run the sign-on audit extract daily at 01:30 only after
      that day's database backup has succeeded; WHEN the export fails THEN the job
      SHALL end with exit code 8 and the security team SHALL be notified by mail
      that the extract was not produced; the daily sign-on report and the Sunday
      audit purge SHALL NOT start until the extract has succeeded.
    plain_text: >
      The audit file is made at 01:30 each night, but only once the nightly
      database backup has worked. If the file cannot be made, the security team
      gets an email. The nightly sign-on report and the weekly audit clean-up wait
      for the file, so no event is deleted before it has been sent.
    technical_note: >
      Control-M job PSL_AUDIT_EXTRACT (PSL_PETSTORE.xml) has TIMEFROM 0130,
      WEEKDAYS ALL, MAXRERUN 1, INCOND PSL_DB_BACKUP-OK, OUTCOND
      PSL_AUDIT_EXTRACT-OK, and on NOTOK mails psl-security@example.invalid.
      PSL_SIGNON_REPORT and PSL_AUDIT_PURGE both have INCOND PSL_AUDIT_EXTRACT-OK.
      The script exits 8 when psl_ij reports an ERROR line. Filed under
      batch-operations because it is job ordering and alerting; the file it
      governs is the sign-on-audit feed.
    interface: true
    confidence: high
    confidence_basis: >
      Schedule, dependency and alert are in the Control-M definition and repeated
      in the runbook job table and section 3.4; exit 8 is in the script and the
      runbook exit-code table.
    risk_class: operational
    basis: >
      Control-M job definition; runbook job table and flow; script exit 8.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 27
        line_end: 39
        excerpt: |
              <JOB JOBISN="2" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_EXTRACT"
                   DESCRIPTION="Export yesterday SIGNON_AUDIT rows to signon_audit_YYYYMMDD.csv"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_extract.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AB"
                   TIMEFROM="0130" WEEKDAYS="ALL" MAXRERUN="1"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="+" />
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="R" DEST="psl-security@example.invalid" SUBJECT="PSL_AUDIT_EXTRACT failed" MESSAGE="Sign-on audit extract not produced" />
                </ON>
              </JOB>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 30
        line_end: 32
        excerpt: |
           <tr><td>PSL_AUDIT_EXTRACT</td><td>PSL_PETSTORE_DAILY</td><td>Daily 01:30</td><td>PSL_DB_BACKUP-OK</td><td>psl_audit_extract.sh</td></tr>
           <tr><td>PSL_SIGNON_REPORT</td><td>PSL_PETSTORE_DAILY</td><td>Daily 01:45</td><td>PSL_AUDIT_EXTRACT-OK</td><td>psl_signon_report.sh</td></tr>
           <tr><td>PSL_AUDIT_PURGE</td><td>PSL_PETSTORE_DAILY</td><td>Sunday 02:00</td><td>PSL_AUDIT_EXTRACT-OK</td><td>psl_audit_purge.sh</td></tr>
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 10
        line_end: 10
        excerpt: |
          psl_ij "$PSL_SQL/audit_extract.sql" > /dev/null || { psl_log "FAILED: export"; exit 8; }
    stack_metadata:
      schedule.trigger: "Control-M TIMEFROM=0130 WEEKDAYS=ALL"
      job.entrypoint: batch/psl_audit_extract.sh
      controlm.maxrerun: 1
      controlm.incond: PSL_DB_BACKUP-OK
      controlm.outcond: PSL_AUDIT_EXTRACT-OK

  - record_key: SIGNON-AUDIT-RULE-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      GIVEN the extract job is run (or rerun) on a given date WHEN it completes
      THEN it SHALL always cover the day before that run date and SHALL replace any
      file of the same name; an older day SHALL only be re-extracted by running the
      export query manually with the dates changed.
    plain_text: >
      Rerunning the nightly job always re-makes yesterday's file. To get the file
      for an earlier day, an operator has to run the export by hand.
    technical_note: >
      The date is derived from the run clock (`date -d yesterday`, and
      CURRENT_DATE in the SQL); there is no date parameter. `mv` onto $OUT
      overwrites an existing file. Runbook 4.2 documents the manual procedure.
    interface: true
    confidence: medium
    confidence_basis: >
      The run-date derivation is clear in the script and SQL and stated in the
      runbook. The overwrite behaviour is inferred from `mv` semantics rather than
      documented, and the manual procedure is only a runbook instruction.
    risk_class: operational
    basis: >
      Script date derivation and mv; runbook 4.2.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 6
        line_end: 11
        excerpt: |
          DAY=$(date -d yesterday '+%Y%m%d' 2>/dev/null || date -v-1d '+%Y%m%d')
          OUT="$PSL_EXTRACT_DIR/signon_audit_$DAY.csv"
          psl_log "start day=$DAY"
          rm -f "$PSL_EXTRACT_DIR/signon_audit_extract.csv"
          psl_ij "$PSL_SQL/audit_extract.sql" > /dev/null || { psl_log "FAILED: export"; exit 8; }
          mv "$PSL_EXTRACT_DIR/signon_audit_extract.csv" "$OUT"
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 88
        line_end: 90
        excerpt: |
          <h2>4.2 Rerunning the extract</h2>
          <p>The extract always covers the day before the run date. To re-extract an older day, run the export query in
          <code>db/batch/audit_extract.sql</code> by hand with the dates changed.</p>
    stack_metadata:
      job.entrypoint: batch/psl_audit_extract.sh

  - record_key: SIGNON-AUDIT-RULE-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      GIVEN no sign-on audit events occurred on the extracted day WHEN the extract
      runs THEN the system SHALL still produce the dated file, containing only the
      trailer line with a count of 0.
    plain_text: >
      On a day with no sign-in activity the security team still receives a file;
      it just says zero events.
    technical_note: >
      Inferred: Derby SYSCS_EXPORT_QUERY writes an empty file for an empty result,
      the script then renames it, wc -l yields 0 and the trailer is appended. No
      test, sample or document shows a zero-row day.
    interface: true
    confidence: low
    confidence_basis: >
      Read from the control flow plus assumed Derby behaviour for an empty result
      set; no sample, test or document confirms it.
    risk_class: regulated
    basis: >
      Script has no branch for an empty result; trailer is always appended.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 10
        line_end: 15
        excerpt: |
          psl_ij "$PSL_SQL/audit_extract.sql" > /dev/null || { psl_log "FAILED: export"; exit 8; }
          mv "$PSL_EXTRACT_DIR/signon_audit_extract.csv" "$OUT"
          ROWS=$(wc -l < "$OUT" | tr -d ' ')
          echo "TRAILER,$DAY,$ROWS" >> "$OUT"
          psl_log "end OK file=$OUT rows=$ROWS"
          exit 0
    stack_metadata:
      job.entrypoint: batch/psl_audit_extract.sh

findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/data/interface/signon_audit_20261029.csv
    description: >
      No consumer-side specification of the security team's feed exists in the
      source (no transfer mechanism, pickup time, acknowledgement or file
      retention for /var/petstore/extract). The file is only written to a local
      folder. A human needs to confirm how the security team receives it and
      whether old extract files are ever cleaned up.

suspected_defects:
  - capability_key: sign-on-audit
    record_keys: [SIGNON-AUDIT-INT-0001, SIGNON-AUDIT-INT-0003]
    severity: medium
    category: error-swallowed
    title: Extract folder override is ignored by the export and a failed rename still reports success
    description: >
      The export SQL always writes to the hard-coded /var/petstore/extract, while
      the script renames and counts from $PSL_EXTRACT_DIR, which conf/env.sh allows
      to be overridden. The script does not stop on errors (no set -e) and does not
      check the mv result. If the folder is overridden, or the rename fails for
      any other reason, the job still appends a trailer (with an empty count) to a
      new file and ends with exit 0 "end OK", so Control-M marks it OK, the
      security team is not alerted, and the Sunday purge is released.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_extract.sql
        line_start: 10
        line_end: 10
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 11
        line_end: 15
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 8
        line_end: 8
  - capability_key: sign-on-audit
    record_keys: [SIGNON-AUDIT-INT-0001]
    severity: low
    category: other
    title: File date and content day are computed from two different clocks
    description: >
      The file name day comes from the batch host's clock (`date -d yesterday`),
      while the rows selected come from the database's CURRENT_DATE. If the two
      differ in time zone, or the job crosses midnight between the two calls, the
      file name and trailer date can name a different day from the events inside.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 6
