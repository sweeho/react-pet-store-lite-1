      enforces them and returns "The password must be N to M characters."
    interface: false
    confidence: low
    confidence_basis: >
      The existence of the rule is clear from the servlet check and its error message.
      Confidence is low because both places that carry the bounds are redacted, so the values
      cannot be read, and it cannot be confirmed that the config value matches the constant.
    risk_class: regulated
    basis: >
      Range check and error message in CreateUserServlet. The bounds come from UserDAO
      constants that are mirrored by the redacted config keys.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 19
        line_end: 20
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 114
        line_end: 115
        excerpt: |
                      || password.length() > UserDAO.MAX_PASSWORD_LENGTH) {
                      return "The password must be " + UserDAO.MIN_PASSWORD_LENGTH + " to " + UserDAO.MAX_PASSWORD_LENGTH + " characters.";
    stack_metadata:
      config.key: signon.password.minLength, signon.password.maxLength

  - record_key: SIGN-ON-BR-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL end a signed-in session after 15 minutes of inactivity.
    plain_text: >
      A signed-in user who is idle for 15 minutes is signed out.
    technical_note: >
      conf/petstore.properties declares signon.session.timeoutMinutes=15, but the web tier
      does not read it (the file header says so). The enforced value is <session-timeout>15
      in WEB-INF/web.xml.
    interface: false
    confidence: high
    confidence_basis: >
      The config file and the deployment descriptor agree, and the descriptor is the
      enforcing source.
    risk_class: regulated
    basis: >
      web.xml session-config sets 15 minutes.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 21
        line_end: 21
        excerpt: |
          signon.session.timeoutMinutes=15
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/WEB-INF/web.xml
        line_start: 123
        line_end: 125
        excerpt: |
            <session-config>
              <session-timeout>15</session-timeout>
            </session-config>
    stack_metadata:
      config.key: signon.session.timeoutMinutes
      session.scope: servlet container session

  - record_key: SIGN-ON-BR-0002
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL, when the user asks to be remembered at sign-on, store the user name
      in a browser cookie named "bp_signon" that lasts 2 678 400 seconds (31 days), and SHALL
      pre-fill the user name on the sign-on screen from that cookie.
    plain_text: >
      If the user ticks "remember me", the browser keeps their user name for 31 days and fills
      it in on the next sign-on.
    technical_note: >
      conf/petstore.properties declares signon.rememberUsernameCookie=bp_signon and maxAgeSeconds=2678400,
      but nothing reads them. SignOnFilter hard-codes COOKIE_NAME="bp_signon" and
      setMaxAge(2678400), whose code comment says "one month". signon.jsp reads the cookie.
    interface: false
    confidence: high
    confidence_basis: >
      The config file, the filter that sets the cookie, and the screen that reads it all agree.
    risk_class: operational
    basis: >
      SignOnFilter sets the cookie when the remember parameter is present. signon.jsp pre-fills j_username from it.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 22
        line_end: 23
        excerpt: |
          signon.rememberUsernameCookie=bp_signon
          signon.rememberUsernameCookie.maxAgeSeconds=2678400
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 176
        line_end: 179
        excerpt: |
                    Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
                    // set cookie to last for one month
                    userNameCookie.setMaxAge(2678400);
                    hres.addCookie(userNameCookie);
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/signon.jsp
        line_start: 24
        line_end: 25
        excerpt: |
                  <c:when test="${cookie['bp_signon'] != null && cookie['bp_signon'] != ''}">
                   <input class="petstore_form" type="text" size="15" name="j_username" value="<c:out value="${cookie['bp_signon'].value}"/>">
    stack_metadata:
      config.key: signon.rememberUsernameCookie, signon.rememberUsernameCookie.maxAgeSeconds
      jsp.page: signon.jsp

  - record_key: CATALOG-BROWSING-BR-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show catalog listings 2 entries per page by default. GIVEN a listing
      request that names its own page size, WHEN the page is shown, THEN that requested size
      is used instead.
    plain_text: >
      Catalog lists show 2 entries per page unless the link asks for a different number.
    technical_note: >
      conf/petstore.properties declares catalog.pageSize=2, but nothing reads it. The
      enforced default is the literal "2" in category.jsp and product.jsp (and the
      CatalogHelper field default count=2). A `count` request parameter overrides it, with no
      upper bound visible.
    interface: false
    confidence: high
    confidence_basis: >
      The value 2 appears in the config file, in two JSPs and in the bean default, and all
      agree. The config key is the one place that does not drive behaviour.
    risk_class: presentational
    basis: >
      The JSP otherwise-branch sets count=2. CatalogHelper initialises count=2.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 27
        line_end: 27
        excerpt: |
          catalog.pageSize=2
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/category.jsp
        line_start: 25
        line_end: 32
        excerpt: |
           <c:when test="${param.count != null}">
            <c:set value="${param.start}" target="${catalog}" property="start"/>
            <c:set value="${param.count}" target="${catalog}" property="count"/>
           </c:when>
           <c:otherwise>
            <c:set value="0" target="${catalog}" property="start"/>
            <c:set value="2" target="${catalog}" property="count"/>
           </c:otherwise>
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 73
        line_end: 73
        excerpt: |
              private int count = 2;
    stack_metadata:
      config.key: catalog.pageSize
      jsp.page: category.jsp, product.jsp

  - record_key: CATALOG-BROWSING-BR-0002
    kind: business-rule
