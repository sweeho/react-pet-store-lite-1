  - record_key: CATALOG-DATA-INTEGRITY-BR-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The catalog SHALL contain at least 5 categories and at least 28 items.
    plain_text: >
      The store should always have at least 5 categories and 28 items for sale. Today nothing
      checks this, so whether it is a real rule needs confirming.
    technical_note: >
      Stated only as catalog.minCategories=5 and catalog.minItems=28 in
      conf/petstore.properties. Nothing reads these keys. The daily integrity check
      (db/batch/catalog_check.sql) only prints the category and item counts to the log, and
      psl_catalog_check.sh fails the job only on C1-C4 rows, so a low count never fails the
      check.
    interface: false
    confidence: low
    confidence_basis: >
      The thresholds are bare literals in a configuration file with no reader, and no code
      enforces them. The integrity check logs the counts but does not compare them to a
      threshold.
    dispute:
      reason: conflicting-sources
      detail: >
        The configuration states minimum counts. The daily check that would naturally enforce
        them only logs the counts and passes regardless. An SME must decide whether a minimum
        count is a live rule, or whether these keys describe the sample data set only.
    risk_class: operational
    basis: >
      Config keys only. The catalog check computes counts but has no threshold comparison.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 28
        line_end: 29
        excerpt: |
          catalog.minCategories=5
          catalog.minItems=28
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 14
        line_end: 16
        excerpt: |
          -- Totals for the log
          SELECT COUNT(*) AS categories FROM category;
          SELECT COUNT(*) AS items FROM item;
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 16
        line_end: 18
        excerpt: |
          if echo "$OUT" | grep -qE "^C[1-4] "; then
            psl_log "FAILED: integrity check found rows"
            exit 4
    stack_metadata:
      config.key: catalog.minCategories, catalog.minItems
      batch.trigger: PSL_CATALOG_CHECK

  - record_key: SIGN-ON-AUDIT-BR-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL delete sign-on audit events whose timestamp is earlier than midnight
      at the start of the day 90 days before the current date.
    plain_text: >
      Sign-on history is kept for 90 days and then deleted.
    technical_note: >
      Declared as batch.audit.retentionDays=90 in petstore.properties and as
      PSL_AUDIT_RETENTION_DAYS=90 in env.sh, but env.sh does not read the properties file,
      and the env variable is only printed in the job log line. The enforced value is the
      literal -90 in db/batch/audit_purge.sql, measured from CURRENT_DATE cast to a timestamp
      (day granularity).
    interface: false
    confidence: high
    confidence_basis: >
      The same 90 appears in the config file, env.sh, the purge SQL, and the purge script
      header. The SQL is the enforcing source.
    risk_class: regulated
    basis: >
      The DELETE in audit_purge.sql uses TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP)).
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 36
        line_end: 36
        excerpt: |
          batch.audit.retentionDays=90
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 11
        line_end: 11
        excerpt: |
          PSL_AUDIT_RETENTION_DAYS=90
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 5
        line_end: 6
        excerpt: |
          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_purge.sh
        line_start: 6
        line_end: 6
        excerpt: |
          psl_log "start retention=${PSL_AUDIT_RETENTION_DAYS}d"
    stack_metadata:
      config.key: batch.audit.retentionDays, PSL_AUDIT_RETENTION_DAYS
      batch.trigger: PSL_AUDIT_PURGE
      db.object: SIGNON_AUDIT

  - record_key: BATCH-OPERATIONS-BR-0001
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL keep daily database backups, one per calendar day, and SHALL delete a
      dated backup once it is older than the 7-day retention setting.
    plain_text: >
      Daily database backups are kept for about a week, then deleted.
    technical_note: >
      Declared as batch.backup.keepDays=7 in petstore.properties and as
      PSL_BACKUP_KEEP_DAYS=7 in env.sh, which is the one actually used. psl_db_backup.sh
      runs `find -mtime +7`, which removes directories whose age in whole days is greater
      than 7. That is 8 or more full days, so about 8 dated backups are kept.
    interface: false
    confidence: high
    confidence_basis: >
      The config file, the env.sh variable, and the script that uses the variable all agree
      on 7. The exact boundary behaviour of -mtime +7 is noted, not graded.
    risk_class: operational
    basis: >
      The backup script deletes PetStoreDB_* directories with -mtime +$PSL_BACKUP_KEEP_DAYS.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 32
        line_end: 33
        excerpt: |
          batch.backup.dir=/var/petstore/backup
          batch.backup.keepDays=7
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 12
        line_end: 12
        excerpt: |
          PSL_BACKUP_KEEP_DAYS=7
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
        excerpt: |
          find "$PSL_BACKUP_DIR" -maxdepth 1 -name 'PetStoreDB_*' -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf {} \;
    stack_metadata:
      config.key: batch.backup.keepDays, PSL_BACKUP_KEEP_DAYS
      batch.trigger: PSL_DB_BACKUP

  - record_key: BATCH-OPERATIONS-INT-0001
    kind: integration
    capability_key: batch-operations
    requirement: >
      The system SHALL write batch outputs to fixed default locations (backups under
      /var/petstore/backup, extract and report files under /var/petstore/extract, job logs
      under /var/petstore/log), and SHALL allow each location, the installation home, and the
      store address to be overridden by the operating environment.
    plain_text: >
      Nightly jobs put backups, extract files and logs in known folders. Operations can move
      these folders without changing the jobs.
    technical_note: >
      env.sh sets PSL_HOME, PSL_LOG_DIR, PSL_BACKUP_DIR, PSL_EXTRACT_DIR and PSL_STORE_URL with
      ${VAR:-default}, so environment values win. petstore.properties repeats the same
      defaults as batch.*.dir / batch.store.url, but nothing reads them. The audit extract
      CSV and the sign-on report land in PSL_EXTRACT_DIR, which is where other parties pick
      them up.
    interface: true
    confidence: high
    confidence_basis: >
      The config file and env.sh agree on every default, and the batch scripts reference the
      env.sh variables. Who consumes the extract folder is outside this shard.
    risk_class: operational
    basis: >
      The env.sh variable defaults, used by the batch scripts.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 3
        line_end: 9
        excerpt: |
          PSL_HOME=${PSL_HOME:-/opt/petstore}
          PSL_CONF=$PSL_HOME/conf
          PSL_SQL=$PSL_HOME/db/batch
          PSL_LOG_DIR=${PSL_LOG_DIR:-/var/petstore/log}
          PSL_BACKUP_DIR=${PSL_BACKUP_DIR:-/var/petstore/backup}
          PSL_EXTRACT_DIR=${PSL_EXTRACT_DIR:-/var/petstore/extract}
          PSL_STORE_URL=${PSL_STORE_URL:-http://localhost:8080/petstore}
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 32
        line_end: 37
        excerpt: |
          batch.backup.dir=/var/petstore/backup
          batch.backup.keepDays=7
          batch.extract.dir=/var/petstore/extract
          batch.log.dir=/var/petstore/log
          batch.audit.retentionDays=90
          batch.store.url=http://localhost:8080/petstore
    stack_metadata:
      config.file: conf/env.sh (sourced by every batch/*.sh)

  - record_key: BATCH-OPERATIONS-INT-0002
    kind: integration
    capability_key: batch-operations
    requirement: >
      The batch jobs SHALL connect to the store database "PetStoreDB" through its network
      listener on the local host, port 1527, as the store's application user.
    plain_text: >
      Nightly jobs connect to the store's live database over the local network while the
      store is running.
    technical_note: >
      env.sh builds PSL_DB_URL as a Derby network-client URL
      (jdbc:derby://localhost:1527//var/petstore/db/PetStoreDB) with user and password
      embedded. psl_ij runs Derby ij with derbytools/derbyclient 10.14.2.0 from DERBY_LIB.
      petstore.properties also lists an embedded URL and a db.home that nothing in this shard
      uses.
    interface: true
    confidence: high
    confidence_basis: >
      The network URL is identical in the config file and env.sh, and env.sh is the one used
      by psl_ij.
    risk_class: operational
    basis: >
      PSL_DB_URL in env.sh and its use in psl_ij.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 10
        line_end: 12
        excerpt: |
          petstore.db.url.embedded=jdbc:derby:/var/petstore/db/PetStoreDB
          petstore.db.url.network=jdbc:derby://localhost:1527//var/petstore/db/PetStoreDB
          petstore.db.dialect=derby
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 17
        line_end: 22
        excerpt: |
          psl_ij() {
            out=$("$JAVA_CMD" -cp "$DERBY_LIB/derbytools-10.14.2.0.jar:$DERBY_LIB/derbyclient-10.14.2.0.jar" \
                  -Dij.connection.psl="$PSL_DB_URL" -Dij.outfile=/dev/stdout \
                  org.apache.derby.tools.ij "$1" 2>&1)
            echo "$out"
            echo "$out" | grep -q "^ERROR" && return 1
    stack_metadata:
      db.object: PetStoreDB (Apache Derby 10.14.2.0, network server :1527)

  - record_key: BATCH-OPERATIONS-BR-0002
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      Every batch job SHALL write a log line with a timestamp (YYYY-MM-DD HH:MM:SS) and its job
      name to a shared batch log, and SHALL treat a database script step as failed when the
      database tool reports a line beginning with "ERROR".
    plain_text: >
      Each nightly job writes time-stamped lines to a shared job log, and a database step
      counts as failed when the database tool reports an error.
    technical_note: >
      psl_log in env.sh appends "<date> [<PSL_JOB>] msg" to $PSL_LOG_DIR/batch.log and to
      stdout. psl_ij captures ij stdout+stderr and returns 1 only when a line matches ^ERROR.
      Callers map a non-zero return to exit code 8.
    interface: false
    confidence: medium
    confidence_basis: >
      The helpers are defined in one place and are visibly used by the batch scripts. No test
      or second definition confirms them, so the grade is medium.
    risk_class: operational
    basis: >
      The psl_log and psl_ij definitions in env.sh.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 17
        line_end: 31
        excerpt: |
          psl_ij() {
            out=$("$JAVA_CMD" -cp "$DERBY_LIB/derbytools-10.14.2.0.jar:$DERBY_LIB/derbyclient-10.14.2.0.jar" \
                  -Dij.connection.psl="$PSL_DB_URL" -Dij.outfile=/dev/stdout \
                  org.apache.derby.tools.ij "$1" 2>&1)
            echo "$out"
            echo "$out" | grep -q "^ERROR" && return 1
            return 0
          }

          # Write a time-stamped line to the job log and stdout.
          psl_log() {
            echo "$(date '+%Y-%m-%d %H:%M:%S') [$PSL_JOB] $*" | tee -a "$PSL_LOG_DIR/batch.log"
          }
    stack_metadata:
      batch.trigger: shared helper sourced by all batch/*.sh

