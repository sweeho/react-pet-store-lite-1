# Spec extraction SX-0001, pass B, shard j2ee-pet-store-lite/conf
# Sources in shard: conf/petstore.properties (37 lines), conf/env.sh (31 lines).
# No legacy-analysis/sources/**/extracted.md exists in this tree, so there are no
# document trace pointers. Each setting was cross-checked against the code that
# enforces it, because the properties file is not read by any program (see
# suspected_defects).
records:
  - record_key: ACCOUNT-LOCKOUT-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock a customer account when 3 sign-on attempts in a row fail.
    plain_text: >
      Three wrong passwords in a row lock the account.
    technical_note: >
      conf/petstore.properties declares signon.maxFailedAttempts=3 and says it must match
      UserDAO. UserDAO.MAX_FAILED_ATTEMPTS = 3 is the value actually enforced: it increments
      failed_attempts and sets locked='Y' when the count reaches 3. Nothing reads the
      property.
    interface: false
    confidence: high
    confidence_basis: >
      The same value appears in three places: the configuration file, the enforcing Java
      constant, and the comment in the unlock batch SQL. The Java code is the enforcement
      point, and the other two agree with it.
    risk_class: regulated
    basis: >
      The config value 3 is enforced by UserDAO (failedAttempts >= MAX_FAILED_ATTEMPTS sets the lock).
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 14
        line_end: 15
        excerpt: |
          # Sign-on rules (must match UserDAO and CreateUserServlet)
          signon.maxFailedAttempts=3
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 141
        line_end: 146
        excerpt: |
                      failedAttempts++;
                      boolean lockNow = failedAttempts >= MAX_FAILED_ATTEMPTS;
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 2
        line_end: 2
        excerpt: |
          -- Business rule: 3 failed sign-ons in a row lock an account (UserDAO).
    stack_metadata:
      config.key: signon.maxFailedAttempts
      java.constant: UserDAO.MAX_FAILED_ATTEMPTS
      db.object: SIGNON.FAILED_ATTEMPTS, SIGNON.LOCKED

  - record_key: ACCOUNT-LOCKOUT-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock a locked account once its lock is more than 30
      minutes old, resetting the failed-attempt count. GIVEN an account was locked at time T,
      WHEN the periodic unlock run executes after T+30 minutes, THEN the account is unlocked
      and an unlock event is recorded. Because the unlock run is periodic, an account can stay
      locked for longer than 30 minutes, up to 30 minutes plus one run interval.
    plain_text: >
      A locked account unlocks itself about 30 minutes after it was locked. Because the
      unlock check runs every 15 minutes, the real wait can be up to about 45 minutes.
    technical_note: >
      conf/petstore.properties declares signon.unlockAfterMinutes=30, but nothing reads it.
      The enforced value is the literal -30 in db/batch/acct_unlock.sql (strict
      locked_ts < now-30min), run by batch/psl_acct_unlock.sh, whose header says it runs
      every 15 minutes.
    interface: false
    confidence: high
    confidence_basis: >
      The config value matches the hard-coded literal in the unlock SQL, which appears in both
      the audit INSERT and the UPDATE, and the comments in the SQL header agree. The 15-minute
      cadence comes only from a script comment; the scheduler definition is outside this shard.
    risk_class: regulated
    basis: >
      The SQL unlocks rows where locked='Y' and locked_ts is older than 30 minutes, sets
      failed_attempts=0, and writes an ACCOUNT_UNLOCKED audit row.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 16
        line_end: 16
        excerpt: |
          signon.unlockAfterMinutes=30
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 15
        excerpt: |
          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_acct_unlock.sh
        line_start: 2
        line_end: 2
        excerpt: |
          # PSL_ACCT_UNLOCK - every 15 minutes. Unlocks accounts locked > 30 minutes.
    stack_metadata:
      config.key: signon.unlockAfterMinutes
      batch.trigger: PSL_ACCT_UNLOCK (every 15 minutes per script header)
      db.object: SIGNON.LOCKED_TS

  - record_key: ACCOUNT-REGISTRATION-BR-0001
    kind: business-rule
    capability_key: account-registration
    requirement: >
      The system SHALL accept a new user name only when its trimmed length is between 3 and
      25 characters inclusive.
    plain_text: >
      A user name must be 3 to 25 characters long.
    technical_note: >
      conf/petstore.properties declares signon.username.minLength=3 / maxLength=25, but
      nothing reads them. UserDAO.MIN_USERNAME_LENGTH=3 and MAX_USERNAME_LENGTH=25 are
      enforced by CreateUserServlet on the trimmed value.
    interface: false
    confidence: high
    confidence_basis: >
      The config file and the Java constants agree, and the servlet check that uses the
      constants is visible.
    risk_class: operational
    basis: >
      CreateUserServlet rejects userName.trim().length() below MIN or above MAX.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 17
        line_end: 18
        excerpt: |
          signon.username.minLength=3
          signon.username.maxLength=25
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 70
        line_end: 71
        excerpt: |
              public static final int MIN_USERNAME_LENGTH = 3;
              public static final int MAX_USERNAME_LENGTH = 25;
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 103
        line_end: 104
        excerpt: |
                  if (userName == null || userName.trim().length() < UserDAO.MIN_USERNAME_LENGTH
                      || userName.trim().length() > UserDAO.MAX_USERNAME_LENGTH) {
    stack_metadata:
      config.key: signon.username.minLength, signon.username.maxLength

  - record_key: ACCOUNT-REGISTRATION-BR-0002
    kind: business-rule
    capability_key: account-registration
    requirement: >
      The system SHALL accept a new password only when its length is between a configured
      minimum and maximum, and SHALL tell the user the allowed range when it is rejected.
