  - capability_key: batch-operations
    record_keys: [ACCOUNT-LOCKOUT-BR-0001, ACCOUNT-LOCKOUT-BR-0002, ACCOUNT-REGISTRATION-BR-0001, SIGN-ON-BR-0001, SIGN-ON-BR-0002, SIGN-ON-AUDIT-BR-0001, BATCH-OPERATIONS-BR-0001]
    severity: medium
    category: contradicts-document
    title: The settings file claims to drive the batch jobs, but no program reads it
    description: >
      The settings file says the batch scripts read it through env.sh. env.sh never loads
      it: it repeats the values as its own literals. The unlock and purge SQL hard-code 30
      minutes and 90 days, and the web tier hard-codes the sign-on values. Changing a value
      in the settings file therefore changes nothing. Also, the retention setting in env.sh
      only appears in a log line while the purge uses its own literal, so the log can report
      a retention that is not the one applied.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
