  - record_key: INTEG-BR-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL require catalog text in the en_US locale, and the daily integrity
      check SHALL report every item that has no en_US description.
    plain_text: >
      Every catalog item must have an English (US) description; the daily check flags
      any item that lacks one.
    technical_note: >
      Declared as catalog.locale=en_US. Enforced by check C4 in db/batch/catalog_check.sql
      (d.locale = 'en_US'), which psl_catalog_check.sh turns into exit code 4.
    interface: false
    confidence: high
    confidence_basis: >
      Configuration and the integrity-check SQL agree on en_US.
    risk_class: operational
    basis: >
      Property and C4 query both name en_US.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 26
        line_end: 26
        excerpt: |
          catalog.locale=en_US
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 11
        line_end: 13
        excerpt: |
          -- C4: items without an en_US description
          SELECT 'C4' AS chk, i.itemid FROM item i
           WHERE NOT EXISTS (SELECT 1 FROM item_details d WHERE d.itemid = i.itemid AND d.locale = 'en_US');
    stack_metadata:
      config.key: catalog.locale
      batch.trigger: PSL_CATALOG_CHECK

  - record_key: INTEG-BR-0002
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The configuration declares that the catalog SHALL hold at least 5 categories and
      at least 28 items; no component enforces or checks these minimums.
    plain_text: >
      The settings say the catalog should have at least 5 categories and 28 items, but
      nothing actually checks this today.
    technical_note: >
      catalog.minCategories=5 and catalog.minItems=28 in conf/petstore.properties. The
      daily check (catalog_check.sql) only prints COUNT(*) of categories and items for
      the log; psl_catalog_check.sh fails only on C1-C4 rows. No Java or script reads
      these keys.
    interface: false
    confidence: low
    confidence_basis: >
      Bare literals in a configuration file that no code reads; the only related code
      logs the counts without comparing them. Intent is inferred, not enforced.
    dispute:
      reason: unresolved-reachability
      detail: >
        The configuration states minimums, the integrity check computes the totals but
        never compares them. An SME must decide whether the minimums are a real rule
        (then the check is incomplete) or a stale setting (then drop the record).
    risk_class: operational
    basis: >
      Declared in configuration only; catalog_check.sql lines 14-16 compute the counts
      without a threshold.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 28
        line_end: 29
        excerpt: |
          catalog.minCategories=5
          catalog.minItems=28
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 14
        line_end: 16
        excerpt: |
          -- Totals for the log
          SELECT COUNT(*) AS categories FROM category;
          SELECT COUNT(*) AS items FROM item;
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 16
        line_end: 19
        excerpt: |
          if echo "$OUT" | grep -qE "^C[1-4] "; then
            psl_log "FAILED: integrity check found rows"
            exit 4
          fi
    stack_metadata:
      config.key: catalog.minCategories, catalog.minItems

  - record_key: AUDIT-BR-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL delete sign-on audit events older than 90 days, measured from the
      start of the current day.
    plain_text: >
      Sign-on history is kept for 90 days and then deleted.
    technical_note: >
      Declared twice: batch.audit.retentionDays=90 (properties) and
      PSL_AUDIT_RETENTION_DAYS=90 (env.sh). psl_audit_purge.sh only logs the variable;
      the deletion uses the literal -90 days in db/batch/audit_purge.sql against
      CAST(CURRENT_DATE AS TIMESTAMP).
    interface: false
    confidence: high
    confidence_basis: >
      Three sources (properties, env.sh, enforcing SQL) agree on 90 days.
    risk_class: regulated
    basis: >
      Audit-trail retention is a record-keeping rule; 90 is stated in config and
      enforced in SQL.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 36
        line_end: 36
        excerpt: |
          batch.audit.retentionDays=90
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 11
        line_end: 11
        excerpt: |
          PSL_AUDIT_RETENTION_DAYS=90
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 5
        line_end: 6
        excerpt: |
          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};
    stack_metadata:
      config.key: batch.audit.retentionDays
      batch.trigger: PSL_AUDIT_PURGE
      db.object: SIGNON_AUDIT

  - record_key: BATCH-BR-0001
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL keep daily database backups for 7 days and delete older ones
      after each successful backup.
    plain_text: >
      Database backups are kept for a week; older ones are removed automatically.
    technical_note: >
      Declared as batch.backup.keepDays=7 and PSL_BACKUP_KEEP_DAYS=7 (env.sh).
      psl_db_backup.sh runs `find ... -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf` on
      PetStoreDB_* folders. find's -mtime +7 matches only folders 8 or more whole days
      old, so 8 dated backups typically remain (see suspected defects).
    interface: false
    confidence: high
    confidence_basis: >
      The value 7 is in properties and env.sh and is consumed by the backup script; the
      exact count retained depends on find semantics, noted separately.
    risk_class: operational
    basis: >
      Configuration and the purge command in the backup script.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 32
        line_end: 33
        excerpt: |
          batch.backup.dir=/var/petstore/backup
          batch.backup.keepDays=7
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 12
        line_end: 12
        excerpt: |
          PSL_BACKUP_KEEP_DAYS=7
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
        excerpt: |
          find "$PSL_BACKUP_DIR" -maxdepth 1 -name 'PetStoreDB_*' -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf {} \;
    stack_metadata:
      config.key: batch.backup.keepDays
      batch.trigger: PSL_DB_BACKUP

  - record_key: BATCH-REQ-0001
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The batch jobs SHALL write backups to /var/petstore/backup, extract files to
      /var/petstore/extract and logs to /var/petstore/log by default, each overridable
      by the operator's environment, and SHALL append every job log line, prefixed with
      a date-time stamp and the job name, to a shared batch.log.
    plain_text: >
      Nightly jobs put backups, extract files and logs in fixed folders (which operations
      can change), and every job writes time-stamped progress lines to one shared log.
    technical_note: >
      env.sh defaults PSL_BACKUP_DIR, PSL_EXTRACT_DIR, PSL_LOG_DIR with ${VAR:-default};
      the same paths are repeated in petstore.properties batch.* keys but not read from
      there. psl_log() tees "YYYY-MM-DD HH:MM:SS [$PSL_JOB] msg" to $PSL_LOG_DIR/batch.log.
      The extract folder is where the daily sign-on extract file is placed; whether
      another system collects it is not visible in this shard.
    confidence: high
    confidence_basis: >
      Paths agree between properties and env.sh, and env.sh is sourced by every batch
      script (psl_db_backup.sh, psl_audit_purge.sh, psl_catalog_check.sh observed).
    risk_class: operational
    basis: >
      env.sh variable defaults and psl_log function.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 6
        line_end: 8
        excerpt: |
          PSL_LOG_DIR=${PSL_LOG_DIR:-/var/petstore/log}
          PSL_BACKUP_DIR=${PSL_BACKUP_DIR:-/var/petstore/backup}
          PSL_EXTRACT_DIR=${PSL_EXTRACT_DIR:-/var/petstore/extract}
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 28
        line_end: 31
        excerpt: |
          # Write a time-stamped line to the job log and stdout.
          psl_log() {
            echo "$(date '+%Y-%m-%d %H:%M:%S') [$PSL_JOB] $*" | tee -a "$PSL_LOG_DIR/batch.log"
          }
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 32
        line_end: 35
        excerpt: |
          batch.backup.dir=/var/petstore/backup
          batch.backup.keepDays=7
          batch.extract.dir=/var/petstore/extract
          batch.log.dir=/var/petstore/log
    stack_metadata:
      config.key: batch.backup.dir, batch.extract.dir, batch.log.dir

  - record_key: BATCH-REQ-0002
    kind: requirement
    capability_key: batch-operations
    requirement: >
      A batch database step SHALL be treated as failed when the SQL tool's output
      contains a line beginning with "ERROR", and as succeeded otherwise.
    plain_text: >
      A nightly database step counts as failed only when the database tool reports an
      error line.
    technical_note: >
      psl_ij() in env.sh runs Derby ij against PSL_DB_URL (network server,
      localhost:1527), echoes its output and returns 1 only if a line matches ^ERROR.
      The java process exit status is not inspected. Callers map a non-zero return to
      job exit code 8.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear implementation with an explanatory comment; no second enforcement point.
    risk_class: operational
    basis: >
      psl_ij function body and its usage comment.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 17
        line_end: 26
        excerpt: |
          # Run a SQL script with Derby ij against the store database.
          # Usage: psl_ij <script.sql>   Fails when ij reports an ERROR line.
          psl_ij() {
            out=$("$JAVA_CMD" -cp "$DERBY_LIB/derbytools-10.14.2.0.jar:$DERBY_LIB/derbyclient-10.14.2.0.jar" \
                  -Dij.connection.psl="$PSL_DB_URL" -Dij.outfile=/dev/stdout \
                  org.apache.derby.tools.ij "$1" 2>&1)
            echo "$out"
            echo "$out" | grep -q "^ERROR" && return 1
            return 0
          }
    stack_metadata:
      framework: Derby ij
      db.object: PetStoreDB (schema ESTOREUSER)

  - record_key: BATCH-INT-0001
    kind: integration
    capability_key: batch-operations
    requirement: >
      The batch jobs SHALL reach the running store over HTTP at the configured store
      address (default http://localhost:8080/petstore) and the store database through
      the database network listener on localhost port 1527.
    plain_text: >
      The nightly jobs talk to the live store and its database over the network on the
      same server.
    technical_note: >
      PSL_STORE_URL (env.sh, overridable; also batch.store.url in properties) is used by
      psl_catalog_check.sh to call /Populate?forcefully=false. PSL_DB_URL is the Derby
      network client URL jdbc:derby://localhost:1527//var/petstore/db/PetStoreDB with
      credentials inline; the web tier opens the same database embedded
      (META-INF/context.xml) with the Derby network server started inside Tomcat
      (Dockerfile CATALINA_OPTS).
    interface: false
    confidence: high
    confidence_basis: >
      URLs agree between properties and env.sh and are consumed by batch scripts;
      Dockerfile and runbook confirm the network-server arrangement.
    risk_class: operational
    basis: >
      env.sh PSL_STORE_URL and PSL_DB_URL; petstore.properties db and store URLs.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 9
        line_end: 10
        excerpt: |
          PSL_STORE_URL=${PSL_STORE_URL:-http://localhost:8080/petstore}
          PSL_DB_URL="jdbc:derby://localhost:1527//var/petstore/db/PetStoreDB;user=estoreuser;password=****"
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 10
        line_end: 12
        excerpt: |
          petstore.db.url.embedded=jdbc:derby:/var/petstore/db/PetStoreDB
