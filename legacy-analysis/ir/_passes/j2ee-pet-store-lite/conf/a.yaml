# Spec extraction SX-0001, stage extract-a, shard j2ee-pet-store-lite/conf
# Sources in shard: conf/petstore.properties (37 lines), conf/env.sh (31 lines).
# No legacy-analysis/sources/**/extracted.md exists, so no document traces are cited.
# Key observation: petstore.properties is read by no code in the tree (grep for the
# file name and for every key finds only the file itself, README, docs and vortex/).
# Each record therefore cites the property AND the code/SQL that actually enforces
# the value; the property alone is treated as declared intent, not behaviour.
# The DB password in conf/env.sh line 10 is masked as "****" in excerpts below.
records:
  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock a customer account when its consecutive failed
      sign-on count reaches 3.
    plain_text: >
      Three wrong passwords in a row lock the account.
    technical_note: >
      Declared as signon.maxFailedAttempts=3 in conf/petstore.properties (comment says it
      must match UserDAO). Enforced by UserDAO.MAX_FAILED_ATTEMPTS = 3 and the
      failedAttempts >= MAX_FAILED_ATTEMPTS check in UserDAO.authenticate, which sets
      SIGNON.LOCKED='Y' and LOCKED_TS. The property itself is not read.
    interface: false
    confidence: high
    confidence_basis: >
      The value 3 appears in the configuration and in the enforcing Java constant and
      comparison, and is restated in the acct_unlock.sql header comment. Three places agree.
    risk_class: operational
    basis: >
      Property and Java constant both state 3; the >= comparison means the third failure
      locks.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 14
        line_end: 15
        excerpt: |
          # Sign-on rules (must match UserDAO and CreateUserServlet)
          signon.maxFailedAttempts=3
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 69
        line_end: 69
        excerpt: |
              public static final int MAX_FAILED_ATTEMPTS = 3;
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 141
        line_end: 142
        excerpt: |
                      failedAttempts++;
                      boolean lockNow = failedAttempts >= MAX_FAILED_ATTEMPTS;
    stack_metadata:
      config.key: signon.maxFailedAttempts
      db.object: SIGNON.FAILED_ATTEMPTS, SIGNON.LOCKED

  - record_key: LOCK-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock an account whose lock was set more than
      30 minutes earlier, resetting its failed sign-on count to zero.
    plain_text: >
      A locked account unlocks itself once it has been locked for more than 30 minutes.
    technical_note: >
      Declared as signon.unlockAfterMinutes=30 in conf/petstore.properties. Actually
      enforced by db/batch/acct_unlock.sql (PSL_ACCT_UNLOCK batch job), which hard-codes
      TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP). The unlock therefore happens
      at the next batch run after the 30 minutes elapse, not at exactly 30 minutes; the
      job schedule is outside this shard.
    interface: false
    confidence: high
    confidence_basis: >
      Configuration value and the enforcing SQL (twice, in the audit insert and the
      update) agree on 30 minutes. The run frequency of the unlock job was not checked
      in this shard, so the effective unlock delay is not established here.
    risk_class: operational
    basis: >
      Property 30 and the SQL literal -30 minutes on locked_ts.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 16
        line_end: 16
        excerpt: |
          signon.unlockAfterMinutes=30
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 15
        excerpt: |
          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
    stack_metadata:
      config.key: signon.unlockAfterMinutes
      batch.trigger: PSL_ACCT_UNLOCK
      db.object: SIGNON.LOCKED_TS

