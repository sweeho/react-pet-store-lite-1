  - record_key: SIGN-BR-0002
    kind: business-rule
    capability_key: sign-on
    requirement: >
      WHEN a user signs on with "remember my user name" selected THEN the system SHALL
      store the user name in a browser cookie named bp_signon that expires after
      2 678 400 seconds (31 days), and SHALL pre-fill the sign-on user name from it.
    plain_text: >
      If the user ticks "remember me", their user name is remembered on that browser for
      31 days and filled in next time.
    technical_note: >
      Declared as signon.rememberUsernameCookie=bp_signon and maxAgeSeconds=2678400.
      Enforced by SignOnFilter.COOKIE_NAME and setMaxAge(2678400) (code comment says
      "one month"); signon.jsp reads cookie['bp_signon'] to pre-fill j_username.
    interface: false
    confidence: high
    confidence_basis: >
      Cookie name and lifetime agree between configuration and SignOnFilter; the JSP
      confirms the read side.
    risk_class: presentational
    basis: >
      Property values match the Java constant and the setMaxAge literal.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 22
        line_end: 23
        excerpt: |
          signon.rememberUsernameCookie=bp_signon
          signon.rememberUsernameCookie.maxAgeSeconds=2678400
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 174
        line_end: 178
        excerpt: |
                  if (rememberUserName != null) {
                    // set a cookie with the username in it
                    Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
                    // set cookie to last for one month
                    userNameCookie.setMaxAge(2678400);
    stack_metadata:
      config.key: signon.rememberUsernameCookie, signon.rememberUsernameCookie.maxAgeSeconds
