findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
    description: >
      The password length bounds (lines 19-20) and the database password (line 9) are
      redacted, as are the matching UserDAO constants. An SME must supply the password
      length bounds for REG-BR-0002; the extraction cannot state them.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
    description: >
      petstore.db.name, db.home, db.user and db.dialect describe the store database
      (Derby PetStoreDB under /var/petstore/db, user estoreuser). These are deployment
      facts, not business rules, and produced no record. A human should confirm the
      rebuild does not need them as requirements.

suspected_defects:
  - capability_key: batch-operations
    record_keys: [LOCK-BR-0001, LOCK-BR-0002, REG-BR-0001, SIGN-BR-0001, SIGN-BR-0002, BROWSE-BR-0001, AUDIT-BR-0001, BATCH-BR-0001]
    severity: medium
    category: contradicts-document
    title: The settings file is not read by anything, so changing it changes nothing
    description: >
      The header of petstore.properties says it is read by the batch scripts through
      env.sh. env.sh does not read it; it hard-codes its own copies of the values. The
      web-tier rules (lockout count, user-name length, session timeout, cookie, page
      size) are hard-coded in Java and web.xml, and the unlock delay and audit retention
      are hard-coded in SQL. Today the two copies agree, but an operator who edits the
      settings file gets no change in behaviour.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 1
        line_end: 3
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 1
        line_end: 15
  - capability_key: sign-on-audit
    record_keys: [AUDIT-BR-0001]
    severity: low
    category: other
    title: Audit retention setting is logged but not used by the purge
    description: >
      The purge job logs "retention=${PSL_AUDIT_RETENTION_DAYS}d", implying the value
      controls the purge, but the delete statement uses a fixed 90 days. Changing the
      variable changes the log line only.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 11
        line_end: 11
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_purge.sh
        line_start: 6
        line_end: 7
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 5
        line_end: 6
  - capability_key: batch-operations
    record_keys: [BATCH-BR-0001]
    severity: low
    category: other
    title: Backups are kept one day longer than the configured 7 days
    description: >
      Retention uses find -mtime +7, which only matches folders at least 8 whole days
      old. With one backup a day, eight dated backups normally remain, not seven.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 12
        line_end: 12
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
  - capability_key: catalog-data-integrity
    record_keys: [INTEG-BR-0002]
    severity: low
    category: other
    title: Declared catalog minimums are never checked
    description: >
      The settings declare at least 5 categories and 28 items, and the daily integrity
      check counts both, but it never compares the counts against those minimums. A
      catalog with fewer categories or items passes the check.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 28
        line_end: 29
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 14
        line_end: 16
  - capability_key: batch-operations
    record_keys: [BATCH-INT-0001, BATCH-REQ-0002]
    severity: high
    category: other
    title: Database password stored in plain text and passed on the command line
    description: >
      env.sh hard-codes the database user and password inside PSL_DB_URL (the value was
      not redacted, unlike petstore.properties and context.xml). psl_ij passes the URL as
      a -D system property, so the password is visible in the process list to any local
      user while a job runs. The Dockerfile starts the database listener on 0.0.0.0:1527.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 10
        line_end: 10
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 20
        line_end: 22
      - path: legacy-source/j2ee-pet-store-lite/Dockerfile
        line_start: 22
        line_end: 23
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0002]
    severity: low
    category: error-swallowed
    title: A database step is judged only by its printed output, not its exit status
    description: >
      psl_ij ignores the exit status of the Java/ij process and fails only when an output
      line starts with "ERROR". A failure that prints differently (for example the JVM
      failing to start because the jar path is wrong) is reported as success.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 20
        line_end: 25
