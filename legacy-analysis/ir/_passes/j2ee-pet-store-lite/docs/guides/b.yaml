# Spec extraction SX-0001, pass B, shard j2ee-pet-store-lite/docs/guides
# Sources: the three HTML guides in this shard (user guide PSL-UG-01,
# administrator guide PSL-AG-01, operations runbook PSL-RB-01). No
# legacy-analysis/sources/**/extracted.md existed in the tree, so the guides
# are cited directly as document traces (kind: document, with an anchor naming
# the section heading) and also carry line ranges in the HTML file.
# Confidence grades are about the document evidence; where a claim was
# spot-checked against code/config in this pass, the basis says so.
records:
  # ---------------------------------------------------------------- browsing
  - record_key: BROW-SCR-0001
    kind: screen
    capability_key: catalog-browsing
    requirement: >
      Every page SHALL show a banner with the store logo linking to the home page, a
      keyword search box, an Account link and a Sign in link (Sign out when signed in,
      with the text "Signed in as <user name>"), a Pets side bar listing one link per
      category in alphabetical order, the requested page body, and a footer.
    plain_text: >
      Every page has the same frame: logo, search box, account and sign-in/out links at
      the top, the list of pet categories in alphabetical order on the left, and a footer.
    technical_note: >
      Documented in the user guide section 1.1. The admin guide states 15 screens share
      one template (screen definitions file). Not verified against templates in this pass.
    confidence: medium
    confidence_basis: >
      One clear documentary statement; the shared-template claim in the admin guide is
      consistent with it, but I did not read the template JSP in this pass.
    risk_class: presentational
    interface: false
    basis: User guide 1.1 "Page layout" lists the four parts of every page.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "1.1 Page layout"
        line_start: 27
        line_end: 36
        excerpt: |2
          <h2>1.1 Page layout</h2>
          <p>Every page has the same four parts:</p>
           <li><b>Pets</b> side bar on the left: one link per category, in alphabetical order.</li>
    stack_metadata:
      framework: j2ee-web-template

