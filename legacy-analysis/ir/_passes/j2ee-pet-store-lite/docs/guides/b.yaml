  # ------------------------------------------------------------------ search
  - record_key: SRCH-BR-0001
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      Keyword search SHALL match an item when a search word appears anywhere (substring)
      in the product name, the category code or the item description, ignoring case;
      when several space-separated words are given, items matching ANY word SHALL be
      returned.
    plain_text: >
      Search finds items whose product name, category code or description contains any
      of the typed words, even partially, regardless of upper/lower case.
    technical_note: >
      User guide section 4. CatalogDAOSQL.xml SEARCH_ITEMS (derby and oracle variants)
      applies lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?, with a
      VARIABLE fragment per extra word (spot-checked).
    confidence: high
    confidence_basis: >
      The guide's matching rules agree with the SEARCH_ITEMS SQL read in this pass
      (lower() on all three columns, LIKE predicates) — document plus code.
    risk_class: operational
    interface: false
    basis: User guide 4 "How search matches" bullets 1-3.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "4. Searching"
        line_start: 90
        line_end: 93
        excerpt: |2
           <li>A word matches when it appears anywhere in the product name, the category code (for example DOGS) or the item description.
           Part of a word is enough: <i>dog</i> finds Bulldog and every item in the DOGS category.</li>
           <li>When you type several words separated by spaces, items that match <b>any</b> of the words are listed.</li>
           <li>Search is not case-sensitive.</li>
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml
        line_start: 119
        line_end: 119
        excerpt: |2
                              where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
    stack_metadata:
      db.object: CatalogDAOSQL.xml#SEARCH_ITEMS

