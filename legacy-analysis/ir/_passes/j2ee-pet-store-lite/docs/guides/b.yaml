findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
    description: >
      User guide 3.3 says Your Price is "the discounted price for members", but no guide
      states the discount rule, whether it depends on being signed in, or how it is
      rounded. A human must confirm where Your Price comes from (stored value or
      calculation) before this is specified; see BROW-SCR-0002.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
    description: >
      Admin guide 4 lists signon_welcome.screen as a protected page, but no guide
      describes what that screen is or who sees it. Needs confirmation from the screen
      definitions.

suspected_defects:
  - capability_key: sign-on
    record_keys: [SIGN-ENT-0001]
    severity: high
    category: other
    title: Passwords are stored in plain text
    description: >
      The administrator guide states passwords are stored as entered in the account
      table, and the sample accounts use passwords equal to or derived from the user
      name. Anyone with database or backup access can read every customer's password.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "1.2 Sample accounts"
        line_start: 45
        line_end: 45
  - capability_key: sample-data-population
    record_keys: [POP-WF-0002]
    severity: medium
    category: data-corruption
    title: Forced reload deletes all real accounts and sign-in history with only a warning
    description: >
      The administrator reload drops the account and audit tables along with the catalog,
      erasing every self-registered customer and all audit history (which the security
      team relies on for 90 days). The only safeguard is a documented advice to take a
      backup first; the backup is not taken automatically.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "3.2 Reload the sample data"
        line_start: 84
        line_end: 87
  - capability_key: sign-on-audit
    record_keys: [AUD-INT-0001, LOCK-REQ-0001]
    severity: low
    category: contradicts-document
    title: Manual unlock writes a client address value the extract layout does not list
    description: >
      The documented manual unlock inserts an audit row with client address 'admin',
      while the extract file layout says column 5 holds either a client address or
      batch:PSL_ACCT_UNLOCK. A consumer of the extract can receive a third, undocumented
      value.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "2.1 Unlock an account at once"
        line_start: 63
        line_end: 65
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.2 PSL_AUDIT_EXTRACT"
        line_start: 55
        line_end: 55
  - capability_key: sign-on-audit
    record_keys: [AUD-INT-0001, BAT-WF-0001]
    severity: medium
    category: other
    title: A missed extract day is not recovered automatically
    description: >
      The extract always covers the day before the run date. If the backup fails after
      its reruns, the extract waits; when it is later released or the next night runs,
      the missed day is not exported unless someone hand-edits the query. The security
      team's feed can silently miss a day.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "4.2 Rerunning the extract"
        line_start: 88
        line_end: 90
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.1 PSL_DB_BACKUP"
        line_start: 44
        line_end: 44
  - capability_key: batch-operations
    record_keys: [BAT-BR-0001]
    severity: low
    category: contradicts-document
    title: Backup retention keeps about 8 days, not 7
    description: >
      The runbook says backups older than 7 days are deleted. The script uses find
      -mtime +7, which only matches files whose age, rounded down to whole days, exceeds
      7, so a backup survives until it is at least 8 full days old.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.1 PSL_DB_BACKUP"
        line_start: 43
        line_end: 43
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
