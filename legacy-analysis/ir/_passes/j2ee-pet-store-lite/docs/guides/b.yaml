      and logs start/end via psl_log to /var/petstore/log/batch.log (spot-checked).
    confidence: high
    confidence_basis: Runbook table plus the exit-8 and psl_log behaviour seen in a batch script and env.sh.
    risk_class: operational
    interface: true
    basis: Runbook 4 exit-code table.
    traces:
