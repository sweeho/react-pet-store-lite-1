           <li>If nothing matches, or the box is empty, the page shows <i>No results were found for your search.</i></li>

  # ------------------------------------------------------ catalog data rules
  - record_key: CDI-BR-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The catalog SHALL satisfy: (C1) every category has at least one product; (C2)
      every product has at least one item; (C3) an item's list price is never below its
      unit cost; (C4) every item has an en_US description.
    plain_text: >
      No empty categories, no products without items, no item priced below its cost,
      and every item has an English description.
    technical_note: >
      Administrator guide 3.3 rules C1-C4; C3 is stated to be a database check
      constraint. The other three are only checked by the daily batch (see CDI-WF-0001).
    confidence: medium
    confidence_basis: >
      Stated in one document table (and referenced by the runbook). I did not read the
      DDL check constraint for C3 or catalog_check.sql in this pass.
    risk_class: financial
    interface: false
    basis: Admin guide 3.3 rule table.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "3.3 Catalog data rules"
        line_start: 91
        line_end: 98
        excerpt: |2
           <tr><td>C1</td><td>Every category has at least one product.</td></tr>
           <tr><td>C2</td><td>Every product has at least one item.</td></tr>
           <tr><td>C3</td><td>An item's list price is never below its unit cost (database check constraint).</td></tr>
           <tr><td>C4</td><td>Every item has an en_US description.</td></tr>

  - record_key: CDI-WF-0001
    kind: workflow
    capability_key: catalog-data-integrity
    requirement: >
      A catalog check SHALL run daily at 06:00 and evaluate rules C1-C4. GIVEN the
      catalog tables do not exist WHEN the check runs THEN it SHALL trigger a first load
      of the sample data and check again. WHEN any rule finds violating rows THEN the
      job SHALL end with exit code 4 and the catalog team SHALL be alerted by mail, with
      details written to the catalog check log.
    plain_text: >
      Every morning at 6 the catalog is checked against its data rules; any breach ends
      the job with a warning code and emails the catalog team. If the catalog is missing
      entirely, it is loaded first.
    technical_note: >
      Runbook 2 (schedule), 3.5 and 4; admin guide 3.3 last paragraph. Job
      PSL_CATALOG_CHECK, psl_catalog_check.sh, calls
      http://localhost:8080/petstore/Populate?forcefully=false when tables are missing.
      Control-M mails psl-catalog. Log /var/petstore/log/catalog_check.log.
    confidence: high
    confidence_basis: >
      Stated consistently in two independent documents (admin guide 3.3 and runbook
      3.5/4). Not traced into the shell script in this pass.
    risk_class: operational
    interface: true
    basis: Runbook 3.5 and exit-code table; admin guide 3.3.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.5 PSL_CATALOG_CHECK"
        line_start: 66
        line_end: 69
        excerpt: |2
          <h2>3.5 PSL_CATALOG_CHECK</h2>
          <p>Runs catalog checks C1 to C4 (see the Administrator Guide). If the catalog tables do not exist it calls
          <code>http://localhost:8080/petstore/Populate?forcefully=false</code> to load the sample data, then checks again.
          Exit code 4 means a check found rows; Control-M mails psl-catalog. Details are in <code>/var/petstore/log/catalog_check.log</code>.</p>
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "3.3 Catalog data rules"
        line_start: 99
        line_end: 99
        excerpt: |2
          <p>Job PSL_CATALOG_CHECK checks C1 to C4 every morning at 06:00 and alerts the catalog team when one fails.</p>
    stack_metadata:
      batch.trigger: "Control-M PSL_PETSTORE_DAILY 06:00"

