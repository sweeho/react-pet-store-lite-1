      population; GIVEN the catalog and account tables already hold data THEN nothing
      SHALL change; OTHERWISE every store table SHALL be dropped, created and loaded from
      the sample data file, without requiring sign-in, while a "Please wait while the
      Java Pet Store Application is being populated..." message is shown.
    plain_text: >
      The first visit to a freshly installed store loads the sample catalog and accounts
      automatically; later visits change nothing.
    technical_note: >
      User guide 2 step 2; admin guide 3.1 (Populate?forcefully=false). PopulateServlet
      populate(): alreadyPopulated = catalogPopulator.check && userPopulator.check;
      population runs when forcefully || !alreadyPopulated (spot-checked).
