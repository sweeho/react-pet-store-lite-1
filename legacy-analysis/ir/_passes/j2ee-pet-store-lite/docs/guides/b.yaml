      page SHALL list its items with attribute, name, description and list price.
    plain_text: >
      Shoppers drill down from a category (e.g. Dogs) to a product (e.g. Bulldog) to an
      individual item (e.g. Male Adult Bulldog).
    technical_note: >
      User guide sections 3, 3.1, 3.2. Catalog SQL statements GET_CATEGORY..GET_ITEMS
      are named in the admin guide configuration table (CatalogDAOSQL.xml).
    confidence: medium
    confidence_basis: Stated in one document section with examples; not traced to the page code in this pass.
    risk_class: presentational
    interface: false
    basis: User guide section 3 table of catalog levels and sections 3.1-3.2.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "3. Browsing the catalog"
        line_start: 48
        line_end: 56
        excerpt: |2
           <tr><td>Category</td><td>Dogs</td><td>Lists the products in the category</td></tr>
           <tr><td>Product</td><td>Bulldog (K9-BD-01)</td><td>Lists the items of the product with their list price</td></tr>
           <tr><td>Item</td><td>Male Adult Bulldog (EST-6)</td><td>Shows the picture, List Price, Your Price, description and Item ID</td></tr>

