      batch.trigger: "Control-M PSL_PETSTORE_DAILY Sunday 02:00, waits PSL_AUDIT_EXTRACT-OK"

  # ------------------------------------------------------ batch operations
  - record_key: BAT-WF-0001
    kind: workflow
    capability_key: batch-operations
    requirement: >
      The nightly chain SHALL run in this order: database backup at 01:00; audit extract
      at 01:30 only after the backup succeeded; sign-on report at 01:45 and (Sundays) audit
      purge at 02:00, each only after the extract succeeded. The catalog check (06:00
      daily) and the unlock job (every 15 minutes) SHALL run independently of the chain.
    plain_text: >
      Each night the store backs up its database, then exports sign-in history, then
      produces a report and (on Sundays) purges old history; each step waits for the one
      before it to succeed.
    technical_note: >
      Runbook 2 schedule table and diagram; Control-M definitions in
      scheduler/control-m/PSL_PETSTORE.xml (folders PSL_PETSTORE_DAILY and
      PSL_PETSTORE_CYCLIC, data center DC_PSL_PRD, node psl-app01).
    confidence: medium
    confidence_basis: One document (table and diagram agree internally); the Control-M XML was not read in this pass.
    risk_class: operational
    interface: true
    basis: Runbook 2.
    traces:
