  - record_key: BAT-BR-0001
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The database SHALL be backed up online daily into a dated backup folder
      (PetStoreDB_YYYYMMDD); backups older than 7 days SHALL be deleted. GIVEN the backup
      fails THEN it SHALL be retried up to 2 times, 10 minutes apart; on final failure
      operations SHALL be mailed and the audit extract SHALL not run.
    plain_text: >
      The database is backed up every night and a week of backups is kept; a failed backup
      is retried twice, then operations are alerted and the rest of the night's chain
      waits.
    technical_note: >
      Runbook 3.1 and settings table. batch/psl_db_backup.sh deletes with find -mtime
      +$PSL_BACKUP_KEEP_DAYS (7); SYSCS_UTIL.SYSCS_BACKUP_DATABASE via db_backup.sql.
      Reruns/mail are Control-M settings (mail psl-ops).
    confidence: high
    confidence_basis: Runbook statement plus the 7-day keep setting and deletion command in the backup script read in this pass; rerun policy is document only.
    risk_class: operational
    interface: false
    basis: Runbook 3.1.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "3.1 PSL_DB_BACKUP"
        line_start: 41
        line_end: 44
        excerpt: |2
          <p>Online backup of PetStoreDB with <code>SYSCS_UTIL.SYSCS_BACKUP_DATABASE</code> (<code>db/batch/db_backup.sql</code>).
          The backup is moved to <code>/var/petstore/backup/PetStoreDB_YYYYMMDD</code>. Backups older than 7 days are deleted.
          Critical job: up to 2 reruns 10 minutes apart; on failure Control-M mails psl-ops and PSL_AUDIT_EXTRACT stays waiting.</p>
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
        excerpt: |2
          find "$PSL_BACKUP_DIR" -maxdepth 1 -name 'PetStoreDB_*' -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf {} \;

  - record_key: BAT-BR-0002
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      Batch jobs SHALL end with exit code 0 on success, 4 when the catalog check finds bad
      catalog data, and 8 on a SQL or file error; each job SHALL write one line at start
      and end to the shared batch log.
    plain_text: >
      Batch jobs report success, "bad catalog data" or "technical error" through a fixed
