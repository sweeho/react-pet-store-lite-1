        anchor: "User Guide PSL-UG-01 §1.1 Page layout"
        line_start: 28
        line_end: 36
        excerpt: "<p>Every page has the same four parts:</p>\n<ul>\n <li><b>Banner</b> at the top: the Java Pet Store logo (returns to the home page), the <b>Search</b> box,\n and the links <b>Account</b> and <b>Sign in</b> (or <b>Sign out</b> when you are signed in). When you are signed in\n the banner shows <i>Signed in as &lt;user name&gt;</i>.</li>\n <li><b>Pets</b> side bar on the left: one link per category, in alphabetical order.</li>\n <li><b>Body</b> in the middle: the page you asked for.</li>\n <li><b>Footer</b> at the bottom.</li>\n</ul>\n"
