  - record_key: "SEARCH-REQ-0001"
    kind: "requirement"
    capability_key: "catalog-search"
    requirement: "The system SHALL match a search word when it appears anywhere (as a substring) in the product name, the category code or the item description, for items in the current locale."
    plain_text: "A search word matches an item if it appears anywhere in the product name, the category code (such as DOGS) or the item description; part of a word is enough, so 'dog' finds Bulldog and every dog."
    technical_note: "User Guide §4. CatalogDAOSQL.xml SEARCH_ITEMS compares lower(name), lower(catid) and lower(b.descn) with LIKE; GenericCatalogDAO wraps each keyword in '%...%'."
    confidence: "high"
    confidence_basis: "The guide and the SQL statement plus the DAO wildcarding agree on the fields and the substring match."
    risk_class: "presentational"
    basis: "User Guide §4 'How search matches' first bullet; SEARCH_ITEMS statement."
    traces:
      - kind: "document"
        path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        anchor: "User Guide PSL-UG-01 §4 Searching"
        line_start: 90
        line_end: 91
        excerpt: " <li>A word matches when it appears anywhere in the product name, the category code (for example DOGS) or the item description.\n Part of a word is enough: <i>dog</i> finds Bulldog and every item in the DOGS category.</li>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml"
        line_start: 119
        line_end: 119
        excerpt: "                    where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java"
        line_start: 362
        line_end: 365
        excerpt: "        for (int i = 0; i < keywords.length; i++) {\n          parameterValues[(i * 3) + 1] = \"%\" + keywords[i] + \"%\";\n          parameterValues[(i * 3) + 2] = \"%\" + keywords[i] + \"%\";\n          parameterValues[(i * 3) + 3] = \"%\" + keywords[i] + \"%\";\n"
    stack_metadata:
      source: "docs/guides"
      db.object: "CatalogDAOSQL.xml SEARCH_ITEMS"
  - record_key: "SEARCH-BR-0002"
    kind: "business-rule"
    capability_key: "catalog-search"
    requirement: "WHEN a search contains several words separated by spaces THEN the system SHALL list items that match ANY of the words."
    plain_text: "When several words are typed, items matching any one of them are listed."
    technical_note: "User Guide §4. The query is split on whitespace (StringTokenizer into a set, so duplicates collapse) and SEARCH_ITEMS repeats an OR-ed fragment per keyword."
    confidence: "high"
    confidence_basis: "Doc plus the OR-ed variable SQL fragment and tokenisation code."
    risk_class: "presentational"
    basis: "User Guide §4 second bullet."
    traces:
      - kind: "document"
        path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        anchor: "User Guide PSL-UG-01 §4 Searching"
        line_start: 92
        line_end: 92
        excerpt: " <li>When you type several words separated by spaces, items that match <b>any</b> of the words are listed.</li>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml"
        line_start: 121
        line_end: 123
        excerpt: "            <SQLFragment parameterNb=\"3\" occurrence=\"VARIABLE\">\n                or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)  \n            </SQLFragment>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java"
        line_start: 346
        line_end: 350
        excerpt: "      Collection keywordSet = new HashSet();\n      StringTokenizer tokenizer = new StringTokenizer(searchQuery);\n      while (tokenizer.hasMoreTokens()) {\n        keywordSet.add(tokenizer.nextToken());\n      }\n"
    stack_metadata:
      source: "docs/guides"
  - record_key: "SEARCH-BR-0003"
    kind: "business-rule"
    capability_key: "catalog-search"
    requirement: "The system SHALL compare search words with the lower-cased product name, category code and item description without lower-casing the typed words; GIVEN a typed word containing an upper-case letter WHEN searching THEN it does not match text that contains that word only in a different case."
    plain_text: "Search compares the typed words against lower-case catalog text, so a word typed in lower case finds matches regardless of case, but a word typed with capitals (for example 'Dog') finds nothing. The User Guide says search is not case-sensitive."
    technical_note: "SEARCH_ITEMS applies lower() to the columns only; GenericCatalogDAO passes each keyword as typed ('%' + keyword + '%') with no toLowerCase anywhere in the search path. User Guide §4 states search is not case-sensitive."
    confidence: "medium"
    confidence_basis: "The code path is clear in one place (SQL plus DAO), but it directly contradicts the user guide; the live behaviour depends on the database collation for LIKE, which was not verified."
    dispute:
      reason: "contradicts-docs"
      detail: "The User Guide says search is not case-sensitive. The SQL lower-cases only the columns, and the Java passes keywords unchanged, so 'Dog' should match nothing on a case-sensitive LIKE (Derby default). A search for 'Dog' against the running store, or the sample search cases, would settle which behaviour is live and which one the business wants."
    risk_class: "presentational"
    basis: "SQL lower() on columns only versus User Guide §4 'Search is not case-sensitive.'"
    traces:
      - kind: "document"
        path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        anchor: "User Guide PSL-UG-01 §4 Searching"
        line_start: 93
        line_end: 93
        excerpt: " <li>Search is not case-sensitive.</li>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml"
        line_start: 119
        line_end: 119
        excerpt: "                    where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java"
        line_start: 362
        line_end: 365
        excerpt: "        for (int i = 0; i < keywords.length; i++) {\n          parameterValues[(i * 3) + 1] = \"%\" + keywords[i] + \"%\";\n          parameterValues[(i * 3) + 2] = \"%\" + keywords[i] + \"%\";\n          parameterValues[(i * 3) + 3] = \"%\" + keywords[i] + \"%\";\n"
    stack_metadata:
      source: "docs/guides"
