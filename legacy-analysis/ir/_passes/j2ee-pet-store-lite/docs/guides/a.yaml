      - kind: "document"
        path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        anchor: "User Guide PSL-UG-01 §3 Browsing the catalog"
        line_start: 49
        line_end: 56
        excerpt: "<p>The catalog has three levels:</p>\n<table class=\"grid\">\n <tr><th>Level</th><th>Example</th><th>Page</th></tr>\n <tr><td>Category</td><td>Dogs</td><td>Lists the products in the category</td></tr>\n <tr><td>Product</td><td>Bulldog (K9-BD-01)</td><td>Lists the items of the product with their list price</td></tr>\n <tr><td>Item</td><td>Male Adult Bulldog (EST-6)</td><td>Shows the picture, List Price, Your Price, description and Item ID</td></tr>\n</table>\n<p>The store has five categories: Birds, Cats, Dogs, Fish and Reptiles.</p>\n"
