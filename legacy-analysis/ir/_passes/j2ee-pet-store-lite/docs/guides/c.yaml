# SX-0001 extract-c (tie-breaker) for shard j2ee-pet-store-lite/docs/guides
# Read independently of passes A and B. Sources: the three guides in docs/guides
# (PSL-UG-01 User Guide, PSL-AG-01 Administrator Guide, PSL-RB-01 Operations Runbook),
# each requirement cross-checked against the code/config that implements it.
# No legacy-analysis/sources/**/extracted.md exists in the tree, so document traces
# point at the guide HTML in legacy-source with an anchor naming the section.
records:

  # ---------------------------------------------------------------- catalog-browsing
  - record_key: CB-SCR-0001
    kind: screen
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show the same layout on every page: a banner holding the store logo
      (linking to the home page), a search box and the Account and Sign in links (Sign out
      plus "Signed in as <user name>" when signed in); a Pets side bar with one link per
      category in alphabetical order; the requested page body; and a footer.
    plain_text: >
      Every page has the same frame: a top banner with the logo, search, and account and
      sign-in links; a left side bar listing the pet categories alphabetically; the page
      itself; and a footer.
    technical_note: >
      Documented in the User Guide section 1.1. The Admin Guide says the screens are 15
      screen definitions on one template (WEB-INF/screendefinitions_en_US.xml). This pass
      did not open the template JSPs to confirm the alphabetical ordering of the side bar.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear document statement. The template and banner JSPs were not read in this
      pass, so the alphabetical ordering and the "Signed in as" text are not code-confirmed.
    risk_class: presentational
    basis: User Guide 1.1 Page layout describes the four parts of every page.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "PSL-UG-01 §1.1 Page layout"
        line_start: 27
        line_end: 36
        excerpt: |2
          <h2>1.1 Page layout</h2>
          <p>Every page has the same four parts:</p>
          <ul>
           <li><b>Banner</b> at the top: the Java Pet Store logo (returns to the home page), the <b>Search</b> box,
           and the links <b>Account</b> and <b>Sign in</b> (or <b>Sign out</b> when you are signed in). When you are signed in
           the banner shows <i>Signed in as &lt;user name&gt;</i>.</li>
           <li><b>Pets</b> side bar on the left: one link per category, in alphabetical order.</li>
           <li><b>Body</b> in the middle: the page you asked for.</li>
           <li><b>Footer</b> at the bottom.</li>
