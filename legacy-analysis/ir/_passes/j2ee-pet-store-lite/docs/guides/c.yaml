suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CB-REQ-0001]
    severity: high
    category: contradicts-document
    title: 'The "Your Price" figure shows the item''s cost price to every visitor'
    description: >
      The User Guide says Your Price is the discounted price for members. The item page shows
      the item's unit cost (the figure the catalog check compares list price against) as Your
      Price, to anonymous and signed-in visitors alike; search results show the same unit cost.
      No member price exists in the code read.
    traces:
