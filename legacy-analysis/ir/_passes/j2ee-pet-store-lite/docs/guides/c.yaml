  - record_key: SOA-INT-0001
    kind: integration
    capability_key: sign-on-audit
    requirement: >
      The system SHALL produce, every day at 01:30 after a successful backup, a file
      signon_audit_YYYYMMDD.csv for the security team containing every audit event dated the
      previous calendar day (00:00 inclusive to 24:00 exclusive), ordered by event number,
      with the columns audit_id, username, event_type, event_ts, remote_addr, comma-separated
      with no header row, followed by a last line "TRAILER,YYYYMMDD,<row count>" whose count
      excludes the trailer. GIVEN the extract fails THEN the security team SHALL be alerted.
      The extract SHALL always cover the day before the run date; an older day SHALL only be
      re-extracted by running the export query by hand.
    plain_text: >
      Each night the previous day's sign-in events are written to a dated CSV file for the
      security team, with a trailer line giving the row count. Older days can only be
      re-extracted manually.
    technical_note: >
      Runbook §3.2 and §4.2. db/batch/audit_extract.sql uses SYSCS_EXPORT_QUERY with
      CURRENT_DATE bounds; batch/psl_audit_extract.sh renames the file and appends the
      trailer. Control-M job waits on PSL_DB_BACKUP-OK and mails psl-security on failure
      (the mail recipient is in the scheduler definition, not the runbook).
    interface: true
    confidence: high
    confidence_basis: Runbook, the export SQL, the script and the scheduler definition agree.
    risk_class: regulated
    basis: Runbook PSL_AUDIT_EXTRACT file layout; audit_extract.sql; psl_audit_extract.sh.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "PSL-RB-01 §3.2 PSL_AUDIT_EXTRACT"
        line_start: 46
        line_end: 57
        excerpt: |2
          <h2>3.2 PSL_AUDIT_EXTRACT</h2>
          <p>Exports yesterday's rows of SIGNON_AUDIT (00:00 to 24:00) to <code>/var/petstore/extract/signon_audit_YYYYMMDD.csv</code>
          for the security team (<code>db/batch/audit_extract.sql</code>).</p>
          <table class="grid">
           <tr><th>Column</th><th>Content</th></tr>
           <tr><td>1 audit_id</td><td>Event number</td></tr>
           <tr><td>2 username</td><td>User name as typed</td></tr>
           <tr><td>3 event_type</td><td>SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, SIGNOFF, USER_CREATED</td></tr>
           <tr><td>4 event_ts</td><td>Time of the event</td></tr>
           <tr><td>5 remote_addr</td><td>Client address, or <code>batch:PSL_ACCT_UNLOCK</code></td></tr>
          </table>
          <p>No header row. The last line is a trailer <code>TRAILER,YYYYMMDD,&lt;row count&gt;</code>; the count excludes the trailer.</p>
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "PSL-RB-01 §4.2 Rerunning the extract"
        line_start: 88
        line_end: 90
        excerpt: |2
          <h2>4.2 Rerunning the extract</h2>
          <p>The extract always covers the day before the run date. To re-extract an older day, run the export query in
          <code>db/batch/audit_extract.sql</code> by hand with the dates changed.</p>
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_extract.sql
        line_start: 4
        line_end: 10
        excerpt: |2
          CALL SYSCS_UTIL.SYSCS_EXPORT_QUERY(
            'SELECT audit_id, username, event_type, event_ts, remote_addr
               FROM signon_audit
              WHERE event_ts >= {fn TIMESTAMPADD(SQL_TSI_DAY, -1, CAST(CURRENT_DATE AS TIMESTAMP))}
                AND event_ts <  CAST(CURRENT_DATE AS TIMESTAMP)
              ORDER BY audit_id',
            '/var/petstore/extract/signon_audit_extract.csv', ',', '"', 'UTF-8');
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_audit_extract.sh
        line_start: 13
        line_end: 13
        excerpt: |2
          echo "TRAILER,$DAY,$ROWS" >> "$OUT"
    stack_metadata:
      batch.trigger: Control-M PSL_PETSTORE_DAILY/PSL_AUDIT_EXTRACT 01:30, INCOND PSL_DB_BACKUP-OK
      output: /var/petstore/extract/signon_audit_YYYYMMDD.csv

