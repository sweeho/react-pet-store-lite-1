        line_start: 98
        line_end: 98

  - capability_key: sign-on-audit
    record_keys: [SOA-BR-0001, SOA-SCR-0001]
    severity: low
    category: data-corruption
    title: Failed sign-ins on a not-yet-registered name appear in that user's history later
    description: >
      A sign-in with an unknown user name is recorded against the name typed. If someone later
      registers that name, My Account (which selects audit events by user name only) shows
      those earlier failures as if they were attempts on the new account, which the User Guide
      tells customers to report as unrecognised activity.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "PSL-AG-01 §2 Sign-on rules (R6)"
        line_start: 55
