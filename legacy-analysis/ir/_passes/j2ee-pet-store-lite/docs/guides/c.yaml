  # ---------------------------------------------------------------- catalog-search
  - record_key: CS-BR-0001
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      The system SHALL split the search text on spaces and return every en_US item where
      any word appears, as a case-insensitive substring, in the product name, the category
      code or the item description.
    plain_text: >
      Search finds an item when any typed word appears anywhere in the product name, the
      category code (such as DOGS) or the item description, ignoring upper and lower case.
      Part of a word is enough.
    technical_note: >
      User Guide §4. SEARCH_ITEMS in src/main/webapp/CatalogDAOSQL.xml builds
      lower(name) like ? or lower(catid) like ? or lower(b.descn) like ? with one OR-group
      per word (VARIABLE fragment), restricted to b.locale = ?.
    interface: false
    confidence: high
    confidence_basis: Guide and the declarative SQL agree on fields, OR semantics and case folding.
    risk_class: operational
    basis: User Guide "How search matches" and the SEARCH_ITEMS statement.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "PSL-UG-01 §4 Searching"
        line_start: 88
        line_end: 93
        excerpt: |2
          <p>How search matches:</p>
          <ul>
           <li>A word matches when it appears anywhere in the product name, the category code (for example DOGS) or the item description.
           Part of a word is enough: <i>dog</i> finds Bulldog and every item in the DOGS category.</li>
           <li>When you type several words separated by spaces, items that match <b>any</b> of the words are listed.</li>
           <li>Search is not case-sensitive.</li>
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml
        line_start: 119
        line_end: 122
        excerpt: |2
                              where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
                      </SQLFragment>
                      <SQLFragment parameterNb="3" occurrence="VARIABLE">
                          or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
    stack_metadata:
      db.object: SEARCH_ITEMS (CatalogDAOSQL.xml)

