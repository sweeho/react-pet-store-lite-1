      config: WEB-INF/screendefinitions_en_US.xml

  - record_key: CB-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL organise the catalog in three levels (category, product, item); a
      category page SHALL list its products with name and description; a product page SHALL
      list its items with attribute, name, description and list price; and an item page
      SHALL show the picture, a List Price, a "Your Price", the description and the Item ID.
      The "Your Price" value shown today SHALL be the item's unit cost, displayed to every
      visitor whether signed in or not.
    plain_text: >
      Customers drill down from category to product to item. The item page shows the
      catalog price, a second "Your Price" figure, the description and the item number.
      Today that second figure is the item's cost price and is shown to everyone.
    technical_note: >
      User Guide §3 and §3.3 describe the levels and say "Your Price" is "the discounted
      price for members". item.jsp renders List Price from item.listCost and Your Price from
      item.unitCost with no sign-in check; product.jsp shows only listCost. unitCost is the
      same column catalog check C3 compares against list price (cost price).
    interface: false
    confidence: high
    confidence_basis: >
      The three-level structure and the fields shown are stated in the guide and visible in
      item.jsp/product.jsp. What "Your Price" means is where the two disagree, which is
      carried as the dispute, not as lowered confidence in what the screen displays.
    dispute:
      reason: contradicts-docs
      detail: >
        The User Guide says Your Price is a members' discounted price; the item page shows
        the unit cost field to anonymous and signed-in visitors alike, and search results
        also show unit cost. A business owner must say whether Your Price is meant to be a
        member price (not implemented) or whether cost price is meant to be shown.
    risk_class: financial
    basis: >
      User Guide catalog levels table and item page description; item.jsp lines 26-30 bind
      the two prices to listCost and unitCost.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "PSL-UG-01 §3 Browsing the catalog"
        line_start: 48
        line_end: 56
        excerpt: |2
          <h1>3. Browsing the catalog</h1>
          <p>The catalog has three levels:</p>
          <table class="grid">
           <tr><th>Level</th><th>Example</th><th>Page</th></tr>
           <tr><td>Category</td><td>Dogs</td><td>Lists the products in the category</td></tr>
           <tr><td>Product</td><td>Bulldog (K9-BD-01)</td><td>Lists the items of the product with their list price</td></tr>
           <tr><td>Item</td><td>Male Adult Bulldog (EST-6)</td><td>Shows the picture, List Price, Your Price, description and Item ID</td></tr>
          </table>
          <p>The store has five categories: Birds, Cats, Dogs, Fish and Reptiles.</p>
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "PSL-UG-01 §3.3 View an item"
        line_start: 73
        line_end: 79
        excerpt: |2
          <h2>3.3 View an item</h2>
          <p>Click an item. The item page shows:</p>
          <ul>
           <li><b>List Price</b>: the catalog price.</li>
           <li><b>Your Price</b>: the discounted price for members.</li>
           <li>The description and the <b>Item ID</b> (for example EST-6). Quote the Item ID when you contact the store.</li>
          </ul>
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/item.jsp
        line_start: 26
        line_end: 30
        excerpt: |2
            <td class="petstore" width="100%"><b>List Price:</b>
             <fmt:formatNumber value="${item.listCost}" type="currency" />
             <br><br>
             <b>Your Price:</b>
             <fmt:formatNumber value="${item.unitCost}" type="currency" />
