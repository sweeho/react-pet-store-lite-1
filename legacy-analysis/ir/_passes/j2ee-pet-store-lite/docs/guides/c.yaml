      SIGNON_FAIL, ACCOUNT_LOCKED, SIGNON_LOCKED, ACCOUNT_UNLOCKED, SIGNOFF), the time and the
      client address. GIVEN a sign-in names a user that does not exist THEN the system SHALL
      still record SIGNON_FAIL against the name typed.
