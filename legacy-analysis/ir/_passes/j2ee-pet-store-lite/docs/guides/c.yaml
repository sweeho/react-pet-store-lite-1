  - capability_key: sample-data-population
    record_keys: [SDP-REQ-0001]
    severity: medium
    category: contradicts-document
    title: Entering an already-loaded store ends the visitor's session
    description: >
      The Administrator Guide says a non-forced load on a populated store does nothing. The
      servlet invalidates the session on every call before checking whether data exists, so a
      signed-in user who clicks "enter the store" is silently signed out.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "PSL-AG-01 §3.1 First load"
        line_start: 76
        line_end: 77
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 126
        line_end: 127

  - capability_key: sign-on
    record_keys: [SO-BR-0001]
    severity: high
    category: other
    title: Passwords are stored and compared in plain text
    description: >
      The Administrator Guide states passwords are stored as entered in the account table, and
      the sample accounts ship with well-known passwords (admin/admin). Anyone with read access
      to the database or a backup can read every password.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "PSL-AG-01 §1.2 Sample accounts"
        line_start: 45
