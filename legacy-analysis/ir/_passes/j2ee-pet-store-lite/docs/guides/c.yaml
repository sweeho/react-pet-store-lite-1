  - record_key: SOA-BR-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL keep audit events for 90 days. Every Sunday at 02:00, and only after
      that day's audit extract has succeeded, it SHALL delete audit events dated more than
      90 days before the start of the current day.
    plain_text: >
      Sign-in history is kept for 90 days. Older events are deleted on Sundays, only after
      the night's extract has been taken.
    technical_note: >
      Runbook §3.4 and §5. db/batch/audit_purge.sql deletes event_ts < CURRENT_DATE - 90 days;
      Control-M PSL_AUDIT_PURGE has WEEKDAYS="0" and INCOND PSL_AUDIT_EXTRACT-OK;
      batch.audit.retentionDays=90.
    interface: false
    confidence: high
    confidence_basis: Runbook, purge SQL, scheduler and properties agree.
    risk_class: regulated
    basis: Runbook PSL_AUDIT_PURGE and settings table; audit_purge.sql.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "PSL-RB-01 §3.4 PSL_AUDIT_PURGE"
        line_start: 63
        line_end: 64
        excerpt: |2
          <h2>3.4 PSL_AUDIT_PURGE</h2>
          <p>Sundays only. Deletes SIGNON_AUDIT rows older than 90 days. It waits for that day's extract so no row is deleted before it is extracted.</p>
      - path: legacy-source/j2ee-pet-store-lite/db/batch/audit_purge.sql
        line_start: 5
        line_end: 6
        excerpt: |2
          DELETE FROM signon_audit
           WHERE event_ts < {fn TIMESTAMPADD(SQL_TSI_DAY, -90, CAST(CURRENT_DATE AS TIMESTAMP))};
    stack_metadata:
      batch.trigger: Control-M PSL_AUDIT_PURGE Sunday 02:00, INCOND PSL_AUDIT_EXTRACT-OK
      db.object: SIGNON_AUDIT

  # ---------------------------------------------------------------- batch-operations
  - record_key: BO-WF-0001
    kind: workflow
    capability_key: batch-operations
    requirement: >
      The system SHALL run its scheduled jobs in this order: database backup daily at 01:00;
      audit extract daily at 01:30 only after the backup succeeded; sign-on report daily at
      01:45 and audit purge on Sundays at 02:00, each only after the extract succeeded;
      catalog check daily at 06:00 independently; account unlock every 15 minutes all day
      independently. Each job SHALL write one line to the batch job log at start and end.
    plain_text: >
      Nightly: backup, then the audit extract, then the report and (on Sundays) the purge.
      The catalog check runs at 6:00 and the unlock job every 15 minutes, on their own.
    technical_note: >
      Runbook §1 and §2; schedule in scheduler/control-m/PSL_PETSTORE.xml (folders
      PSL_PETSTORE_DAILY and PSL_PETSTORE_CYCLIC) with INCOND dependencies; job log
      /var/petstore/log/batch.log.
    interface: false
    confidence: high
    confidence_basis: Runbook table and diagram agree with the Control-M definition's times and INCONDs.
    risk_class: operational
    basis: Runbook batch schedule.
    traces:
      - kind: document
