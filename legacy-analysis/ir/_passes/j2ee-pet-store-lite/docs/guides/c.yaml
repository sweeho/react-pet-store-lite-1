  - record_key: SDP-REQ-0002
    kind: requirement
    capability_key: sample-data-population
    requirement: >
      The system SHALL allow only a signed-in ADMIN to force a reload of the sample data;
      any other caller, anonymous or CUSTOMER, SHALL be shown Access Denied. A forced reload
      SHALL drop and recreate the category, category details, product, product details,
      item, item details, account and sign-on audit tables, load the sample data file, end
      the administrator's session and show the home page.
    plain_text: >
      Only an administrator can reload the sample data. A reload wipes and recreates the whole
      catalog, every account and all sign-in history, signs the administrator out and returns
      to the home page.
    technical_note: >
      Admin Guide §1.1 matrix row "Forced reload" and §3.2; reached from the Admin link and
