  - record_key: BO-REQ-0001
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL take an online backup of the store database every day at 01:00 into a
      folder named PetStoreDB_YYYYMMDD and delete backups older than 7 days. GIVEN the backup
      fails THEN it SHALL be retried up to 2 times 10 minutes apart; GIVEN it still fails THEN
      operations SHALL be mailed and the audit extract SHALL stay waiting.
    plain_text: >
      The database is backed up every night and a week of backups is kept. A failed backup is
      retried twice, then operations are alerted and the audit extract waits.
    technical_note: >
      Runbook §3.1 and §5. batch/psl_db_backup.sh runs SYSCS_BACKUP_DATABASE, renames to
      PetStoreDB_$STAMP and prunes with find -mtime +$PSL_BACKUP_KEEP_DAYS; Control-M
      MAXRERUN=2 INTERVAL=00010M, DOMAIL to psl-ops.
    interface: false
    confidence: high
    confidence_basis: Runbook, script and scheduler retry settings agree.
    risk_class: operational
    basis: Runbook PSL_DB_BACKUP.
    traces:
