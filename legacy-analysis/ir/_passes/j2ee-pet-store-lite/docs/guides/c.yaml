  - capability_key: batch-operations
    record_keys: [BO-REQ-0001]
    severity: low
    category: contradicts-document
    title: Backup pruning keeps about 8 days, not 7
    description: >
      The runbook says backups older than 7 days are deleted. The script uses find -mtime +7,
      which only matches folders at least 8 whole days old, so one extra day of backups is
      kept.
