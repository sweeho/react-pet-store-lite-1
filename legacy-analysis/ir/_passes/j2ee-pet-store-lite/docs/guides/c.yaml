      Admin Guide R6/R7; User Guide §5.4 event table. UserDAO.audit inserts into
      SIGNON_AUDIT (username, event_type, event_ts, remote_addr); line 118 audits SIGNON_FAIL
      for an unknown user. The batch unlock writes remote_addr 'batch:PSL_ACCT_UNLOCK'.
    interface: false
    confidence: high
    confidence_basis: Two guides and the DAO event constants and insert agree.
    risk_class: regulated
    basis: Admin Guide R6-R7; UserDAO audit calls.
