  # ---------------------------------------------------------------- catalog-data-integrity
  - record_key: CDI-BR-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The catalog SHALL satisfy four rules at all times: C1 every category has at least one
      product; C2 every product has at least one item; C3 an item's list price is never
      below its unit cost; C4 every item has an en_US description.
    plain_text: >
      Every category has a product, every product has an item, no item is priced below its
      cost, and every item has an English description.
    technical_note: >
      Admin Guide §3.3 says C3 is also a database check constraint. db/batch/catalog_check.sql
      implements C1-C4 as queries that must return no rows. The DDL for the C3 constraint
      (populate/PopulateSQL.xml) was not opened in this pass.
    interface: false
    confidence: high
    confidence_basis: Guide rule table and the batch check SQL state the same four rules.
    risk_class: financial
    basis: Admin Guide catalog data rules table; catalog_check.sql C1-C4 queries.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "PSL-AG-01 §3.3 Catalog data rules"
        line_start: 91
        line_end: 98
        excerpt: |2
          <h2>3.3 Catalog data rules</h2>
          <table class="grid">
           <tr><th>#</th><th>Rule</th></tr>
           <tr><td>C1</td><td>Every category has at least one product.</td></tr>
           <tr><td>C2</td><td>Every product has at least one item.</td></tr>
           <tr><td>C3</td><td>An item's list price is never below its unit cost (database check constraint).</td></tr>
           <tr><td>C4</td><td>Every item has an en_US description.</td></tr>
          </table>
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 3
        line_end: 13
        excerpt: |2
          -- C1: categories with no product
          SELECT 'C1' AS chk, c.catid FROM category c
           WHERE NOT EXISTS (SELECT 1 FROM product p WHERE p.catid = c.catid);
          -- C2: products with no item
          SELECT 'C2' AS chk, p.productid FROM product p
           WHERE NOT EXISTS (SELECT 1 FROM item i WHERE i.productid = p.productid);
          -- C3: items priced below cost
          SELECT 'C3' AS chk, itemid FROM item_details WHERE listprice < unitcost;
          -- C4: items without an en_US description
          SELECT 'C4' AS chk, i.itemid FROM item i
           WHERE NOT EXISTS (SELECT 1 FROM item_details d WHERE d.itemid = i.itemid AND d.locale = 'en_US');
    stack_metadata:
      db.object: CATEGORY, PRODUCT, ITEM, ITEM_DETAILS

  - record_key: CDI-WF-0001
    kind: workflow
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL check rules C1 to C4 every day at 06:00. GIVEN the catalog tables do
      not exist WHEN the check runs THEN it SHALL first trigger the non-forced sample data
      load and then check again. GIVEN any rule is breached THEN the check SHALL end with
      exit code 4, write the details to the catalog check log and the catalog team SHALL be
      alerted by mail.
    plain_text: >
      Every morning at 6:00 the catalog is checked against its four rules. If the catalog is
      missing it is loaded first. Any breach alerts the catalog team by mail.
    technical_note: >
      Runbook §2 and §3.5; Admin Guide §3.3. batch/psl_catalog_check.sh curls
      $PSL_STORE_URL/Populate?forcefully=false (exit 8 on failure), exits 4 on a breach;
      scheduler/control-m/PSL_PETSTORE.xml schedules PSL_CATALOG_CHECK at 0600 with a DOMAIL
      to psl-catalog.
    interface: false
    confidence: high
    confidence_basis: Two guides, the script and the Control-M definition agree.
    risk_class: operational
    basis: Runbook job details for PSL_CATALOG_CHECK; Admin Guide schedule sentence.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        anchor: "PSL-RB-01 §3.5 PSL_CATALOG_CHECK"
        line_start: 66
        line_end: 69
        excerpt: |2
          <h2>3.5 PSL_CATALOG_CHECK</h2>
          <p>Runs catalog checks C1 to C4 (see the Administrator Guide). If the catalog tables do not exist it calls
          <code>http://localhost:8080/petstore/Populate?forcefully=false</code> to load the sample data, then checks again.
          Exit code 4 means a check found rows; Control-M mails psl-catalog. Details are in <code>/var/petstore/log/catalog_check.log</code>.</p>
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "PSL-AG-01 §3.3 Catalog data rules"
        line_start: 99
        line_end: 99
        excerpt: |2
          <p>Job PSL_CATALOG_CHECK checks C1 to C4 every morning at 06:00 and alerts the catalog team when one fails.</p>
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 12
        line_end: 21
        excerpt: |2
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
    stack_metadata:
      batch.trigger: Control-M PSL_PETSTORE_DAILY/PSL_CATALOG_CHECK 06:00
      batch.script: batch/psl_catalog_check.sh

  # ---------------------------------------------------------------- sample-data-population
  - record_key: SDP-REQ-0001
    kind: requirement
    capability_key: sample-data-population
    requirement: >
      WHEN a visitor enters the store THEN the system SHALL request a non-forced sample data
      load without requiring sign-in. GIVEN the catalog and account tables already hold data
      THEN no data SHALL be changed. GIVEN they do not THEN every catalog and account table
      SHALL be dropped, recreated and loaded from the sample data file, while a "Please wait
      while the Java Pet Store Application is being populated..." message is shown. In both
      cases the visitor's current session is ended.
    plain_text: >
      The first visit to an empty store loads the sample catalog and accounts automatically,
      for anyone. On a store that already has data, nothing is reloaded, but the visitor's
      session is still reset.
    technical_note: >
      Admin Guide §3.1, User Guide §2. PopulateServlet.doPost: a non-forced call skips the
      ADMIN check, calls request.getSession().invalidate() unconditionally, then populate(false)
      drops/creates/loads only when catalogPopulator.check && userPopulator.check is false.
      The session reset on an already-populated store is not in the guides (see suspected defect).
    interface: false
    confidence: high
    confidence_basis: Guide and servlet agree on the load-if-empty rule; the session reset is read directly from code.
    risk_class: operational
    basis: Admin Guide first load section; PopulateServlet doPost/populate.
    traces:
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "PSL-AG-01 §3.1 First load"
        line_start: 75
