suspected_defects:
  - capability_key: sign-on-audit
    record_keys: [AUDIT-REQ-0003, AUDIT-RULE-0004, BATCH-WFL-0001]
    severity: medium
    category: other
    title: On Sundays the purge can consume the condition the sign-on report still needs
    description: >
      Both the sign-on report and the Sunday purge wait on the same "extract OK" condition,
      and the purge deletes that condition when it finishes. Normally the report (01:45)
      starts before the purge (02:00). If the extract finishes after 02:00 on a Sunday (for
      example after backup reruns), both become eligible together; if the purge completes
      before the report is submitted, the report waits indefinitely, and because the report
      has no failure alert nobody is told. The runbook describes the two jobs as parallel
      successors and does not mention this.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 47
        line_end: 47
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 57
        line_end: 58
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 36
        line_end: 37
  - capability_key: catalog-data-integrity
    record_keys: [CATINT-REQ-0001, POP-REQ-0001]
    severity: medium
    category: error-swallowed
    title: Catalog check alerts only on exit code 4; a failed first load or SQL error (exit 8) mails nobody
    description: >
      The catalog check's alert is bound to completion code 4 only. The script exits 8 when
      the first-load call fails or a SQL/file error occurs, and the runbook lists 8 as an
      error needing action. On exit 8 the job ends not-OK but no mail is sent, so the store
      can open with no catalog or an unchecked catalog without the catalog team knowing.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 69
        line_end: 71
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 12
        line_end: 12
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 79
        line_end: 79
  - capability_key: account-lockout
    record_keys: [LOCK-RULE-0001]
    severity: medium
    category: error-swallowed
    title: Account unlock job has no failure alert, so locked accounts can stay locked unnoticed
    description: >
      The every-15-minutes unlock job has no failure notification. The script exits 8 on a
      SQL error, but nothing is mailed, so locked customers stay locked beyond the
      documented 30 minutes until someone looks at the scheduler or logs. The admin guide
      presents automatic unlock after 30 minutes as a rule (R5).
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 78
        line_end: 85
