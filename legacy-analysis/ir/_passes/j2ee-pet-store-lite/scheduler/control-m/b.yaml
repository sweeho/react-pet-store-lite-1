  - record_key: AUDIT-RULE-0004
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL purge sign-on audit events older than 90 days once a week, on
      Sunday, no earlier than 02:00, and only after that Sunday's audit extract has
      completed successfully, so that no event is deleted before it has been extracted.
    plain_text: >
      Every Sunday night, sign-on events older than 90 days are deleted, but only after
      that night's audit file has been produced.
    technical_note: >
      PSL_AUDIT_PURGE: WEEKDAYS="0" (Sunday in Control-M), TIMEFROM=0200, INCOND
      PSL_AUDIT_EXTRACT-OK, script psl_audit_purge.sh; retention from conf/env.sh
      PSL_AUDIT_RETENTION_DAYS=90. On success it deletes the PSL_AUDIT_EXTRACT-OK
      condition. No ON/DOMAIL and no MAXRERUN.
    interface: false
    confidence: high
    confidence_basis: >
      Sunday schedule, 90-day retention and the extract dependency are in the scheduler,
      and the same three facts appear in runbook 3.4 and conf/env.sh. WEEKDAYS=0 is read as
      Sunday per Control-M convention, confirmed by the job description "(Sundays)".
    risk_class: regulated
    basis: >
      PSL_AUDIT_PURGE job definition; runbook 3.4; conf/env.sh retention setting.
      Regulated because it governs retention of a security audit trail.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 51
        line_end: 57
        excerpt: |
              <JOB JOBISN="4" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_PURGE"
                   DESCRIPTION="Delete SIGNON_AUDIT rows older than 90 days (Sundays)"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_purge.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AD"
                   TIMEFROM="0200" WEEKDAYS="0"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 64
        line_end: 64
        excerpt: |
          <p>Sundays only. Deletes SIGNON_AUDIT rows older than 90 days. It waits for that day's extract so no row is deleted before it is extracted.</p>
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 11
        line_end: 11
        excerpt: |
          PSL_AUDIT_RETENTION_DAYS=90
    stack_metadata:
      framework: control-m
      batch.trigger: "PSL_AUDIT_PURGE WEEKDAYS=0 TIMEFROM=0200 INCOND PSL_AUDIT_EXTRACT-OK"
      db.object: SIGNON_AUDIT

  - record_key: CATINT-REQ-0001
    kind: requirement
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL run the catalog integrity check every day no earlier than 06:00,
      independently of the nightly backup and audit chain, and GIVEN the check ends with
      the "bad catalog data" result WHEN the run completes THEN it SHALL send an urgent
      alert to the catalog team pointing to the check log.
    plain_text: >
      Every morning at 6 am, before the store opens, the catalog is checked. If the check
      finds bad data the catalog team gets an urgent e-mail.
    technical_note: >
      PSL_CATALOG_CHECK: TASKTYPE=Command, TIMEFROM=0600, WEEKDAYS=ALL, CRITICAL=1, no
      INCOND. <ON STMT="*" CODE="COMPSTAT=4"> DOMAIL URGENCY="U" to
      psl-catalog@example.invalid, message "See /var/petstore/log/catalog_check.log".
      psl_catalog_check.sh exits 4 when a check C1-C4 returns rows, and also performs a
      first load (Populate?forcefully=false) when the catalog tables are missing; that
      logic belongs to the batch shard. The alert is bound to exit code 4 only.
    interface: true
    confidence: high
    confidence_basis: >
      Schedule and alert are declared in the scheduler; exit code 4 meaning and the
      catalog-team mail are restated in runbook 3.5 and section 4, and the script exits 4.
    risk_class: operational
    basis: >
      PSL_CATALOG_CHECK job definition and its ON block; runbook 3.5.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 62
        line_end: 71
        excerpt: |
              <JOB JOBISN="5" APPLICATION="PETSTORE" SUB_APPLICATION="CATALOG" JOBNAME="PSL_CATALOG_CHECK"
                   DESCRIPTION="Catalog integrity check before the store opens; first load when empty"
                   TASKTYPE="Command" CMDLINE="/opt/petstore/batch/psl_catalog_check.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0600" WEEKDAYS="ALL"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <OUTCOND NAME="PSL_CATALOG_CHECK-OK" ODATE="ODAT" SIGN="+" />
                <ON STMT="*" CODE="COMPSTAT=4">
                  <DOMAIL URGENCY="U" DEST="psl-catalog@example.invalid" SUBJECT="Petstore catalog integrity check failed" MESSAGE="See /var/petstore/log/catalog_check.log" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 67
        line_end: 69
        excerpt: |
          <p>Runs catalog checks C1 to C4 (see the Administrator Guide). If the catalog tables do not exist it calls
          <code>http://localhost:8080/petstore/Populate?forcefully=false</code> to load the sample data, then checks again.
          Exit code 4 means a check found rows; Control-M mails psl-catalog. Details are in <code>/var/petstore/log/catalog_check.log</code>.</p>
    stack_metadata:
      framework: control-m
      batch.trigger: "PSL_CATALOG_CHECK TIMEFROM=0600 WEEKDAYS=ALL"
      control_m.on: "STMT=* CODE=COMPSTAT=4 DOMAIL URGENCY=U"
      alert.dest: psl-catalog@example.invalid

  - record_key: POP-REQ-0001
    kind: requirement
    capability_key: sample-data-population
    requirement: >
      GIVEN the daily 06:00 catalog check finds the catalog empty WHEN it runs THEN the
      system SHALL perform a first load of the sample data (not a forced reload) and then
      check the catalog again.
    plain_text: >
      If the morning catalog check finds no catalog at all, it loads the starter catalog
      once, without wiping anything, and checks again.
    technical_note: >
      The scheduler only states "first load when empty" in the PSL_CATALOG_CHECK
      description. psl_catalog_check.sh detects "does not exist" in the check output, calls
      $PSL_STORE_URL/Populate?forcefully=false, and re-runs catalog_check.sql; it exits 8 if
      the populate call fails.
    interface: false
    confidence: high
    confidence_basis: >
      Stated in the scheduler description, the script header, the script body and runbook
      3.5. "Empty" is detected as missing tables, not as tables with no rows; that nuance is
      the batch shard's to grade.
    risk_class: operational
    basis: >
      Job description; psl_catalog_check.sh lines 10-14; runbook 3.5.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 63
        line_end: 63
        excerpt: |
                   DESCRIPTION="Catalog integrity check before the store opens; first load when empty"
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 10
        line_end: 14
        excerpt: |
          if echo "$OUT" | grep -q "does not exist"; then
            psl_log "catalog tables missing, requesting first load"
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
            OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          fi
    stack_metadata:
      framework: control-m
      batch.trigger: PSL_CATALOG_CHECK

  - record_key: LOCK-RULE-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL check for locked sign-on accounts every 15 minutes, around the clock,
      and unlock every account that has been locked for more than 30 minutes; GIVEN an
      account was locked at time T WHEN no other unlock happens THEN it SHALL become usable
      again at the first 15-minute check after T + 30 minutes, which is between 30 and 45
      minutes after T.
    plain_text: >
      A locked account unlocks itself automatically after about half an hour; because the
      unlock check runs every 15 minutes, in practice that takes 30 to 45 minutes.
    technical_note: >
      Control-M folder PSL_PETSTORE_CYCLIC, job PSL_ACCT_UNLOCK: CYCLIC=1,
      CYCLIC_TYPE=Interval, INTERVAL=00015M, IND_CYCLIC=START (interval measured from job
      start), TIMEFROM=0000 TIMETO=2359, WEEKDAYS=ALL. The 30-minute threshold lives in the
      job description and in db/batch/acct_unlock.sql (batch shard); the runbook and admin
      guide (R5) state it too and add that failed attempts are reset and ACCOUNT_UNLOCKED
      is audited. No ON/DOMAIL block.
    interface: false
    confidence: high
    confidence_basis: >
      Interval declared in the scheduler; 15 min and 30 min stated in the job description,
      script header, runbook 3.6 and section 5, and admin guide R5. The 30-45 minute window
      is derived from those two numbers, not read anywhere.
    risk_class: operational
    basis: >
      PSL_ACCT_UNLOCK job definition; runbook 3.6; admin guide R5.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 78
        line_end: 85
        excerpt: |
              <JOB JOBISN="1" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_ACCT_UNLOCK"
                   DESCRIPTION="Unlock sign-on accounts locked for more than 30 minutes"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_acct_unlock.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA"
                   TIMEFROM="0000" TIMETO="2359" WEEKDAYS="ALL"
                   CYCLIC="1" CYCLIC_TYPE="Interval" INTERVAL="00015M" IND_CYCLIC="START"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
              </JOB>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 54
        line_end: 54
        excerpt: |
           <tr><td>R5</td><td>Batch job PSL_ACCT_UNLOCK runs every 15 minutes and unlocks accounts locked more than 30 minutes ago. It sets failed attempts to 0 and records ACCOUNT_UNLOCKED.</td></tr>
    stack_metadata:
      framework: control-m
      batch.trigger: "PSL_PETSTORE_CYCLIC PSL_ACCT_UNLOCK CYCLIC Interval 00015M IND_CYCLIC=START"

