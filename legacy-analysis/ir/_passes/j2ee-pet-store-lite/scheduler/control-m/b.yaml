        line_start: 54
        line_end: 54
  - capability_key: sign-on-audit
    record_keys: [AUDIT-REQ-0003, AUDIT-RULE-0004]
    severity: low
    category: error-swallowed
    title: Sign-on report and audit purge failures are neither retried nor alerted
    description: >
      Unlike the backup and the extract, the sign-on report and the Sunday audit purge have
      no rerun setting and no failure mail. A failed purge leaves audit events beyond the
      90-day retention for at least another week; a failed report is simply missing.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 41
        line_end: 60
  - capability_key: sign-on-audit
    record_keys: [BATCH-REQ-0003, AUDIT-REQ-0002]
    severity: low
    category: other
    title: When the backup fails the security team is not told the audit extract is missing
    description: >
      A failed backup holds the audit extract, and the only mail goes to operations. The
      extract's own failure mail to security never fires because the extract never runs, so
      the recipients of the audit feed learn of a missing file only by its absence.
