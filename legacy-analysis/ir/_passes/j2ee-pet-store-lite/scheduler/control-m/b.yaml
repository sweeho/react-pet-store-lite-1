# Pass B, independent reading of legacy-source/j2ee-pet-store-lite/scheduler/control-m
# Sources read: PSL_PETSTORE.xml (the only file in the shard); corroborated against
# batch/*.sh, conf/env.sh, docs/guides/operations-runbook.html, docs/guides/admin-guide.html.
# No legacy-analysis/sources/**/extracted.md exists in the tree, so the HTML guides are
# cited directly by path and line range.
records:
  - record_key: BATCH-WFL-0001
    kind: workflow
    capability_key: batch-operations
    requirement: >
      The system SHALL run the nightly chain in this order: database backup, then the
      sign-on audit extract, then (in parallel) the sign-on report and, on Sundays, the
      audit purge; the audit extract SHALL start only after that day's database backup has
      completed successfully, and the report and the purge SHALL start only after that
      day's audit extract has completed successfully.
    plain_text: >
      Every night the database is backed up first. Only after a good backup is the
      sign-on audit file produced, and only after that file is produced do the daily
      sign-on report and the Sunday audit clean-up run.
    technical_note: >
      Control-M folder PSL_PETSTORE_DAILY. PSL_DB_BACKUP sets condition PSL_DB_BACKUP-OK;
      PSL_AUDIT_EXTRACT has INCOND PSL_DB_BACKUP-OK and sets PSL_AUDIT_EXTRACT-OK;
      PSL_SIGNON_REPORT and PSL_AUDIT_PURGE both have INCOND PSL_AUDIT_EXTRACT-OK. All
      conditions are dated ODAT, so a dependency only resolves within the same order date.
      The extract deletes PSL_DB_BACKUP-OK on success, the purge deletes
      PSL_AUDIT_EXTRACT-OK on success (see suspected defect on that).
    interface: false
    confidence: high
    confidence_basis: >
      The ordering is declared in the scheduler conditions and stated identically in the
      runbook table and diagram, and in the script header comments. Two independent
      places (configuration and documentation) agree.
    risk_class: operational
    basis: >
      INCOND/OUTCOND pairs in PSL_PETSTORE.xml; runbook section 2 table and diagram.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 21
        line_end: 21
        excerpt: |
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 33
        line_end: 35
        excerpt: |
                <INCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 47
        line_end: 48
        excerpt: |
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_SIGNON_REPORT-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 57
        line_end: 59
        excerpt: |
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PSL_AUDIT_PURGE-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 36
        line_end: 38
        excerpt: |
          <pre>01:00 PSL_DB_BACKUP --> 01:30 PSL_AUDIT_EXTRACT --+--> 01:45 PSL_SIGNON_REPORT
                                                            +--> 02:00 PSL_AUDIT_PURGE (Sundays)
          06:00 PSL_CATALOG_CHECK            every 15 min  PSL_ACCT_UNLOCK</pre>
    stack_metadata:
      framework: control-m
      batch.trigger: "folder PSL_PETSTORE_DAILY, condition chain (ODAT)"
      control_m.datacenter: DC_PSL_PRD
      control_m.node: psl-app01
      control_m.run_as: tomcat

  - record_key: BATCH-REQ-0002
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL start the database backup every day of the week no earlier than
      01:00, and GIVEN a backup run fails WHEN fewer than 2 reruns have been made THEN it
      SHALL rerun the backup automatically 10 minutes later.
    plain_text: >
      The database is backed up every night from 1 am. If the backup fails it is retried
      automatically, at most twice, ten minutes apart.
    technical_note: >
      PSL_DB_BACKUP: TIMEFROM=0100, WEEKDAYS=ALL, MAXRERUN=2, INTERVAL=00010M,
      CRITICAL=1, PRIORITY=AA, script /opt/petstore/batch/psl_db_backup.sh. Also carries
      DAYSCAL=PSL_CAL, a calendar not present in the source (see finding).
    interface: false
    confidence: high
    confidence_basis: >
      Time, rerun count and interval are declared in the scheduler job and repeated in
      runbook 3.1 ("up to 2 reruns 10 minutes apart"). Not graded lower despite the
      unknown PSL_CAL calendar, because WEEKDAYS=ALL and the runbook "Daily 01:00" agree.
    risk_class: operational
    basis: >
      Job attributes of PSL_DB_BACKUP; runbook sections 2 and 3.1.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 15
        line_end: 20
        excerpt: |
              <JOB JOBISN="1" APPLICATION="PETSTORE" SUB_APPLICATION="DATABASE" JOBNAME="PSL_DB_BACKUP"
                   DESCRIPTION="Online backup of PetStoreDB, keep 7 days"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_db_backup.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0100" WEEKDAYS="ALL" DAYSCAL="PSL_CAL" MAXRERUN="2" INTERVAL="00010M"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 44
        line_end: 44
        excerpt: |
          Critical job: up to 2 reruns 10 minutes apart; on failure Control-M mails psl-ops and PSL_AUDIT_EXTRACT stays waiting.</p>
    stack_metadata:
      framework: control-m
      batch.trigger: "PSL_DB_BACKUP TIMEFROM=0100 WEEKDAYS=ALL DAYSCAL=PSL_CAL"
      control_m.maxrerun: 2
      control_m.interval: 00010M
      control_m.critical: 1

  - record_key: BATCH-REQ-0003
    kind: requirement
    capability_key: batch-operations
    requirement: >
      GIVEN the database backup ends in failure WHEN its run completes THEN the system
      SHALL send an urgent alert to the operations team stating that the backup failed
      and that the audit extract is held, and SHALL NOT start that day's audit extract.
    plain_text: >
      If the nightly backup fails, operations gets an urgent e-mail, and the sign-on audit
      file is not produced until the backup succeeds.
    technical_note: >
      PSL_DB_BACKUP <ON STMT="*" CODE="NOTOK"> DOMAIL URGENCY="U" to
      psl-ops@example.invalid. Because PSL_DB_BACKUP-OK is never added, PSL_AUDIT_EXTRACT
      stays waiting on its INCOND. The ON block fires per failed run, so each of the up to
      3 attempts may mail.
    interface: true
    confidence: high
    confidence_basis: >
      Declared in the scheduler and restated in runbook 3.1. Whether a mail is sent per
      rerun or only after the last rerun depends on Control-M ON semantics not visible in
      the source; the record does not claim either.
    risk_class: operational
    basis: >
      DOMAIL action on NOTOK for PSL_DB_BACKUP; INCOND on PSL_AUDIT_EXTRACT; runbook 3.1.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 22
        line_end: 24
        excerpt: |
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="U" DEST="psl-ops@example.invalid" SUBJECT="PSL_DB_BACKUP failed" MESSAGE="Petstore DB backup failed, audit extract is held" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 44
        line_end: 44
        excerpt: |
          Critical job: up to 2 reruns 10 minutes apart; on failure Control-M mails psl-ops and PSL_AUDIT_EXTRACT stays waiting.</p>
    stack_metadata:
      framework: control-m
      control_m.on: "STMT=* CODE=NOTOK DOMAIL URGENCY=U"
      alert.dest: psl-ops@example.invalid

  - record_key: BATCH-RULE-0004
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL keep database backups for 7 days and delete older backups as part of
      the nightly backup.
    plain_text: >
      A week of nightly database backups is kept; older ones are deleted.
    technical_note: >
      Stated in the PSL_DB_BACKUP job description ("keep 7 days"). Enforced by
      psl_db_backup.sh with `find ... -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf`, where
      conf/env.sh sets PSL_BACKUP_KEEP_DAYS=7. `-mtime +7` deletes only directories more
      than 7 full days old, so 8 dated backups can coexist; the exact boundary belongs to
      the batch shard.
    interface: false
    confidence: high
    confidence_basis: >
      The value 7 appears in the scheduler description, the script header, conf/env.sh and
      runbook settings table. The exact day boundary is not graded here.
    risk_class: operational
    basis: >
      Job DESCRIPTION, env setting and runbook 3.1 / section 5.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 16
        line_end: 16
        excerpt: |
                   DESCRIPTION="Online backup of PetStoreDB, keep 7 days"
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
        excerpt: |
          find "$PSL_BACKUP_DIR" -maxdepth 1 -name 'PetStoreDB_*' -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf {} \;
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 12
        line_end: 12
        excerpt: |
          PSL_BACKUP_KEEP_DAYS=7
    stack_metadata:
      framework: control-m
      batch.trigger: PSL_DB_BACKUP

  - record_key: AUDIT-INT-0001
    kind: integration
    capability_key: sign-on-audit
    requirement: >
      The system SHALL, every day no earlier than 01:30 and after that day's successful
      backup, export the previous calendar day's sign-on audit events to a file named
      signon_audit_YYYYMMDD.csv for the security team, and GIVEN the export fails WHEN it
      has not yet been rerun THEN it SHALL be rerun once.
    plain_text: >
      Each night, after the backup, yesterday's sign-on events are written to a dated file
      for the security team. A failed export is retried once.
    technical_note: >
      PSL_AUDIT_EXTRACT: TIMEFROM=0130, WEEKDAYS=ALL, MAXRERUN=1 (no INTERVAL), script
      psl_audit_extract.sh; output in /var/petstore/extract. File layout (no header,
      TRAILER line) is defined by the batch script and runbook 3.2, not by the scheduler.
    interface: true
    confidence: high
    confidence_basis: >
      Schedule, dependency and file name are declared in the scheduler and match runbook
      sections 2 and 3.2 and the script header.
    risk_class: regulated
    basis: >
      PSL_AUDIT_EXTRACT job attributes and description; runbook 3.2 says it is for the
      security team. Classed regulated because it is a security audit feed.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 27
        line_end: 33
        excerpt: |
              <JOB JOBISN="2" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_EXTRACT"
                   DESCRIPTION="Export yesterday SIGNON_AUDIT rows to signon_audit_YYYYMMDD.csv"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_extract.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AB"
                   TIMEFROM="0130" WEEKDAYS="ALL" MAXRERUN="1"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" AND_OR="A" />
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
