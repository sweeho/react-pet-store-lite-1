# SX-0001 extract-a, shard j2ee-pet-store-lite/scheduler/control-m (pass A)
# Scope: the Control-M export scheduler/control-m/PSL_PETSTORE.xml (2 folders, 6 jobs).
# The batch/*.sh wrappers, conf/env.sh and the HTML guides are cited only as
# corroboration; what each job does inside is owned by the batch and db/batch shards.
# No legacy-analysis/sources/**/extracted.md exists in this tree, so the guides are
# cited by repo path and line rather than as `kind: document` pointers (see findings).
records:

  # ---------------------------------------------------------------- batch-operations
  - record_key: BATCH-WF-0001
    kind: workflow
    capability_key: batch-operations
    requirement: >
      The system SHALL run the nightly jobs in this order every day: the database backup
      from 01:00; the sign-on audit extract from 01:30, and only after that day's backup
      has completed successfully; the daily sign-on report from 01:45, and the audit purge
      (Sundays only) from 02:00, each only after that day's audit extract has completed
      successfully.
    plain_text: >
      Every night the database is backed up first. The sign-in history file is produced
      only after a good backup, and the sign-in report and the weekly history clean-up
      run only after that file has been produced.
    technical_note: >
      Folder PSL_PETSTORE_DAILY. Ordering is enforced by Control-M conditions:
      PSL_DB_BACKUP adds PSL_DB_BACKUP-OK; PSL_AUDIT_EXTRACT waits on it (INCOND) and
      consumes it (OUTCOND SIGN="-") on success, adding PSL_AUDIT_EXTRACT-OK;
      PSL_SIGNON_REPORT and PSL_AUDIT_PURGE both wait on PSL_AUDIT_EXTRACT-OK, and the
      purge consumes it. TIMEFROM gives the earliest start of each job (0100, 0130, 0145,
      0200); the condition, not the time, decides whether a job may start. All conditions
      are dated ODAT (the order date), so a missing condition is not carried to the next
      day. Node psl-app01, run as user tomcat.
    interface: false
    confidence: high
    confidence_basis: >
      The ordering is declared by IN/OUT conditions in the scheduler export and restated
      in the folder comment, the Operations Runbook schedule table and diagram, and the
      header comment of psl_audit_extract.sh. Not graded higher because the scheduler
      runtime behaviour (condition handling) is inferred from the export, not observed.
    risk_class: operational
    basis: >
      INCOND/OUTCOND pairs and TIMEFROM on jobs 1 to 4 of PSL_PETSTORE_DAILY; the runbook
      schedule table and chain diagram say the same.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 4
        line_end: 7
        excerpt: |2
           Two folders:
             PSL_PETSTORE_DAILY   nightly chain: backup -> audit extract -> report / purge,
                                  plus the 06:00 catalog check
             PSL_PETSTORE_CYCLIC  account unlock every 15 minutes, all day
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 31
        line_end: 35
        excerpt: |2
                   TIMEFROM="0130" WEEKDAYS="ALL" MAXRERUN="1"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 45
        line_end: 48
        excerpt: |2
                   TIMEFROM="0145" WEEKDAYS="ALL"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_SIGNON_REPORT-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 55
        line_end: 59
        excerpt: |2
                   TIMEFROM="0200" WEEKDAYS="0"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PSL_AUDIT_PURGE-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 36
        line_end: 38
        excerpt: |2
          <pre>01:00 PSL_DB_BACKUP --> 01:30 PSL_AUDIT_EXTRACT --+--> 01:45 PSL_SIGNON_REPORT
                                                            +--> 02:00 PSL_AUDIT_PURGE (Sundays)
          06:00 PSL_CATALOG_CHECK            every 15 min  PSL_ACCT_UNLOCK</pre>
    stack_metadata:
      framework: Control-M Workload Automation
      batch.trigger: "folder PSL_PETSTORE_DAILY; conditions PSL_DB_BACKUP-OK, PSL_AUDIT_EXTRACT-OK"
      controlm.datacenter: DC_PSL_PRD
      controlm.node: psl-app01

  - record_key: BATCH-REQ-0001
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL take an online backup of the store database every day, starting no
      earlier than 01:00, and SHALL treat it as a critical job: GIVEN the backup fails,
      THEN it SHALL be retried automatically up to 2 more times, 10 minutes apart.
    plain_text: >
      The store database is backed up every night from 1 a.m. while the store stays
      open. If the backup fails it is tried again up to twice, ten minutes apart.
    technical_note: >
      Job PSL_DB_BACKUP (JOBISN 1, folder PSL_PETSTORE_DAILY) runs
      /opt/petstore/batch/psl_db_backup.sh as tomcat on psl-app01. CRITICAL="1",
      PRIORITY="AA", MAXRERUN="2", INTERVAL="00010M" (rerun interval). Scheduling uses
      both WEEKDAYS="ALL" and DAYSCAL="PSL_CAL"; the calendar PSL_CAL is not in the export
      (see findings).
    interface: false
    confidence: high
    confidence_basis: >
      Stated in the scheduler attributes and restated word for word in Operations Runbook
      3.1 ("up to 2 reruns 10 minutes apart") and the script header ("daily 01:00").
      Two independent statements agree.
    risk_class: operational
    basis: >
      TIMEFROM, CRITICAL, MAXRERUN and INTERVAL on PSL_DB_BACKUP; runbook 3.1.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 15
        line_end: 19
        excerpt: |2
              <JOB JOBISN="1" APPLICATION="PETSTORE" SUB_APPLICATION="DATABASE" JOBNAME="PSL_DB_BACKUP"
                   DESCRIPTION="Online backup of PetStoreDB, keep 7 days"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_db_backup.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0100" WEEKDAYS="ALL" DAYSCAL="PSL_CAL" MAXRERUN="2" INTERVAL="00010M"
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 41
        line_end: 44
        excerpt: |2
          <h2>3.1 PSL_DB_BACKUP</h2>
          <p>Online backup of PetStoreDB with <code>SYSCS_UTIL.SYSCS_BACKUP_DATABASE</code> (<code>db/batch/db_backup.sql</code>).
          The backup is moved to <code>/var/petstore/backup/PetStoreDB_YYYYMMDD</code>. Backups older than 7 days are deleted.
          Critical job: up to 2 reruns 10 minutes apart; on failure Control-M mails psl-ops and PSL_AUDIT_EXTRACT stays waiting.</p>
    stack_metadata:
      batch.trigger: "PSL_DB_BACKUP TIMEFROM=0100 WEEKDAYS=ALL DAYSCAL=PSL_CAL"
      controlm.maxrerun: 2
      controlm.rerun_interval: 00010M
      controlm.critical: 1

  - record_key: BATCH-BR-0001
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL keep the daily database backups for 7 days and delete older ones.
    plain_text: >
      Nightly database backups are kept for a week; older ones are deleted.
    technical_note: >
      The scheduler only states the retention in the job description ("keep 7 days").
      Deletion is done by psl_db_backup.sh with find -mtime +$PSL_BACKUP_KEEP_DAYS
      (PSL_BACKUP_KEEP_DAYS=7 in conf/env.sh), which in practice keeps about 8 dated
      folders (discovery finding F14). That script belongs to the batch shard.
    interface: false
    confidence: medium
    confidence_basis: >
      The 7 is stated in the scheduler description, the runbook and the script comment,
      and enforced in one place (the find in the script). Medium because the exact
      boundary (7 or 8 backups kept) differs between the wording and the mechanism, and
      this shard does not own the mechanism.
    dispute:
      reason: conflicting-sources
      detail: >
        The scheduler description and Operations Runbook 3.1 say backups older than 7
        days are deleted; the script uses find -mtime +7, which only matches folders
        whose age is 8 whole days or more, so roughly 8 daily backups survive. An SME
        should state whether the rule is "7 backups" or "at least 7 days of backups".
    risk_class: operational
    basis: >
      PSL_DB_BACKUP description, runbook 3.1, psl_db_backup.sh line 11, env.sh line 12.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 16
        line_end: 16
        excerpt: |2
                   DESCRIPTION="Online backup of PetStoreDB, keep 7 days"
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_db_backup.sh
        line_start: 11
        line_end: 11
        excerpt: |2
          find "$PSL_BACKUP_DIR" -maxdepth 1 -name 'PetStoreDB_*' -mtime +$PSL_BACKUP_KEEP_DAYS -exec rm -rf {} \;
      - path: legacy-source/j2ee-pet-store-lite/conf/env.sh
        line_start: 12
        line_end: 12
        excerpt: |2
          PSL_BACKUP_KEEP_DAYS=7
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 43
        line_end: 43
        excerpt: |2
          The backup is moved to <code>/var/petstore/backup/PetStoreDB_YYYYMMDD</code>. Backups older than 7 days are deleted.

  - record_key: BATCH-REQ-0002
    kind: requirement
    capability_key: batch-operations
    requirement: >
      GIVEN the nightly database backup ends in failure, THEN the system SHALL send an
      urgent e-mail to the operations team stating that the backup failed and the audit
      extract is held, AND the sign-on audit extract, the sign-on report and the audit
      purge SHALL NOT run for that day.
    plain_text: >
      If the nightly backup fails, operations get an urgent e-mail, and the sign-in
      history file, report and clean-up wait instead of running.
    technical_note: >
      PSL_DB_BACKUP <ON STMT="*" CODE="NOTOK"> with DOMAIL URGENCY="U" to
      psl-ops@example.invalid. Because PSL_DB_BACKUP-OK is never added, PSL_AUDIT_EXTRACT
      waits on its INCOND; the report and purge wait in turn on PSL_AUDIT_EXTRACT-OK. The
      mail is triggered on the final NOTOK; whether it is sent after each failed attempt
      or only after the reruns are exhausted is decided by Control-M, not stated here.
    interface: false
    confidence: high
    confidence_basis: >
      Declared in the scheduler ON/DOMAIL block and the condition chain, and restated in
      runbook 3.1 ("on failure Control-M mails psl-ops and PSL_AUDIT_EXTRACT stays
      waiting").
    risk_class: operational
    basis: >
      ON NOTOK / DOMAIL on PSL_DB_BACKUP; INCOND on PSL_AUDIT_EXTRACT; runbook 3.1.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 21
        line_end: 24
        excerpt: |2
                <OUTCOND NAME="PSL_DB_BACKUP-OK" ODATE="ODAT" SIGN="+" />
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="U" DEST="psl-ops@example.invalid" SUBJECT="PSL_DB_BACKUP failed" MESSAGE="Petstore DB backup failed, audit extract is held" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 44
        line_end: 44
        excerpt: |2
          Critical job: up to 2 reruns 10 minutes apart; on failure Control-M mails psl-ops and PSL_AUDIT_EXTRACT stays waiting.</p>
    stack_metadata:
      controlm.on: "STMT=* CODE=NOTOK"
      controlm.domail: "URGENCY=U DEST=psl-ops@example.invalid"

  # ---------------------------------------------------------------- sign-on-audit
  - record_key: AUDIT-REQ-0001
    kind: integration
    capability_key: sign-on-audit
    requirement: >
      The system SHALL, every day from 01:30 and after a successful backup, export the
      previous day's sign-on audit events to a file named signon_audit_YYYYMMDD.csv,
      where YYYYMMDD is the previous day's date.
    plain_text: >
      Every night, after the backup, yesterday's sign-in history is written to a dated
      file for the security team.
    technical_note: >
      Job PSL_AUDIT_EXTRACT (JOBISN 2) runs /opt/petstore/batch/psl_audit_extract.sh.
      MAXRERUN="1" with no INTERVAL. File layout (no header, trailer
      TRAILER,YYYYMMDD,count) is owned by the batch / db/batch shards and runbook 3.2;
      only the schedule and the file name are stated here.
    interface: true
    confidence: high
    confidence_basis: >
      The scheduler job description, the script header comment and runbook 3.2 all state
      the same day window and file name. Interface is true because runbook 3.2 says the
      file is produced for the security team.
    risk_class: operational
    basis: >
      PSL_AUDIT_EXTRACT description and TIMEFROM; runbook 3.2.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 27
        line_end: 31
        excerpt: |2
              <JOB JOBISN="2" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_EXTRACT"
                   DESCRIPTION="Export yesterday SIGNON_AUDIT rows to signon_audit_YYYYMMDD.csv"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_extract.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AB"
                   TIMEFROM="0130" WEEKDAYS="ALL" MAXRERUN="1"
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 46
        line_end: 48
        excerpt: |2
          <h2>3.2 PSL_AUDIT_EXTRACT</h2>
          <p>Exports yesterday's rows of SIGNON_AUDIT (00:00 to 24:00) to <code>/var/petstore/extract/signon_audit_YYYYMMDD.csv</code>
          for the security team (<code>db/batch/audit_extract.sql</code>).</p>
    stack_metadata:
      batch.trigger: "PSL_AUDIT_EXTRACT TIMEFROM=0130 INCOND=PSL_DB_BACKUP-OK"
      controlm.maxrerun: 1

  - record_key: AUDIT-REQ-0002
    kind: requirement
    capability_key: sign-on-audit
    requirement: >
      GIVEN the daily sign-on audit extract ends in failure, THEN the system SHALL send a
      regular-urgency e-mail to the security team stating that the sign-on audit extract
      was not produced, AND the sign-on report and the audit purge SHALL NOT run for that
      day.
    plain_text: >
      If the nightly sign-in history file is not produced, the security team is told by
      e-mail, and the report and the clean-up do not run that day.
    technical_note: >
      PSL_AUDIT_EXTRACT <ON STMT="*" CODE="NOTOK"> DOMAIL URGENCY="R" to
      psl-security@example.invalid. PSL_AUDIT_EXTRACT-OK is not added, so
      PSL_SIGNON_REPORT and PSL_AUDIT_PURGE stay waiting; conditions are dated ODAT so they
      do not carry to the next day.
    interface: false
    confidence: medium
    confidence_basis: >
      The alert is declared in one place, the scheduler export; the runbook does not
      mention the extract's alert. The hold on report and purge follows from the
      conditions and is corroborated by runbook 3.4 ("waits for that day's extract").
    risk_class: operational
    basis: >
      ON NOTOK / DOMAIL on PSL_AUDIT_EXTRACT; INCONDs on jobs 3 and 4.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 36
        line_end: 38
        excerpt: |2
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="R" DEST="psl-security@example.invalid" SUBJECT="PSL_AUDIT_EXTRACT failed" MESSAGE="Sign-on audit extract not produced" />
                </ON>
    stack_metadata:
      controlm.on: "STMT=* CODE=NOTOK"
      controlm.domail: "URGENCY=R DEST=psl-security@example.invalid"

  - record_key: AUDIT-REQ-0003
    kind: requirement
    capability_key: sign-on-audit
    requirement: >
      The system SHALL produce a daily sign-on statistics report every day from 01:45,
      only after that day's sign-on audit extract has completed successfully.
    plain_text: >
      A daily report of sign-in statistics is produced every night after the sign-in
      history file.
    technical_note: >
      Job PSL_SIGNON_REPORT (JOBISN 3) is TASKTYPE="Command" running
      /opt/petstore/batch/psl_signon_report.sh. No ON/DOMAIL block and no MAXRERUN: a
      failure alerts nobody and is not retried (see suspected defects). Report content
      (counts per event type, locked accounts, accounts per role) is in runbook 3.3 and
      owned by the batch / db/batch shards.
    interface: false
    confidence: high
    confidence_basis: >
      Schedule and dependency are declared in the export and restated in the runbook
      schedule table and chain diagram.
    risk_class: operational
    basis: >
      PSL_SIGNON_REPORT TIMEFROM and INCOND; runbook schedule table.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 41
        line_end: 49
        excerpt: |2
              <JOB JOBISN="3" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_SIGNON_REPORT"
                   DESCRIPTION="Daily sign-on statistics report"
                   TASKTYPE="Command" CMDLINE="/opt/petstore/batch/psl_signon_report.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AC"
                   TIMEFROM="0145" WEEKDAYS="ALL"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PSL_SIGNON_REPORT-OK" ODATE="ODAT" SIGN="+" />
              </JOB>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 31
        line_end: 31
        excerpt: |2
           <tr><td>PSL_SIGNON_REPORT</td><td>PSL_PETSTORE_DAILY</td><td>Daily 01:45</td><td>PSL_AUDIT_EXTRACT-OK</td><td>psl_signon_report.sh</td></tr>
    stack_metadata:
      batch.trigger: "PSL_SIGNON_REPORT TIMEFROM=0145 INCOND=PSL_AUDIT_EXTRACT-OK"

  - record_key: AUDIT-BR-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL delete sign-on audit events older than 90 days once a week, on
      Sundays from 02:00, and only after that Sunday's audit extract has completed
      successfully. GIVEN that Sunday's extract does not complete successfully, THEN no
      purge SHALL run that week.
    plain_text: >
      Sign-in history older than 90 days is deleted every Sunday night, but only after
      that night's history file has been produced, so nothing is deleted before it has
      been exported. If that file fails, the clean-up is skipped until the next Sunday.
    technical_note: >
      Job PSL_AUDIT_PURGE (JOBISN 4) WEEKDAYS="0" (Sunday), TIMEFROM="0200", INCOND
      PSL_AUDIT_EXTRACT-OK, consumes that condition on success. Runs
      /opt/petstore/batch/psl_audit_purge.sh. The 90-day value is in the job description;
      the delete itself is in db/batch/audit_purge.sql (other shard). No ON/DOMAIL and no
      rerun. The "skipped until next Sunday" clause is inferred from ODAT-dated
      conditions, not stated anywhere.
    interface: false
    confidence: high
    confidence_basis: >
      Sunday-only scheduling and the extract dependency are declared in the export and
      restated in runbook 3.4 together with the 90 days. The skip-a-week consequence is
      inferred and only medium on its own.
    risk_class: operational
    basis: >
      PSL_AUDIT_PURGE attributes and INCOND; runbook 3.4.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 51
        line_end: 57
        excerpt: |2
              <JOB JOBISN="4" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_AUDIT_PURGE"
                   DESCRIPTION="Delete SIGNON_AUDIT rows older than 90 days (Sundays)"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_audit_purge.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AD"
                   TIMEFROM="0200" WEEKDAYS="0"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PSL_AUDIT_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 63
        line_end: 64
        excerpt: |2
          <h2>3.4 PSL_AUDIT_PURGE</h2>
          <p>Sundays only. Deletes SIGNON_AUDIT rows older than 90 days. It waits for that day's extract so no row is deleted before it is extracted.</p>
    stack_metadata:
      batch.trigger: "PSL_AUDIT_PURGE TIMEFROM=0200 WEEKDAYS=0 INCOND=PSL_AUDIT_EXTRACT-OK"
      db.object: SIGNON_AUDIT

  # ---------------------------------------------------------------- catalog-data-integrity
  - record_key: CATI-REQ-0001
    kind: requirement
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL run the catalog integrity check every day from 06:00, independently
      of the nightly backup and audit chain, and GIVEN the check finds catalog data that
      breaks an integrity rule (job result code 4), THEN the system SHALL send an urgent
      e-mail to the catalog team pointing to the catalog check log.
    plain_text: >
      Every morning at 6 a.m., before the store opens, the catalog is checked. If any
      catalog rule is broken, the catalog team gets an urgent e-mail.
    technical_note: >
      Job PSL_CATALOG_CHECK (JOBISN 5) TASKTYPE="Command"
      /opt/petstore/batch/psl_catalog_check.sh, CRITICAL="1", PRIORITY="AA", no INCOND.
      <ON STMT="*" CODE="COMPSTAT=4"> DOMAIL URGENCY="U" to psl-catalog@example.invalid,
      message "See /var/petstore/log/catalog_check.log". Exit 4 is set by the script when
      any check C1-C4 returns rows. No rerun. Only code 4 is routed; code 8 is not (see
      suspected defects).
    interface: false
    confidence: high
    confidence_basis: >
      The 06:00 schedule and the code-4 alert are declared in the export, the script sets
      exit 4 on a failed check, and runbook 3.5 / Admin Guide 3.3 restate both.
    risk_class: operational
    basis: >
      PSL_CATALOG_CHECK attributes and ON COMPSTAT=4 block; psl_catalog_check.sh exit 4;
      runbook 3.5; admin guide 3.3.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 62
        line_end: 71
        excerpt: |2
              <JOB JOBISN="5" APPLICATION="PETSTORE" SUB_APPLICATION="CATALOG" JOBNAME="PSL_CATALOG_CHECK"
                   DESCRIPTION="Catalog integrity check before the store opens; first load when empty"
                   TASKTYPE="Command" CMDLINE="/opt/petstore/batch/psl_catalog_check.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0600" WEEKDAYS="ALL"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <OUTCOND NAME="PSL_CATALOG_CHECK-OK" ODATE="ODAT" SIGN="+" />
                <ON STMT="*" CODE="COMPSTAT=4">
                  <DOMAIL URGENCY="U" DEST="psl-catalog@example.invalid" SUBJECT="Petstore catalog integrity check failed" MESSAGE="See /var/petstore/log/catalog_check.log" />
                </ON>
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 16
        line_end: 18
        excerpt: |2
          if echo "$OUT" | grep -qE "^C[1-4] "; then
            psl_log "FAILED: integrity check found rows"
            exit 4
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 99
        line_end: 99
        excerpt: |2
          <p>Job PSL_CATALOG_CHECK checks C1 to C4 every morning at 06:00 and alerts the catalog team when one fails.</p>
    stack_metadata:
      batch.trigger: "PSL_CATALOG_CHECK TIMEFROM=0600 WEEKDAYS=ALL"
      controlm.on: "STMT=* CODE=COMPSTAT=4"
      controlm.domail: "URGENCY=U DEST=psl-catalog@example.invalid"

  # ---------------------------------------------------------------- sample-data-population
  - record_key: POP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      GIVEN the catalog tables do not exist when the daily 06:00 catalog check runs, WHEN
      the check runs, THEN the system SHALL request the store's first load of sample data
      (not a forced reload) and then run the integrity checks again.
    plain_text: >
      If the morning catalog check finds no catalog at all, it asks the store to load its
      starting sample data and then checks again.
    technical_note: >
      The scheduler states only "first load when empty" in the PSL_CATALOG_CHECK
      description. The mechanism is in psl_catalog_check.sh: on "does not exist" in the
      check output it calls $PSL_STORE_URL/Populate?forcefully=false over HTTP, exiting 8
      if that call fails. That first load drops and recreates every table, accounts and
      sign-in history included (discovery F3); this belongs to the batch and populate
      shards.
    interface: false
    confidence: medium
    confidence_basis: >
      The scheduler description and runbook 3.5 state the behaviour and the script
      implements it, but this shard sees only the description; the destructive scope of
      the first load is outside this shard and not verified here.
    risk_class: operational
    basis: >
      PSL_CATALOG_CHECK DESCRIPTION; psl_catalog_check.sh lines 10-13; runbook 3.5.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 63
        line_end: 63
        excerpt: |2
                   DESCRIPTION="Catalog integrity check before the store opens; first load when empty"
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 10
        line_end: 13
        excerpt: |2
          if echo "$OUT" | grep -q "does not exist"; then
            psl_log "catalog tables missing, requesting first load"
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
            OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 67
        line_end: 68
        excerpt: |2
          <p>Runs catalog checks C1 to C4 (see the Administrator Guide). If the catalog tables do not exist it calls
          <code>http://localhost:8080/petstore/Populate?forcefully=false</code> to load the sample data, then checks again.
    stack_metadata:
      batch.trigger: "PSL_CATALOG_CHECK TIMEFROM=0600"

  # ---------------------------------------------------------------- account-lockout
  - record_key: LOCK-REQ-0001
    kind: requirement
    capability_key: account-lockout
    requirement: >
      The system SHALL run the automatic account-unlock check every 15 minutes, all day
      (00:00 to 23:59), every day, unlocking accounts whose lock is more than 30 minutes
      old.
    plain_text: >
      Every 15 minutes, round the clock, the store releases accounts that have been
      locked for more than 30 minutes. A locked customer may therefore wait up to about
      45 minutes.
    technical_note: >
      Folder PSL_PETSTORE_CYCLIC, job PSL_ACCT_UNLOCK: CYCLIC="1",
      CYCLIC_TYPE="Interval", INTERVAL="00015M", IND_CYCLIC="START" (interval measured
      from the start of the previous run), TIMEFROM 0000, TIMETO 2359, WEEKDAYS ALL.
      Runs /opt/petstore/batch/psl_acct_unlock.sh. The 30-minute threshold is in the job
      description; the UPDATE itself is in db/batch/acct_unlock.sql (other shard). No
      ON/DOMAIL block and no INCOND.
    interface: false
    confidence: medium
    confidence_basis: >
      The 15-minute cadence is enforced in one place only, the scheduler; the runbook,
      Admin Guide R5, User Guide and script comment restate it but do not enforce it.
      Discovery lists this cadence as a single-source rule.
    risk_class: operational
    basis: >
      PSL_ACCT_UNLOCK cyclic attributes and description; Admin Guide R5; runbook 3.6.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 78
        line_end: 85
        excerpt: |2
              <JOB JOBISN="1" APPLICATION="PETSTORE" SUB_APPLICATION="SECURITY" JOBNAME="PSL_ACCT_UNLOCK"
                   DESCRIPTION="Unlock sign-on accounts locked for more than 30 minutes"
                   TASKTYPE="Job" MEMLIB="/opt/petstore/batch" MEMNAME="psl_acct_unlock.sh"
                   RUN_AS="tomcat" NODEID="psl-app01" PRIORITY="AA"
                   TIMEFROM="0000" TIMETO="2359" WEEKDAYS="ALL"
                   CYCLIC="1" CYCLIC_TYPE="Interval" INTERVAL="00015M" IND_CYCLIC="START"
                   CREATED_BY="psl_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
              </JOB>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 54
        line_end: 54
        excerpt: |2
           <tr><td>R5</td><td>Batch job PSL_ACCT_UNLOCK runs every 15 minutes and unlocks accounts locked more than 30 minutes ago. It sets failed attempts to 0 and records ACCOUNT_UNLOCKED.</td></tr>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        line_start: 130
        line_end: 130
        excerpt: |2
          (the store checks every 15 minutes, so allow up to 45 minutes). You can keep browsing the catalog while you wait.
    stack_metadata:
      batch.trigger: "PSL_ACCT_UNLOCK cyclic every 00015M from start, 0000-2359"
      controlm.folder: PSL_PETSTORE_CYCLIC

suspected_defects:
  - capability_key: catalog-data-integrity
    record_keys: [CATI-REQ-0001, POP-WF-0001]
    severity: medium
    category: error-swallowed
    title: Catalog check alerts only on code 4; a failed first load (code 8) alerts nobody
    description: >
      The catalog check job sends its e-mail only when the job ends with code 4 (a rule
      broken). When the tables are missing and the first load call fails, the script ends
      with code 8; no ON block covers code 8 and the job has no rerun, so the store can
      start the day with no catalog and no one is e-mailed. The runbook's exit-code table
      lists code 8 as "Rerun", which assumes someone notices.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 69
        line_end: 71
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 12
        line_end: 12
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
        line_start: 79
        line_end: 79

  - capability_key: account-lockout
    record_keys: [LOCK-REQ-0001]
    severity: medium
    category: error-swallowed
    title: Unlock job has no failure alert or recovery
    description: >
      The cyclic unlock job has no failure handling: no e-mail, no rerun. If a run fails,
      nobody is told. In Control-M a cyclic job that ends NOTOK normally stops cycling
      until someone acts. Locked customers could then stay locked for the rest of the day,
      against the 30-minute promise in the guides. The stop-cycling behaviour is the
      scheduler's default and is inferred, not observed.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 78
        line_end: 85
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        line_start: 130
        line_end: 130

  - capability_key: sign-on-audit
    record_keys: [AUDIT-REQ-0003, AUDIT-BR-0001]
    severity: low
    category: error-swallowed
    title: Sign-on report and audit purge failures alert nobody
    description: >
      The sign-on report and the Sunday audit purge jobs have no ON/DOMAIL block and no
      rerun. A failed report or purge goes unnoticed. A missed purge leaves audit rows
      beyond 90 days until the next Sunday, and nobody is told the retention was not
      applied.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 41
        line_end: 60

  - capability_key: batch-operations
    record_keys: [BATCH-WF-0001, AUDIT-REQ-0003]
    severity: low
    category: other
    title: On Sundays the purge consumes the condition the report also waits on
    description: >
      Both the sign-on report and the Sunday purge wait on the same "extract OK"
      condition, and the purge deletes it when it finishes. If on a Sunday the extract
      completes late (for example after backup reruns) and the report has not yet started
      when the purge ends, the report loses its condition and waits without running for
      that day. Normally the report's earlier start time (01:45 vs 02:00) and higher
      priority avoid this, so the risk is a timing race, not a certainty.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 47
        line_end: 47
      - path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
        line_start: 57
        line_end: 58

findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
    description: >
      PSL_DB_BACKUP carries both WEEKDAYS="ALL" and DAYSCAL="PSL_CAL", and the calendar
      PSL_CAL is not defined anywhere in the tree. Depending on the Control-M AND/OR
      setting between weekdays and the calendar, the backup may run every day or only on
      calendar days. On a day the backup does not run, the extract, report and purge do
      not run either. Operations should export PSL_CAL or confirm the backup runs every
      day.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/scheduler/control-m/PSL_PETSTORE.xml
    description: >
      PSL_AUDIT_EXTRACT has MAXRERUN="1" but no INTERVAL or rerun trigger. The export does
      not show whether a failed extract is rerun automatically or whether this only caps
      manual reruns. A human with Control-M access should confirm.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/docs/guides/operations-runbook.html
    description: >
      There is no legacy-analysis/sources/**/extracted.md for any guide in this tree, so
      the Operations Runbook, Admin Guide and User Guide are cited by repo path and line
      rather than as `kind: document` pointers with anchors. If extracted documents are
      produced later, these traces may need re-pointing.
