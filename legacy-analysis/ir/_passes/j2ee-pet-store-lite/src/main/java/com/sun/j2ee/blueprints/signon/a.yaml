  - record_key: SIGN-ENT-0001
    kind: entity
    capability_key: sign-on
    requirement: >
      The system SHALL keep one account record per user name, holding: user name
      (unique, at most 25 characters), password (at most 25 characters), role
      (CUSTOMER or ADMIN, default CUSTOMER), count of consecutive failed sign-ons
      (default 0), locked flag (Y or N, default N), time the lock was set, time of
      the last successful sign-on, and time the account was created.
    plain_text: >
      Each account has a unique user name, a password, a role (customer or
      administrator), a failed-sign-in counter, a locked flag with the lock time,
      the last sign-in time and the creation time.
    technical_note: >
      Table SIGNON (petstore_derby.sql / petstore_oracle.sql): PK username varchar(25),
      CHECK role IN ('CUSTOMER','ADMIN'), CHECK locked IN ('Y','N'). UserDAO reads and
      writes it through SELECT_USER, UPDATE_SUCCESS, UPDATE_FAILURE and INSERT_USER.
