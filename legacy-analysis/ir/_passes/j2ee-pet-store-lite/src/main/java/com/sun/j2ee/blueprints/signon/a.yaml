  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: >
      The system SHALL accept a sign-on only when an account with exactly the
      submitted user name exists, the account is not locked, and the submitted
      password is exactly equal to the stored password; user names and passwords
      SHALL be compared case-sensitively.
    plain_text: >
      You can sign in only if the account exists, is not locked, and the password
      matches exactly. "J2EE" and "j2ee" are two different users.
    technical_note: >
      UserDAO.authenticate selects the SIGNON row by username (exact match),
      checks LOCKED first, then compares the stored password with String.equals.
      It returns SIGNON_OK, SIGNON_INVALID or SIGNON_LOCKED to SignOnFilter.validateSignOn,
      which handles the POST to j_signon_check.
    interface: false
    confidence: high
    confidence_basis: >
      The code path in UserDAO is explicit, and the admin guide (rule R1) and user
      guide (case-sensitivity note) state the same rule independently. Case
      sensitivity of the lookup depends on the database collation. The Derby default
      is case-sensitive, but the Oracle variant was not checked at runtime.
    risk_class: regulated
    basis: >
      Exact-match SELECT on username, lock check before password check, and
      String.equals on the password.
    traces:
