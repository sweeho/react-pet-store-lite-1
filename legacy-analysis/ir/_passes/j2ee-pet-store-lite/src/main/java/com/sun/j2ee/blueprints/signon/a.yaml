  - record_key: SIGN-REQ-0007
    kind: workflow
    capability_key: sign-on
    requirement: >
      WHEN the user signs off, THEN the system SHALL record a sign-off event for the
      signed-on user name (if any), end the session, and show the signed-out page.
      WHEN there is no session, THEN the system SHALL show the signed-out page
      without recording anything. Sign-off SHALL be accepted by both page link
      and form submission.
    plain_text: >
      Signing out records the event, ends your session and shows "You are signed out".
    technical_note: >
      SignOffServlet (mapped to /signoff.do, doGet and doPost) reads j_signon_username
      from an existing session, calls UserDAO.recordSignOff (event SIGNOFF), invalidates
      the session and redirects to signoff.screen.
    interface: false
    confidence: high
    confidence_basis: >
      The code is explicit, and the user guide 5.5 describes the same outcome.
    risk_class: operational
    basis: >
      SignOffServlet.doGet body. doPost delegates to doGet.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/SignOffServlet.java
        line_start: 58
        line_end: 78
        excerpt: |2
              public void doGet(HttpServletRequest request, HttpServletResponse response)
                  throws IOException, ServletException {
                  HttpSession session = request.getSession(false);
                  if (session != null) {
                      String userName = (String)session.getAttribute(SignOnFilter.USER_NAME);
                      if (userName != null) {
                          try {
                              new UserDAO().recordSignOff(userName, request.getRemoteAddr());
                          } catch (UserDAOException ue) {
                              System.err.println("SignOffServlet: " + ue.getMessage());
                          }
                      }
                      session.invalidate();
                  }
                  response.sendRedirect("signoff.screen");
              }

              public void doPost(HttpServletRequest request, HttpServletResponse response)
                  throws IOException, ServletException {
                  doGet(request, response);
              }
