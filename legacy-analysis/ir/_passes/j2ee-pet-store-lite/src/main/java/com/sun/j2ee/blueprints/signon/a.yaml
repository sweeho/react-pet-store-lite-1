    category: other
    title: Protected-page check compares the raw request path exactly, so variants of the same page may bypass it
    description: >
      The filter takes the undecoded request URI, removes the first path segment (the
      context root) and compares the rest with each protected name using exact string
      equality. A request for the same page with a path parameter (for example
      ";jsessionid=..."), a percent-encoded character, a different case, or an extra
      path segment does not match, so the filter passes it through unprotected. For a
      signed-on customer the same comparison decides the ADMIN-only check. If the
      container still routes such a variant to the page, an anonymous user could
      reach My Account and a customer could reach Catalog Administration. This was
      inferred from the code and not confirmed against a running container. The same
      parsing also returns no target (so nothing is protected) when the application
      is deployed at the root context. The Dockerfile deploys it as /petstore, which
      avoids that case today.
