# Spec extraction SX-0001 · extract-b · j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf
# Pass B (independent reading). This module is the page-composition framework
# (screen definitions, layout template, insert tag, session/request keys). It
# holds no domain rules of its own; the records below cover the user-visible
# behaviour it produces: the shared page layout, the screen catalogue and page
# titles, locale selection, the "previous screen" shortcut and the error output
# for an undefined screen. None of the capability keys is a perfect fit for
# framework behaviour; each record says in `basis` why it was filed where it is.
# No legacy-analysis/sources/**/extracted.md exists in this tree; the HTML guides
# under legacy-source/j2ee-pet-store-lite/docs/guides were read and are cited as
# line-ranged traces.

records:
  - record_key: CATB-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL render every store page on one shared layout made of a page
      title, a banner at the top, a side bar on the left, a body area holding the
      requested page content, and a footer at the bottom. GIVEN a page that names no
      layout of its own WHEN it is shown THEN the system SHALL use the default layout.
    plain_text: >
      Every page in the store looks the same around the edges: a title, a banner at the
      top, a category side bar on the left, the page content in the middle and a footer
      at the bottom.
    technical_note: >
      Requests for *.screen are mapped to TemplateServlet (web.xml). The servlet looks
      the screen up in WEB-INF/screendefinitions_en_US.xml, stores it as request
      attribute CURRENT_SCREEN and forwards to the template (default-template
      /template.jsp; Screens.getTemplate falls back to the default when the screen's
      template attribute is empty or unknown). template.jsp places five
      <template:insert> tags (title, banner, sidebar, body, footer); InsertTag prints a
      parameter whose direct="true" as literal text, otherwise includes the named JSP.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in code (TemplateServlet forward, Screens default-template fallback,
      InsertTag include/print), declared in configuration (screen definitions give
      every screen the same five parameters, template.jsp lays them out) and stated in
      the User Guide section 1.1. Three independent sources agree.
    risk_class: presentational
    basis: >
      Filed under catalog-browsing because the layout frames the catalog pages and the
      side bar is the category list; the layout itself spans every capability. The
      User Guide says "Every page has the same four parts" (banner, side bar, body,
      footer); the code adds the page title as a fifth composed part.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/Screens.java
