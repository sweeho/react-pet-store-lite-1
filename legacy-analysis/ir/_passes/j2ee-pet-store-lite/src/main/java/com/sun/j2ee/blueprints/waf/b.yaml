  - record_key: CATB-WF-0001
    kind: workflow
    capability_key: catalog-browsing
    requirement: >
      The system SHALL remember, per visitor session, the last page shown. WHEN the
      visitor requests the special page "PREVIOUS" THEN the system SHALL show that last
      page again, without replacing the remembered page. The re-use of the previous
      page's form inputs and computed data SHALL be off unless explicitly switched on, so
      by default the previous page is re-shown without its earlier inputs.
    plain_text: >
      The store remembers the last page you looked at and can take you back to it, but
      by default it does not bring back what you had typed on it.
    technical_note: >
      TemplateServlet stores "<screen>.<ext>" in session attribute PREVIOUS_SCREEN on
      every non-PREVIOUS screen request; a request for PREVIOUS.screen re-dispatches that
      screen. Init params cache_previous_screen_parameters / cache_previous_screen_attributes
      (both absent from web.xml, so false) control copying request parameters/attributes
      to and from the session.
    interface: false
