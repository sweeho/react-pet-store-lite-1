  - record_key: CATB-REQ-0002
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL present the store in a single language, US English (en_US).
      GIVEN a request that asks for another language (by request parameter or by a
      language remembered in the session) WHEN no page set exists for that language THEN
      the system SHALL show the en_US pages. GIVEN a page that is not defined for the
      requested language THEN the system SHALL show the en_US version of that page.
    plain_text: >
      The store is in US English only. Asking for any other language quietly shows the
      English pages.
    technical_note: >
      TemplateServlet.init loads WEB-INF/screendefinitions_<locale>.xml for each entry
      of init-param "locales" (web.xml: en_US) and sets default_locale (web.xml: en_US;
      JVM default if absent). process() takes the "locale" request parameter first, then
      the session LOCALE attribute, and falls back to default_locale when no definitions
      were loaded for it; a screen missing from the chosen locale is looked up in the
      default locale. The catalog JSPs also hard-code locale en_US (outside this module).
    interface: false
    confidence: high
    confidence_basis: >
      Configured in web.xml, implemented in TemplateServlet and stated in the User Guide
      ("The store is in English (en_US)"). The override-by-parameter path is read from
      code; nothing in the application links with a locale parameter.
    risk_class: presentational
    basis: >
      Filed under catalog-browsing (closest fit; the capability list has no
      localisation capability). Code plus web.xml plus User Guide.
