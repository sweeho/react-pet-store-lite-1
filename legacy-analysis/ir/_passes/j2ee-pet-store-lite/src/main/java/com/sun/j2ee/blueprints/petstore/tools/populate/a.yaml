suspected_defects:
  - capability_key: sample-data-population
    record_keys: [POP-BR-0001, POP-WF-0001, POP-INT-0002]
    severity: high
    category: data-corruption
    title: >
      A failed or empty check on any table wipes every account and all sign-in history
    description: >
      The "already populated" check swallows any database error and treats it as "empty", and it reports "empty" if just one of six catalog tables has no rows. Either case triggers a full drop-and-reload that also deletes the sign-on accounts and the sign-on history, which are unrelated to the catalog. The request needs no sign-in, and the daily catalog check job makes it automatically when catalog tables are missing. Admin Guide 3.1 states the drop of every table but not that a read error counts as empty.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 162
        line_end: 170
