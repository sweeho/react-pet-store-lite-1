    requirement: >
      GIVEN a reload fails part-way (a table cannot be created, a row cannot be inserted, or the data file cannot be read), THEN the system SHALL leave the tables in whatever state the failure reached: tables already dropped stay dropped and rows already inserted stay inserted. No step of the reload SHALL be undone.
    plain_text: >
      A reload is not all-or-nothing. If it breaks half-way, the store is left with the catalog and accounts partly deleted or partly loaded.
    technical_note: >
      populate() obtains a connection from the catalog data source and never calls setAutoCommit(false), commit() or rollback(); each PreparedStatement.execute() runs under the JDBC default auto-commit. On failure the exception is wrapped and rethrown; the finally block only closes the connection.
