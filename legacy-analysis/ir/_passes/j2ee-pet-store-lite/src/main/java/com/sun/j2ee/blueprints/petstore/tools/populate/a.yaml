records:
  - record_key: POP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      WHEN a population request arrives that is not a forced reload, the system SHALL check whether the catalog (categories, category texts, products, product texts, items, item texts) and the sign-on accounts each hold at least one row. GIVEN all of them hold data, THEN the system SHALL change nothing. GIVEN any of them is empty or cannot be read, THEN the system SHALL drop, recreate and reload every catalog and sign-on table from the sample data file, exactly as for a forced reload.
    plain_text: >
      The first time anyone enters the store, it fills itself with the sample catalog and the sample users. If the catalog and the user list already contain data, entering the store leaves them alone.
    technical_note: >
      PopulateServlet.populate(false): alreadyPopulated = CatalogPopulator.check && UserPopulator.check. Each check runs the per-table CheckStatement from PopulateSQL.xml ('select * from <table>') and PopulateUtils.executeSQLStatement returns resultSet.next(), i.e. true when the table has at least one row. CatalogPopulator.check chains category, category_details, product, product_details, item, item_details; UserPopulator.check reads signon only. If !alreadyPopulated the drop/create/parse branch runs (see POP-WF-0002).
    interface: false
    confidence: high
    confidence_basis: >
      The branch is read directly in PopulateServlet and the per-table checks in every populator; Admin Guide 3.1 states the same rule in prose ("If the catalog and SIGNON tables already hold data nothing happens. Otherwise every table is dropped, created and loaded"). Code plus document agree.
    risk_class: operational
    basis: >
      The non-forced branch of PopulateServlet.populate, the check() methods of the catalog and user populators, the row-exists result in PopulateUtils, and Admin Guide section 3.1.
