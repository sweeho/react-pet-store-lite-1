  - record_key: POP-BR-0007
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      WHEN a population request completes, the system SHALL send the requester to the success page named in the request; GIVEN none is named, to the page the request came from; GIVEN neither is known, it SHALL return an empty successful response. WHEN population fails, GIVEN an error page is named in the request, THEN the system SHALL send the requester there; otherwise it SHALL return a server error. A page name beginning with a single slash or no slash SHALL be resolved inside the store; one beginning with two slashes SHALL be resolved against the current request address.
    plain_text: >
      After loading, the person is taken to the page the caller asked for (normally the home page), or back where they came from. If loading fails they see the error page the caller asked for, or a server error.
    technical_note: >
      PopulateServlet.doPost lines 130-142 and redirect() lines 200-210. Callers: populating.jsp and populate_admin.jsp both pass success_page=main.screen; neither passes error_page, so a failure surfaces as ServletException (HTTP 500). The failure root-cause message is written to System.err. The populate() boolean result is ignored.
    interface: false
    confidence: medium
    confidence_basis: >
      Read in one place; the two web callers confirm the success-page path, and Admin Guide 3.2 says the reload "shows the home page". The failure path with error_page is never used by a caller and has a suspected defect (see suspected_defects).
    risk_class: presentational
    basis: >
      The redirect branches and the PopulateException catch in PopulateServlet.doPost, and redirect().
    traces:
