  - record_key: POP-BR-0001
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      GIVEN a non-forced population request, WHEN any one of the seven checked tables has no rows, OR the check itself fails for any reason (for example a table is missing or the database returns an error), THEN the system SHALL treat the store as not yet populated and SHALL perform the full drop-and-reload, which also deletes every sign-on account and all sign-on history. The sign-on history table SHALL NOT be part of the check.
    plain_text: >
      The store decides it is "empty" if even one part of the catalog is empty, if there are no user accounts at all, or if it simply cannot read one of those tables. In any of those cases it wipes and reloads everything, including real customer accounts and their sign-in history.
    technical_note: >
      PopulateServlet.java:163-165 wraps the check in try { ... } catch (PopulateException exception) {} so any SQL error leaves alreadyPopulated=false. The checks are joined with && so the first empty table short-circuits to false. UserPopulator.check queries signon only; signon_audit has a CheckStatement in PopulateSQL.xml but no code calls it.
    interface: false
    confidence: medium
    confidence_basis: >
      Read in one clear place (the swallowed catch and the && chain). Admin Guide 3.1 states the "already hold data" rule but not that a read error counts as empty, so the error-equals-empty half rests on the code alone.
    risk_class: operational
    basis: >
      The empty catch block around the checks in PopulateServlet.populate and the short-circuit && of the per-table checks.
