  - record_key: POP-INT-0002
    kind: integration
    capability_key: sample-data-population
    requirement: >
      The system SHALL expose the first-load population as an address that the daily catalog check job can call without signing in. GIVEN the call succeeds or there was nothing to load, THEN the call SHALL report success; GIVEN population fails, THEN the call SHALL report failure, so the job can end with its population-failed exit code.
    plain_text: >
      The daily catalog check can ask the store to load its sample data when the catalog tables are missing, and is told whether that worked.
    technical_note: >
      batch/psl_catalog_check.sh line 12 runs curl -sf "$PSL_STORE_URL/Populate? forcefully=false" and exits 8 on failure. With no success_page and no Referer the servlet returns 200 with an empty body; a PopulateException with no error_page becomes ServletException (HTTP 500), which curl -f reports as failure. Mapping /Populate in web.xml. Because the call is a non-forced first load, it also wipes SIGNON and SIGNON_AUDIT whenever a catalog check fails (POP-BR-0001).
    interface: true
    confidence: high
    confidence_basis: >
      The batch script, the Operations Runbook 3.5 and the servlet's response behaviour agree on the call and its success/failure signalling.
    risk_class: operational
    basis: >
      The HTTP call in psl_catalog_check.sh, the /Populate servlet mapping and the response paths of PopulateServlet.doPost; Runbook 3.5.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 2
        line_end: 14
        excerpt: |2
          # PSL_CATALOG_CHECK - daily 06:00 before the store opens.
          # Runs the catalog integrity checks. When the catalog is empty it asks the
          # store to populate itself (first load, not a forced reload). Any failed
          # check ends the job with code 4 so operations is alerted.
          PSL_JOB=PSL_CATALOG_CHECK
          . "${PSL_HOME:-/opt/petstore}/conf/env.sh"
          psl_log "start"
          OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          if echo "$OUT" | grep -q "does not exist"; then
            psl_log "catalog tables missing, requesting first load"
            curl -sf -o /dev/null "$PSL_STORE_URL/Populate?forcefully=false" || { psl_log "FAILED: populate"; exit 8; }
            OUT=$(psl_ij "$PSL_SQL/catalog_check.sql")
          fi
