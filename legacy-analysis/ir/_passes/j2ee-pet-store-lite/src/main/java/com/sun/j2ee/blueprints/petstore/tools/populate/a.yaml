    requirement: >
      WHEN a reload is performed (forced, or first load on an empty store), the system SHALL (1) drop the item texts, items, product texts, products, category texts and categories, then the sign-on history and the sign-on accounts, ignoring any table that cannot be dropped; (2) create categories, category texts, products, product texts, items, item texts, then sign-on accounts and sign-on history, stopping with an error if any table cannot be created; (3) load users and catalog from the sample data file.
    plain_text: >
      A reload deletes the whole catalog, every user account and all sign-in history, rebuilds those eight tables empty, and then fills them from the sample data file.
    technical_note: >
      PopulateServlet.populate lines 168-179. CatalogPopulator.dropTables drops item(+item_details first), product(+product_details first), category(+category_details first), each in its own try/catch that swallows PopulateException; UserPopulator.dropTables drops signon_audit then signon, also swallowing. createTables propagates PopulateException: category, category_details, product, product_details, item, item_details, signon, signon_audit. Statements come from PopulateSQL.xml (Drop/Create per table).
    interface: false
    confidence: high
    confidence_basis: >
      The order is explicit statement sequence in CatalogPopulator, the three catalog populators and UserPopulator; Admin Guide 3.2 lists the same eight tables (order not stated in the guide).
