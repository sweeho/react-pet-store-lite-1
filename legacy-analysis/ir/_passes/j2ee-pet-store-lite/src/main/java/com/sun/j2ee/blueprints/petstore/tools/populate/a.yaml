    severity: medium
    category: other
    title: >
      Failure path redirects twice when an error page is given
    description: >
      When population fails and the request names an error page, the servlet redirects to that page and then falls through to the success-page or Referer redirect. A second redirect on a committed response normally raises an illegal-state error, so the user would likely see the general error page instead of the named one. No current caller passes error_page, so the path is latent.
    traces:
