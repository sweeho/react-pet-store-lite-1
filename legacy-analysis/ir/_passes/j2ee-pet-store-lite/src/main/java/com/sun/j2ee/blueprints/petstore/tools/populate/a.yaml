  - capability_key: sample-data-population
    record_keys: [POP-BR-0004, POP-WF-0002]
    severity: medium
    category: data-corruption
    title: >
      Reload is not atomic; a mid-way failure leaves tables dropped or half-loaded
    description: >
      Drops, creates and inserts each commit on their own. If any step after the drops fails, the catalog and accounts are left partially deleted or partially loaded, and the next non-forced request will see an empty table and reload again. Drop failures are silently ignored.
