    record_keys: [CATB-REQ-0003]
    severity: low
    category: data-corruption
    title: Item list swaps category and product identifiers
    description: >
      When items are listed for a product, each item's category is set to the product
      identifier and its product identifier is set to the category identifier (constructor
      argument order does not match the selected columns). The current product page shows
      neither field, so the swap is not visible today, but any consumer reading them gets
      wrong values.
