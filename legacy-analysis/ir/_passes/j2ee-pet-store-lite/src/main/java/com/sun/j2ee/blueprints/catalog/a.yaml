  - record_key: CATB-RULE-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL page every catalog list (categories, products, items, search results)
      by a zero-based start position and a requested count: a page holds at most count rows
      starting at start; a next page SHALL be offered only when at least one more row exists
      after the page; a previous page SHALL be offered whenever start is greater than zero;
      the next page SHALL start at start plus the number of rows shown; the previous page
      SHALL start at start minus the number of rows shown, never below zero. GIVEN start is
      negative or beyond the last row WHEN a page is requested THEN the system SHALL return an
      empty page.
    plain_text: >
      Long lists are shown in pages, with Next and Previous links. Next appears only when
      more results exist; Previous appears on every page after the first. Asking for a page
      past the end shows nothing.
    technical_note: >
      Each list method calls resultSet.absolute(start + 1) and loops while
      (hasNext = resultSet.next()) && (--count > 0), returning Page.EMPTY_PAGE otherwise.
      Page.isNextPageAvailable returns hasNext; isPreviousPageAvailable is start > 0;
      getStartOfNextPage = start + size; getStartOfPreviousPage = max(start - size, 0).
    interface: false
    confidence: high
    confidence_basis: >
      The same loop is repeated in four DAO methods and the navigation arithmetic in Page is
      explicit; the JSPs use these accessors for their links.
    risk_class: presentational
    basis: >
      Repeated paging loop in GenericCatalogDAO and the Page model.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 195
        line_end: 205
