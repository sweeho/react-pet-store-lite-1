findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
    description: >
      CatalogHelper carries a useFastLane flag (constructor argument, default true) that no
      code reads; the comment says the EJB path was removed. No record emitted. A human only
      needs to confirm nothing outside the tree constructs the helper with false expecting a
      different path.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/webapp/WEB-INF/web.xml
    description: >
      The env-entry values that choose the DAO class, SQL file URL and database dialect are
      redacted in this tree, so which DAOStatements block (derby or oracle) is live cannot be
      confirmed from source. The two blocks are semantically equivalent as read.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/model/Item.java
    description: >
      The model exposes list price and unit cost; the item page labels unit cost "Your Price".
      Whether "unit cost" is the shopper's selling price or the store's purchase cost cannot be
      decided from this module (the schema requires list price >= unit cost). A business owner
      should state what "Your Price" means before the rebuild names the field.

suspected_defects:
  - capability_key: catalog-search
    record_keys: [SRCH-RULE-0002]
    severity: medium
    category: other
    title: Search keywords with capital letters never match
    description: >
      The stored text is lower-cased before comparison but the shopper's keyword is not, so
      any keyword containing an upper-case letter (for example "Dog" or "FISH") returns no
      items, even though matching items exist.
    traces:
