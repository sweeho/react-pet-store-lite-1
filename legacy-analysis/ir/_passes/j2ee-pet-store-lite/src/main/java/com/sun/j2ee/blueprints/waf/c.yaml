    kind: requirement
    capability_key: catalog-browsing
    requirement: "The system SHALL serve a page for each of exactly these named screens: main (title \"Welcome to the BluePrints Petstore\"), category (\"Products\"), product (\"Items\"), item (\"Item\"), search (\"Search\"), signon (\"Sign On\"), signon_welcome (\"Welcome\"), signon_error (\"Sign On Error\"), signon_locked (\"Account Locked\"), user_creation_error (\"Create Account Error\"), signoff (\"Sign Off\"), account (\"My Account\"), access_denied (\"Access Denied\"), populate_admin (\"Catalog Administration\") and general_error (\"General Error\"), where signon_welcome shows the same body as main under the title \"Welcome\"."
    plain_text: "The store has fifteen pages, each with a fixed title: the home page, category, product, item, search, sign-in, the welcome page after sign-in, sign-in error, account locked, account creation error, signed out, My Account, access denied, catalog administration, and a general error page. The welcome page after sign-in shows the home page content."
    technical_note: "The page inventory is data, not code: screendefinitions_en_US.xml lists the 15 <screen> elements read by ScreenDefinitionDAO.getScreens at servlet start-up; a page is reached as <name>.screen. signon_welcome reuses /main.jsp as its body."
    interface: false
    confidence: high
    confidence_basis: "The screen list is read directly from the definitions file loaded by this module, and its count (15) matches the admin guide's configuration table. Filed under catalog-browsing although several pages belong to sign-on/access-control, because the inventory is one cross-cutting list."
    risk_class: presentational
    basis: "Fifteen <screen name=...> entries with a direct=\"true\" title parameter; admin guide says 15 screens on one template. Filed under catalog-browsing as the closest listed capability: page composition is cross-cutting and has no capability of its own."
    traces:
