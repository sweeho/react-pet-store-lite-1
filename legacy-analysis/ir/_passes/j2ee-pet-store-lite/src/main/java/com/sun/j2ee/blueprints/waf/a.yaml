findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
    description: >
      Lines 147-149 remove session attribute WebKeys.CURRENT_URL on every page
      request, but nothing in the application outside this module sets or reads
      CURRENT_URL (grep of Java, JSP and XML). It may be a vestige of the original
      Pet Store sign-on redirect. A human should confirm no sign-on return-to-page
      behaviour depends on it.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/ScreenDefinitionDAO.java
    description: >
      Page definitions declared more than once (screen, template, parameter, language)
      keep the first occurrence and log a "Non Fatal errror". The "Default Template not
      Defined" check at line 156 can never fire, because getTagValue returns "" rather
      than null when the tag is absent, so a file with no default template loads with an
      empty default template. This is configuration-loading behaviour with no business rule; noted
      so a rebuild does not have to rediscover it.

suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CATALOG-BROWSING-REQ-0001, CATALOG-BROWSING-SCREEN-0001]
    severity: low
    category: other
    title: A page address without a file extension crashes the page request
    description: >
      When a *.screen request URI yields no screen name (for example the last dot
      precedes the last slash), screenName stays null and screenName.equals(...) at
      line 169 throws a NullPointerException, so the user gets a server error instead
      of the "Definition for screen not found" page. With the *.screen mapping this
      path is hard but not impossible to reach (e.g. a path like /a.screen/b).
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 163
        line_end: 169
  - capability_key: catalog-browsing
    record_keys: [CATALOG-BROWSING-WF-0001]
    severity: low
    category: other
    title: Requesting the previous page before any page was seen crashes
    description: >
      PREVIOUS.screen reads the remembered page from the session without checking it
      exists; in a new session it is null and longScreenName.lastIndexOf throws a
      NullPointerException (server error). If parameter caching were ever enabled,
      putting into the request's parameter map (normally immutable) would also fail.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 170
        line_end: 184
  - capability_key: catalog-browsing
    record_keys: [CATALOG-BROWSING-REQ-0001]
    severity: low
    category: other
    title: Unknown page answered as success, not "not found"
    description: >
      An undefined page name returns a bare error fragment without setting an HTTP
      error status, so the response is reported as successful (200) to browsers,
      crawlers and monitoring.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 242
        line_end: 246
  - capability_key: catalog-browsing
    record_keys: [CATALOG-BROWSING-SCREEN-0001]
    severity: medium
    category: error-swallowed
    title: A failing page section is silently dropped
    description: >
      If including a page region (banner, sidebar, body, footer) fails, the error is
      printed to the server log and the page continues rendering without that region,
      so the user sees a partial page with no error message. A failed body include
      means a page that looks blank.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/tags/InsertTag.java
        line_start: 101
        line_end: 104
