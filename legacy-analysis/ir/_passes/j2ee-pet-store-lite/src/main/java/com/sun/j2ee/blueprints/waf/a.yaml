# Pass A — j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf
# Module is the web-application-framework page-composition layer (TemplateServlet,
# screen definitions, insert tag, session keys). It carries no catalog, sign-on or
# batch business rule of its own; every record below is filed under the closest
# listed capability and says so in basis. No legacy-analysis/sources/**/extracted.md
# exists in the tree, so no document trace pointers are possible.
records:
  - record_key: CATALOG-BROWSING-SCREEN-0001
    kind: screen
    capability_key: catalog-browsing
    requirement: >
      The system SHALL render every named page from one shared page layout made of
      a title, banner, sidebar, body and footer, where each page's title text and the
      content of each region are taken from that page's definition, and SHALL use the
      default layout when a page names no layout of its own.
    plain_text: >
      Every page of the store looks the same around the edges: a title, a banner
      across the top, a sidebar, the page's own content, and a footer. Only the title
      and the main content change from page to page.
    technical_note: >
      web.xml maps *.screen to TemplateServlet, which strips the screen name from the
      URI, looks it up in WEB-INF/screendefinitions_en_US.xml (loaded by
      ScreenDefinitionDAO at startup), stores the Screen in request scope and forwards
      to the template (default /template.jsp). The template's InsertTag either prints a
      parameter value verbatim (direct="true", used for titles) or includes the named
      JSP fragment.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in code (TemplateServlet.process, Screens.getTemplate, InsertTag) and
      stated in declarative configuration (web.xml servlet mapping and the screen
      definitions file), which agree with each other.
    risk_class: presentational
    basis: >
      Filed under catalog-browsing as the closest capability: the catalog pages
      (main, category, product, item, search) are the bulk of the screens composed,
      but the same layout serves sign-on and account pages too. No listed capability
      covers page composition itself.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 162
        line_end: 167
        excerpt: |2
