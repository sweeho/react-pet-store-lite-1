  - record_key: CATALOG-BROWSING-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      GIVEN a page request whose page name has no definition in the requested
      language or in the default language
      WHEN the page is requested
      THEN the system SHALL respond with a plain error page reading
      "Error: Definition for screen <name> not found" instead of a store page.
    plain_text: >
      If someone asks for a page the store does not have, they get a bare error
      message naming the missing page rather than a normal store page.
    technical_note: >
      TemplateServlet.process falls back to the default-locale Screens; if the screen
      is still null it writes an HTML fragment with content type "text/html;charset=8859_1"
      directly to the response. No HTTP error status is set, so the response is a 200.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place in code; no test, configuration or document states this
      behaviour. The 200 status is inferred from the absence of any setStatus/sendError
      call, not observed.
    risk_class: presentational
    basis: >
      Filed under catalog-browsing as the closest capability (page navigation); no
      listed capability covers unknown-page handling. The literal message is in
      TemplateServlet.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 230
        line_end: 246
        excerpt: |2
          // default to the default locale screen if it was not defined in the locale specific definitions
          if (screen == null) {
              System.err.println("Screen not Found loading default from " + defaultLocale);
              localeScreens = (Screens)allScreens.get(defaultLocale);
              screen = (Screen)localeScreens.getScreen(screenName);
          }
          if (screen != null) {
              request.setAttribute(WebKeys.CURRENT_SCREEN, screen);
              String templateName = localeScreens.getTemplate(screenName);
              if (templateName != null) {
                  insertTemplate(request, response, templateName);
              }
          } else {
              response.setContentType("text/html;charset=8859_1");
              PrintWriter out = response.getWriter();
              out.println("<font size=+4>Error:</font><br>Definition for screen " + screenName + " not found");
          }
    stack_metadata:
      framework: J2EE BluePrints WAF
      servlet: com.sun.j2ee.blueprints.waf.view.template.TemplateServlet

  - record_key: CATALOG-BROWSING-BR-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL choose the display language of a page from, in order, a
      "locale" request parameter, then the language stored in the user's session, and
      SHALL use the default language (en_US) when neither is given or the chosen
      language has no page definitions; a page missing from the chosen language SHALL
      be taken from the default language. Only en_US is configured.
    plain_text: >
      The store is shown in US English. The code can pick another language if one is
      asked for, but none other is set up, so every visitor sees US English.
    technical_note: >
      TemplateServlet.init reads init-params "locales" (comma list, each loading
      /WEB-INF/screendefinitions_<locale>.xml) and "default_locale" (JVM default if
      absent). web.xml sets both to en_US. process() checks request param "locale",
      then session attribute WebKeys.LOCALE, then falls back to default_locale.
    interface: false
    confidence: high
    confidence_basis: >
      Code (TemplateServlet init and process) and declarative configuration (web.xml
      init-params) agree that en_US is the only and default locale. Nothing in the
      application outside this module was found setting the session locale or sending
      a locale parameter, so the override paths are present but appear unused.
    risk_class: presentational
    basis: >
      Filed under catalog-browsing as the closest capability. The catalog-data-integrity
      capability summary separately requires en_US text, which is consistent with en_US
      being the only display language.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 151
        line_end: 160
        excerpt: |2
          String languageParam = request.getParameter("locale");
          // The language when specified as a parameter overrides the language set in the session
          if (languageParam != null) {
              localeString = languageParam;
          } else if (request.getSession().getAttribute(WebKeys.LOCALE) != null) {
              localeString = ((Locale)request.getSession().getAttribute(WebKeys.LOCALE)).toString();
          }
          if (allScreens.get(localeString) == null) {
             localeString = defaultLocale;
          }
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 96
        line_end: 106
        excerpt: |2
