  - record_key: CATALOG-BROWSING-WF-0001
    kind: workflow
    capability_key: catalog-browsing
    requirement: >
      The system SHALL remember, per user session, the last page displayed, and
      WHEN the special page name "PREVIOUS" is requested THEN the system SHALL
      re-display that remembered page; re-supplying the previous request's inputs and
      data SHALL happen only when explicitly enabled, which it is not.
    plain_text: >
      The store keeps track of the last page each visitor saw and has a hidden
      "go back to the previous page" address that shows it again.
    technical_note: >
      Every non-PREVIOUS *.screen request stores "<name>.screen" in session attribute
      WebKeys.PREVIOUS_SCREEN. PREVIOUS.screen reads it back. Copying previous request
      parameters/attributes is gated by init-params cache_previous_screen_parameters /
      cache_previous_screen_attributes, which web.xml does not set (both default false).
    interface: false
    confidence: medium
    confidence_basis: >
      The behaviour is clear in one place in code. Whether any user can reach it is
      not established: no JSP or document found links to PREVIOUS.screen.
    dispute:
      reason: unresolved-reachability
      detail: >
        Code supports PREVIOUS.screen, but a search of the webapp JSPs and the user and
        admin guides found no link or form targeting it. A human should confirm whether
        any page, bookmark or external link uses PREVIOUS.screen; if none does, this
        workflow need not be carried forward.
    risk_class: presentational
    basis: >
      Filed under catalog-browsing as the closest capability (page navigation).
      Session bookkeeping happens on every page request regardless of reachability.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 168
        line_end: 174
