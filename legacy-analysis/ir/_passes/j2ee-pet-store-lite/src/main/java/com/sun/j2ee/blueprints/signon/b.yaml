    description: >
      Account passwords are written to the account table exactly as typed and checked with a
      direct string comparison; there is no hashing. The Administrator Guide states this
      ("Passwords are stored as entered"), so it is documented behaviour, but anyone with
      read access to the database or a backup or migration extract sees every password.
