  - capability_key: account-lockout
    record_keys: [LOCK-BR-0001, LOCK-BR-0002]
    severity: low
    category: data-corruption
    title: Failed-attempt counter is read and written without a transaction
    description: >
      The failure count is read, incremented in memory and written back as separate
      auto-committed statements. Two wrong-password attempts arriving at the same time can
      both read the same count and write the same value, so an attacker sending parallel
      guesses can get more than 3 attempts before the lock. A concurrent duplicate sign-up
      likewise passes the existence check and then fails on the primary key with a server
      error instead of the "already taken" message.
