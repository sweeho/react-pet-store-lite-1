  - record_key: SIGNON-REQ-0004
    kind: requirement
    capability_key: sign-on
    requirement: >
      WHEN a user submits the sign-in form with "Remember My User Name" ticked, the system SHALL
      store the entered user name in a browser cookie named bp_signon that lasts 2 678 400
      seconds (31 days); WHEN the box is not ticked, the system SHALL expire any existing
      bp_signon cookie. The sign-in page SHALL pre-fill the user name and tick the box when the
      cookie is present.
    plain_text: >
      If the customer ticks "Remember My User Name", the browser remembers the name for 31 days
      and fills it in next time; unticking it makes the browser forget the name.
    technical_note: >
      SignOnFilter.validateSignOn (before authentication) adds Cookie bp_signon with
      setMaxAge(2678400), or re-sends incoming bp_signon cookies with setMaxAge(0).
      signon.jsp reads ${cookie['bp_signon']} to pre-fill j_username and check
      j_remember_username. Value duplicated in conf/petstore.properties.
    interface: false
    confidence: high
    confidence_basis: >
      Literal in code, same value in conf/petstore.properties, 31 days in User Guide 5.2, and
      the reader side in signon.jsp. The code comment says "one month", which 31 days matches.
    risk_class: presentational
    basis: >
      Cookie name constant COOKIE_NAME = "bp_signon"; max age 2678400 seconds = 31 days.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
