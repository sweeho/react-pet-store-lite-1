  # ------------------------------------------------------------ account-lockout
  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL add 1 to an existing, unlocked account's failed sign-in count on every
      sign-in attempt with a wrong password (including a blank password), and SHALL reset the
      count to 0 on every successful sign-in.
    plain_text: >
      Every wrong password adds one to the account's failure count; a successful sign-in sets
      it back to zero, so only failures in a row count.
    technical_note: >
      UserDAO.authenticate: failedAttempts++ then UPDATE_FAILURE; UPDATE_SUCCESS sets
      failed_attempts = 0. Read-then-write without a transaction or row lock.
    interface: false
    confidence: high
    confidence_basis: >
      Code plus Admin Guide R2 plus User Guide 5.3 ("A successful sign-in resets the count").
    risk_class: regulated
    basis: >
      failedAttempts is incremented and written on a password mismatch; UPDATE_SUCCESS zeroes it.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 141
        line_end: 149
        excerpt: |
                  failedAttempts++;
                  boolean lockNow = failedAttempts >= MAX_FAILED_ATTEMPTS;
                  PreparedStatement update = connection.prepareStatement(UPDATE_FAILURE);
                  update.setInt(1, failedAttempts);
                  update.setString(2, lockNow ? "Y" : "N");
                  update.setTimestamp(3, lockNow ? now : null);
                  update.setString(4, userName);
                  update.executeUpdate();
                  update.close();
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
