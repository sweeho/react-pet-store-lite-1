  # ------------------------------------------------------------------ sign-on
  - record_key: SIGNON-REQ-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL accept a sign-in only when an account with exactly the entered user
      name exists, the account is not locked, and the entered password is exactly equal to
      the stored password (case-sensitive comparison of both user name and password).
    plain_text: >
      A customer gets in only if the user name exists, the account is not locked, and the
      password matches exactly, including upper and lower case.
    technical_note: >
      UserDAO.authenticate selects the SIGNON row by username (equality, case-sensitive in
      Derby), returns SIGNON_LOCKED before any password check when LOCKED = 'Y', then compares
      with String.equals. SignOnFilter.validateSignOn calls it on POST to j_signon_check.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in code (UserDAO.authenticate) and stated identically in Admin Guide rule R1;
      the user guide also states user names are case-sensitive. Not higher-level tested in
      this shard beyond the guides.
    risk_class: regulated
    basis: >
      authenticate() returns SIGNON_INVALID when no row is found, SIGNON_LOCKED when the
      locked flag is Y, and SIGNON_OK only when storedPassword.equals(password).
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 115
        line_end: 120
        excerpt: |
              if (!rs.next()) {
                  rs.close();
                  select.close();
                  audit(connection, userName, EVENT_SIGNON_FAIL, remoteAddr);
                  return SIGNON_INVALID;
              }
