  - record_key: LOCK-BR-0005
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The web application SHALL NOT offer any way to unlock an account; a lock SHALL stay in
      force until it is cleared outside the application (the scheduled unlock job or a manual
      database change by an administrator).
    plain_text: >
      There is no unlock button in the store; a locked account stays locked until the
      automatic unlock job or an administrator clears it.
    technical_note: >
