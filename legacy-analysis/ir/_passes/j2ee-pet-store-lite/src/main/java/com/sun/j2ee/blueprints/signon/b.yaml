      the time and the client network address, for each of: a successful sign-in (SIGNON_OK);
      a failed sign-in, including an unknown user name (SIGNON_FAIL); a sign-in attempt on a
      locked account (SIGNON_LOCKED); an account becoming locked (ACCOUNT_LOCKED); a sign-out
      by a signed-in user (SIGNOFF); and a new account (USER_CREATED).
