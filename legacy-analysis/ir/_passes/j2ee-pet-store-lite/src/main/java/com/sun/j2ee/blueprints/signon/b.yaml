findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
    description: >
      The user-name character rule (REG-BR-0002) uses a Unicode-aware letter/digit test, so
      names such as "Zoë" or names with non-Latin digits are accepted, while the User Guide only
      says "letters, digits". A human should decide whether the rebuilt rule is ASCII-only or
      Unicode letters. Lines 107-112.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
    description: >
      The password length limits (REG-BR-0003) are defined at UserDAO.java lines 72-73 and
      enforced at CreateUserServlet.java line 113, but those lines were masked in this pass's
      view, so the enforced numbers were taken from the class comment and User Guide. Someone
      should confirm the constants are 4 and 25.

