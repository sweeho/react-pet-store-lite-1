    severity: low
    category: other
    title: Page protection matches only the exact screen name directly under the application root
    description: >
      Protection compares the request path after the first path segment with each configured
      name by exact equality. The underlying page files (for example the account and catalog
      administration page bodies) can be requested directly by their own file names and are
      not checked, and if the application were deployed at the server root rather than under
      /petstore, no path would ever match and nothing would be protected. As deployed
      (context /petstore) the screen names are protected; the forced reload itself is checked
      again elsewhere (outside this shard).
