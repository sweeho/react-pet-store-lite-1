    record_keys: [SIGNON-WF-0002, REG-WF-0007]
    severity: medium
    category: other
    title: Session identifier is not renewed at sign-in or sign-up
    description: >
      A successful sign-in (and the automatic sign-in after account creation) marks the
      visitor's existing session as signed in, without starting a new session. A session
      identifier obtained before sign-in therefore stays valid after it, with the signed-in
      user's identity and role. The same holds when a second user signs in on a session that
      is already signed in: the identity is overwritten in place.
