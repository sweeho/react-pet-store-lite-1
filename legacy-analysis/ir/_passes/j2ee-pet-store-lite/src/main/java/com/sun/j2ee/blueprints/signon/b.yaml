      called from authenticate, createUser and recordSignOff. The DDL check constraint lists the
      same values plus ACCOUNT_UNLOCKED, which this module never writes.
    interface: false
    confidence: high
    confidence_basis: >
      Code constants and insert, DDL check constraint on event_type, and Admin Guide R7.
    risk_class: regulated
    basis: >
