records:
  - record_key: SDP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      The system SHALL, on a first-load (non-forced) population request, check
      whether the category, category details, product, product details, item,
      item details and sign-on tables each hold at least one row; WHEN every one
      of them does THEN the system SHALL change nothing; OTHERWISE the system
      SHALL drop, recreate and reload every catalog and sign-on table from the
      sample data file.
    plain_text: >
      When someone enters the store, the store checks whether its catalog and
      user accounts are already loaded. If they are, nothing happens. If any part
      is empty or missing, the whole store (catalog, accounts and sign-in
      history) is wiped and reloaded from the sample data.
    technical_note: >
      PopulateServlet.populate(false) calls CatalogPopulator.check (category,
      product, item and their *_details tables) AND UserPopulator.check (signon).
      Each check runs the table's CheckStatement from PopulateSQL.xml
      ("select * from <table>") and returns true when the result set has a row.
      signon_audit is not checked. Triggered from populating.jsp (meta refresh
      to Populate?success_page=main.screen&forcefully=false) and from the batch
      job PSL_CATALOG_CHECK.
    interface: false
    confidence: high
    confidence_basis: >
      The check-then-reload logic is read directly in the servlet and each
      populator, and the Administrator Guide section 3.1 states the same
      behaviour ("If the catalog and SIGNON tables already hold data nothing
      happens. Otherwise every table is dropped, created and loaded").
    risk_class: operational
    basis: >
      populate() computes alreadyPopulated from the catalog and user checks and
      only drops/creates/loads when forcefully || !alreadyPopulated. The check
      statements are plain "select * from" queries, so "populated" means "at
      least one row".
