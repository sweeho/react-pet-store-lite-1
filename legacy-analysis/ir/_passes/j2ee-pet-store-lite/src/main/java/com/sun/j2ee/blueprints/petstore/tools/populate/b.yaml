  - record_key: SDP-BR-0005
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      WHEN a population (forced reload, or a first load that finds the store not
      loaded) runs THEN the system SHALL delete every user account and the whole
      sign-on audit history, and SHALL recreate only the accounts listed in the
      sample data file, each with the user name, password and role given there.
    plain_text: >
      Reloading the sample data deletes every customer account created in the
      store and all sign-in history. Only the sample accounts from the data file
      exist afterwards.
    technical_note: >
      UserPopulator.dropTables drops signon_audit then signon; createTables
      recreates signon then signon_audit (empty). Users are inserted from the
      Users/User elements of Populate-UTF8.xml with "insert into signon
      (username, password, role) values (?, ?, ?)"; the password value is stored
      exactly as it appears in the file (no transformation in this module).
      Other signon columns take their DDL defaults (failed_attempts 0, locked N,
      created_ts now). The admin page and Administrator Guide warn about this.
    interface: false
    confidence: high
    confidence_basis: >
      Drop/create/insert logic in code, the warning text on the admin page and
      the Administrator Guide warning all agree.
    risk_class: regulated
    basis: >
      Sign-on audit history is destroyed by this operation, which bears on the
      audit trail and its retention; hence regulated rather than operational.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/UserPopulator.java
        line_start: 93
        line_end: 111
        excerpt: |2
            public void dropTables(Connection connection) {
              try {
                PopulateUtils.executeSQLStatement(connection, sqlStatements, PopulateUtils.makeSQLStatementKey(PopulateUtils.DROP_OPERATION, "signon_audit"), null, null);
              } catch (PopulateException exception) {
                // System.err.println(exception.getRootCause().getMessage());
              }
              try {
                PopulateUtils.executeSQLStatement(connection, sqlStatements, PopulateUtils.makeSQLStatementKey(PopulateUtils.DROP_OPERATION, "signon"), null, null);
              } catch (PopulateException exception) {
                // System.err.println(exception.getRootCause().getMessage());
              }
              return;
            }

            public void createTables(Connection connection) throws PopulateException {
              PopulateUtils.executeSQLStatement(connection, sqlStatements, PopulateUtils.makeSQLStatementKey(PopulateUtils.CREATE_OPERATION, "signon"), null, null);
              PopulateUtils.executeSQLStatement(connection, sqlStatements, PopulateUtils.makeSQLStatementKey(PopulateUtils.CREATE_OPERATION, "signon_audit"), null, null);
              return;
            }
