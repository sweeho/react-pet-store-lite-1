  - record_key: SDP-ENT-0008
    kind: entity
    capability_key: sample-data-population
    requirement: >
      The system SHALL load from the sample data file, in file order: each
      category (identifier) with its localised details (name, image,
      description, locale); each product (identifier, owning category) with its
      localised details (locale, name, image, description); and each item
      (identifier, owning product) with its localised details (list price, unit
      cost, locale, up to five attributes, image, description). A details record
      SHALL take its identifier from the enclosing category, product or item.
    plain_text: >
      The sample catalog is loaded from a data file: categories, products and
      items, each with a name or description, a picture and a language; items
      also carry a list price, a cost and up to five descriptive attributes.
    technical_note: >
      Category/Product/ItemPopulator insert the parent row when the start tag is
      read (lazyInstantiation=true in XMLDBHandler) so the parent exists before
      its *Details rows; *DetailsPopulator insert on the end tag. Parameter order
      is fixed by each PARAMETER_NAMES array and must match the INSERT statements
      in PopulateSQL.xml. Price and cost are passed as strings (setString);
      the item_details table has a check constraint listprice >= unitcost, so a
      file row violating it fails the load. Admin guide: 5 categories,
      16 products, 28 items in the shipped file.
    interface: false
    confidence: medium
    confidence_basis: >
      Field lists and parent/child wiring are read from one place each (the
      populator classes); the admin guide confirms the file content at a summary
      level only.
    risk_class: operational
    basis: >
      PARAMETER_NAMES arrays in each populator and the insert-on-start-tag
      behaviour of XMLDBHandler.
