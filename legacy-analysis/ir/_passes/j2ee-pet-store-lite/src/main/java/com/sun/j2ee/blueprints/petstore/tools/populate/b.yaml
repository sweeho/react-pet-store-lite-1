findings:
  - kind: unparseable
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateUtils.java
    description: >
      The printSQLStatement path (used by every populator's create() when the
      connection is null) prints SQL to stdout instead of executing it. The only
      caller in this module, PopulateServlet, always passes a non-null connection
      (getConnection throws rather than returning null), so this "dry run" path
      appears unreachable. No record was emitted. A human should confirm no
      other tool or script constructs the populators with a null connection.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/CatalogPopulator.java
    description: >
      CatalogPopulator declares a hard-coded database user name and password
      constant (lines 50-51, value redacted by the scanner) that nothing in this
      module reads; PopulateUtils likewise declares an unused DATABASE_DRIVER
      constant (RmiJdbc.RJDriver). They produce no behaviour. A human should
      confirm they are dead and that the credential is not live (the admin guide
      names the same database user for the data source).
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/UserPopulator.java
    description: >
      Sample user passwords are written to the sign-on table exactly as they
      appear in the data file; this module applies no hashing. Whether the
      sign-on component expects plain-text passwords (and so whether this is a
      requirement to preserve) is outside this shard and needs confirming
      against the sign-on capability.

suspected_defects:
  - capability_key: sample-data-population
    record_keys: [SDP-WF-0001, SDP-BR-0002, SDP-BR-0004, SDP-BR-0005, SDP-INT-0012]
    severity: high
    category: data-corruption
    title: An unauthenticated first load can wipe all customer accounts and sign-in history
    description: >
      Wiping accounts and audit history is restricted to a signed-in ADMIN on
      the forced path, and the admin guide warns about it. The first-load path
      does the same full drop with no sign-in whenever any one catalog table is
      missing or empty, or the check errors. Anyone visiting the "enter the
      store" link, or the daily PSL_CATALOG_CHECK job when catalog tables are
      missing, therefore deletes every customer account and all sign-on audit
      rows, even though the sign-on table still held data.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 162
        line_end: 170
      - path: legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh
        line_start: 10
        line_end: 12
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 76
        line_end: 87
  - capability_key: sample-data-population
    record_keys: [SDP-WF-0007, SDP-WF-0001]
    severity: medium
    category: data-corruption
    title: A failed load leaves the store partly loaded and may never be repaired
    description: >
      Drops, creates and inserts run without a transaction. If the load fails
      part way, the tables already dropped stay dropped and the rows already
      inserted stay. On the next first-load request the store counts as loaded
      as soon as every checked table has at least one row, so a partly loaded
      catalog can stay in place until an administrator forces a reload. Drop
      failures are also swallowed, so a create can then fail on a table that
      still exists.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 168
        line_end: 187
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/CatalogPopulator.java
        line_start: 75
        line_end: 92
  - capability_key: sample-data-population
    record_keys: [SDP-REQ-0011, SDP-REQ-0010]
    severity: medium
    category: other
    title: After redirecting to the error page the code also redirects to the success page
    description: >
      When a load fails and an error page was given, the code redirects to the
      error page and then continues into the success redirect (success page or
      referring page). A second redirect on a response that has already been
      redirected raises a server error, so the user may see a server error
      instead of the error page.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 130
        line_end: 142
  - capability_key: sample-data-population
    record_keys: [SDP-BR-0006]
    severity: medium
    category: other
    title: Every "enter the store" visit signs the user out, even when nothing is reloaded
    description: >
      The session is ended on every accepted request, before the code knows
      whether a reload is needed. The "enter the store" page always calls the
      load in first-load mode, so a signed-in user who follows that link loses
      their session even though the store was already loaded and nothing
      changed. The code comment justifies ending the session only because the
      cached catalog and sign-on state are no longer valid, which is untrue when
      nothing was reloaded.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 126
        line_end: 129
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populating.jsp
        line_start: 8
        line_end: 8
  - capability_key: sample-data-population
    record_keys: [SDP-BR-0015]
    severity: low
    category: error-swallowed
    title: Data-file validation errors are logged and ignored
    description: >
      The parser validates the sample data against its declared structure, but
