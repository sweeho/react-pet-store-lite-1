  - record_key: SDP-WF-0007
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      The system SHALL perform a population in this order: drop item details,
      items, product details, products, category details, categories, sign-on
      audit, sign-on; then create categories, category details, products,
      product details, items, item details, sign-on, sign-on audit; then load
      the sample data file. A failure to drop a table SHALL be ignored; a failure
      to create a table or to load the data SHALL stop the population and report
      a failure. Tables dropped and rows inserted before a failure SHALL NOT be
      restored.
    plain_text: >
      A reload first removes all the old tables (detail records before the
      records they belong to), then builds them again and loads the file. If
      removing an old table fails it carries on; if building or loading fails
      it stops and reports an error, leaving whatever was already done in place.
    technical_note: >
      Drop order: CatalogPopulator.dropTables (item -> ItemPopulator drops
      item_details then item; product likewise; category likewise), then
      UserPopulator.dropTables (signon_audit, signon); every drop failure is
      caught and discarded. Create order: CatalogPopulator.createTables
      (category, category_details, product, product_details, item, item_details)
      then UserPopulator.createTables (signon, signon_audit); failures propagate
      as PopulateException. No transaction or rollback is used; the connection
      is closed in finally.
    interface: false
    confidence: medium
    confidence_basis: >
      Ordering is read directly from statement sequence in the code; it is
      implicit (no comment states the ordering is required). The admin guide
      lists the tables but not the order.
    risk_class: operational
    basis: >
      Statement order in populate(), CatalogPopulator.dropTables/createTables and
      the per-entity populators; empty catch blocks on the drop side only.
