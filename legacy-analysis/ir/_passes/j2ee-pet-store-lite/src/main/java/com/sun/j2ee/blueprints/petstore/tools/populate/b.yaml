  - record_key: SDP-BR-0002
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      GIVEN a first-load request WHEN the "already loaded" check itself fails
      (for example because a table does not exist) THEN the system SHALL treat
      the store as not loaded and perform the full drop, recreate and reload.
    plain_text: >
      If the store cannot even tell whether it is loaded (for instance a table is
      missing), it assumes it is empty and reloads everything.
    technical_note: >
      The PopulateException thrown by any check (SQL error on a missing table,
      or a missing CheckStatement) is caught and discarded; alreadyPopulated
      stays false. The PSL_CATALOG_CHECK batch relies on this when catalog
      tables "do not exist".
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place in code (the empty catch). The batch script and runbook
      depend on it for the missing-tables case, but do not state the rule
      itself, so not graded high.
    risk_class: operational
    basis: >
      The catch block around the check is empty and alreadyPopulated is
      initialised to false.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 157
        line_end: 165
        excerpt: |2
              boolean alreadyPopulated = false;
              try {
                connection = getConnection();
                CatalogPopulator catalogPopulator = new CatalogPopulator(sqlStatements);
                UserPopulator userPopulator = new UserPopulator(sqlStatements);
                if (!forcefully) {
                  try {
                    alreadyPopulated = catalogPopulator.check(connection) && userPopulator.check(connection);
                  } catch (PopulateException exception) {}
    stack_metadata:
      framework: servlet

  - record_key: SDP-BR-0003
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      The system SHALL accept a forced reload of the sample data only from a
      signed-on user whose role is ADMIN. GIVEN a forced reload request WHEN the
      requester is not signed on as ADMIN THEN the system SHALL redirect to the
      access-denied page and SHALL NOT drop, recreate or load any table, and
      SHALL NOT end the requester's session.
    plain_text: >
      Only an administrator who is signed in can force the store to wipe and
      reload its sample data. Anyone else asking for it is shown "access denied"
      and nothing is changed.
    technical_note: >
      PopulateServlet.doPost compares the session attribute j_signon_role (set by
      SignOnFilter) to "ADMIN" before anything else when forcefully is true, and
      redirects to /access_denied.screen. Separately, the admin form page
      populate_admin.screen is protected for role ADMIN in signon-config.xml; the
      /Populate URL itself is not in signon-config, so the servlet check is the
      only gate on the endpoint.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in the servlet code and corroborated by a declarative ADMIN
      constraint on the admin screen plus the Administrator Guide (reload steps
      begin with "Sign in as an ADMIN user").
    risk_class: operational
    basis: >
      The force branch redirects to the access-denied page and returns before
      the session is invalidated and before populate() runs.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 118
        line_end: 125
        excerpt: |2
              // Petstore Lite: the first load is open to anyone so the store can start
              // on an empty database. A forced repopulate drops every table, sign-ons
              // included, so only a signed on ADMIN may ask for it.
              boolean force = forcefully != null && Boolean.valueOf(forcefully).booleanValue();
              if (force && !ADMIN_ROLE.equals(request.getSession().getAttribute(SIGNED_ON_ROLE))) {
                redirect(request, response, ACCESS_DENIED_PAGE);
                return;
              }
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/WEB-INF/signon-config.xml
        line_start: 41
        line_end: 49
        excerpt: |2
           <security-constraint>
             <web-resource-collection>
              <web-resource-name>Populate Admin Screen</web-resource-name>
              <url-pattern>populate_admin.screen</url-pattern>
             </web-resource-collection>
             <auth-constraint>
              <role-name>ADMIN</role-name>
             </auth-constraint>
           </security-constraint>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        line_start: 79
