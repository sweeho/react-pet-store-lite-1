  - record_key: SEARCH-REQ-0004
    kind: requirement
    capability_key: catalog-search
    requirement: >
      The system SHALL return search results two per page by default, each with
      category, product identifier, product name, item identifier, image,
      description, attributes, list price and unit cost, in no defined order, using
      the catalog paging rules.
    plain_text: >
      Search results are shown two at a time with Next and Previous links. The order
      of results is not fixed.
    technical_note: >
      SEARCH_ITEMS has no ORDER BY in either dialect. search.jsp resets start=0,
      count=2 for a new search. Keyword characters "%" and "_" are passed through
      un-escaped and act as LIKE wildcards.
    interface: false
