  - capability_key: catalog-browsing
    record_keys: [BROWSE-RULE-0009]
    severity: low
    category: error-swallowed
    title: Validation errors in the catalog SQL file are printed and ignored
    description: >
      The SQL definition file is parsed with validation on, but validation errors and
      warnings are only printed to the error log, and a non-numeric parameter count is
      silently treated as 0. A statement missing from the file yields no statement and
      fails later with an unchecked error at query time; a parameter-count mismatch is
      only printed.
