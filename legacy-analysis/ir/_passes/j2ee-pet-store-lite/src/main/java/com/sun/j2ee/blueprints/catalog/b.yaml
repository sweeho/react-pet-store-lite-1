  - record_key: BROWSE-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list the catalog categories in the requested locale, each with
      its identifier, name and description, ordered alphabetically by category name.
    plain_text: >
      The list of pet categories shows each category's name and description, sorted
      alphabetically by name.
    technical_note: >
      GenericCatalogDAO.getCategories runs the GET_CATEGORIES statement from
      CatalogDAOSQL.xml (category joined to category_details, filtered by locale,
      "order by name"); the same ordering exists in both the derby and oracle
      dialects. The sidebar calls CatalogHelper.getCategories with count=5, start=0.
    interface: false
    confidence: high
    confidence_basis: >
      The ordering is declared in both SQL dialects and matches the user guide
      ("one link per category, in alphabetical order"). Two independent sources agree.
    risk_class: presentational
    basis: >
      GET_CATEGORIES selects catid, name, descn with "order by name"; the DAO maps
      each row to a Category (id trimmed, name, description).
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml
        line_start: 71
        line_end: 77
        excerpt: |
                  <SQLStatement method="GET_CATEGORIES">
                      <SQLFragment parameterNb="1">
                          select a.catid, name, descn
                              from (category a join category_details b on a.catid=b.catid)
                              where locale = ?  order by name
                      </SQLFragment>
                  </SQLStatement>
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 195
        line_end: 205
        excerpt: |
                if (start >= 0 && resultSet.absolute(start + 1)) {
                  boolean hasNext = false;
                  List categories = new ArrayList();
                  do {
                    categories.add(new Category(resultSet.getString(1).trim(),
                                                resultSet.getString(2),
                                                resultSet.getString(3)));
                  } while ((hasNext = resultSet.next()) && (--count > 0));
                  return new Page(categories, start, hasNext);
                }
                return Page.EMPTY_PAGE;
