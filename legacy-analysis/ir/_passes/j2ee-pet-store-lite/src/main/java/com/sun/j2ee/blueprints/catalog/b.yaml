  - capability_key: catalog-browsing
    record_keys: [BROWSE-RULE-0005]
    severity: low
    category: other
    title: A page size of zero or less still returns one row
    description: >
      The paging loop adds a row before it checks the remaining count, so a count of 0
      or a negative count returns one row and reports a next page when more rows
      exist. A non-numeric count or start parameter raises a number-format error.
    traces:
