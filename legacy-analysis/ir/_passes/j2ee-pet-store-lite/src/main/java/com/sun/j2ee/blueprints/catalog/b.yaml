  - record_key: SEARCH-RULE-0001
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      The system SHALL split the search text into keywords on whitespace, discard
      duplicate keywords, and treat each keyword as a substring to be found.
      GIVEN search text that contains no keywords (empty or only whitespace)
      WHEN a search is run
      THEN the system SHALL return no results without querying the catalog.
    plain_text: >
      The search box text is split into words at spaces; repeated words count once.
      An empty search returns no results.
    technical_note: >
      GenericCatalogDAO.searchItems tokenises with java.util.StringTokenizer (default
      delimiters space, tab, newline, carriage return, form feed) into a HashSet and
      returns Page.EMPTY_PAGE when the set is empty. Each keyword becomes "%kw%".
    interface: false
    confidence: high
    confidence_basis: >
      The tokenising and empty check are in the DAO and the user guide states the
      empty-box outcome; two sources agree.
    risk_class: presentational
    basis: >
      Tokeniser loop, HashSet de-duplication, empty-set early return.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 346
        line_end: 354
