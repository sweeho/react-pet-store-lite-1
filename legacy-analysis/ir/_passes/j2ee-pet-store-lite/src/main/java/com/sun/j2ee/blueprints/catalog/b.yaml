  - record_key: BROWSE-ENT-0007
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL model the catalog as a three-level hierarchy: a Category
      (identifier, name, description) contains Products (identifier, name,
      description), and a Product contains Items (item identifier, category, product
      identifier, product name, image location, description defaulting to "none",
      attributes 1 to 5, list price, unit cost). An item's default attribute is
      attribute 1.
    plain_text: >
      The catalog is organised as category, then pet (product), then sellable variant
      (item). Each item has a picture, a description, up to five attributes, a list
      price and a unit cost.
    technical_note: >
      Value objects Category, Product and Item in catalog/model. Item.getAttribute()
      and getAttribute(index) with an out-of-range index both return attribute1.
      Prices are carried as Java double although the columns are decimal(10,2).
    interface: false
    confidence: high
    confidence_basis: >
      The hierarchy is in the model classes and their Javadoc, and the foreign keys in
      the schema (product.catid, item.productid) enforce it.
    risk_class: presentational
    basis: >
      Model class fields and Javadoc; schema foreign keys.
