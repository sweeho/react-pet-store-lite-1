findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/util/DatabaseNames.java
    description: >
      DatabaseNames.getTableName maps a locale to per-locale table names (suffix _ja
      for Japan, _zh for China). No caller was found in the source, and the live
      schema uses a locale column instead. Treated as dead code and no record was
      emitted. A human should confirm that no Japanese or Chinese catalog tables are
      expected.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
    description: >
      GenericCatalogDAO.main (lines 598-631) is a developer harness that prints the
      SQL for sample French parameters, binding two values per search keyword where
      the live path binds three. It is not wired to any deployment entry point, so no
      record was emitted.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/webapp/WEB-INF/web.xml
    description: >
      The env-entry values for the catalog DAO class, SQL file URL and database
      dialect (lines 148-165) are redacted in this checkout, so the live dialect
      (derby or oracle) and DAO class could not be confirmed from the source. The
      admin guide says derby. BROWSE-RULE-0009 is graded medium for this reason.
