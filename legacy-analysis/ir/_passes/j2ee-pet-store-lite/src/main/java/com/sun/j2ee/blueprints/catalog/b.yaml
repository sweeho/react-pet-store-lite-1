suspected_defects:
  - capability_key: catalog-search
    record_keys: [SEARCH-RULE-0003]
    severity: medium
    category: contradicts-document
    title: Search is case-sensitive although the guide says it is not
    description: >
      The user guide states search is not case-sensitive. The searched columns are
      lower-cased but the typed keyword is not, so any keyword containing a capital
      letter (for example "Dog" or the documented category code "DOGS") matches
      nothing, while "dog" works.
    traces:
