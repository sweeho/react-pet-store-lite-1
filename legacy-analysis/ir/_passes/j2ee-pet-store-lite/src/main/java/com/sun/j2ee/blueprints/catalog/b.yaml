  - record_key: BROWSE-RULE-0005
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL page catalog lists by a zero-based start position and a page
      size, SHALL report a next page as available only when at least one further row
      exists after the page, and SHALL report a previous page as available whenever
      the start position is greater than zero. The next page SHALL start at
      (start + number of rows shown) and the previous page at
      max(start - number of rows shown, 0).
      GIVEN a start position that is negative or beyond the last row
      WHEN a list is requested
      THEN the system SHALL return an empty page with neither next nor previous
      available.
    plain_text: >
      Long lists are shown a page at a time. "Next" appears only when there is more to
      see, "Previous" appears whenever you are not on the first page, and asking for a
      page past the end shows an empty list.
    technical_note: >
      Page.java holds the rows, the start index and a hasNext flag. The DAO computes
      hasNext by reading one row past the page (resultSet.next()). EMPTY_PAGE is
      returned when start < 0 or absolute(start + 1) fails. Applies identically to
      categories, products, items and search results.
    interface: false
    confidence: high
    confidence_basis: >
      The same paging loop is repeated in four DAO methods, the Page class defines the
      navigation arithmetic, and the user guide describes the Next/Previous behaviour.
    risk_class: presentational
    basis: >
      Page.isNextPageAvailable returns hasNext; isPreviousPageAvailable is start > 0;
      getStartOfPreviousPage uses the current page's size.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 75
        line_end: 91
        excerpt: |
              public boolean isNextPageAvailable() {
                // XXX
                /*
                  return (start + objects.size()) < containingListSize;
                  */
                  return hasNext;
              }

              public boolean isPreviousPageAvailable() {
                  return start > 0;
              }

              public int getStartOfNextPage() { return start + objects.size(); }

              public int getStartOfPreviousPage() {
                  return Math.max(start-objects.size(), 0);
              }
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
