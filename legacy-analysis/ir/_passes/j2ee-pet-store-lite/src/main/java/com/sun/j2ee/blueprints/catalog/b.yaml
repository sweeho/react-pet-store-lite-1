    record_keys: [BROWSE-RULE-0008]
    severity: low
    category: unreachable-branch
    title: Locale parsing never reads a variant and rejects a language-only locale
    description: >
      The variant index is initialised to -1 and never assigned, so the variant branch
      cannot run, and a locale string without "_" (for example "en") yields no locale,
      which then fails when the query reads it. All current callers pass en_US, so
      neither path is reached today.
    traces:
