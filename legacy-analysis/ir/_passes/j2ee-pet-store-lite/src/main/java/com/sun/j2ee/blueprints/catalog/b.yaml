  - capability_key: catalog-browsing
    record_keys: [BROWSE-RULE-0005]
    severity: low
    category: other
    title: Previous-page position uses the size of the current page
    description: >
      The previous page starts at start minus the number of rows on the current page.
      On a short last page (for example one row at start 4 with page size 2) Previous
      goes to position 3, not 2, so the earlier pages are re-cut out of step.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 89
