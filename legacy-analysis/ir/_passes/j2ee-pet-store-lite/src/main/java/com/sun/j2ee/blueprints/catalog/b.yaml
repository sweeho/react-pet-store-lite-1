  - record_key: BROWSE-RULE-0008
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL read all catalog text and prices for exactly one locale per
      request, and SHALL show an item in a product list, an item page or a search
      result only when the item's details and its product's details both exist in
      that locale. The storefront SHALL request the en_US locale.
    plain_text: >
      The catalog is shown in US English only. An item or pet that has no English text
      is not shown anywhere in the store.
    technical_note: >
      Every statement filters on locale = ? (locale.toString(), e.g. "en_US"); the
      item statements join item_details and product_details on b.locale = c.locale.
      Every caller page sets locale to the literal en_US. CatalogHelper parses
      "language_country" strings and maps "default" to the JVM default locale.
      Filed here rather than under catalog-data-integrity because this is the browse
      filter, not the integrity check; it is the reason the en_US-text rule matters.
    interface: false
    confidence: high
    confidence_basis: >
      The locale filter appears in all seven statements in both dialects, the en_US
      literal is set in every caller, and the user guide states the store is en_US.
    risk_class: presentational
    basis: >
      Locale filter and same-locale join in SQL; en_US literal in callers; user guide.
