  - capability_key: catalog-search
    record_keys: [SEARCH-REQ-0004, BROWSE-REQ-0004]
    severity: low
    category: other
    title: Paged search results and item lists have no sort order
    description: >
      Paging re-runs the query for each page and positions by row number, but the
      search and item-list queries have no ORDER BY. If the database returns rows in a
      different order between requests, an item can appear on two pages or on none.
    traces:
