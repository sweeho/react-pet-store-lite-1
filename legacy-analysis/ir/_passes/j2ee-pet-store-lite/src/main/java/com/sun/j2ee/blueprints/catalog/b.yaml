    record_keys: [SEARCH-RULE-0001]
    severity: low
    category: other
    title: A search request without a keywords parameter fails instead of showing no results
    description: >
      The search text is tokenised without a null check. When the keywords request
      parameter is absent the search text is null and tokenising it raises an
      unchecked error, rather than returning the empty result that an empty box gets.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 347
        line_end: 347
