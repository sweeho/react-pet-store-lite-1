  - capability_key: catalog-search
    record_keys: [SEARCH-RULE-0002]
    severity: low
    category: other
    title: Wildcard characters in search keywords are not escaped
    description: >
      A keyword is wrapped in "%" and bound to LIKE without escaping "%" or "_", so a
      keyword of "%" or "_" matches every item in the locale.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
