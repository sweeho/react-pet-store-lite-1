  - record_key: BROWSE-REQ-0004
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list the items of a selected product in the requested locale,
      each with item identifier, image, description, up to five attributes, product
      name, list price and unit cost, two items per page by default, in no defined
      order.
    plain_text: >
      Opening a pet lists its sellable variants (items) two at a time with their
      attributes, description and prices. The order of the items is not fixed.
    technical_note: >
      GenericCatalogDAO.getItems runs GET_ITEMS (item + item_details + product_details
      + product, item and product details in the same locale). The statement has no
      ORDER BY in either dialect, so row order is whatever the database returns.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear SQL statement per dialect and one DAO method; the absence of ordering
      is read directly from the SQL. Not corroborated by a test.
    risk_class: presentational
    basis: >
      GET_ITEMS column list and filters; DAO builds one Item per row up to count.
