    record_keys: [BROWSE-REQ-0004]
    severity: low
    category: other
    title: Product item list puts product ID in the category field and category in the product-ID field
    description: >
      When items are listed for a product, each item's category field is filled with
      the product identifier and its product-identifier field with the category code
      (the first constructor argument is the product ID, the first column is catid).
      The single-item and search paths fill them correctly. The product page does not
      currently display either field, so the wrong values are not visible today.
