  - record_key: BROWSE-RULE-0009
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL select the catalog SQL dialect (derby or oracle) and the catalog
      data-access implementation from deployment configuration, and SHALL fail the
      catalog request with a catalog error when the configuration, the SQL definition
      file or the database cannot be reached.
    plain_text: >
      Which database the catalog reads from is a deployment setting. If the catalog
      database or its configuration is unavailable, catalog pages fail with an error.
    technical_note: >
      CatalogDAOFactory.getDAO instantiates the class named by
      java:comp/env/param/CatalogDAOClass. GenericCatalogDAO reads the SQL file URL
      (url/CatalogDAOSQLURL) and dialect (param/CatalogDAODatabase), parses
      CatalogDAOSQL.xml and keeps only the DAOStatements block for that dialect.
      Naming and SQL exceptions become CatalogDAOSysException, rethrown by
      CatalogHelper as CatalogException. The env-entry values in web.xml are
      redacted in this checkout.
    interface: false
    confidence: medium
    confidence_basis: >
      The lookup and the error wrapping are clear in code and the admin guide names
      the dialect setting, but the configured values themselves are redacted, so the
      live dialect could not be read.
    risk_class: operational
    basis: >
      JNDI lookups in the factory and DAO constructor; dialect selection in the SAX
      handler; exception wrapping in CatalogHelper.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/CatalogDAOFactory.java
        line_start: 53
        line_end: 66
        excerpt: |
              public static CatalogDAO getDAO() throws CatalogDAOSysException {

                  CatalogDAO catDao = null;
                  try {
                      InitialContext ic = new InitialContext();
                      String className = (String) ic.lookup(JNDINames.CATALOG_DAO_CLASS);
                      catDao = (CatalogDAO) Class.forName(className).newInstance();
                  } catch (NamingException ne) {
                      throw new CatalogDAOSysException("CatalogDAOFactory.getDAO:  NamingException while getting DAO type : \n" + ne.getMessage());
                  } catch (Exception se) {
                      throw new CatalogDAOSysException("CatalogDAOFactory.getDAO:  Exception while getting DAO type : \n" + se.getMessage());
                  }
                  return catDao;
              }
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 93
        line_end: 100
        excerpt: |
                URL daoSQLURL = new URL((String) context.lookup(JNDINames.CATALOG_DAO_SQL_URL));
                String database = (String) context.lookup(JNDINames.CATALOG_DAO_DATABASE);
