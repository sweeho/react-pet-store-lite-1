                              from (((item a join item_details b on a.itemid=b.itemid)
                                  join product_details c on a.productid=c.productid)
                                  join product d on d.productid=c.productid and b.locale = c.locale)
                              where b.locale = ? and a.productid = ?
                      </SQLFragment>
                  </SQLStatement>
