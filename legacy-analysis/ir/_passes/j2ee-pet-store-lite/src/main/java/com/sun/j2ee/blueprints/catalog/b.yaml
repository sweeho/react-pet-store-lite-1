  - record_key: BROWSE-RULE-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show at most five categories in the category navigation list,
      starting from the first category, with no way to page to further categories.
    plain_text: >
      The side menu of pet categories shows the first five categories only.
    technical_note: >
      sidebar.jsp sets count=5 and start=0 on the session-scoped CatalogHelper before
      calling getCategories; the DAO stops after count rows. No next/previous link is
      rendered in the sidebar. The store currently has exactly five categories.
    interface: false
    confidence: low
    confidence_basis: >
      The value 5 is a bare literal in one page with no comment or configuration; it
      matches the documented five categories, so it may be an incidental cap rather
      than a rule. Inferred from the caller, not stated anywhere.
    risk_class: presentational
    basis: >
      Bare literal count=5 in the sidebar caller; the DAO honours count as a page size.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/sidebar.jsp
        line_start: 15
        line_end: 17
        excerpt: |
          <c:set value="en_US" target="${catalog}" property="locale"/>
          <c:set value="5" target="${catalog}" property="count"/>
          <c:set value="0" target="${catalog}" property="start"/>
      - path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        line_start: 56
        line_end: 56
        excerpt: |
          <p>The store has five categories: Birds, Cats, Dogs, Fish and Reptiles.</p>
    stack_metadata:
      jsp.page: sidebar.jsp
      session.scope: session

  - record_key: BROWSE-REQ-0003
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list the products of a selected category in the requested
      locale, each with its identifier, name and description, ordered alphabetically
      by product name, two products per page by default.
    plain_text: >
      Opening a category lists its pets (products) by name and description, sorted by
      name, two at a time.
    technical_note: >
      CatalogHelper.getProducts -> GenericCatalogDAO.getProducts -> GET_PRODUCTS
      (product joined to product_details, filtered by locale and catid, "order by
      name"). category.jsp resets start=0/count=2 when no count parameter is present.
    interface: false
    confidence: high
    confidence_basis: >
      Ordering is declared in both SQL dialects; the page size of two is set in the
      caller and stated in the user guide. Two sources agree on both facts.
    risk_class: presentational
    basis: >
      GET_PRODUCTS SQL filters by locale and category and orders by name; default
      count of 2 in the caller and in CatalogHelper's field initialiser.
    traces:
