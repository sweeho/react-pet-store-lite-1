  - record_key: SEARCH-RULE-0003
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      The system SHALL compare each keyword exactly as typed against the lower-cased
      product name, lower-cased category code and lower-cased item description.
      GIVEN a keyword containing any upper-case letter
      WHEN a search is run
      THEN that keyword SHALL match no item.
    plain_text: >
      Search finds matches only for words typed in lower case. A word with a capital
      letter ("Dog", "DOGS") finds nothing.
    technical_note: >
      The SQL applies lower() to the three columns, but searchItems binds
      "%" + keyword + "%" without lower-casing the keyword. This is today's behaviour;
      the user guide says search is not case-sensitive (see suspected defect).
