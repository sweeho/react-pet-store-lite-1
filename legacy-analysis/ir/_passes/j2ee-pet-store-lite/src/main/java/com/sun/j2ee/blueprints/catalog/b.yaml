  - record_key: SEARCH-RULE-0002
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      The system SHALL return an item as a search result when ANY keyword appears as a
      substring of the item's product name, its category code or its item
      description, considering only items whose details exist in the requested
      locale.
    plain_text: >
      A word matches when it appears anywhere in the pet's name, the category code
      (for example DOGS) or the item description. With several words, items matching
      any one of them are listed.
    technical_note: >
      SEARCH_ITEMS is assembled from fragments: a fixed fragment with the locale and
      the first keyword's three LIKE tests, a VARIABLE fragment repeated once per
      further keyword joined with OR, and a closing parenthesis. buildSQLStatement
      repeats the variable fragment while parameters remain. Each keyword is bound
      three times as "%kw%".
    interface: false
    confidence: high
    confidence_basis: >
      The matched fields and OR semantics are declared identically in both dialects,
      bound by the DAO, and described the same way in the user guide.
    risk_class: presentational
    basis: >
      SQL fragments for SEARCH_ITEMS and the parameter-binding loop.
    traces:
