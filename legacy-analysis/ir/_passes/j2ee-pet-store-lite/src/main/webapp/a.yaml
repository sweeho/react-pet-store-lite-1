  - record_key: POP-RUL-0001
    kind: business-rule
    capability_key: sample-data-population
    requirement: >-
      WHEN a forced reload of the sample data is requested THEN the system SHALL perform
      it only for a signed-in user with role ADMIN, SHALL show Access Denied to anyone
      else, and on success SHALL delete and recreate all catalog, account and sign-on
      history data from the sample file and end the requester's session.
    plain_text: >-
      Only an administrator can force a reload; it erases and reloads the catalog, every
      account and all sign-in history, and signs the administrator out.
    technical_note: >-
      PopulateServlet: force = Boolean.valueOf(forcefully); if force and session
      j_signon_role != ADMIN redirect to /access_denied.screen; then
      session.invalidate() and populate(force). Tables per Admin Guide 3.2: CATEGORY,
      CATEGORY_DETAILS, PRODUCT, PRODUCT_DETAILS, ITEM, ITEM_DETAILS, SIGNON,
      SIGNON_AUDIT.
    interface: false
    confidence: high
    confidence_basis: >-
      The ADMIN check is in PopulateServlet independently of the page protection in
      signon-config, and both guides and the admin page text describe the wipe.
    risk_class: operational
    basis: >-
      populate_admin.jsp warning; PopulateServlet role check and invalidate; Admin Guide
      1.1 and 3.2.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/populate_admin.jsp"
        line_start: 9
        line_end: 13
