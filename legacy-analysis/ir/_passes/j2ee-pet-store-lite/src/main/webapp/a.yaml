  - record_key: POP-SCR-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >-
      The system SHALL show an entry page with an 'enter the store' link; WHEN followed
      THEN the system SHALL show 'Please wait while the Java Pet Store Application is
      being populated...' and immediately request a first load (not a forced reload) of
      the sample data, then show the home page. Any visitor SHALL be able to do this
      without signing in.
    plain_text: >-
      The store's front door has an 'enter the store' link. Following it loads the
      sample catalog if the store is empty, then opens the home page. No sign-in is
      needed.
    technical_note: >-
      index.jsp (welcome-file) links to populating.jsp, whose meta refresh issues GET
      Populate?success_page=main.screen&forcefully=false. PopulateServlet.doGet
      delegates to doPost; with force=false no role check applies. The servlet
      invalidates the session before populating, so entering the store also signs out
      anyone signed in.
