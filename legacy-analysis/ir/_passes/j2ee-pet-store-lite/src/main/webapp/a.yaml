  - record_key: SRCH-RUL-0001
    kind: business-rule
    capability_key: catalog-search
    requirement: >-
      The system SHALL split the search text on whitespace into distinct keywords and
      return every en_US item whose product name, category code or item description
      contains any keyword as a substring, comparing against the lower-cased field
      values and the keyword exactly as typed; GIVEN a keyword containing an upper-case
      letter THEN that keyword SHALL match nothing.
    plain_text: >-
      Search finds items whose product name, category code or description contains any
      of the words typed. Today a word typed with a capital letter finds nothing.
    technical_note: >-
      SEARCH_ITEMS: '(lower(name) like ? or lower(catid) like ? or lower(b.descn) like
      ?)' repeated per keyword with OR. GenericCatalogDAO.searchItems wraps each keyword
      as %kw% without lower-casing, keywords go into a HashSet, and there is no ORDER
      BY. '%' and '_' in a keyword act as SQL wildcards. Captured sample: 'Bulldog'
      returns 0 results while 'dog' returns 13.
    interface: false
    confidence: high
    confidence_basis: >-
      Declared SQL plus the Java parameter binding, corroborated by a captured
      characterisation case ('Bulldog' gives no results). High for what the system does
      today; the dispute is about what it should do.
    dispute:
      reason: contradicts-docs
      detail: >-
        The User Guide 4 says 'Search is not case-sensitive'. The SQL lower-cases the
        columns but the keyword is bound as typed, so 'Bulldog' finds nothing (captured
        sample). An SME must decide whether the rebuild keeps today's behaviour or the
        documented case-insensitive match.
    risk_class: operational
    basis: >-
      SEARCH_ITEMS statement; GenericCatalogDAO keyword binding; User Guide 4; captured
      search cases.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml"
        line_start: 112
        line_end: 127
        excerpt: "        <SQLStatement method=\"SEARCH_ITEMS\">\n            <SQLFragment parameterNb=\"4\">\n                select catid, a.productid, name, a.itemid, b.image, b.descn, attr1, \n                        attr2, attr3, attr4, attr5, listprice, unitcost \n                    from (((item a join item_details b on a.itemid=b.itemid)\n                        join product_details c on a.productid=c.productid)\n                        join product d on d.productid=c.productid and b.locale = c.locale)\n                    where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)\n            </SQLFragment>\n            <SQLFragment parameterNb=\"3\" occurrence=\"VARIABLE\">\n                or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)  \n            </SQLFragment>\n            <SQLFragment parameterNb=\"0\">\n                )\n            </SQLFragment>\n        </SQLStatement>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java"
        line_start: 344
        line_end: 365
        excerpt: "  public Page searchItems(String searchQuery, int start, int count, Locale locale)\n    throws CatalogDAOSysException {\n      Collection keywordSet = new HashSet();\n      StringTokenizer tokenizer = new StringTokenizer(searchQuery);\n      while (tokenizer.hasMoreTokens()) {\n        keywordSet.add(tokenizer.nextToken());\n      }\n      if (keywordSet.isEmpty()) {\n        return Page.EMPTY_PAGE;\n      }\n      String[] keywords = (String[]) keywordSet.toArray(new String[0]);\n      Connection connection = null;\n      PreparedStatement statement = null;\n      ResultSet resultSet = null;\n      try {\n        connection = getDataSource().getConnection();\n        String[] parameterValues = new String[1 + (keywords.length * 3)];\n        parameterValues[0] = locale.toString();\n        for (int i = 0; i < keywords.length; i++) {\n          parameterValues[(i * 3) + 1] = \"%\" + keywords[i] + \"%\";\n          parameterValues[(i * 3) + 2] = \"%\" + keywords[i] + \"%\";\n          parameterValues[(i * 3) + 3] = \"%\" + keywords[i] + \"%\";\n"
      - path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        line_start: 90
        line_end: 94
        excerpt: " <li>A word matches when it appears anywhere in the product name, the category code (for example DOGS) or the item description.\n Part of a word is enough: <i>dog</i> finds Bulldog and every item in the DOGS category.</li>\n <li>When you type several words separated by spaces, items that match <b>any</b> of the words are listed.</li>\n <li>Search is not case-sensitive.</li>\n <li>If nothing matches, or the box is empty, the page shows <i>No results were found for your search.</i></li>\n"
      - path: "legacy-source/j2ee-pet-store-lite/vortex/samples/catalog_search_cases.json"
        line_start: 54
        line_end: 65
        excerpt: "      \"input\": {\n        \"keywords\": \"Bulldog\",\n        \"locale\": \"en_US\",\n        \"pageSize\": 2\n      },\n      \"output\": {\n        \"resultCount\": 0,\n        \"itemIds\": [],\n        \"message\": \"No results were found for your search.\",\n        \"pages\": 0\n      }\n    },\n"
    stack_metadata:
      db.object: "product_details.name, product.catid, item_details.descn"
      framework: "Fast Lane Reader DAO"
