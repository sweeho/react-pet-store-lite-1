  - record_key: POP-INT-0001
    kind: integration
    capability_key: sample-data-population
    requirement: >-
      The system SHALL expose the first-load request over plain HTTP without sign-in, so
      that the daily catalog check job can ask the store to populate itself when the
      catalog tables are missing.
    plain_text: >-
      The nightly catalog check can ask the store, over the web, to load the sample data
      when its catalog is missing.
    technical_note: >-
      web.xml maps PopulateServlet to /Populate. batch/psl_catalog_check.sh calls curl
      $PSL_STORE_URL/Populate?forcefully=false when catalog_check.sql reports missing
      tables, and exits 8 if that call fails.
    interface: true
    confidence: high
    confidence_basis: >-
      The servlet mapping is declared and the batch caller is read directly; the shell
      comment states the intent.
    risk_class: operational
    basis: >-
      web.xml /Populate mapping; psl_catalog_check.sh.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/WEB-INF/web.xml"
        line_start: 118
        line_end: 121
        excerpt: "  <servlet-mapping>\n    <servlet-name>PopulateServlet</servlet-name>\n    <url-pattern>/Populate</url-pattern>\n  </servlet-mapping>\n"
      - path: "legacy-source/j2ee-pet-store-lite/batch/psl_catalog_check.sh"
        line_start: 3
        line_end: 12
        excerpt: "# Runs the catalog integrity checks. When the catalog is empty it asks the\n# store to populate itself (first load, not a forced reload). Any failed\n# check ends the job with code 4 so operations is alerted.\nPSL_JOB=PSL_CATALOG_CHECK\n. \"${PSL_HOME:-/opt/petstore}/conf/env.sh\"\npsl_log \"start\"\nOUT=$(psl_ij \"$PSL_SQL/catalog_check.sql\")\nif echo \"$OUT\" | grep -q \"does not exist\"; then\n  psl_log \"catalog tables missing, requesting first load\"\n  curl -sf -o /dev/null \"$PSL_STORE_URL/Populate?forcefully=false\" || { psl_log \"FAILED: populate\"; exit 8; }\n"
    stack_metadata:
      batch.trigger: "PSL_CATALOG_CHECK 06:00"
findings:
  - kind: ambiguity
    path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/search.jsp"
    description: >-
      search.screen requested with no 'keywords' parameter at all (as opposed to an
      empty one): search.jsp copies param.keywords (null) into CatalogHelper.searchQuery
      and GenericCatalogDAO passes it to new StringTokenizer(searchQuery), which would
      throw and show the general error page rather than 'No results were found'. Read,
      not executed; depends on how JSTL 1.0 c:set handles a null value on a bean
      property. A human should confirm whether a bare search.screen shows the no-results
      message or the error page.
  - kind: ambiguity
    path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/META-INF/context.xml"
    description: >-
      The database connection pool (max 20 connections, 10 s wait) and the Derby
      location /var/petstore/db/PetStoreDB are deployment settings, not requirements; no
      record was emitted. A human should decide whether pool size or wait time is a
      capacity requirement for the rebuild. The password on line 13 is redacted.
  - kind: ambiguity
    path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/WEB-INF/web.xml"
    description: >-
      The catalog DAO class, SQL file URL and database dialect env-entries (lines
      149-165) are redacted, so which CatalogDAOSQL.xml statement set (derby or oracle)
      runs in production cannot be confirmed from this module; PopulateServlet's
      Database init-param says derby. Records here assume the derby and oracle
      statements behave the same, which they do on the rules extracted.
