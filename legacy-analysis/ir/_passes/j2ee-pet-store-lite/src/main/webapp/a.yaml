  - record_key: BROW-RUL-0005
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >-
      GIVEN a category, product or search listing WHEN the visitor follows Next THEN the
      system SHALL start the next page after the last item shown and keep the current
      page's size; WHEN the visitor follows Previous THEN the system SHALL start at the
      current start minus the number of items on the current page (never below zero)
      with a page size of 2.
    plain_text: >-
      Next and Previous move through a list in pages; the page start and size are
      carried in the link.
    technical_note: >-
      Next link: start=Page.startOfNextPage (start+size), count=pageResults.size.
      Previous link: start=Page.startOfPreviousPage (max(start-size,0)), count=2
      literal. start and count come from request parameters and are trusted as-is (new
      Integer(...)); a non-numeric count raises NumberFormatException, which web.xml
      maps to the general error page.
    interface: false
    confidence: high
    confidence_basis: >-
      The same link construction appears in three JSPs and the arithmetic is read in
      Page.java.
    risk_class: presentational
    basis: >-
      Previous/Next c:url blocks in category/product/search JSPs; Page.java.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/category.jsp"
        line_start: 77
        line_end: 97
        excerpt: "  <c:if test=\"${pageResults.previousPageAvailable == true}\">\n    <c:url value=\"/category.screen\" var=\"previousURL\">\n      <c:param name=\"category_id\" value=\"${param.category_id}\"/>\n      <c:param name=\"start\" value=\"${pageResults.startOfPreviousPage}\"/>\n      <c:param name=\"count\" value=\"2\"/>\n    </c:url>\n    <a href='<c:out value=\"${previousURL}\"/>'>\n     Previous\n    </a>\n  </c:if>\n\n  <c:if test=\"${pageResults.nextPageAvailable == true}\">\n    <c:url value=\"/category.screen\" var=\"nextURL\">\n      <c:param name=\"category_id\" value=\"${param.category_id}\"/>\n      <c:param name=\"start\" value=\"${pageResults.startOfNextPage}\"/>\n      <c:param name=\"count\" value=\"${pageResults.size}\"/>\n    </c:url>\n    <a href='<c:out value=\"${nextURL}\"/>'>\n     Next\n    </a>\n  </c:if>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/product.jsp"
        line_start: 81
        line_end: 100
        excerpt: "  <c:if test=\"${pageResults.previousPageAvailable == true}\">\n    <c:url value=\"/product.screen\" var=\"previousURL\">\n      <c:param name=\"product_id\" value=\"${param.product_id}\"/>\n      <c:param name=\"start\" value=\"${pageResults.startOfPreviousPage}\"/>\n      <c:param name=\"count\" value=\"2\"/>\n    </c:url>\n    <a href='<c:out value=\"${previousURL}\"/>'>\n     Previous\n    </a>\n  </c:if>\n  <c:if test=\"${pageResults.nextPageAvailable == true}\">\n    <c:url value=\"/product.screen\" var=\"nextURL\">\n      <c:param name=\"product_id\" value=\"${param.product_id}\"/>\n      <c:param name=\"start\" value=\"${pageResults.startOfNextPage}\"/>\n      <c:param name=\"count\" value=\"${pageResults.size}\"/>\n    </c:url>\n    <a href='<c:out value=\"${nextURL}\"/>'>\n     Next\n    </a>\n  </c:if>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/search.jsp"
