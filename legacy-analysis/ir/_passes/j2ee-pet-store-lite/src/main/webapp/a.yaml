    record_keys: [POP-SCR-0001, POP-INT-0001]
    severity: high
    category: data-corruption
    title: "Anonymous first-load path can wipe every account and the sign-in history"
    description: >-
      The first load needs no sign-in and is triggered by the entry page and by the
      daily catalog check job. When it decides the store is empty (catalog or sign-on
      check returns no row, or fails) it drops and recreates every table, including
      accounts and sign-in history. A catalog problem alone can therefore erase all
      customer accounts and the audit trail. Entering the store also ends the session of
      anyone already signed in.
