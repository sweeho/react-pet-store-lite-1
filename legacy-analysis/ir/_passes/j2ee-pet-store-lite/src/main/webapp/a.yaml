# SX-0001 extract-a, shard j2ee-pet-store-lite/src/main/webapp (populate/ excluded per discovery)
records:
  - record_key: BROW-SCR-0001
    kind: screen
    capability_key: catalog-browsing
    requirement: >-
      The system SHALL show, for a chosen category, a 'Products for this Category' page
      listing that category's products two at a time, each with its name (linking to the
      product's items) and description, with a 'Previous' link only when an earlier page
      exists and a 'Next' link only when a later page exists.
    plain_text: >-
      Opening a category lists its products two per page, with name and description;
      Next and Previous appear only when there is a page in that direction.
    technical_note: >-
      category.jsp sets start=0,count=2 when no count parameter is present, otherwise
      copies start/count from the request into the session CatalogHelper; Previous/Next
      visibility comes from Page.isPreviousPageAvailable (start>0) and
      isNextPageAvailable (DAO saw another row).
    interface: false
    confidence: high
    confidence_basis: >-
      The page size of 2 and the conditional links are in the JSP and are restated
      independently in the User Guide section 3.1; the next/previous logic is
      corroborated by Page.java. Two independent places agree.
    risk_class: presentational
    basis: >-
      category.jsp default paging block and Previous/Next c:if blocks; User Guide 3.1
      states two products at a time and links only when a page exists.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/category.jsp"
        line_start: 24
        line_end: 33
        excerpt: "<c:choose>\n <c:when test=\"${param.count != null}\">\n  <c:set value=\"${param.start}\" target=\"${catalog}\" property=\"start\"/>\n  <c:set value=\"${param.count}\" target=\"${catalog}\" property=\"count\"/>\n </c:when>\n <c:otherwise>\n  <c:set value=\"0\" target=\"${catalog}\" property=\"start\"/>\n  <c:set value=\"2\" target=\"${catalog}\" property=\"count\"/>\n </c:otherwise>\n</c:choose>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/category.jsp"
        line_start: 77
        line_end: 97
        excerpt: "  <c:if test=\"${pageResults.previousPageAvailable == true}\">\n    <c:url value=\"/category.screen\" var=\"previousURL\">\n      <c:param name=\"category_id\" value=\"${param.category_id}\"/>\n      <c:param name=\"start\" value=\"${pageResults.startOfPreviousPage}\"/>\n      <c:param name=\"count\" value=\"2\"/>\n    </c:url>\n    <a href='<c:out value=\"${previousURL}\"/>'>\n     Previous\n    </a>\n  </c:if>\n\n  <c:if test=\"${pageResults.nextPageAvailable == true}\">\n    <c:url value=\"/category.screen\" var=\"nextURL\">\n      <c:param name=\"category_id\" value=\"${param.category_id}\"/>\n      <c:param name=\"start\" value=\"${pageResults.startOfNextPage}\"/>\n      <c:param name=\"count\" value=\"${pageResults.size}\"/>\n    </c:url>\n    <a href='<c:out value=\"${nextURL}\"/>'>\n     Next\n    </a>\n  </c:if>\n"
      - path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        line_start: 61
        line_end: 62
        excerpt: " <li>The page <i>Products for this Category</i> lists two products at a time, each with its name and description.</li>\n <li>Click <b>Next</b> to see the next two products, or <b>Previous</b> to go back. A link only appears when there is a page in that direction.</li>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/model/Page.java"
        line_start: 75
        line_end: 85
        excerpt: "    public boolean isNextPageAvailable() {\n      // XXX\n      /*\n        return (start + objects.size()) < containingListSize;\n        */\n        return hasNext;\n    }\n\n    public boolean isPreviousPageAvailable() {\n        return start > 0;\n    }\n"
    stack_metadata:
      jsp.page: "category.jsp"
      framework: "JSP 1.2 / JSTL 1.0"
      session.scope: "CatalogHelper (session)"
  - record_key: BROW-SCR-0002
    kind: screen
    capability_key: catalog-browsing
    requirement: >-
      The system SHALL show, for a chosen product, an 'Items for this Product' page
      listing that product's items two at a time, each with its attribute and product
      name (linking to the item page), its description and its list price formatted as
      en_US currency, with the same conditional Previous/Next links as the category
      page.
    plain_text: >-
      Opening a product lists its items two per page with name, description and list
      price in US dollars.
    technical_note: >-
      product.jsp: default start=0,count=2; price cell is fmt:formatNumber of
      item.listCost (column listprice) with fmt:setLocale en_US.
    interface: false
    confidence: high
    confidence_basis: >-
      JSP and User Guide section 3.2 agree on two-at-a-time and list price; the column
      mapping is visible in the GET_ITEMS SQL.
    risk_class: financial
    basis: >-
      product.jsp paging defaults and price column; User Guide 3.2.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/product.jsp"
        line_start: 24
        line_end: 33
        excerpt: "<c:choose>\n <c:when test=\"${param.count != null}\">\n  <c:set value=\"${param.start}\" target=\"${catalog}\" property=\"start\"/>\n  <c:set value=\"${param.count}\" target=\"${catalog}\" property=\"count\"/>\n </c:when>\n <c:otherwise>\n  <c:set value=\"0\" target=\"${catalog}\" property=\"start\"/>\n  <c:set value=\"2\" target=\"${catalog}\" property=\"count\"/>\n </c:otherwise>\n</c:choose>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/product.jsp"
        line_start: 52
        line_end: 69
        excerpt: "<c:forEach var=\"item\" items=\"${pageResults.list}\" >\n <tr>\n  <td class=\"petstore_listing\">\n   <c:url value=\"/item.screen\" var=\"viewItemURL\">\n    <c:param name=\"item_id\" value=\"${item.itemId}\"/>\n   </c:url>\n   <a href='<c:out value=\"${viewItemURL}\"/>'>\n    <c:out value=\"${item.attribute}\" />\n    <c:out value=\"${item.productName}\"/>\n   </a>\n   <br>\n   <c:out value=\"${item.description}\"/>\n  </td>\n  <td class=\"petstore_listing\" align=\"right\">\n   <fmt:formatNumber value=\"${item.listCost}\" type=\"currency\" />\n  </td>\n </tr>\n</c:forEach>\n"
      - path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        line_start: 69
        line_end: 69
        excerpt: " <li>The page <i>Items for this Product</i> lists the items, two at a time, with the item attribute, name, description and list price.</li>\n"
    stack_metadata:
      jsp.page: "product.jsp"
      db.object: "item_details.listprice"
  - record_key: BROW-SCR-0003
    kind: screen
    capability_key: catalog-browsing
    requirement: >-
      The system SHALL show an item page titled with the item attribute and product
      name, showing the item image, 'List Price' (the item's list price), 'Your Price'
      (the item's unit cost), the item description and the Item ID, with both prices
      formatted as en_US currency.
    plain_text: >-
      The item page shows a picture, a List Price, a 'Your Price', the description and
      the Item ID. 'Your Price' is the item's stored unit cost.
    technical_note: >-
      item.jsp lines 26-30: List Price = item.listCost (listprice), Your Price =
      item.unitCost (unitcost). DDL CHECK listprice >= unitcost; Oracle DDL comment says
      unitcost is 'Price shown as Your Price'. The User Guide calls Your Price 'the
      discounted price for members', but no membership or discount logic exists: every
      visitor, signed in or not, sees the same unitcost.
    interface: false
    confidence: medium
    confidence_basis: >-
      What is displayed is unambiguous in item.jsp and matches the Oracle column
      comment. Medium, not high, because the business meaning of 'Your Price' (member
      discount vs. cost price) conflicts between the User Guide and the data model, and
      no code decides which price a customer pays.
    dispute:
      reason: contradicts-docs
      detail: >-
        item.jsp shows unitcost as 'Your Price' to everyone. The User Guide 3.3 says
        Your Price is 'the discounted price for members', implying a member-only price;
        the schema names the column unitcost and constrains listprice >= unitcost, which
        reads like a cost price. The Oracle DDL comment says unitcost is the price shown
        as Your Price. An SME must decide whether unitcost is a customer-facing price
        and whether it is member-only.
    risk_class: financial
    basis: >-
      item.jsp price block; User Guide 3.3; Oracle DDL column comments.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/item.jsp"
        line_start: 18
        line_end: 34
        excerpt: "<p class=\"petstore_title\">\n <c:out value=\"${item.attribute}\"/>\n <c:out value=\"${item.productName}\"/>\n</p>\n<fmt:setLocale value=\"en_US\" />\n<table cellpadding=\"2\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n <tr>\n  <td><img src='images/<c:out value=\"${item.imageLocation}\"/>'></td>\n  <td class=\"petstore\" width=\"100%\"><b>List Price:</b>\n   <fmt:formatNumber value=\"${item.listCost}\" type=\"currency\" />\n   <br><br>\n   <b>Your Price:</b>\n   <fmt:formatNumber value=\"${item.unitCost}\" type=\"currency\" />\n   <br><br>\n   <c:out value=\"${item.description}\"/>\n   <br><br>\n   <b>Item ID:</b> <c:out value=\"${item.itemId}\"/>\n"
      - path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        line_start: 76
        line_end: 77
        excerpt: " <li><b>List Price</b>: the catalog price.</li>\n <li><b>Your Price</b>: the discounted price for members.</li>\n"
      - path: "legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql"
        line_start: 133
        line_end: 134
        excerpt: "COMMENT ON COLUMN item_details.listprice IS 'Price shown as List Price';\nCOMMENT ON COLUMN item_details.unitcost IS 'Price shown as Your Price';\n"
    stack_metadata:
      jsp.page: "item.jsp"
      db.object: "item_details.listprice, item_details.unitcost"
  - record_key: BROW-RUL-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >-
      The system SHALL list categories and the products of a category in ascending order
      of their localized name.
    plain_text: >-
      Categories in the side bar and products within a category are listed
      alphabetically by name.
    technical_note: >-
      CatalogDAOSQL.xml GET_CATEGORIES and GET_PRODUCTS end with 'order by name' in both
      the derby and oracle statement sets. GET_ITEMS and SEARCH_ITEMS have no ORDER BY
      (see BROW-RUL-0002, SRCH-RUL-0001).
    interface: false
    confidence: high
    confidence_basis: >-
      Declared in both dialect blocks of the SQL config and restated by the User Guide
      1.1 for the side bar.
    risk_class: presentational
    basis: >-
      ORDER BY name in GET_CATEGORIES/GET_PRODUCTS; User Guide 1.1 'in alphabetical
      order'.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml"
        line_start: 71
        line_end: 91
        excerpt: "        <SQLStatement method=\"GET_CATEGORIES\">\n            <SQLFragment parameterNb=\"1\">\n                select a.catid, name, descn\n                    from (category a join category_details b on a.catid=b.catid) \n                    where locale = ?  order by name\n            </SQLFragment>\n        </SQLStatement>\n        <SQLStatement method=\"GET_PRODUCT\">\n            <SQLFragment parameterNb=\"2\">\n                select name, descn\n                    from (product a join product_details b on a.productid=b.productid)\n                    where locale = ? and a.productid = ? \n            </SQLFragment>\n        </SQLStatement>\n        <SQLStatement method=\"GET_PRODUCTS\">\n            <SQLFragment parameterNb=\"2\">\n                select a.productid, name, descn\n                    from (product a join product_details b on a.productid=b.productid)\n                    where locale = ? and a.catid = ? order by name\n            </SQLFragment>\n        </SQLStatement>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml"
        line_start: 137
        line_end: 157
        excerpt: "        <SQLStatement method=\"GET_CATEGORIES\">\n            <SQLFragment parameterNb=\"1\">\n                select a.catid, name, descn\n                    from category a, category_details b\n                    where a.catid = b.catid and locale = ? order by name\n            </SQLFragment>\n        </SQLStatement>\n        <SQLStatement method=\"GET_PRODUCT\">\n            <SQLFragment parameterNb=\"2\">\n                select name, descn\n                    from product a, product_details b\n                    where a.productid = b.productid and locale = ? and a.productid = ? \n            </SQLFragment>\n        </SQLStatement>\n        <SQLStatement method=\"GET_PRODUCTS\">\n            <SQLFragment parameterNb=\"2\">\n                select a.productid, name, descn\n                    from product a, product_details b\n                    where a.productid = b.productid and locale = ? and a.catid = ? order by name\n            </SQLFragment>\n        </SQLStatement>\n"
      - path: "legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html"
        line_start: 33
        line_end: 33
        excerpt: " <li><b>Pets</b> side bar on the left: one link per category, in alphabetical order.</li>\n"
    stack_metadata:
      db.object: "category_details.name, product_details.name"
  - record_key: BROW-RUL-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >-
      The system SHALL list the items of a product without any defined sort order; the
      order is whatever the database returns.
    plain_text: >-
      Items of a product are not sorted; their order (and so which items land on which
      page) is not guaranteed.
    technical_note: >-
      GET_ITEMS in CatalogDAOSQL.xml (derby and oracle) has no ORDER BY, unlike
      GET_CATEGORIES/GET_PRODUCTS. Paging is done by ResultSet.absolute(start+1) on an
      unordered result.
    interface: false
    confidence: medium
    confidence_basis: >-
      The absence of ORDER BY is read directly from one declarative file (both
      dialects); whether the database returns a stable order in practice was not
      observed.
    risk_class: presentational
    basis: >-
      GET_ITEMS statements lack ORDER BY.
    traces:
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml"
        line_start: 102
        line_end: 111
        excerpt: "        <SQLStatement method=\"GET_ITEMS\">\n            <SQLFragment parameterNb=\"2\">\n                select catid, name, a.itemid, b.image, b.descn, attr1, attr2, attr3,\n                        attr4, attr5, listprice, unitcost\n                    from (((item a join item_details b on a.itemid=b.itemid)\n                        join product_details c on a.productid=c.productid)\n                        join product d on d.productid=c.productid and b.locale = c.locale)\n                    where b.locale = ? and a.productid = ?\n            </SQLFragment>\n        </SQLStatement>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml"
        line_start: 168
        line_end: 177
        excerpt: "        <SQLStatement method=\"GET_ITEMS\">\n            <SQLFragment parameterNb=\"2\">\n                select catid, name, a.itemid, b.image, b.descn, attr1, attr2, attr3,\n                        attr4, attr5, listprice, unitcost\n                    from item a, item_details b, product_details c, product d\n                    where a.itemid = b.itemid and a.productid = c.productid \n                        and d.productid = c.productid and b.locale = c.locale\n                        and b.locale = ? and a.productid = ?\n            </SQLFragment>\n        </SQLStatement>\n"
    stack_metadata:
      db.object: "item, item_details"
