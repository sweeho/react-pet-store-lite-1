        line_start: 76
        line_end: 77
        excerpt: "<p>When a user clicks <i>enter the store</i>, the store calls <code>Populate?forcefully=false</code>. If the catalog and SIGNON tables\nalready hold data nothing happens. Otherwise every table is dropped, created and loaded. No sign-in is needed for the first load.</p>\n"
      - path: "legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java"
        line_start: 118
        line_end: 127
        excerpt: "    // Petstore Lite: the first load is open to anyone so the store can start\n    // on an empty database. A forced repopulate drops every table, sign-ons\n    // included, so only a signed on ADMIN may ask for it.\n    boolean force = forcefully != null && Boolean.valueOf(forcefully).booleanValue();\n    if (force && !ADMIN_ROLE.equals(request.getSession().getAttribute(SIGNED_ON_ROLE))) {\n      redirect(request, response, ACCESS_DENIED_PAGE);\n      return;\n    }\n    // kill the Servlet Session because the cached catalog and sign-on state are no longer valid\n    request.getSession().invalidate();\n"
