    confidence_basis: >
      The JSP shows list price and the User Guide 3.2 says the list shows the list price; page size 2
      is in JSP, properties and guide.
    risk_class: financial
    basis: >
      Item rows display attribute + productName linking to item.screen, description, and listCost as
      currency.
    traces:
