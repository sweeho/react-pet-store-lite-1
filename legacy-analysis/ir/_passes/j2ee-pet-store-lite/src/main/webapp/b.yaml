# SX-0001 extract-b, shard j2ee-pet-store-lite/src/main/webapp (populate/ excluded per discovery report).
# Independent second reading. No legacy-analysis/sources/**/extracted.md existed in the tree at the
# time of this pass; the HTML guides under docs/guides were read directly and are cited as
# document traces with a section anchor plus line numbers.
records:

  # ---------------------------------------------------------------- catalog-browsing
  - record_key: CB-SCR-0001
    kind: screen
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show, as the home page, a picture of pets in which each pet region links to
      the product list of its category (Birds, Fish, Dogs, Reptiles, Cats).
    plain_text: >
      The home page is a picture of pets; clicking a pet opens the list of products in that pet's
      category.
    technical_note: >
      main.jsp is an HTML image map over images/splash.gif with hard-coded category ids BIRDS, FISH,
      DOGS, REPTILES, CATS (BIRDS appears twice). The same body is reused by the signon_welcome screen.
      The splash image itself was dropped at extract time.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place (main.jsp) plus the User Guide section 2 describing the same page. The category
      ids are bare literals not checked against the data; medium, not high, because the behaviour is
      a single page and the image is missing.
    risk_class: presentational
    basis: >
      The image map areas link to category.screen with fixed category ids; the screen definition
      "main" composes main.jsp as the body with title "Welcome to the BluePrints Petstore".
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/main.jsp
        line_start: 6
        line_end: 25
        excerpt: |
          <map name="petmap">
          <area href="category.screen?category_id=BIRDS"
          ...
          <area href="category.screen?category_id=CATS"
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/WEB-INF/screendefinitions_en_US.xml
        line_start: 13
        line_end: 19
        excerpt: |
          <screen name="main">
            <parameter key="title" value="Welcome to the BluePrints Petstore" direct="true"/>
            <parameter key="body" value="/main.jsp" />
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "2. Entering the store"
        line_start: 43
        line_end: 43
        excerpt: |
          The home page opens with a picture of the pets. Click a pet in the picture, or a category in the side bar.
    stack_metadata:
