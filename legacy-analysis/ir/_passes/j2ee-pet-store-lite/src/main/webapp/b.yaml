    record_keys: [AC-BR-0001]
    severity: medium
    category: other
    title: Protected pages matched by exact text, so an altered address may skip the sign-in check
    description: >
      Protection compares the request path after the context root to the configured page name by exact
      equality. An address carrying a path parameter (for example account.screen;jsessionid=...) or a
      different path form would not match and would be served without the sign-in or role check. Read,
      not executed. The forced data reload is re-checked in the populate entry point, so the data wipe
      stays gated; My Account would render with no user.
