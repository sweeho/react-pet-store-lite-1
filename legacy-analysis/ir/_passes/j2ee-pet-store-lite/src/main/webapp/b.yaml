  - record_key: CB-REQ-0002
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show on every page a "Pets" side bar listing the catalog categories by name in
      alphabetical order, each linking to that category's product list, limited to the first 5
      categories.
    plain_text: >
      Every page has a side bar listing the pet categories alphabetically; only the first five
      categories are listed.
    technical_note: >
      sidebar.jsp sets locale en_US, count=5, start=0 on the session-scoped CatalogHelper and iterates
      catalog.categories.list. GET_CATEGORIES orders by name. The 5 is a bare literal; with exactly 5
      sample categories the cap is invisible today.
    interface: false
    confidence: medium
    confidence_basis: >
      The alphabetical order is in the SQL and the User Guide; the 5-category cap is a bare literal in
      one JSP with no comment or config, so the cap part on its own is low. Graded medium overall.
    risk_class: presentational
    basis: >
      Sidebar JSP iterates the first page (count 5) of categories; the SQL sorts by name; the guide
      says "one link per category, in alphabetical order".
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/sidebar.jsp
        line_start: 15
        line_end: 35
        excerpt: |
          <c:set value="en_US" target="${catalog}" property="locale"/>
          <c:set value="5" target="${catalog}" property="count"/>
          <c:set value="0" target="${catalog}" property="start"/>
          ...
                <c:forEach var="item" items="${catalog.categories.list}" >
                 <a href="category.screen?category_id=<c:out value="${item.id}" />">
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml
        line_start: 71
        line_end: 76
        excerpt: |
          <SQLStatement method="GET_CATEGORIES">
              <SQLFragment parameterNb="1">
                  select a.catid, name, descn
                      from (category a join category_details b on a.catid=b.catid)
                      where locale = ?  order by name
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "1.1 Page layout"
        line_start: 33
        line_end: 33
        excerpt: |
          <li><b>Pets</b> side bar on the left: one link per category, in alphabetical order.</li>
    stack_metadata:
      jsp.page: sidebar.jsp
      session.scope: catalog (CatalogHelper)

  - record_key: CB-SCR-0003
    kind: screen
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show, for a chosen category, the page "Products for this Category" listing that
      category's products in name order, two at a time, each with its name (linking to the product's
      item list) and description, with a Previous link only when an earlier page exists and a Next
      link only when a later page exists.
    plain_text: >
      Choosing a category lists its products, two per page, sorted by name, with Previous and Next
      links that appear only when there is a page in that direction.
    technical_note: >
      category.jsp resets start=0/count=2 when no count parameter is present, otherwise takes start and
      count from the request; calls catalog.products (GET_PRODUCTS ... order by name). Page.hasNext
      comes from reading one row past the page in GenericCatalogDAO.
    interface: false
    confidence: high
    confidence_basis: >
      Page size 2 is in the JSP, in conf/petstore.properties catalog.pageSize=2 and in the User Guide
      3.1; ordering is in the SQL. Several independent places agree.
    risk_class: presentational
    basis: >
      JSP defaults count to 2, lists name and description with a link to product.screen, and shows
      Previous/Next conditionally on previousPageAvailable/nextPageAvailable.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/category.jsp
        line_start: 24
        line_end: 66
        excerpt: |
          <c:choose>
           <c:when test="${param.count != null}">
            <c:set value="${param.start}" target="${catalog}" property="start"/>
            <c:set value="${param.count}" target="${catalog}" property="count"/>
           </c:when>
           <c:otherwise>
            <c:set value="0" target="${catalog}" property="start"/>
            <c:set value="2" target="${catalog}" property="count"/>
          ...
          <p class="petstore_title">Products for this Category</p>
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml
        line_start: 85
        line_end: 90
        excerpt: |
          <SQLStatement method="GET_PRODUCTS">
              <SQLFragment parameterNb="2">
                  select a.productid, name, descn
                      from (product a join product_details b on a.productid=b.productid)
                      where locale = ? and a.catid = ? order by name
      - path: legacy-source/j2ee-pet-store-lite/conf/petstore.properties
        line_start: 27
        line_end: 27
        excerpt: |
          catalog.pageSize=2
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "3.1 Browse a category"
        line_start: 61
        line_end: 62
        excerpt: |
          The page Products for this Category lists two products at a time, each with its name and description.
          Click Next to see the next two products, or Previous to go back. A link only appears when there is a page in that direction.
    stack_metadata:
      jsp.page: category.jsp
      db.object: category, category_details, product, product_details

