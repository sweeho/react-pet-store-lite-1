  - record_key: CB-BR-0007
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL page catalog lists (products, items and search results) as follows: the Next
      link starts at the first entry after the current page and asks for as many entries as the
      current page shows; the Previous link starts at the current start minus the number of entries on
      the current page (never below the first entry) and asks for 2 entries; any start and count
      supplied in the address are used as given.
      GIVEN a list of 5 entries WHEN the visitor is on the last page (entry 5 only) and clicks
      Previous THEN the page shown starts at entry 4 and shows entries 4 and 5.
    plain_text: >
      Lists move forward and backward by page; going back from a short last page does not return to
      the exact previous page boundary, and page position can be set directly in the address.
    technical_note: >
      category.jsp/product.jsp/search.jsp build Previous with start=pageResults.startOfPreviousPage
      (Page: max(start - objects.size(), 0)) and count=2, and Next with start=startOfNextPage
      (start + objects.size()) and count=pageResults.size. When a count parameter is present, start
      and count are copied into CatalogHelper as integers without range checks; a non-numeric value
      raises NumberFormatException and lands on the general error page.
    interface: false
    confidence: medium
    confidence_basis: >
      Read from three JSPs and Page.java, which agree with each other; the misaligned-previous outcome
      is derived by reading, not executed, and no document describes paging at this level.
    risk_class: presentational
    basis: >
      The paging link parameters are written the same way in all three list pages.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/category.jsp
        line_start: 77
        line_end: 97
        excerpt: |
          <c:if test="${pageResults.previousPageAvailable == true}">
            <c:url value="/category.screen" var="previousURL">
              <c:param name="category_id" value="${param.category_id}"/>
              <c:param name="start" value="${pageResults.startOfPreviousPage}"/>
              <c:param name="count" value="2"/>
          ...
              <c:param name="start" value="${pageResults.startOfNextPage}"/>
              <c:param name="count" value="${pageResults.size}"/>
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 87
        line_end: 91
        excerpt: |
          public int getStartOfNextPage() { return start + objects.size(); }
          public int getStartOfPreviousPage() {
              return Math.max(start-objects.size(), 0);
          }
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/search.jsp
        line_start: 90
        line_end: 105
        excerpt: |
          <c:param name="start" value="${pageResults.startOfPreviousPage}"/>
          <c:param name="count" value="2"/>
          ...
          <c:param name="start" value="${pageResults.startOfNextPage}"/>
          <c:param name="count" value="${pageResults.size}"/>
    stack_metadata:
      jsp.page: category.jsp, product.jsp, search.jsp
      session.scope: catalog (CatalogHelper)

