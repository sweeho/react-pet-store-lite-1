  - record_key: CS-BR-0002
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      The system SHALL split the search text into words on white space and list every en_US item whose
      product name, category code or item description contains any of the words anywhere (part of a
      word is enough).
    plain_text: >
      Search finds items whose product name, category code or description contains any of the typed
      words, including partial words.
    technical_note: >
      SEARCH_ITEMS in CatalogDAOSQL.xml repeats "(lower(name) like ? or lower(catid) like ? or
      lower(b.descn) like ?)" once per keyword joined with OR, filtered on b.locale = ?.
      GenericCatalogDAO.searchItems tokenises with StringTokenizer, de-duplicates in a HashSet and wraps
      each keyword in % ... %.
    interface: false
    confidence: high
