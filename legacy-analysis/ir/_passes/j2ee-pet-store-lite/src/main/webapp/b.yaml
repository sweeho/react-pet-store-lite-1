  - record_key: CB-SCR-0005
    kind: screen
    capability_key: catalog-browsing
    requirement: >
      The system SHALL show, for a chosen item, its attribute and product name as the heading, its
      picture, "List Price" (the item's list price), "Your Price" (the item's unit cost), its
      description and its Item ID, both prices formatted as US-dollar currency, to every visitor
      whether signed in or not.
    plain_text: >
      The item page shows the picture, a List Price, a "Your Price", the description and the Item ID.
      Everyone sees "Your Price", signed in or not.
    technical_note: >
      item.jsp prints item.listCost under "List Price" and item.unitCost under "Your Price" (columns
      listprice and unitcost of item_details via GET_ITEM). Neither the page nor the item screen is in
      signon-config.xml, so no sign-in is required. The Oracle DDL column comments say listprice is
      "Price shown as List Price" and unitcost is "Price shown as Your Price".
    interface: false
    confidence: high
    confidence_basis: >
      The mapping of the two labels to the two columns is in the JSP and stated again in the Oracle
      column comments; the guide lists the same fields. What the business means by "Your Price" is the
      disputed part, not what is shown.
    dispute:
      reason: contradicts-docs
      detail: >
        The User Guide calls Your Price "the discounted price for members", but the page shows it to
        anonymous visitors too, and the value is the unit cost (the Derby DDL describes it as "cost").
        The product list shows only the list price while search results show only Your Price, so a
        customer sees two different prices for the same item depending on how they reached it. A
        business owner must decide which price is the selling price and whether Your Price is
        member-only.
    risk_class: financial
    basis: >
      item.jsp lines 26-34 render both prices, description and item id; screen "item" is not protected.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/item.jsp
        line_start: 18
        line_end: 34
        excerpt: |
          <p class="petstore_title">
           <c:out value="${item.attribute}"/>
           <c:out value="${item.productName}"/>
          </p>
          <fmt:setLocale value="en_US" />
          ...
            <td class="petstore" width="100%"><b>List Price:</b>
             <fmt:formatNumber value="${item.listCost}" type="currency" />
             <br><br>
             <b>Your Price:</b>
             <fmt:formatNumber value="${item.unitCost}" type="currency" />
             ...
             <b>Item ID:</b> <c:out value="${item.itemId}"/>
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 133
        line_end: 134
        excerpt: |
          COMMENT ON COLUMN item_details.listprice IS 'Price shown as List Price';
          COMMENT ON COLUMN item_details.unitcost IS 'Price shown as Your Price';
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/user-guide.html
        anchor: "3.3 View an item"
        line_start: 76
        line_end: 78
        excerpt: |
          <li><b>List Price</b>: the catalog price.</li>
          <li><b>Your Price</b>: the discounted price for members.</li>
          The description and the Item ID (for example EST-6). Quote the Item ID when you contact the store.
    stack_metadata:
      jsp.page: item.jsp
      db.object: item_details.listprice, item_details.unitcost

