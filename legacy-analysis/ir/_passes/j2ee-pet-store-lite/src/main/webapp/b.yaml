  # ---------------------------------------------------------------- batch-operations
  - record_key: BO-INT-0001
    kind: integration
    capability_key: batch-operations
    requirement: >
      The system SHALL keep its catalog, accounts and sign-on history in a single database at
      /var/petstore/db/PetStoreDB (created if missing), reached through a connection pool of at most 20
      connections that waits at most 10 seconds for a free connection.
    plain_text: >
      All store data lives in one database file location that the nightly backup copies; the store
      uses up to 20 database connections at once.
    technical_note: >
      META-INF/context.xml binds jdbc/CatalogDB to Derby embedded url
      jdbc:derby:/var/petstore/db/PetStoreDB;create=true, maxTotal 20, maxIdle 5, maxWaitMillis 10000;
      web.xml declares the resource-ref. db/batch/db_backup.sql backs up PetStoreDB. Filed under
      batch-operations as the closest capability (deployment configuration has no capability of its
      own); the password is redacted.
    interface: true
    confidence: medium
    confidence_basis: >
      One declarative place for the pool settings; the database name is corroborated by the backup SQL
      and Admin Guide section 4. Pool numbers are deployment tuning, not clearly business rules.
    risk_class: operational
    basis: >
      Tomcat Resource definition and the web.xml resource-ref.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/META-INF/context.xml
        line_start: 7
        line_end: 16
        excerpt: |
          <Resource name="jdbc/CatalogDB"
                    auth="Container"
                    type="javax.sql.DataSource"
                    driverClassName="org.apache.derby.jdbc.EmbeddedDriver"
                    url="jdbc:derby:/var/petstore/db/PetStoreDB;create=true"
                    ...
                    maxTotal="20"
                    maxIdle="5"
                    maxWaitMillis="10000"/>
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/WEB-INF/web.xml
        line_start: 142
        line_end: 147
        excerpt: |
          <resource-ref>
            <description>Catalog and sign-on database</description>
            <res-ref-name>jdbc/CatalogDB</res-ref-name>
      - path: legacy-source/j2ee-pet-store-lite/db/batch/db_backup.sql
        line_start: 1
        line_end: 3
        excerpt: |
          -- PSL_DB_BACKUP: online backup of PetStoreDB.
          -- Derby writes /var/petstore/backup/PetStoreDB; the script moves it to a dated folder.
          CALL SYSCS_UTIL.SYSCS_BACKUP_DATABASE('/var/petstore/backup');
    stack_metadata:
      db.object: jdbc/CatalogDB

