    record_keys: [AREG-ENT-0001, SDP-REQ-0003]
    severity: high
    category: other
    title: Passwords are stored as plain text
    description: >
      The password column is a 25-character text field and the sample data and insert
      statement write the password as given, with no hashing step visible. A 25-character
      limit is too short for any standard password hash, which indicates passwords are held
      in clear text. The sample administrator's password is also fixed in the data file and
      restored on every reload.
    traces:
