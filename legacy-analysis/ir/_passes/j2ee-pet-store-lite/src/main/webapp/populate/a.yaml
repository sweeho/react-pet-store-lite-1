suspected_defects:
  - capability_key: sign-on-audit
    record_keys: [SDP-WF-0005, SAUD-ENT-0001]
    severity: high
    category: data-corruption
    title: Populating or force-reloading the store erases all sign-on history and accounts
    description: >
      The sign-on audit and account tables are part of the populate statement set, so every
      (re)populate drops them and recreates them empty (plus the three sample logins). The
      schema scripts describe the audit table as a transaction log extracted daily and kept
      90 days; a reload destroys it before retention or extraction has run, and every real
      customer login is lost.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 189
        line_end: 191
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 118
        line_end: 120
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
        line_start: 84
        line_end: 84
  - capability_key: sign-on-audit
    record_keys: [SAUD-BR-0002, SDP-INT-0006]
    severity: medium
    category: other
    title: Oracle populate creates an audit table with no id generator
    description: >
      The Oracle populate DDL declares audit_id NOT NULL without the sequence and trigger
      that the Oracle schema script defines. Audit inserts omit audit_id, so after a populate
      on Oracle every sign-on audit write would fail. The configured database is Derby, so
      this is latent.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 353
        line_end: 363
