  - record_key: SDP-BR-0004
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      The system SHALL store the language code of each sample-data text entry with an
      underscore separator (for example "en-US" in the sample data is stored as "en_US").
    plain_text: >
      Language codes in the sample data ("en-US") are saved in the store's own format
      ("en_US"), so the catalog finds its US English text.
    technical_note: >
      XMLDBHandler.normalizeValue replaces '-' with '_' for the xml:lang attribute before it
      is bound to the locale column. All 49 *Details entries in Populate-UTF8.xml use en-US.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place in code (outside this shard, read for context) acting on the data in
      this shard; no test or second enforcement seen.
    risk_class: presentational
    basis: >
      xml:lang values in the data file and the normalisation in the loader.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/Populate-UTF8.xml
        line_start: 86
        line_end: 86
        excerpt: |2
          	  <CategoryDetails xml:lang="en-US">
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/XMLDBHandler.java
        line_start: 178
        line_end: 181
        excerpt: |2
            private String normalizeValue(String attributeName, String attributeValue) {
              if (attributeName.equals("xml:lang")) {
                return attributeValue.replace('-', '_');
              }
    stack_metadata:
