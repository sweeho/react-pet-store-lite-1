  - record_key: SDP-BR-0001
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      The system SHALL validate the sample data before loading it, and SHALL require that every
      category, product and item in it has at least one localized text entry carrying a
      language code, that every product names a category defined in the same data, and that
      every item names a product defined in the same data.
    plain_text: >
      The sample data file is checked before it is loaded: every category, product and item
      must have its text in at least one language, and must point at a parent that exists in
      the file.
    technical_note: >
      Populate-UTF8.xml declares an internal DOCTYPE pulling in dtds/*.dtd; Category, Product
      and Item each require one or more *Details children with a required xml:lang; Product
      @category and Item @product are IDREF #REQUIRED. PopulateServlet builds the SAX parser
      with setValidating(true), so a violation aborts the load.
    interface: false
    confidence: high
    confidence_basis: >
      Grammar declared in the DTDs and validation switched on in the loader; also backed by
      the database foreign keys for the parent references.
    risk_class: operational
    basis: >
      DTD content models (CategoryDetails+, ProductDetails+, ItemDetails+), IDREF attributes,
      validating parser.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/Populate-UTF8.xml
        line_start: 41
        line_end: 66
        excerpt: |2
          <!DOCTYPE Populate [

          	<!ELEMENT Populate (Users, Catalog)>
           
          	<!ELEMENT Catalog (Categories, Products, Items)>

          	<!ELEMENT Users (User+)>
          	<!ENTITY % User SYSTEM "dtds/User.dtd">
          	%User;


          	<!ELEMENT Categories (Category+)>
          	<!ENTITY % Category SYSTEM "dtds/Category.dtd">
          	%Category;

          	<!ELEMENT Products (Product+)>
          	<!ENTITY % Product SYSTEM "dtds/Product.dtd">
          	%Product;

          	<!ELEMENT Items (Item+)>
          	<!ENTITY % Item SYSTEM "dtds/Item.dtd">
          	%Item;

              <!ENTITY % CommonElements SYSTEM "dtds/CommonElements.dtd">
              %CommonElements;
          ]>
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/dtds/Product.dtd
        line_start: 38
        line_end: 41
        excerpt: |2
          <!ELEMENT Product (ProductDetails+)>
          <!ATTLIST Product
                  id ID #REQUIRED
                  category IDREF #REQUIRED
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/dtds/CategoryDetails.dtd
        line_start: 38
        line_end: 40
        excerpt: |2
          <!ELEMENT CategoryDetails (Name, Image?, Description?)>
          <!ATTLIST CategoryDetails
          	xml:lang NMTOKEN #REQUIRED
    stack_metadata:
      framework: SAX validating parser + DTD

