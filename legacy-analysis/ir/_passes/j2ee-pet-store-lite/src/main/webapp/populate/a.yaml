# SX-0001 extract-a — shard j2ee-pet-store-lite/src/main/webapp/populate
# Sources read: PopulateSQL.xml, Populate-UTF8.xml, dtds/*.dtd. Cross-checked (read-only,
# not extracted) against db/schema/*.sql, PopulateServlet.java, XMLDBHandler.java, UserDAO.java.
# No legacy-analysis/sources/**/extracted.md exists in the tree, so no document traces.
records:
  - record_key: CDI-ENT-0001
    kind: entity
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL hold the catalog as a three-level hierarchy in which every product
      belongs to exactly one existing category and every item belongs to exactly one existing
      product, and SHALL refuse a product whose category does not exist or an item whose
      product does not exist. Category, product and item identifiers SHALL be unique and at
      most 10 characters.
    plain_text: >
      The catalog is categories, which contain products, which contain items (the things
      actually sold). A product must belong to a real category and an item to a real product.
      Codes are unique and at most 10 characters long.
    technical_note: >
      Enforced by the populate DDL primary and foreign keys (category.catid,
      product.productid + fk_product_1 -> category, item.itemid + fk_item_1 -> product), in
      both the derby and oracle statement sets, and again by the seed-data DTDs, where
      Product@category and Item@product are IDREFs that a validating parser resolves.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in two independent places: database foreign keys (both dialects) and the
      DTD IDREF constraints the populate parser validates against. Matches db/schema scripts.
    risk_class: operational
    basis: >
      Foreign-key constraints on product and item tables, plus IDREF attributes in the
      Product and Item DTDs.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 56
        line_end: 61
        excerpt: |2
                  create table product (
                    productid char(10) not null,
                    catid char(10) not null,
                    constraint pk_product primary key (productid),
                      constraint fk_product_1 foreign key (catid)
                      references category (catid))
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 97
        line_end: 103
        excerpt: |2
                  create table item (
                    itemid char(10) not null,
                    productid char(10) not null,
                    constraint pk_item primary key (itemid),
                      constraint fk_item_1 foreign key (productid)
                      references product (productid)
                  )
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/dtds/Item.dtd
        line_start: 39
        line_end: 41
        excerpt: |2
          <!ATTLIST Item
          	id ID #REQUIRED
          	product IDREF #REQUIRED
    stack_metadata:
      db.object: [category, product, item]
      framework: populate-ddl

  - record_key: CDI-BR-0002
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL NOT store an item price entry whose list price is lower than its unit
      cost; GIVEN an item price entry WHEN its list price is below its unit cost THEN the
      entry SHALL be rejected.
    plain_text: >
      An item may never be priced below what it costs the store.
    technical_note: >
      CHECK constraint ck_item_details_price (listprice >= unitcost) on item_details in both
      the derby and oracle populate DDL; the same constraint is in db/schema/petstore_*.sql.
      Equal price and cost is allowed.
    interface: false
    confidence: high
    confidence_basis: >
      Declared as a database CHECK in both populate dialects and repeated in the standalone
      schema scripts; every seeded item satisfies it (closest case EST-13, 12.50 vs 11.10).
    risk_class: financial
    basis: >
      CHECK constraint on item_details.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 117
        line_end: 133
        excerpt: |2
                  create table item_details (
                    itemid char(10) not null,
                    listprice decimal(10,2) not null,
                    unitcost decimal(10,2) not null,
                    locale char(10) not null,
                    image varchar(255) not null,
                    descn varchar(255) not null,
                    attr1 varchar(80),
                    attr2 varchar(80),
                    attr3 varchar(80),
                    attr4 varchar(80),
                    attr5 varchar(80),
                    constraint pk_item_details primary key (itemid, locale),
                        constraint fk_item_details_1 foreign key (itemid)
                        references item (itemid),
                        constraint ck_item_details_price check (listprice >= unitcost)
                  )
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 310
        line_end: 310
        excerpt: |2
                        constraint ck_item_details_price check (listprice >= unitcost)
    stack_metadata:
      db.object: item_details.ck_item_details_price

  - record_key: CDI-BR-0003
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL record item list price and unit cost as mandatory monetary amounts with
      two decimal places and at most eight digits before the decimal point.
    plain_text: >
      Every item has a list price and a cost, both in money to the cent, up to 99 999 999.99.
    technical_note: >
      item_details.listprice / unitcost are decimal(10,2) not null (derby) and number(10,2)
      not null (oracle). ItemDetails.dtd makes ListPrice and UnitCost mandatory in seed data.
      No currency column exists; currency is implicit.
    interface: false
    confidence: high
    confidence_basis: >
      Same precision and NOT NULL in both dialects plus mandatory elements in the seed DTD.
      The implicit single currency is inferred from the absence of a column, not read.
    risk_class: financial
    basis: >
      Column types and NOT NULL on item_details; ListPrice/UnitCost required by DTD.
