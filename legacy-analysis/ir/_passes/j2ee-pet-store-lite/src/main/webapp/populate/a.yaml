  - record_key: AC-BR-0001
    kind: business-rule
    capability_key: access-control
    requirement: >
      The system SHALL give every sign-on account exactly one role, either CUSTOMER or ADMIN,
      and SHALL assign CUSTOMER when no role is given.
    plain_text: >
      Every login is either a customer or an administrator; new logins are customers unless
      stated otherwise.
    technical_note: >
      signon.role varchar(10) default 'CUSTOMER' not null with CHECK ck_signon_role
      (role in ('CUSTOMER','ADMIN')), both dialects; db/schema comment repeats it. Seed users
      use both values.
