  - record_key: SAUD-BR-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL give every sign-on audit event a unique identifier generated
      automatically when the event is recorded.
    plain_text: >
      Each sign-in history entry gets its own automatically assigned number.
    technical_note: >
      Derby populate DDL: audit_id bigint generated always as identity. Oracle populate DDL:
      audit_id number(19) not null with no sequence or trigger, whereas
      db/schema/petstore_oracle.sql adds signon_audit_seq and trigger trg_signon_audit_id.
      UserDAO's audit insert omits audit_id, so on Oracle the id only exists if the schema
      script (not the populate) created the table.
    interface: false
    confidence: medium
    confidence_basis: >
      Clear for the configured Derby path; the Oracle populate path contradicts the Oracle
      schema script, so the guarantee holds on one of the two declared databases only.
    dispute:
      reason: conflicting-sources
      detail: >
        Derby populate DDL and the Oracle schema script both auto-generate the id; the Oracle
        populate DDL does not, so audit inserts would fail with a NOT NULL violation after an
        Oracle populate. Settled by confirming whether any deployment runs the populate with
        Database=oracle.
    risk_class: regulated
    basis: >
      Identity column (derby) versus plain NOT NULL column (oracle) in the populate DDL.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 176
        line_end: 176
        excerpt: |2
                    audit_id bigint generated always as identity,
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 353
        line_end: 354
        excerpt: |2
                  create table signon_audit (
                    audit_id number(19) not null,
      - path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 96
        line_end: 104
        excerpt: |2
          CREATE SEQUENCE signon_audit_seq START WITH 1 INCREMENT BY 1 CACHE 20;

          CREATE OR REPLACE TRIGGER trg_signon_audit_id
          BEFORE INSERT ON signon_audit
          FOR EACH ROW
          WHEN (new.audit_id IS NULL)
          BEGIN
            SELECT signon_audit_seq.NEXTVAL INTO :new.audit_id FROM dual;
          END;
    stack_metadata:
      db.object: signon_audit.audit_id

