  - record_key: SDP-WF-0005
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      The system SHALL treat the store as already populated only when every one of the eight
      store tables (category, category details, product, product details, item, item details,
      sign-on accounts, sign-on audit) can be read; WHEN it (re)populates THEN it SHALL drop
      and recreate all eight tables, including all sign-on accounts and the whole sign-on
      audit history, before loading the sample data.
    plain_text: >
      If any store table is missing the store is loaded from scratch. Loading (or a forced
      reload) wipes everything: the catalog, every customer login and the full sign-in
      history, and then puts the sample data back.
    technical_note: >
      Each TableStatements block has a CheckStatement (select * from <table>), used by the
      populators' check(); CreateStatement/DropStatement drive dropTables/createTables in
      PopulateServlet.populate(). signon and signon_audit are in the same statement set, so a
      reload drops them too (servlet comment lines 118-120 confirms).
    interface: false
    confidence: high
    confidence_basis: >
      Statements declared in the SQL file and the drop/create sequence read in the servlet,
      whose comment states the same behaviour.
    risk_class: regulated
    basis: >
      Check/Create/Drop statements for all eight tables, used by the populate sequence.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 170
        line_end: 192
        excerpt: |2
              <TableStatements table="signon_audit">
                <CheckStatement>
                  select * from signon_audit
                </CheckStatement>
                <CreateStatement>
                  create table signon_audit (
                    audit_id bigint generated always as identity,
                    username varchar(25) not null,
                    event_type varchar(20) not null,
                    event_ts timestamp not null,
                    remote_addr varchar(45),
                    constraint pk_signon_audit primary key (audit_id),
                    constraint ck_signon_audit_event check (event_type in
                      ('SIGNON_OK', 'SIGNON_FAIL', 'SIGNON_LOCKED', 'ACCOUNT_LOCKED', 'SIGNOFF', 'USER_CREATED', 'ACCOUNT_UNLOCKED'))
                  )
                </CreateStatement>
                <InsertStatement>
                  insert into signon_audit (username, event_type, event_ts, remote_addr) values (?, ?, current_timestamp, ?)
                </InsertStatement>
                <DropStatement>
                  drop table signon_audit
                </DropStatement>
              </TableStatements>
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
        line_start: 118
        line_end: 120
        excerpt: |2
              // Petstore Lite: the first load is open to anyone so the store can start
              // on an empty database. A forced repopulate drops every table, sign-ons
              // included, so only a signed on ADMIN may ask for it.
    stack_metadata:
      framework: PopulateServlet
      db.object: [category, category_details, product, product_details, item, item_details, signon, signon_audit]

  - record_key: SDP-INT-0006
    kind: integration
    capability_key: sample-data-population
    requirement: >
