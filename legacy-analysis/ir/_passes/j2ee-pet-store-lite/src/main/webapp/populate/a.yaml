    plain_text: >
      A new store starts with a ready-made pet catalog: five categories, sixteen products and
      twenty-eight items, all in US English, with fixed prices.
    technical_note: >
      Populate-UTF8.xml <Catalog> section (Categories lines 84-115, Products 116-229, Items
