        line_start: 38
        line_end: 38
        excerpt: |2
          <!ELEMENT ItemDetails (ListPrice, UnitCost, Attribute?, Attribute?, Attribute?, Attribute?, Attribute?, Image, Description)>
    stack_metadata:
      db.object: item_details

  - record_key: CDI-BR-0004
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL hold catalog display text per locale, with at most one text entry per
      category, product or item for each locale. A category or product text entry SHALL have a
      name (at most 80 characters) and MAY have an image reference and a description (each at
      most 255 characters). An item text entry SHALL have a list price, unit cost, image
      reference and description (each image/description at most 255 characters) and MAY have
      up to five descriptive attributes of at most 80 characters each.
    plain_text: >
      Catalog names and descriptions are stored per language. Categories and products must
      have a name; picture and description are optional. Items must have a price, cost,
      picture and description, and can carry up to five short descriptive tags such as
      "Adult Male".
    technical_note: >
      category_details / product_details / item_details have composite primary keys
      (id, locale). Nullability and lengths from the populate DDL; the DTDs mirror it
      (CategoryDetails/ProductDetails: Name, Image?, Description?; ItemDetails: up to five
      Attribute? and mandatory Image, Description). Attributes map to attr1..attr5.
    interface: false
    confidence: high
    confidence_basis: >
      DDL nullability/keys and DTD content models agree, in two independent artifacts.
    risk_class: presentational
    basis: >
      Composite primary keys and NOT NULL columns on the *_details tables; DTD content models.
    traces:
