  - record_key: SDP-WF-0001
    kind: workflow
    capability_key: sample-data-population
    requirement: >
      The system SHALL treat the store as already populated only when the category, product, item and account tables each contain at least one row. WHEN the store is not populated, or a forced reload is requested, THEN the system SHALL delete the catalog tables, the account table and the sign-on audit table, recreate all of them empty, and load the sample accounts and the sample catalog. WHEN the store is already populated and no forced reload is requested THEN the system SHALL change nothing.
    plain_text: >
      On first start the store fills itself with sample accounts and a sample catalog. If it already has data, nothing happens. A forced reload wipes the catalog, every account and the whole sign-in history, then reloads only the sample data.
    technical_note: >
      PopulateSQL.xml declares per table a CheckStatement (select *), Create, Insert and Drop. PopulateServlet.populate() runs check on category/product/item (CatalogPopulator.check) and signon (UserPopulator.check); PopulateUtils returns true when the select yields a row. On !alreadyPopulated or forcefully it calls dropTables then createTables then parses Populate-UTF8.xml. UserPopulator drops and creates signon_audit alongside signon. The *_details tables and signon_audit are not part of the check.
    interface: false
    confidence: high
