  - record_key: AUD-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on audit event with a system-assigned unique identifier, the user name (required, at most 25 characters), an event type (required), the event time taken from the database clock at the moment of recording, and the client network address when known (at most 45 characters). The event type SHALL be one of SIGNON_OK, SIGNON_FAIL, SIGNON_LOCKED, ACCOUNT_LOCKED, SIGNOFF, USER_CREATED or ACCOUNT_UNLOCKED, and any other type SHALL be refused.
    plain_text: >
      Every sign-in related event is logged with who, what, when and from which network address. Only seven kinds of event exist: successful sign-in, failed sign-in, sign-in attempt on a locked account, account locked, sign-out, account created and account unlocked. The time comes from the server, not the user.
    technical_note: >
      signon_audit in PopulateSQL.xml: audit_id bigint generated always as identity (derby) / number(19) NOT NULL with no generator (oracle); username varchar(25); event_type varchar(20) with ck_signon_audit_event; event_ts NOT NULL set to current_timestamp in the insert statement; remote_addr varchar(45) nullable (long enough for an IPv6 text address). There is no foreign key to signon, so audit rows can name a user name that has no account (for example a failed sign-in with an unknown name).
    interface: false
    confidence: high
    confidence_basis: >
      The event type list and the server-side timestamp are declared in both dialects and the timestamp is fixed again in the insert statement itself. The absence of a foreign key is read directly from the DDL.
    risk_class: regulated
    basis: >
      signon_audit DDL, its CHECK constraint and its insert statement.
