  - record_key: SDP-BR-0003
    kind: business-rule
    capability_key: sample-data-population
    requirement: >
      The system SHALL reject the sample data file, and load nothing from it, when it does not conform to the declared structure: accounts before the catalog, and within the catalog categories before products before items, with every product naming a declared category and every item naming a declared product.
    plain_text: >
      The starter data file is checked against a fixed layout before it is used; a file that breaks the layout or refers to a missing category or product is not loaded.
    technical_note: >
      Internal DOCTYPE in Populate-UTF8.xml (Populate = Users, Catalog; Catalog = Categories, Products, Items) pulls in the dtds/*.dtd files. PopulateServlet sets SAXParserFactory.setValidating(true). Whether a validation error leaves a half-loaded database depends on the error handler in the populator classes, which this pass did not trace.
    interface: false
    confidence: medium
    confidence_basis: >
      The structure is declared and validation is switched on in code, but I did not confirm in this pass that a validity error aborts the load before any insert.
    risk_class: operational
    basis: >
      The DOCTYPE declarations and the validating parser setting.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/Populate-UTF8.xml
        line_start: 41
        line_end: 66
        excerpt: |
          <!DOCTYPE Populate [

          	<!ELEMENT Populate (Users, Catalog)>
           
          	<!ELEMENT Catalog (Categories, Products, Items)>

          	<!ELEMENT Users (User+)>
          	<!ENTITY % User SYSTEM "dtds/User.dtd">
          	%User;


          	<!ELEMENT Categories (Category+)>
          	<!ENTITY % Category SYSTEM "dtds/Category.dtd">
          	%Category;

          	<!ELEMENT Products (Product+)>
          	<!ENTITY % Product SYSTEM "dtds/Product.dtd">
          	%Product;

          	<!ELEMENT Items (Item+)>
          	<!ENTITY % Item SYSTEM "dtds/Item.dtd">
          	%Item;

              <!ENTITY % CommonElements SYSTEM "dtds/CommonElements.dtd">
              %CommonElements;
          ]>
