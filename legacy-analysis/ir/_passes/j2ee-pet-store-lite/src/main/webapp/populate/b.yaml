      The key, the per-locale uniqueness and the required name are declared in the table definitions and enforced again by the structure file that validates the seed data. The same rule appears in both database dialects.
    risk_class: operational
    basis: >
      Primary key, foreign key and NOT NULL constraints in the DDL; Name is required and Image/Description are optional in the CategoryDetails DTD.
