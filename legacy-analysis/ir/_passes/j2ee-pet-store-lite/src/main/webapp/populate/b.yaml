findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
    description: >
      Nothing in the schema requires a category to have a product, a product to have an item, or any catalog entry to have en_US text (only foreign keys from child to parent exist). The capability list describes those as catalog invariants with a daily check; that check is outside this module. A human should confirm which component owns those invariants so they are not assumed to be database rules.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
    description: >
      The "already populated" test checks only category, product, item and signon for at least one row. A store whose details tables or audit table are missing would still count as populated and not be rebuilt. Whether that matters depends on how the tables are dropped in practice; not resolvable from this module.

suspected_defects:
  - capability_key: sign-on-audit
    record_keys: [ AUD-ENT-0001, SDP-BR-0004 ]
    severity: medium
    category: other
    title: On Oracle, sign-on audit rows cannot be written because no identifier is generated
    description: >
      The Derby definition generates the audit identifier automatically. The Oracle definition declares the identifier as required with no generator, sequence or trigger, while the shared insert statement leaves it out. On Oracle every audit write would therefore be refused for a missing identifier. Derby is the configured default, so this affects only an Oracle deployment.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 353
        line_end: 366
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 175
        line_end: 176
  - capability_key: sample-data-population
    record_keys: [ SDP-WF-0001 ]
    severity: high
    category: data-corruption
    title: A forced reload permanently deletes the sign-on audit trail
    description: >
      A forced reload drops and recreates the sign-on audit table together with the accounts, so every recorded sign-in, failure, lockout and unlock is lost with no copy kept. Every customer account also disappears except the three sample accounts. Only an administrator can request it, but no step preserves the history first.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 189
        line_end: 191
      - path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/petstore/tools/populate/UserPopulator.java
        line_start: 93
        line_end: 109
  - capability_key: account-registration
    record_keys: [ ACCT-ENT-0001, SDP-BR-0001 ]
    severity: high
    category: other
    title: Passwords are stored as entered, in a 25-character column
    description: >
      The account table holds the password in a 25-character text column, and the insert writes the value it is given. Nothing in this module hashes it, and the length cap suits plain text more than a hash. The sample data also ships an administrator account with a fixed password in the source tree. Whether a hash is applied before the insert elsewhere was not confirmed in this pass.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 150
        line_end: 164
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/Populate-UTF8.xml
        line_start: 78
        line_end: 81
  - capability_key: catalog-data-integrity
    record_keys: [ CDI-ENT-0001, CDI-ENT-0002, CDI-BR-0002, SDP-BR-0004 ]
    severity: low
    category: other
    title: Code columns are fixed-width on Derby but variable-width on Oracle
    description: >
      On Derby, category, product, item and locale codes are fixed-width columns, which pad short values with trailing spaces. On Oracle they are variable-width. The same code ("FISH") is therefore stored differently, and comparisons or exports that keep trailing spaces can behave differently depending on the database.
    traces:
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 22
        line_end: 22
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/populate/PopulateSQL.xml
        line_start: 200
        line_end: 200
