    requirement: >
      The system SHALL identify each catalog category by a unique code of at most 10 characters, and SHALL hold its display text (a required name of at most 80 characters, an optional image reference and an optional description, each of at most 255 characters) at most once per category per locale, only for a category that exists.
    plain_text: >
      Every category has its own short code (up to 10 characters). Its name, picture and description are stored per language; the name is mandatory, and a category can have only one set of text per language.
    technical_note: >
      Tables category (pk_category on catid) and category_details (pk_category_details on catid+locale, fk_category_details_1 to category) in PopulateSQL.xml, both the derby and oracle statement sets. The seed DTD CategoryDetails.dtd makes Name mandatory and Image/Description optional, matching the nullability.
    interface: false
    confidence: high
