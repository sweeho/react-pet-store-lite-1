  - record_key: CDI-BR-0003
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL refuse to store an item's localized details whose list price is lower than its unit cost. GIVEN an item detail with list price 12.50 and unit cost 11.10 WHEN it is stored THEN it is accepted; GIVEN list price 9.99 and unit cost 10.00 WHEN it is stored THEN it is rejected. A list price equal to the unit cost is accepted.
    plain_text: >
      An item may never be priced below what it costs the store. Selling at exactly cost is allowed.
    technical_note: >
      CHECK constraint ck_item_details_price (listprice >= unitcost) on item_details, present in both the derby and oracle statement sets. Every one of the 28 seeded items satisfies it (narrowest: EST-13, 12.50 vs 11.10).
    interface: false
    confidence: medium
    confidence_basis: >
      One clear, declared constraint (repeated in the two dialect variants of the same file). I could not see a programmatic check in this module; the daily integrity check the capability list mentions lives outside this shard, so I cannot confirm a second enforcement point here.
    risk_class: financial
