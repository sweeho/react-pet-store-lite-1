    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL hold each product under a unique product identifier of at most 10 characters, and SHALL refuse a product whose category does not exist.
    plain_text: >
      Every product has its own code and belongs to exactly one existing pet category; a product cannot be filed under a category that does not exist.
    technical_note: >
      PRODUCT table: productid char(10)/varchar(10) primary key pk_product; catid NOT NULL with foreign key fk_product_1 to CATEGORY(catid). Indexed by idx_product_catid for browsing by category. The schema comment gives the example K9-BD-01 Bulldog in DOGS. The table only carries keys; display text is in PRODUCT_DETAILS.
    interface: false
    confidence: high
    confidence_basis: >
      Primary key, NOT NULL and foreign key are declared in both dialect schemas and repeated in the runtime creation script (PopulateSQL.xml lines 56-60).
    risk_class: operational
    basis: >
      pk_product primary key and fk_product_1 foreign key to category.
