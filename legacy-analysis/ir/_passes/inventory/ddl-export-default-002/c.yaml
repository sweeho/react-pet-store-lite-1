      The system SHALL hold at most one descriptive record per product per locale, each requiring a name of at most 80 characters and allowing an optional image reference and optional description of at most 255 characters each, and SHALL refuse a descriptive record for a product that does not exist.
    plain_text: >
      A product's name, picture and description are kept per language; each language version must have a name, the picture and description are optional, and there is only one version per language.
    technical_note: >
      PRODUCT_DETAILS: composite primary key pk_product_details (productid, locale); name varchar(80) NOT NULL; image and descn varchar(255) nullable; fk_product_details_1 to PRODUCT. Unlike ITEM_DETAILS, image and description are optional here. The schema does not force any particular locale (e.g. en_US) to exist for a product; the daily check C4 only covers items, not products.
