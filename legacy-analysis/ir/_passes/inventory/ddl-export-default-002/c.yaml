  - record_key: SOA-REQ-0001
    kind: requirement
    capability_key: sign-on-audit
    requirement: >
      The system SHALL support retrieving one user's sign-on audit events ordered by event time without scanning the whole audit trail.
    plain_text: >
      A customer's own sign-on history (for the My Account recent-activity view) can be looked up quickly by user name, newest first.
    technical_note: >
      Index idx_signon_audit_user_ts on SIGNON_AUDIT (username, event_ts), identical in Derby and Oracle. It serves UserDAO's recent-activity query 'select event_type, event_ts, remote_addr from signon_audit where username = ? order by event_ts desc, audit_id desc' (src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java line 102). An index is a performance structure, not a rule; a rebuild needs only equivalent lookup performance.
    interface: false
    confidence: medium
    confidence_basis: >
      The index is declared in both dialects and a matching query exists in the DAO, but an index only expresses an access path; the business need (recent-activity view) is inferred from that query rather than stated anywhere in the DDL.
    risk_class: operational
    basis: >
      CREATE INDEX idx_signon_audit_user_ts ON signon_audit (username, event_ts).
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: idx_signon_audit_user_ts
        line_start: 98
        line_end: 98
