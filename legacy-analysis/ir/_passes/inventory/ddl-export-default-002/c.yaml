  - record_key: CDI-ENT-0004
    kind: entity
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL hold at most one priced, described record per item per locale, each requiring a list price, a unit cost, an image reference and a description (each of at most 255 characters), and allowing up to five optional attributes of at most 80 characters each, and SHALL refuse such a record for an item that does not exist.
    plain_text: >
      Each item's price, cost, picture, description and up to five short features (such as 'Large' or 'Cuddly') are kept per language; price, cost, picture and description are required, the features are optional.
    technical_note: >
      ITEM_DETAILS: composite primary key pk_item_details (itemid, locale); listprice, unitcost, image, descn NOT NULL; attr1..attr5 varchar(80) nullable; fk_item_details_1 to ITEM. Prices are therefore stored per locale, not per item. The schema does not require an en_US row for every item; that is detected only by the daily check C4 (db/batch/catalog_check.sql lines 12-13), which the job treats as a failure.
    interface: false
    confidence: high
    confidence_basis: >
      All constraints are declared in both dialect schemas and the runtime creation script (PopulateSQL.xml lines 117-132).
    risk_class: operational
    basis: >
      pk_item_details (itemid, locale), NOT NULL columns and fk_item_details_1 to item.
    traces:
