findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
    description: >
      No document sources exist for this run (legacy-analysis/sources/ is absent), so no document
      trace could be added. The db/schema/*.sql files and vortex/inputs/02-database/*.sql files are
      byte-identical copies; every record cites all four. The Derby file states that the
      authoritative table shape is PopulateSQL.xml, which the store executes on first load; its
      catalog DDL matches these files for the constraints extracted here.
suspected_defects:
  - capability_key: catalog-data-integrity
    record_keys: [CDI-ENT-0001, CDI-ENT-0003, CDI-ENT-0004]
    severity: low
    category: other
    title: Catalog codes are fixed-width (blank-padded) on the runtime database but variable-width on production
    description: >
      The Derby runtime schema declares product, item and locale codes as char(10), which pads
      shorter values such as 'EST-6' or 'en_US' with trailing blanks, while the Oracle
      reference-production schema declares the same columns varchar(10), which does not. The
      same code can therefore come back from the two databases with different trailing
      whitespace, and comparisons against padded values can behave differently between the two
      environments. Which behaviour is intended is not stated.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: item
        line_start: 43
        line_end: 44
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: item
        line_start: 43
        line_end: 44
