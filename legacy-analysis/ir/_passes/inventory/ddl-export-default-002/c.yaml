records:
  - record_key: CDI-RULE-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL refuse to store any item's localised price record whose list price is lower than its unit cost; GIVEN an item price record WHEN its list price is below its unit cost THEN the save SHALL be rejected.
    plain_text: >
      An item can never be listed at a price below what it costs the store; any attempt to save such a price is refused.
    technical_note: >
      Enforced by the CHECK constraint ck_item_details_price (listprice >= unitcost) on ITEM_DETAILS in both the Derby runtime schema and the Oracle reference-production schema (lines 51-67), and the same DDL is issued by PopulateSQL.xml (src/main/webapp/populate/PopulateSQL.xml line 132) when the store creates its tables on first load. The nightly PSL_CATALOG_CHECK query C3 (db/batch/catalog_check.sql line 10) re-checks listprice < unitcost, which can only find rows if the constraint were absent. The UI labels unitcost as 'Your Price' (item.jsp lines 26-30), so in shopper terms the rule means 'your price never exceeds the list price'.
    interface: false
    confidence: high
    confidence_basis: >
      The same CHECK constraint is declared in both database dialects, repeated in the runtime table-creation script, and independently re-verified by the daily integrity query; the schema comment states the rule in words. Nothing in this pass leaves the live behaviour in doubt.
    risk_class: financial
    basis: >
      CHECK (listprice >= unitcost) on item_details plus the table comment 'List price must not be below unit cost.'
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: item_details
        line_start: 65
        line_end: 66
        excerpt: |
                references item (itemid),
                constraint ck_item_details_price check (listprice >= unitcost)
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
