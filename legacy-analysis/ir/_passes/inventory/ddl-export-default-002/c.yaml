  - record_key: CDI-RULE-0002
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: >
      The system SHALL store each item's list price and unit cost as mandatory amounts with exactly two decimal places and at most ten significant digits (maximum 99,999,999.99).
    plain_text: >
      Every item must have both a list price and a cost, recorded to the cent, up to 99,999,999.99.
    technical_note: >
      ITEM_DETAILS.listprice and unitcost are decimal(10,2) NOT NULL in Derby and number(10,2) NOT NULL in Oracle (lines 53-54). No currency column exists; the pages format amounts with the en_US locale (item.jsp fmt:setLocale en_US), so amounts are implicitly US dollars.
    interface: false
    confidence: high
    confidence_basis: >
      Declared identically (precision, scale and NOT NULL) in both dialect schemas and in the runtime creation script; the currency is inferred from page locale, not from the database.
    risk_class: financial
    basis: >
      listprice/unitcost columns declared decimal(10,2)/number(10,2) not null.
