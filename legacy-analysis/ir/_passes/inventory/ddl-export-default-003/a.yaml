  - record_key: AUDIT-BR-0001
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL accept only these sign-on event types: SIGNON_OK, SIGNON_FAIL,
      SIGNON_LOCKED, ACCOUNT_LOCKED, SIGNOFF, USER_CREATED and ACCOUNT_UNLOCKED, and
      SHALL refuse to record any other event type.
    plain_text: >
      The sign-on log knows seven kinds of event: successful sign-in, failed sign-in,
      sign-in tried while locked, account locked, sign-out, account created and
      account unlocked. Nothing else can be logged.
    technical_note: >
      CHECK CK_SIGNON_AUDIT_EVENT on SIGNON_AUDIT.EVENT_TYPE in both dialects and in
      PopulateSQL.xml. The same seven values are the EVENT_* constants in UserDAO
      (ACCOUNT_UNLOCKED is written only by db/batch/acct_unlock.sql and the manual
      unlock SQL), the Oracle column comment, User Guide §5.4 and the extract layout.
    interface: false
    confidence: high
    confidence_basis: >
      The database refuses other values in both dialects, and the identical list
      appears in application constants, the column comment and two guides.
    risk_class: regulated
    basis: >
      constraint ck_signon_audit_event check (event_type in ('SIGNON_OK',
      'SIGNON_FAIL', 'SIGNON_LOCKED', 'ACCOUNT_LOCKED', 'SIGNOFF', 'USER_CREATED',
      'ACCOUNT_UNLOCKED')).
