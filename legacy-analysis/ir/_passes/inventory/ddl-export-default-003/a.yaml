  - record_key: LOCK-BR-0001
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL lock an account after 3 consecutive failed sign-ins, recording
      the time of the lock, and SHALL reset the consecutive-failure count to 0 on a
      successful sign-in or when the account is unlocked. GIVEN an account with 2
      consecutive failures WHEN a third sign-in with a wrong password is made THEN the
      account is marked locked and the lock time is recorded.
    plain_text: >
      Three wrong passwords in a row lock the account, and the store notes when it
      happened. A correct sign-in, or an unlock, starts the count again from zero.
    technical_note: >
      The threshold is stated in the SIGNON table comment and in Oracle COMMENT ON
      COLUMN signon.locked / signon.failed_attempts. It is enforced in application
      code, not by the database: UserDAO.MAX_FAILED_ATTEMPTS = 3 and UPDATE_FAILURE
      sets LOCKED='Y' and LOCKED_TS=now when the count reaches 3; UPDATE_SUCCESS sets
      FAILED_ATTEMPTS = 0. The unlock (batch db/batch/acct_unlock.sql, 30 minutes) also
      resets FAILED_ATTEMPTS to 0 and clears LOCKED_TS.
    interface: false
    confidence: high
    confidence_basis: >
      The rule is written in the DDL comments of both dialects, implemented in
      UserDAO.authenticate, and stated again in Admin Guide §2 R2-R3. The database
      itself does not enforce the threshold, so this is code plus comment plus
      document rather than a constraint.
    risk_class: regulated
    basis: >
      "-- SIGNON: Sign-on accounts. ... Locked after 3 failed sign-ons in a row;
      unlocked by PSL_ACCT_UNLOCK after 30 minutes." and the column comments; the
      table carries the columns the rule writes.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: signon
        line_start: 74
        line_end: 76
        excerpt: |
            failed_attempts number(3) default 0 not null,
            locked char(1) default 'N' not null,
            locked_ts timestamp,
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: signon
        line_start: 74
        line_end: 76
      - kind: code
        path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        line_start: 130
        line_end: 131
        excerpt: |
          COMMENT ON COLUMN signon.locked IS 'Y when the account is locked after 3 failed sign-ons in a row, else N';
          COMMENT ON COLUMN signon.failed_attempts IS 'Consecutive failed sign-ons; reset to 0 on success or unlock';
      - kind: code
        path: legacy-source/j2ee-pet-store-lite/src/main/java/com/sun/j2ee/blueprints/signon/dao/UserDAO.java
        line_start: 141
        line_end: 146
        excerpt: |
                      failedAttempts++;
                      boolean lockNow = failedAttempts >= MAX_FAILED_ATTEMPTS;
                      PreparedStatement update = connection.prepareStatement(UPDATE_FAILURE);
                      update.setInt(1, failedAttempts);
                      update.setString(2, lockNow ? "Y" : "N");
                      update.setTimestamp(3, lockNow ? now : null);
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "PSL-AG-01 §2 Sign-on rules (R2, R3)"
        line_start: 51
        line_end: 52
        excerpt: |
          <tr><td>R2</td><td>Each failed sign-in adds 1 to the account's failed attempts. A successful sign-in sets it back to 0.</td></tr>
          <tr><td>R3</td><td>The 3rd failure in a row locks the account (LOCKED = Y) and records the time of the lock.</td></tr>
    stack_metadata:
      db.object: signon
      db.kind: table
      db.writes: [signon]

  - record_key: LOCK-BR-0002
    kind: business-rule
    capability_key: account-lockout
    requirement: >
      The system SHALL automatically unlock an account once its lock is more than 30
      minutes old, clearing the lock time and resetting the consecutive-failure count
      to 0.
    plain_text: >
      A locked account unlocks itself once it has been locked for more than 30
      minutes.
    technical_note: >
      Stated in the SIGNON table comment; the column it relies on is SIGNON.LOCKED_TS.
      Implemented by batch job PSL_ACCT_UNLOCK (db/batch/acct_unlock.sql, every 15
      minutes, so the effective unlock is 30 to 45 minutes after the lock). That job
      selects WHERE locked = 'Y' AND locked_ts < now - 30 minutes, so a locked row
      with an empty LOCKED_TS is never selected. The batch module owns the schedule
      detail; this record captures what the schema documents.
    interface: false
    confidence: high
    confidence_basis: >
      Written in the DDL comment, implemented in acct_unlock.sql, and repeated in
      Admin Guide R5 and User Guide §5.3.
    risk_class: operational
    basis: >
      Table comment "unlocked by PSL_ACCT_UNLOCK after 30 minutes" and the nullable
      locked_ts column the job compares against.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: signon
        line_start: 75
        line_end: 76
        excerpt: |
            locked char(1) default 'N' not null,
            locked_ts timestamp,
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: signon
        line_start: 75
        line_end: 76
      - kind: code
        path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 15
        excerpt: |
          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "PSL-AG-01 §2 Sign-on rules (R5)"
        line_start: 54
        line_end: 54
    stack_metadata:
      db.object: signon
      db.kind: table

