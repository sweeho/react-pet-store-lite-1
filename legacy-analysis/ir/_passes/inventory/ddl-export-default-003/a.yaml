  - record_key: AUDIT-BR-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL assign each sign-on event a system-generated event number that
      is unique and increases with each event recorded.
    plain_text: >
      Each logged sign-on event gets its own number from the store, in the order the
      events are recorded. That number appears in the daily file sent to the security
      team.
    technical_note: >
      Derby: AUDIT_ID BIGINT GENERATED ALWAYS AS IDENTITY (a caller cannot supply a
      value). Oracle: sequence SIGNON_AUDIT_SEQ (START WITH 1 INCREMENT BY 1 CACHE 20)
      and BEFORE INSERT trigger TRG_SIGNON_AUDIT_ID that sets AUDIT_ID from the
      sequence only WHEN new.audit_id IS NULL, so on Oracle a caller-supplied value
      is kept. CACHE 20 means numbers can be skipped after an instance restart.
      db/batch/audit_extract.sql exports AUDIT_ID as column 1 ("Event number") and
      orders the file by it; UserDAO.SELECT_AUDIT uses it to break ties on equal
      EVENT_TS.
    interface: true
    confidence: high
    confidence_basis: >
      Enforced in both dialects by different mechanisms (identity column; sequence plus
      trigger), and consumed by the extract and the recent-activity query. interface
      is true because the number is a column of the daily extract file the security
      team receives (Runbook §3.2).
    risk_class: regulated
    basis: >
      Derby identity column; Oracle sequence plus BEFORE INSERT trigger filling
      audit_id; primary key PK_SIGNON_AUDIT on audit_id in both.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: signon_audit
        line_start: 86
        line_end: 86
        excerpt: |
            audit_id bigint generated always as identity,
      - kind: db_object
