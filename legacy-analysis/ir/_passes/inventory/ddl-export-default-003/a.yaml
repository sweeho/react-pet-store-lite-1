  - capability_key: account-lockout
    record_keys: [LOCK-ENT-0001, LOCK-BR-0002]
    severity: low
    category: other
    title: A locked account with no lock time is never unlocked automatically
    description: >
      The schema allows an account to be marked locked while its lock time is empty;
      nothing ties the two together. The automatic unlock only selects accounts whose
      lock time is more than 30 minutes old, so such an account (for example from a
      data migration or a hand-edited row) stays locked until someone clears it by
      hand. The application itself always sets both together.
    traces:
