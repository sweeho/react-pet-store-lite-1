  - record_key: AUDIT-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on event with a unique event number, the user
      name (mandatory, at most 25 characters), the event type (mandatory), the event
      time (mandatory) and, optionally, the client address (at most 45 characters).
    plain_text: >
      Every sign-on event is logged with a number, the user name, what happened, when
      it happened and, where known, the address it came from.
    technical_note: >
      Table SIGNON_AUDIT: AUDIT_ID primary key PK_SIGNON_AUDIT (Derby BIGINT GENERATED
      ALWAYS AS IDENTITY; Oracle NUMBER(19) NOT NULL filled by trigger), USERNAME
      VARCHAR(25) NOT NULL, EVENT_TYPE VARCHAR(20) NOT NULL, EVENT_TS TIMESTAMP NOT
      NULL, REMOTE_ADDR VARCHAR(45) nullable (wide enough for an IPv6 address). The
      address column also carries non-address markers: 'batch:PSL_ACCT_UNLOCK' from
      the unlock job and 'admin' from the manual unlock SQL in Admin Guide §2.1.
      Indexes IDX_SIGNON_AUDIT_USER_TS and IDX_SIGNON_AUDIT_TS (other unit) support
      the per-user history and date-range extract.
    interface: false
    confidence: high
    confidence_basis: >
      Declared in both DDL dialects and the runtime create statements; written by
      UserDAO.audit and acct_unlock.sql with exactly these columns; the extract file
      layout in Operations Runbook §3.2 lists the same five columns.
