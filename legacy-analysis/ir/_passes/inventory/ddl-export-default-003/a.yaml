    record_keys: [ACCREG-ENT-0001]
    severity: high
    category: other
    title: Passwords are stored as plain text
    description: >
      The account table holds the password as entered, in a 25-character text column,
      and sign-in compares it with an exact string match. The Administrator Guide
      confirms passwords are "stored as entered in table SIGNON". Anyone with read
      access to the database, its backups or the sample-data files can read every
      password.
