  - record_key: CATB-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL provide a combined catalog item listing that shows, per item
      and locale, the category code and name, product code and name, item code, list
      price, unit cost, first attribute, description and image, and SHALL include an
      item for a locale only when its product and its category both have text in that
      same locale.
    plain_text: >
      There is a ready-made list of every item with its category, product, prices,
      description and picture, in each language. An item only appears in a language
      if its product and category are also described in that language.
    technical_note: >
      View V_CATALOG_ITEM, identical in Derby and Oracle: inner joins ITEM ->
      ITEM_DETAILS -> PRODUCT -> PRODUCT_DETAILS (locale = item_details.locale) ->
      CATEGORY -> CATEGORY_DETAILS (locale = item_details.locale). Exposes LISTPRICE
      and UNITCOST (shown to shoppers as "List Price" and "Your Price" per the column
      comments) and only ATTR1 of the five attributes. No application code, batch SQL
      or populate script references the view (repository-wide search).
    confidence: low
    confidence_basis: >
      The view definition is unambiguous and appears in both dialects, but nothing in
      the repository reads it, so whether any live screen, report or outside tool
      depends on it cannot be seen from this pass.
    dispute:
      reason: unresolved-reachability
      detail: >
        The view is created by both DDL scripts but a search of the Java sources, JSPs,
        PopulateSQL.xml, batch SQL and shell scripts finds no reader. It may be used by
        ad-hoc reporting or an outside tool. An SME should confirm whether anything
        consumes V_CATALOG_ITEM; if not, the listing rule is not live behaviour.
    risk_class: presentational
    basis: >
      CREATE VIEW v_catalog_item AS SELECT ... with inner joins on locale.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: v_catalog_item
        line_start: 101
        line_end: 109
        excerpt: |
          CREATE VIEW v_catalog_item AS
          SELECT d.catid, cd.name AS category_name, p.productid, pd.name AS product_name,
                 i.itemid, idt.listprice, idt.unitcost, idt.attr1, idt.descn, idt.image, idt.locale
            FROM item i
            JOIN item_details idt ON idt.itemid = i.itemid
            JOIN product p ON p.productid = i.productid
            JOIN product_details pd ON pd.productid = p.productid AND pd.locale = idt.locale
            JOIN category d ON d.catid = p.catid
            JOIN category_details cd ON cd.catid = d.catid AND cd.locale = idt.locale;
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: v_catalog_item
        line_start: 112
        line_end: 120
      - kind: db_object
