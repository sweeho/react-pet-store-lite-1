  - capability_key: sign-on-audit
    record_keys: [AUDIT-ENT-0001, AUDIT-BR-0003]
    severity: medium
    category: contradicts-document
    title: Sign-in with an unknown user name longer than 25 characters fails with an error and is not audited
    description: >
      The sign-in form passes the typed user name straight to authentication with no
      length check. When no account matches, the system writes a SIGNON_FAIL audit
      row with that name, but the audit user-name column holds at most 25
      characters, so for a longer name the insert is refused by the database, the
      error is raised as a servlet failure, the user gets an error instead of the
      Sign-in Error page, and no audit row is written. Admin Guide R6 and R7 say every
      failed sign-in is recorded against the name typed.
