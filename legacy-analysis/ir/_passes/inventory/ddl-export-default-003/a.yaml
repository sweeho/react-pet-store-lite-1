  - capability_key: sign-on-audit
    record_keys: [AUDIT-BR-0002]
    severity: low
    category: other
    title: Event numbering differs between the Derby and Oracle schemas
    description: >
      On Derby the event number is always generated by the database and cannot be
      supplied. On Oracle a caller-supplied number is kept (the trigger fires only
      when none is given), and the sequence caches 20 numbers, so numbers can be
      skipped after a restart. The daily extract to the security team is ordered by
      this number; skipped numbers can look like missing events.
