  - record_key: LOCK-ENT-0001
    kind: entity
    capability_key: account-lockout
    requirement: >
      The system SHALL keep, for every account, a count of consecutive failed
      sign-ins that starts at 0, a locked flag that is either Y or N and starts at N,
      and the time the account was locked, which is empty while the account is not
      locked.
    plain_text: >
      Each account tracks how many sign-ins in a row have failed, whether it is
      locked, and when it was locked. A new account starts unlocked with no failures.
    technical_note: >
      SIGNON.FAILED_ATTEMPTS (Derby INTEGER, Oracle NUMBER(3)) DEFAULT 0 NOT NULL;
      SIGNON.LOCKED CHAR(1) DEFAULT 'N' NOT NULL with CHECK CK_SIGNON_LOCKED
      (locked IN ('Y','N')); SIGNON.LOCKED_TS TIMESTAMP nullable. The Oracle column
      comments state "Y when the account is locked after 3 failed sign-ons in a row"
      and "Consecutive failed sign-ons; reset to 0 on success or unlock". No
      constraint ties LOCKED = 'Y' to a non-null LOCKED_TS; UserDAO sets both together.
    interface: false
    confidence: high
    confidence_basis: >
      Defaults and the Y/N check are declared in both dialects and the runtime create
      statements; UserDAO.authenticate writes these exact columns and the Oracle
      COMMENT ON COLUMN text describes their meaning.
    risk_class: operational
    basis: >
      failed_attempts ... default 0 not null; locked char(1) default 'N' not null;
      locked_ts timestamp; constraint ck_signon_locked check (locked in ('Y', 'N')).
