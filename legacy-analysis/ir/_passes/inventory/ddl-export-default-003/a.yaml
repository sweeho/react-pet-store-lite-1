  - capability_key: sign-on-audit
    record_keys: [AUDIT-BR-0002]
    severity: medium
    category: other
    title: On Oracle, a sample-data reload recreates the audit table without its event-number trigger
    description: >
      The Oracle schema script creates the audit table with a mandatory event number
      that a sequence and trigger fill in. The runtime create statement used by the
      sample-data load and the administrator reload (which drops and recreates
      SIGNON_AUDIT, Admin Guide §3.2) creates the same table but no sequence or
      trigger, and dropping an Oracle table also drops its triggers. After a reload on
      Oracle, every audit insert, which supplies no event number, would be refused,
      so sign-in, sign-out and account creation would fail. Derby is unaffected
      because the number is an identity column. Whether any Oracle deployment is live
      is not visible here; the batch scripts use Derby ij.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: trg_signon_audit_id
        line_start: 98
        line_end: 104
