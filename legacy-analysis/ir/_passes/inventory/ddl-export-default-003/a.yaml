records:
  - record_key: ACCREG-ENT-0001
    kind: entity
    capability_key: account-registration
    requirement: >
      The system SHALL hold one sign-on account per user name, where the user name
      is mandatory, at most 25 characters and unique, and the password is mandatory
      and at most 25 characters; the system SHALL refuse a second account with the
      same user name.
    plain_text: >
      Every account has a user name of up to 25 characters and a password of up to
      25 characters. Both are required, and no two accounts can have the same user
      name.
    technical_note: >
      Table SIGNON: USERNAME VARCHAR(25) NOT NULL with primary key PK_SIGNON,
      PASSWORD VARCHAR(25) NOT NULL. Identical in the Derby and Oracle DDL and in the
      runtime CREATE in src/main/webapp/populate/PopulateSQL.xml. UserDAO.createUser
      also checks for an existing row first and throws DuplicateUserException. The
      primary key is a plain VARCHAR comparison, so user names are case-sensitive
      (matches User Guide §5.1). Minimum lengths (3 / 4) and the allowed character
      set are not in the database; they are application checks outside this unit.
    interface: false
    confidence: high
    confidence_basis: >
      The NOT NULL, length and primary-key rules are declared in both dialects' DDL
      and again in the runtime create statements, and the duplicate check is repeated
      in UserDAO.createUser. The 25-character maximum also matches User Guide §5.1.
    risk_class: operational
    basis: >
      CREATE TABLE signon (username varchar(25) not null, password varchar(25) not
      null, ... constraint pk_signon primary key (username)).
