  - record_key: AUDIT-BR-0003
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record sign-on events against the user name as typed, without
      requiring that an account with that name exists. GIVEN a sign-in with a user
      name that has no account WHEN it fails THEN a SIGNON_FAIL event is recorded
      under the name typed.
    plain_text: >
      Failed sign-ins with a user name that does not exist are still logged, under
      the name the person typed.
    technical_note: >
      SIGNON_AUDIT.USERNAME has no foreign key to SIGNON, in either dialect.
      UserDAO.authenticate calls audit(..., EVENT_SIGNON_FAIL, ...) when the SELECT
      finds no row. Audit rows also survive deletion of the account (sample-data
      reload drops both tables, so this does not arise there).
    interface: false
    confidence: medium
    confidence_basis: >
      The absence of a foreign key is what the DDL shows, and the code path plus
      Admin Guide R6 confirm the intent; but an absence in DDL is weaker evidence
      than a declared constraint, hence medium.
    risk_class: regulated
    basis: >
      signon_audit declares only a primary key and a check constraint, no reference
      to signon.
