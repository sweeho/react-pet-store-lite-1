  - record_key: SAU-BR-0003
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record audit events against the user name as given, whether or not
      an account with that name exists; GIVEN a sign-in with a user name that has no
      account WHEN it fails THEN a failed sign-in event SHALL still be recorded under the
      name typed.
    plain_text: >
      Failed sign-ins are logged even when the user name typed does not belong to any
      account; the event is kept under the name that was typed.
    technical_note: >
      SIGNON_AUDIT.USERNAME has no foreign key to SIGNON in either dialect, so rows for
      non-existent users are accepted and audit rows are not removed or blocked by account
