  # ------------------------------------------------------------------- sign-on-audit
  - record_key: SAU-ENT-0001
    kind: entity
    capability_key: sign-on-audit
    requirement: >
      The system SHALL record each sign-on event as an audit entry carrying a mandatory
      user name (at most 25 characters), a mandatory event type (at most 20 characters), a
      mandatory event time and an optional client address of at most 45 characters.
    plain_text: >
      Every sign-on event is logged with who it was for, what happened, when it happened
      and, when known, the address the request came from.
    technical_note: >
      Table SIGNON_AUDIT: USERNAME VARCHAR(25) NOT NULL, EVENT_TYPE VARCHAR(20) NOT NULL,
      EVENT_TS TIMESTAMP NOT NULL (no default; the writer supplies it), REMOTE_ADDR
      VARCHAR(45) nullable (45 is the length of a textual IPv6 address). Indexed by
      (username, event_ts) and by event_ts, which serve the per-user recent-activity read
      and the date-ranged extract/purge. The DDL comment says it is extracted daily by
      PSL_AUDIT_EXTRACT and purged after 90 days by PSL_AUDIT_PURGE.
    confidence: high
    confidence_basis: >
      NOT NULL and lengths are database-enforced in both dialects and both copies; the
      Admin Guide R7 ("written to SIGNON_AUDIT with the time and the client address")
      describes the same content.
    risk_class: regulated
    basis: >
      CREATE TABLE signon_audit with username, event_type, event_ts not null and
      remote_addr varchar(45).
