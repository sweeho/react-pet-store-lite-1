  - record_key: SAU-BR-0002
    kind: business-rule
    capability_key: sign-on-audit
    requirement: >
      The system SHALL give every audit event a unique, system-assigned, ascending
      identifier at the moment it is recorded, so that the writer of an event never
      supplies one; events with the same time SHALL be ordered by this identifier.
    plain_text: >
      Each logged sign-on event gets its own reference number from the store, in the order
      the events were written; when two events have the same time, the number decides
      which came first.
    technical_note: >
      Derby: AUDIT_ID BIGINT GENERATED ALWAYS AS IDENTITY (an explicit value is refused).
      Oracle: AUDIT_ID NUMBER(19) NOT NULL filled by BEFORE INSERT trigger
      TRG_SIGNON_AUDIT_ID from SEQUENCE SIGNON_AUDIT_SEQ (START WITH 1 INCREMENT BY 1 CACHE
      20), but only WHEN new.audit_id IS NULL, so on Oracle an explicitly supplied id is
      kept. PK_SIGNON_AUDIT(audit_id) in both. All writers seen (UserDAO INSERT_AUDIT,
      acct_unlock.sql, Admin Guide manual SQL) omit audit_id. UserDAO SELECT_AUDIT orders
      "by event_ts desc, audit_id desc", which is where the id acts as tie-breaker. With
      CACHE 20, Oracle ids are unique and increasing per session but may have gaps after a
      restart.
    confidence: high
    confidence_basis: >
      Uniqueness is enforced by the primary key in both dialects and generation by two
      independent mechanisms (identity column; sequence + trigger). The tie-break use is
      read in one query only, which is why it is stated but not separately graded.
    risk_class: operational
    interface: false
    basis: >
      Derby identity column; Oracle sequence plus trigger that assigns NEXTVAL when no id
      is given; primary key pk_signon_audit on audit_id in both.
