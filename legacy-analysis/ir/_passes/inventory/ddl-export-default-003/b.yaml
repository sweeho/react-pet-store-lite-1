  # ----------------------------------------------------------------- account-lockout
  - record_key: ALK-ENT-0001
    kind: entity
    capability_key: account-lockout
    requirement: >
      The system SHALL keep, for each account, a mandatory count of consecutive failed
      sign-ins that starts at 0, a mandatory locked flag that is either locked or not
      locked and starts as not locked, and an optional time at which the lock was set.
    plain_text: >
      For every account the store remembers how many sign-ins in a row have failed
      (starting at zero), whether the account is currently locked (new accounts are not),
      and when it was locked.
    technical_note: >
      SIGNON.FAILED_ATTEMPTS (Derby INTEGER, Oracle NUMBER(3)) DEFAULT 0 NOT NULL;
      SIGNON.LOCKED CHAR(1) DEFAULT 'N' NOT NULL with CHECK ck_signon_locked (locked in
      ('Y','N')); SIGNON.LOCKED_TS nullable. The DDL comment states the policy that uses
      them: locked after 3 failed sign-ons in a row, unlocked by PSL_ACCT_UNLOCK after 30
      minutes. The counting itself is in UserDAO.authenticate (MAX_FAILED_ATTEMPTS = 3)
      and the unlock in db/batch/acct_unlock.sql, both outside this unit.
    confidence: high
    confidence_basis: >
      Defaults, NOT NULL and the Y/N check are database-enforced in both dialects; the
      Oracle column comments ("Consecutive failed sign-ons; reset to 0 on success or
      unlock") and the Admin Guide R2-R5 describe the same fields. The 3-attempt and
      30-minute numbers appear here only as comments, so they are left to the code units.
    risk_class: regulated
    interface: false
    basis: >
      failed_attempts default 0 not null, locked char(1) default 'N' not null, locked_ts
      timestamp, constraint ck_signon_locked check (locked in ('Y', 'N')), and the table
      comment "Locked after 3 failed sign-ons in a row; unlocked by PSL_ACCT_UNLOCK after
      30 minutes."
    traces:
