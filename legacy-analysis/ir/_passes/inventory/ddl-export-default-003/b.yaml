  # ------------------------------------------------------------------ access-control
  - record_key: ACC-BR-0001
    kind: business-rule
    capability_key: access-control
    requirement: >
      The system SHALL give every account exactly one role, which SHALL be either CUSTOMER
      or ADMIN; WHEN an account is created without a role THEN its role SHALL be CUSTOMER;
      any other role value SHALL be refused.
    plain_text: >
      Each account is either a Customer or an Administrator, nothing else. A new account is
      a Customer unless it is explicitly made an Administrator.
    technical_note: >
      SIGNON.ROLE VARCHAR(10) DEFAULT 'CUSTOMER' NOT NULL with CHECK ck_signon_role (role
      in ('CUSTOMER','ADMIN')), in both dialects and in PopulateSQL.xml. The populate
      insert supplies role explicitly from the seed file.
    confidence: high
    confidence_basis: >
      Enforced by a CHECK constraint and default in both dialects and restated in the DDL
      table comment ("Role is CUSTOMER or ADMIN"); the Admin Guide roles section agrees.
    risk_class: regulated
    interface: false
    basis: >
