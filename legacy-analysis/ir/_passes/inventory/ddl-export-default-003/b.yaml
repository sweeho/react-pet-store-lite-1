  # ---------------------------------------------------------------- catalog-browsing
  - record_key: CBR-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL provide a combined, per-locale listing of catalog items giving the
      category code and name, product code and name, item code, list price, unit cost,
      first attribute, description, image and locale; GIVEN an item whose product or
      category has no text in the item's locale WHEN the listing is read THEN that item
      SHALL NOT appear in it for that locale.
    plain_text: >
      There is a single list of every item with its category, product, prices, description
      and picture, one line per language; an item only shows up in a language if its
      product and category are also described in that language.
    technical_note: >
      View V_CATALOG_ITEM: inner joins ITEM -> ITEM_DETAILS -> PRODUCT -> PRODUCT_DETAILS
      (on locale = item_details.locale) -> CATEGORY -> CATEGORY_DETAILS (on locale =
      item_details.locale). Identical in Derby and Oracle and both copies. No Java, JSP,
      batch script or scheduler file in legacy-source references the view (grep for
      v_catalog), and PopulateSQL.xml does not create it, so it exists only in the
      hand-run schema scripts.
    confidence: low
    confidence_basis: >
      The join logic is read directly and is unambiguous, but nothing in the application
      reads the view, so whether it carries live behaviour (for example an external report
      or ad-hoc query) is inferred, not seen.
    dispute:
      reason: unresolved-reachability
      detail: >
        The view is declared in the Derby and Oracle schema scripts but is not referenced
        by any application code, batch job or scheduler definition, and the in-app
        populate/reload (PopulateSQL.xml) does not recreate it. An SME needs to say whether
        anything outside the repository (reports, BI, support queries) reads it; if not,
        this record should be dropped rather than carried into the rebuild.
    risk_class: presentational
    basis: >
      CREATE VIEW v_catalog_item selects the listed columns through inner joins that match
      product and category text on the item detail's locale.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: v_catalog_item
        line_start: 101
        line_end: 109
        excerpt: |2
          CREATE VIEW v_catalog_item AS
          SELECT d.catid, cd.name AS category_name, p.productid, pd.name AS product_name,
                 i.itemid, idt.listprice, idt.unitcost, idt.attr1, idt.descn, idt.image, idt.locale
            FROM item i
            JOIN item_details idt ON idt.itemid = i.itemid
            JOIN product p ON p.productid = i.productid
            JOIN product_details pd ON pd.productid = p.productid AND pd.locale = idt.locale
            JOIN category d ON d.catid = p.catid
            JOIN category_details cd ON cd.catid = d.catid AND cd.locale = idt.locale;
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: v_catalog_item
        line_start: 112
        line_end: 120
