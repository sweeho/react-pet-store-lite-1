findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
    description: >
      The two dialects assign audit ids differently: Derby's identity column is GENERATED
      ALWAYS and refuses a caller-supplied id, while the Oracle trigger only fills the id
      when none is given and keeps a supplied one. Every writer seen omits the id, so live
      behaviour is the same today; a human should confirm no external loader inserts audit
      rows with explicit ids on Oracle (which could collide with later sequence values and
      fail on the primary key). Recorded under SAU-BR-0002.
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_oracle.sql
    description: >
      Failed-attempt counter width differs by dialect (Oracle NUMBER(3), max 999; Derby
      INTEGER). Under the 3-attempt lock the counter never exceeds 3 in practice, so this is
      noted, not disputed. Recorded under ALK-ENT-0001.

suspected_defects:
  - capability_key: account-registration
    record_keys: [ACR-ENT-0001]
    severity: high
    category: other
    title: Passwords are stored as typed, not hashed
    description: >
      The account password column holds the password exactly as entered (25 characters,
      plain text), the sign-in check compares it with a plain string equality, and the
      Admin Guide confirms "Passwords are stored as entered in table SIGNON". Anyone who can
      read the table, a backup or the seed data can read every customer's and
      administrator's password.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: signon
        line_start: 72
        line_end: 72
        excerpt: |2
            password varchar(25) not null,
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: signon
        line_start: 72
        line_end: 72
        excerpt: |2
            password varchar2(25) not null,
      - kind: document
        path: legacy-source/j2ee-pet-store-lite/docs/guides/admin-guide.html
        anchor: "1.2 Sample accounts"
        line_start: 45
        line_end: 45
        excerpt: |2
          <div class="warn">Change these passwords before the store is used outside a test environment. Passwords are stored as entered in table SIGNON.</div>
  - capability_key: account-lockout
    record_keys: [ALK-ENT-0001]
    severity: low
    category: other
    title: A locked account with no lock time is never unlocked automatically
    description: >
      The database allows an account to be marked locked while its lock time is empty
      (no constraint ties the two). The automatic unlock only selects accounts whose lock
      time is older than 30 minutes, and an empty lock time never satisfies that, so such
      an account stays locked until someone clears it by hand. The application's own lock
      path always sets the time, so this arises only from manual edits or data loads.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: signon
        line_start: 75
        line_end: 81
        excerpt: |2
            locked char(1) default 'N' not null,
            locked_ts timestamp,
          ...
            constraint ck_signon_locked check (locked in ('Y', 'N'))
      - path: legacy-source/j2ee-pet-store-lite/db/batch/acct_unlock.sql
        line_start: 12
        line_end: 15
        excerpt: |2
          UPDATE signon
             SET locked = 'N', failed_attempts = 0, locked_ts = NULL
           WHERE locked = 'Y'
             AND locked_ts < {fn TIMESTAMPADD(SQL_TSI_MINUTE, -30, CURRENT_TIMESTAMP)};
