# Pass B, unit ddl-export-default-003 (ddl-export@1.0.0).
# The 16 items are 4 logical objects (SIGNON, SIGNON_AUDIT, the Oracle audit-id
# sequence + trigger, V_CATALOG_ITEM) declared in Derby and Oracle dialects, each in
# two byte-identical copies (db/schema and vortex/inputs/02-database; verified with diff).
# No legacy-analysis/sources/**/extracted.md exists in this tree, so the HTML guides are
# cited as kind: document with the HTML heading as anchor.
records:

  # ------------------------------------------------------------ account-registration
  - record_key: ACR-ENT-0001
    kind: entity
    capability_key: account-registration
    requirement: >
      The system SHALL hold each user account under a mandatory user name of at most 25
      characters that is unique across all accounts, with a mandatory password of at most
      25 characters and a mandatory creation timestamp that defaults to the time the
      account row is created; a second account with an existing user name SHALL be refused.
    plain_text: >
      Every account has a user name of up to 25 characters that nobody else can have, a
      password of up to 25 characters, and the date and time it was created.
    technical_note: >
      Table SIGNON: USERNAME VARCHAR(25)/VARCHAR2(25) NOT NULL with PK_SIGNON(username);
      PASSWORD VARCHAR(25) NOT NULL; CREATED_TS TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT
      NULL. Identical in Derby and Oracle DDL and in both copies; the same CREATE is
      repeated in src/main/webapp/populate/PopulateSQL.xml. UserDAO inserts new users with
      an explicit created_ts. The password column holds the password as typed (see
      suspected defect on plaintext storage).
    confidence: high
    confidence_basis: >
      Primary key, NOT NULL and lengths are enforced by the database and declared in both
      dialects (plus the populate script). The 25-character password ceiling matches the
      User Guide's "4 to 25 characters"; the 4-character minimum is not visible in the DDL
      and is not asserted here.
    risk_class: regulated
    interface: false
    basis: >
      CREATE TABLE signon declares username and password not null, both 25 characters,
      created_ts default current_timestamp not null, and constraint pk_signon primary key
      (username).
    traces:
      - kind: db_object
