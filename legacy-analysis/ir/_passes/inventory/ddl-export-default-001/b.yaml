  - record_key: SOA-REQ-0001
    kind: requirement
    capability_key: sign-on-audit
    requirement: |
      The system SHALL support selecting sign-on audit events by event time range across all users without scanning the whole audit trail.
    plain_text: |
      Pulling the sign-on history for a period (for example yesterday's events, or everything older than the retention limit) must be efficient regardless of which user the events belong to.
    technical_note: |
      Index IDX_SIGNON_AUDIT_TS on SIGNON_AUDIT(event_ts) in both dialects; it serves the date-window predicates in db/batch/audit_extract.sql (previous calendar day) and db/batch/audit_purge.sql (older than 90 days). A separate (username, event_ts) index covers per-user views and is outside this unit.
    confidence: low
    confidence_basis: |
      Inferred from an index whose only stated purpose is access by event_ts; the consumers (extract and purge batch scripts) were read only to confirm the predicate shape, not as part of this unit.
    risk_class: operational
    interface: false
    basis: |
      CREATE INDEX idx_signon_audit_ts ON signon_audit (event_ts); batch scripts filter signon_audit on event_ts ranges.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: idx_signon_audit_ts
