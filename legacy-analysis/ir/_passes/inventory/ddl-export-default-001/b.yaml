findings:
  - kind: conflict
    record_key: CDI-ENT-0001
    path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
    description: >
      The category code (and the locale code of category text) is CHAR(10) in the
      Derby runtime schema and VARCHAR(10) in the Oracle reference-production schema.
      CHAR pads short codes with trailing blanks; VARCHAR does not. Codes such as
      FISH or en_US are shorter than 10, so a value read back may differ by trailing
      spaces between the two databases. A human should confirm the target semantics
      (codes compared trimmed) before the data model is rebuilt.
  - kind: ambiguity
    path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
    description: >
      Nothing in the category tables requires a category to have text in the default
      locale (en_US). The nightly catalog check (db/batch/catalog_check.sql, check C4)
      enforces en_US text for items only, not for categories. Whether a category with
      no en_US name is acceptable is not stated; an SME should decide whether the
      en_US-presence rule covers categories too.
suspected_defects: []
