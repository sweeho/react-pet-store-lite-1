  - record_key: CDI-BR-0002
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: |
      The system SHALL refuse category display text whose category code does not identify an existing category, and SHALL refuse to remove a category while display text for it still exists.
    plain_text: |
      Category names and descriptions can only be stored for a category that exists, and a category cannot be deleted while it still has names or descriptions attached.
    technical_note: |
      Foreign key FK_CATEGORY_DETAILS_1 (catid) REFERENCES CATEGORY(catid), no ON DELETE clause (default restrict / no action) in both dialects. The populate tool therefore has to drop/insert in dependency order.
    confidence: high
    confidence_basis: |
      Foreign key declared in both dialect schemas. The delete-restrict half is the default behaviour of a foreign key with no ON DELETE clause rather than an explicit statement, but that default is the same in Derby and Oracle.
    risk_class: operational
    interface: false
    basis: |
      constraint fk_category_details_1 foreign key (catid) references category (catid), with no cascade option.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: category_details
        line_start: 19
        line_end: 20
        excerpt: |
              constraint fk_category_details_1 foreign key (catid)
              references category (catid));
      - kind: db_object
        path: j2ee-pet-store-lite/vortex/inputs/02-database/petstore_derby.sql
        anchor: category_details
        line_start: 19
        line_end: 20
        excerpt: |
              constraint fk_category_details_1 foreign key (catid)
              references category (catid));
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: category_details
        line_start: 19
        line_end: 20
        excerpt: |
              constraint fk_category_details_1 foreign key (catid)
              references category (catid));
      - kind: db_object
        path: j2ee-pet-store-lite/vortex/inputs/02-database/petstore_oracle.sql
        anchor: category_details
        line_start: 19
        line_end: 20
        excerpt: |
              constraint fk_category_details_1 foreign key (catid)
              references category (catid));
    stack_metadata:
      db.object: "CATEGORY_DETAILS"
      db.kind: "table"
      db.constraints: "FK_CATEGORY_DETAILS_1 -> CATEGORY(catid)"
      db.reads: "category"
  - record_key: CB-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: |
      The system SHALL support looking up the products of a category and the items of a product by their parent code without scanning the whole catalog.
    plain_text: |
      Listing the products in a category, and the items for a product, must stay fast as the catalog grows.
    technical_note: |
      Non-unique indexes IDX_PRODUCT_CATID on PRODUCT(catid) and IDX_ITEM_PRODUCTID on ITEM(productid), present in both Derby and Oracle schemas. They back the category -> product -> item browse queries in the catalog DAO.
    confidence: low
    confidence_basis: |
      An index states a performance intent, not a business rule; the requirement is inferred from the index existing, not read from any stated target. Present in both dialects, but there is no response-time figure anywhere in this unit.
    risk_class: operational
    interface: false
    basis: |
      CREATE INDEX idx_product_catid ON product (catid); CREATE INDEX idx_item_productid ON item (productid).
    traces:
