  - record_key: CDI-BR-0001
    kind: business-rule
    capability_key: catalog-data-integrity
    requirement: |
      The system SHALL allow at most one set of display text per category and locale.
      GIVEN a category already has text for a locale
      WHEN a second text entry is stored for the same category and the same locale
      THEN the system SHALL refuse it.
    plain_text: |
      A category can have only one name/description per language; adding a second one for the same language is rejected.
    technical_note: |
      Composite primary key PK_CATEGORY_DETAILS(catid, locale) on CATEGORY_DETAILS, in both Derby and Oracle schemas.
    confidence: high
    confidence_basis: |
      Composite primary key is declared in both dialect schemas and enforced by the database.
    risk_class: operational
    interface: false
    basis: |
      constraint pk_category_details primary key (catid, locale).
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
