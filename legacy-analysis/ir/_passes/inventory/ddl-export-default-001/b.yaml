records:
  - record_key: CDI-ENT-0001
    kind: entity
    capability_key: catalog-data-integrity
    requirement: |
      The system SHALL hold each pet category as a record identified by a mandatory category code of at most 10 characters, and SHALL refuse a second category with the same code.
    plain_text: |
      Every pet category (for example Fish or Dogs) has a short code of up to 10 characters; the code is required and no two categories may share it.
    technical_note: |
      Table CATEGORY has a single column CATID, NOT NULL, primary key PK_CATEGORY. Derby declares it CHAR(10), Oracle VARCHAR(10). The table holds the key only; all display text lives in CATEGORY_DETAILS. Identical DDL appears in db/schema and vortex/inputs/02-database.
    confidence: high
    confidence_basis: |
      Primary key and NOT NULL are declared in both the Derby and the Oracle schema (and duplicated in the vortex inputs copies); the database itself enforces them. Not higher-risk than that because the two dialects disagree on fixed vs variable length, which is noted separately.
    risk_class: operational
    interface: false
    basis: |
      CREATE TABLE category declares catid not null with constraint pk_category primary key (catid); the header comment lists the categories FISH, DOGS, REPTILES, CATS, BIRDS.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: category
        line_start: 11
        line_end: 12
        excerpt: |
          CREATE TABLE category (catid char(10) not null,
            constraint pk_category primary key (catid));
      - kind: db_object
        path: j2ee-pet-store-lite/vortex/inputs/02-database/petstore_derby.sql
        anchor: category
        line_start: 11
        line_end: 12
        excerpt: |
          CREATE TABLE category (catid char(10) not null,
            constraint pk_category primary key (catid));
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_oracle.sql
        anchor: category
        line_start: 11
        line_end: 12
        excerpt: |
          CREATE TABLE category (catid varchar(10) not null,
            constraint pk_category primary key (catid));
      - kind: db_object
        path: j2ee-pet-store-lite/vortex/inputs/02-database/petstore_oracle.sql
        anchor: category
        line_start: 11
        line_end: 12
        excerpt: |
          CREATE TABLE category (catid varchar(10) not null,
            constraint pk_category primary key (catid));
    stack_metadata:
      db.object: "CATEGORY"
      db.kind: "table"
      db.schema: "ESTOREUSER"
      db.constraints: "PK_CATEGORY(catid)"
      db.column_type.derby: "CHAR(10)"
      db.column_type.oracle: "VARCHAR(10)"
  - record_key: CDI-ENT-0002
    kind: entity
    capability_key: catalog-data-integrity
    requirement: |
      The system SHALL hold the display text of a category per locale: each entry SHALL carry the category code, a mandatory locale code of at most 10 characters, a mandatory name of at most 80 characters, and an optional image reference and optional description of at most 255 characters each.
    plain_text: |
      A category's name, picture and description are stored separately for each language/region. The name and the language/region are required; the picture and description are optional. Names are limited to 80 characters, picture references and descriptions to 255.
    technical_note: |
      Table CATEGORY_DETAILS(catid, name, image, descn, locale). NOT NULL on catid, name, locale; image and descn nullable. Derby uses VARCHAR/CHAR, Oracle VARCHAR2/VARCHAR.
    confidence: high
    confidence_basis: |
      Column nullability and lengths are declared identically (modulo dialect type names) in both the Derby and Oracle schemas and enforced by the database.
    risk_class: presentational
    interface: false
    basis: |
      name varchar(80) not null, image varchar(255), descn varchar(255), locale char(10) not null in CREATE TABLE category_details.
