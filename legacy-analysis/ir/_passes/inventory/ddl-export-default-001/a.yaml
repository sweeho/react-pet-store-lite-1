findings:
  - kind: ambiguity
    path: legacy-source/j2ee-pet-store-lite/db/schema/petstore_derby.sql
    description: >
      Category key and locale are CHAR(10) in Derby (the runtime) but VARCHAR(10) in Oracle
      (the reference production), so Derby returns codes padded with blanks and the
      application trims them (GenericCatalogDAO.getCategories). Product, item and other key
      columns are VARCHAR in both. A human should confirm that codes are compared without
      trailing blanks, so that the rebuild does not reproduce the padding.

suspected_defects:
  - capability_key: catalog-data-integrity
    record_keys: [CATB-BR-0001, CATB-ENT-0002]
    severity: low
    category: other
    title: Category with no en_US text is invisible and not caught by the daily catalog check
    description: >
      Category text is optional per locale (nothing requires an en_US row), and the category
      list drops any category without text in the shopper's locale. The daily catalog
      integrity check tests en_US text only for items (C4), not for categories, so a
      category with products but no en_US text disappears from the store with no alert.
    traces:
      - kind: db_object
        path: j2ee-pet-store-lite/db/schema/petstore_derby.sql
        anchor: category_details
        line_start: 15
        line_end: 20
      - path: legacy-source/j2ee-pet-store-lite/db/batch/catalog_check.sql
        line_start: 11
        line_end: 13
      - path: legacy-source/j2ee-pet-store-lite/src/main/webapp/CatalogDAOSQL.xml
        line_start: 71
        line_end: 77
