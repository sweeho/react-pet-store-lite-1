      Module data/migration (pass b). The rule duplicates SWHR5-R-0001; the account counts
      (42 CUSTOMER, 1 ADMIN) describe the extract, not behaviour, and pass a counts 43.
      Merge into SWHR5-R-0001 without the counts.
