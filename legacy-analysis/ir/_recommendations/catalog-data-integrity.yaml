# Recommendations for catalog-data-integrity (SX-0001, synthesize stage). Advisory only.
# Covers only the records of this capability that are not yet approved.
recommendations:
  - record_key: CATALOG-DATA-INTEGRITY-BR-0001
    recommendation: reject
    confidence: medium
    reason: >
      petstore.properties:28-29 declares 5 categories and 28 items, but no code reads the keys
      (catalog_check.sql:14-16 only counts, psl_catalog_check.sh greps for C1-C4 rows) and the migrated
      sample data has exactly 5 categories and 28 items, so the keys most likely describe the sample set.
      The approved INTEG-BR-0002 already records that the minimums are not enforced. Whether a minimum is
      wanted goes to Intent for the Business Owner.
  - record_key: CATINT-ENT-0002
    recommendation: edit
    confidence: medium
    reason: >
      The per-locale structure matches the DDL (petstore_derby.sql:14-67), but "an en_US entry SHALL exist
      for every category, product and item" is checked only for items (C4, catalog_check.sql:11-13).
    edited_requirement: >
      The catalog SHALL store language-dependent text (name, image, description, and for items the
      price, cost and up to five attributes) per locale, separately from the identity rows. Every item
      SHALL have an en_US entry.
  - record_key: CATINT-REQ-0001
    recommendation: reject
    confidence: high
    reason: >
      Same behaviour as the approved CATI-REQ-0001 from the other pass of the same shard; both match
      PSL_PETSTORE.xml:62-71. Reject as a duplicate.
  - record_key: CATINT-WF-0001
    recommendation: reject
    confidence: high
    reason: >
      Accurate to catalog_check.sql:3-13 and psl_catalog_check.sh:15-19, but fully covered by the approved
      C1-C4 records and CATINT-WF-0005. Reject as a duplicate.
  - record_key: CDI-RULE-0002
    recommendation: edit
    confidence: low
    reason: >
      Key collision: db/schema/a uses it for the v_catalog_item view (no reader found, unresolved
      reachability), ddl-002/b for product identity (covered by CDI-ENT-0001), ddl-002/c for price
      precision. Keep the price-precision meaning, which matches decimal(10,2) in both DDLs, and ask a
      DBA whether the view exists in production before recording it under a new key.
    edited_requirement: >
      The system SHALL store each item's list price and unit cost as mandatory amounts with exactly two
      decimal places and a maximum of 99,999,999.99.
